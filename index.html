function mdToHtml(md){
  const lines=esc(md||"").split("\n"); let out="", inList=null;
  const inl=t=>t.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*(?!\s)(.+?)\*/g,"$1<i>$2</i>").replace(/==(.+?)==/g,"<mark>$1</mark>");
  const close=()=>{ if(inList){ out+="</"+inList+">"; inList=null; } };
  for(const raw of lines){ const l=raw.trimEnd();
    let m;
    if(m=l.match(/^#{1,2}\s+(.*)/)){ close(); out+="<h4>"+inl(m[1])+"</h4>"; }
    else if(m=l.match(/^#{3,}\s+(.*)/)){ close(); out+="<h5>"+inl(m[1])+"</h5>"; }
    else if(m=l.match(/^\s*[-*•]\s+(.*)/)){ if(inList!=="ul"){ close(); out+="<ul>"; inList="ul"; } out+="<li>"+inl(m[1])+"</li>"; }
    else if(m=l.match(/^\s*\d+[.)]\s+(.*)/)){ if(inList!=="ol"){ close(); out+="<ol>"; inList="ol"; } out+="<li>"+inl(m[1])+"</li>"; }
    else if(m=l.match(/^&gt;\s?(.*)/)){ close(); out+='<div class="rule">'+inl(m[1])+"</div>"; }
    else if(!l.trim()){ close(); }
    else { close(); out+="<p>"+inl(l)+"</p>"; }
  }
  close(); return out;
}

function noteByKey(k){ const [sid,i]=k.split(":"); if(i==null) return null; if(i[0]==="m"){ const m=myNotes(sid).find(x=>"m"+x.id===i); return m?{t:m.t,html:mdToHtml(m.md),key:k,own:m}:null; } const n=notesOf(sid)[+i]; return n?{...n,key:k}:null; }

  stop(k){ const r=this.all(); delete r[k]; Store.set("rev",r); },
  rate(k,grade){ // grade: 2 umiałem, 1 częściowo, 0 nie umiałem
    const r=this.all(); const x=r[k]||{stage:0}; const t=todayISO();
    if(grade===2){ x.stage=Math.min(INTERVALS.length-1,(x.stage||0)+1); x.due=addDays(t,INTERVALS[x.stage]); }
    else if(grade===1){ x.due=addDays(t,1); }

    x.last=t; r[k]=x; Store.set("rev",r);
    const rd=Store.get("read",{}); rd[k]=true; Store.set("read",rd);
    return x;
  },
  // przed sprawdzianem: jeśli z przedmiotu jest termin w ciągu 2 dni, a ostatnia powtórka była wcześniej niż wczoraj
  dueList(){
    const t=todayISO(); const out=[]; const r=this.all(); const ev=allEvents();

function mindMap(n){
  const doc=document.createElement("div"); doc.innerHTML=n.html;
  const root={t:n.t,ch:[]}; let br=null, sub=null;
  const GENERIC=/^(cytat|znaczenie|punkt \d+|przykład|przykłady|zasada z tablicy|uwaga|definicja|wniosek|sens|kim jest|główna myśl)$/i;
  const branch=t=>{ br={t,ch:[]}; root.ch.push(br); sub=null; };
  for(const el of doc.children){
    if(el.matches(".topic")&&!root.topic){ root.topic=el.textContent.replace(/^Temat/,"").trim(); continue; }
    if(el.matches("h4")){ const num=(el.querySelector(".num")||{}).textContent||""; const t=el.textContent.trim();
      if(/^[A-H][.)]/.test(num.trim())&&br){ sub={t,ch:[]}; br.ch.push(sub); } else branch(t); continue; }
    if(el.matches("h5")){ if(!br) branch(n.t); const node={t:el.textContent.trim(),ch:[]}; if(sub&&sub!==br){ sub.ch.push({t:node.t,leaf:true,strong:true}); } else { br.ch.push(node); sub=node; } continue; }
    if(el.matches("ul")){ if(!br) branch("Najważniejsze"); const tgt=sub||br;
      for(const li of el.querySelectorAll(":scope > li")){ const b=li.querySelector("b"); let txt=(b?b.textContent:li.textContent).replace(/:$/,"").trim(); if(!txt||txt.length>70||GENERIC.test(txt)) continue; tgt.ch.push({t:txt,leaf:true}); } }
  }
  const flat=root.ch;
  const wrap=h("div",{class:"mm"});
  wrap.append(h("div",{class:"mm-root"},h("b",{},root.t),root.topic?h("small",{},root.topic):null));
  const branches=h("div",{class:"mm-br"});
  const colors=["#2B4F45","#C2573D","#2F6E8E","#8A5A2B","#5B4A7A","#3C7D4A","#8E2F3C","#B0782A"];
  flat.forEach((b,i)=>{
    const card=h("div",{class:"mm-b",style:"--c:"+colors[i%colors.length]},h("div",{class:"mm-bt"},b.t));
    const leaves=h("div",{class:"mm-l"});
    for(const c of b.ch.slice(0,12)){
      if(c.leaf) leaves.append(h("span",{class:"mm-leaf"},c.t));
      else { const g=h("div",{class:"mm-sub"},h("div",{class:"mm-st"},c.t)); const ll=h("div",{class:"mm-l"}); c.ch.slice(0,10).forEach(x=>ll.append(h("span",{class:"mm-leaf"+(x.strong?" strong":"")},x.t))); if(c.ch.length) g.append(ll); leaves.append(g); }
    }
    if(b.ch.length) card.append(leaves);
    branches.append(card);
  });
  if(!flat.length) branches.append(h("div",{class:"empty"},"Ta notatka nie ma nagłówków – mapa myśli powstaje z nagłówków i pogrubionych haseł."));
  wrap.append(branches);
  return wrap;
}

<p><b>LAUDO, LAUDARE, LAUDAVI, LAUDATUM</b></p>
<ul>
<li><b>laudo</b> – chwalę (1 os. l. poj. cz. teraźniejszego trybu oznajmującego strony czynnej = persona prima singularis indicativi praesentis activi)</li>
<li><b>laudare</b> – chwalić (bezokolicznik czasu teraźniejszego strony czynnej = infinitivus praesentis activi)</li>
<li><b>laudavi</b> – pochwaliłem/am (1 os. l. poj. cz. przeszłego dokonanego trybu oznajmującego strony czynnej = persona prima singularis indicativi perfecti activi)</li>
<li><b>laudatum</b> – aby pochwalić (celownik czasownikowy = supinum)</li>
</ul>
<p>Supinum występuje po czasownikach oznaczających ruch i wyraża cel tego ruchu, np. <b>festino scriptum</b> – śpieszę, aby pisać.</p>
<h4><span class="num">5.</span> Coniugationes – 4 koniugacje</h4>
<ul>
<li><b>I</b> – thema praesentis kończy się na <b>-a</b>, bezokolicznik na <b>-are</b>, np. laboro, laborare – pracować</li>
<li><b>II</b> – thema praesentis kończy się na <b>-e</b>, bezokolicznik na <b>-ēre</b>, np. studeo, studēre – starać się o coś, uczyć się</li>
<li><b>III</b> – thema praesentis kończy się na <b>spółgłoskę</b>, bezokolicznik na <b>-ĕre</b>, np. ago, agĕre – czynić</li>
<li><b>IV</b> – thema praesentis kończy się na <b>-i</b>, bezokolicznik na <b>-ire</b>, np. audio, audire – słuchać</li>
</ul>
<h4><span class="num">6.</span> Kolokwia z modlitw (ustnie / na pamięć)</h4>
<ul>
<li><b>Cz. 1 – 26.10.2026:</b> Signum Sanctae Crucis, Doxologia (Gloria Patri), Oratio Dominica (Pater noster), Salutatio Angelica (Ave Maria) + pytania o znaczenie słów.</li>
<li><b>Cz. 2 – 16.11.2026:</b> Oratio ad Angelum Custodem (Angele Dei), Oratio pro fidelibus defunctis (Requiem aeternam), Credo do wyboru (Skład Apostolski albo nicejsko-konstantynopolitańskie).</li>

function sylls(w){ return (w.toLowerCase().replace(/(ae|au|oe)/g,"a").match(/[aeiouy]+/g)||[]).length; }
function parseNoun(line){

/* zwraca {sg:[6],pl:[6], note} albo null, jeśli rzeczownik nieregularny */
function declineNoun(n){
  const {nom,g,d}=n; let gen=n.gen;
  if(d==="irr"||/^(Deus|domus|vis|Iesus)$/i.test(nom)) return null;
  const neu=g==="n"; let sg,pl,note="";
  if(d==="1"){ const st=gen.replace(/ae$/,"");
    sg=[nom,st+"ae",st+"ae",st+"am",st+"a",nom]; pl=[st+"ae",st+"arum",st+"is",st+"as",st+"is",st+"ae"];
    if(g==="m") note="Rodzaj męski mimo I deklinacji (np. nauta, poeta, propheta) – odmiana taka sama jak puella.";
  }
  else if(d==="2"){ const st=gen.replace(/i$/,"");
    if(neu){ sg=[nom,st+"i",st+"o",nom,st+"o",nom]; pl=[st+"a",st+"orum",st+"is",st+"a",st+"is",st+"a"];
      if(nom==="caelum"){ pl=["caeli","caelorum","caelis","caelos","caelis","caeli"]; note="Caelum w l. mnogiej jest rodzaju męskiego: caeli, caelorum, caelis, caelos (qui es in caelis; ascendit ad caelos)."; } }
    else { const voc=/us$/.test(nom)? (/ius$/.test(nom)? nom.replace(/ius$/,"i") : nom.replace(/us$/,"e")) : nom;
      sg=[nom,st+"i",st+"o",st+"um",st+"o",voc]; pl=[st+"i",st+"orum",st+"is",st+"os",st+"is",st+"i"];
      if(/ius$/.test(nom)) note="Rzeczowniki na -ius mają wołacz na -i (fili, Domine ale: mi fili).";
      if(/er$/.test(nom)) note=st===nom? "Typ puer – „e” zostaje we wszystkich przypadkach; wołacz = mianownik." : "Typ magister – „e” wypada (magistr-); wołacz = mianownik.";
    }
  }
  else if(d==="3"){ const st=gen.replace(/is$/,""); const base=nom.toLowerCase();
    let istem=false;
    if(neu) istem=/(e|al|ar)$/.test(base);
    else if(/(is|es)$/.test(base) && sylls(nom)===sylls(gen)) istem=true;
    else if(sylls(nom)===1 && /[^aeiou][^aeiou]$/.test(st)) istem=true;
    if(UM_GEN_PL.includes(base)) istem=false;
    const neuI=neu&&istem;
    if(neu){ sg=[nom,st+"is",st+"i",nom,st+(neuI?"i":"e"),nom]; const p=neuI?"ia":"a"; pl=[st+p,st+(istem?"ium":"um"),st+"ibus",st+p,st+"ibus",st+p]; }
    else { sg=[nom,st+"is",st+"i",st+"em",st+"e",nom]; pl=[st+"es",st+(istem?"ium":"um"),st+"ibus",st+"es",st+"ibus",st+"es"]; }
    if(istem) note=neu? "Odmiana samogłoskowa (nijakie na -e, -al, -ar): abl. lp. -i, mian./bier. lm. -ia, dop. lm. -ium." : "Odmiana mieszana (i-tematowa): dop. lm. -ium.";
    else if(UM_GEN_PL.includes(base)) note="Wyjątek: mimo kształtu ma dop. lm. -um ("+st+"um).";
  }
  else if(d==="4"){ const st=gen.replace(/us$/,"");
    if(neu){ sg=[nom,st+"us",st+"u",nom,st+"u",nom]; pl=[st+"ua",st+"uum",st+"ibus",st+"ua",st+"ibus",st+"ua"]; }
    else { sg=[nom,st+"us",st+"ui",st+"um",st+"u",nom]; pl=[st+"us",st+"uum",st+"ibus",st+"us",st+"ibus",st+"us"]; }
  }
  else if(d==="5"){ const st=nom.replace(/es$/,"");
    sg=[nom,st+"ei",st+"ei",st+"em",st+"e",nom]; pl=[st+"es",st+"erum",st+"ebus",st+"es",st+"ebus",st+"es"];
    if(!/^(res|dies)$/.test(nom)) pl=null, note="Rzeczowniki V deklinacji poza res i dies zwykle nie mają pełnej liczby mnogiej (tylko mian./bier. lm.).";
  }
  else return null;
  return {sg,pl,note};
}

/* ===== Wersja Netlify: logowanie (Netlify Identity), synchronizacja postępów, PWA ===== */
(function(){
const API="/.netlify/functions/progress";
const SK="augustapka.sync";
const meta=()=>{ try{ return JSON.parse(localStorage.getItem(SK)||"{}"); }catch(e){ return {}; } };
const setMeta=o=>{ try{ localStorage.setItem(SK,JSON.stringify({...meta(),...o})); }catch(e){} };
const NI=()=>window.netlifyIdentity;
let user=null, timer=null, busy=false, pending=false, state={text:"—",at:meta().at||null};
let applying=false;

function dot(t){ let d=document.querySelector(".sync-dot"); if(!d){ d=document.createElement("div"); d.className="sync-dot"; document.body.append(d); } d.textContent=t; d.classList.add("show"); clearTimeout(d._t); d._t=setTimeout(()=>d.classList.remove("show"),1800); }
function setState(text,at){ state={text,at:at||state.at}; if(at) setMeta({at}); }

async function token(){ if(!user) return null; try{ return await user.jwt(); }catch(e){ return null; } }
async function api(method,body){
  const t=await token(); if(!t) throw new Error("brak tokenu");
  const r=await fetch(API,{method,headers:{"Authorization":"Bearer "+t,"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined,cache:"no-store"});
  if(!r.ok){ let t=""; try{ t=(await r.text()).slice(0,120); }catch(_){} throw new Error("HTTP "+r.status+(t&&r.status!==404?": "+t.replace(/<[^>]+>/g," ").trim():"")); } return r.json();
}
// łączenie: dla każdego klucza wygrywa nowszy znacznik czasu
function merge(local,remote){
  const lt=local.__ts||{}, rt=remote.__ts||{}; const out={}, ts={};
  const keys=new Set([...Object.keys(local),...Object.keys(remote)]); keys.delete("__ts");
  let changedLocal=false, changedRemote=false;
  keys.forEach(k=>{ const inL=k in local, inR=k in remote; const a=lt[k]||0, b=rt[k]||0;
    if(inR&&(!inL||b>a)){ out[k]=remote[k]; ts[k]=b; if(JSON.stringify(local[k])!==JSON.stringify(remote[k])) changedLocal=true; }
    else { out[k]=local[k]; ts[k]=a||Date.now(); if(!inR||JSON.stringify(local[k])!==JSON.stringify(remote[k])) changedRemote=true; } });
  out.__ts=ts; return {out,changedLocal,changedRemote};
}
async function pull(){
  if(!user) return; if(busy){ pending=true; return; } busy=true; setState("synchronizuję…");
  try{
    const res=await api("GET"); const remote=(res&&res.data)||{};
    const {out,changedLocal,changedRemote}=merge(Store.raw(),remote);
    if(changedLocal){ applying=true; Store.load(out); applying=false; try{ SEARCH_IDX=null; }catch(e){} render(); }
    if(changedRemote||!res) await api("PUT",{data:out});
    setState("zsynchronizowano",Date.now()); if(changedLocal) dot("☁️ Pobrano postęp z konta");
  }catch(e){ setState(navigator.onLine?"błąd synchronizacji ("+(e&&e.message||"?")+") – spróbuję ponownie":"offline – zapiszę po powrocie internetu"); }
  busy=false; if(pending){ pending=false; schedule(1500); }
}
async function push(){
  if(!user) return; if(busy){ pending=true; return; } busy=true;
  try{ // przed wysłaniem scal z tym, co jest na koncie (inne urządzenie mogło coś zmienić)
    const res=await api("GET"); const {out,changedLocal}=merge(Store.raw(),(res&&res.data)||{});
    if(changedLocal){ applying=true; Store.load(out); applying=false; }
    await api("PUT",{data:out}); setState("zsynchronizowano",Date.now()); dot("☁️ Zapisano na koncie");
  }catch(e){ setState(navigator.onLine?"błąd synchronizacji ("+(e&&e.message||"?")+") – spróbuję ponownie":"offline – zapiszę po powrocie internetu"); }
  busy=false; if(pending){ pending=false; schedule(1500); }
}
function schedule(ms=2500){ clearTimeout(timer); timer=setTimeout(push,ms); }
Store.onChange(()=>{ if(!applying&&user) schedule(); });
window.addEventListener("online",()=>user&&pull());
document.addEventListener("visibilitychange",()=>{ if(!user) return; if(document.visibilityState==="hidden"&&timer){ clearTimeout(timer); push(); } else if(document.visibilityState==="visible") pull(); });

/* ---- bramka logowania ---- */
function openLogin(){
  const ni=NI();
  if(!ni){ toast("Nie udało się wczytać logowania Netlify – sprawdź internet albo wyłącz blokadę reklam dla tej strony"); return; }
  try{ ni.open("login"); }catch(e){ toast("Logowanie niedostępne: "+e.message); }
}
const PL_ERR=e=>{ const m=((e&&e.json&&(e.json.error_description||e.json.msg||e.json.error))||(e&&e.message)||"").toString();
  if(/not confirmed/i.test(m)) return "E-mail nie został jeszcze potwierdzony – kliknij link z maila od Netlify.";
  if(/invalid|no user|password/i.test(m)) return "Nieprawidłowy e-mail albo hasło.";
  if(/fetch|network|failed/i.test(m)) return "Brak połączenia z internetem.";
  return m||"Nie udało się zalogować."; };
async function loginDirect(email,pw,remember){
  const ni=NI(); let g=null; try{ g=ni&&ni.gotrue; }catch(e){}
  if(!g||typeof g.login!=="function"){ openLogin(); return; }
  const u=await g.login(email,pw,remember);
  try{ localStorage.setItem("augustapka.remember",remember?"1":"0"); }catch(e){}
  onUser(u); toast("Witaj, "+((u.user_metadata&&u.user_metadata.full_name)||u.email)+"!");
}
function gate(show){
  let g=document.querySelector(".gate");
  if(!show){ if(g) g.remove(); return; }
  if(g) return;
  const em=h("input",{class:"input",type:"email",name:"email",id:"login-email",autocomplete:"username",inputmode:"email",autocapitalize:"off",placeholder:"E-mail",required:true});
  const pw=h("input",{class:"input",type:"password",name:"password",id:"login-pass",autocomplete:"current-password",placeholder:"Hasło",required:true});
  const show1=h("button",{type:"button",class:"btn sm ghost pw-eye","aria-label":"Pokaż hasło",onclick:()=>{ pw.type=pw.type==="password"?"text":"password"; show1.textContent=pw.type==="password"?"👁":"🙈"; }},"👁");
  const rem=h("input",{type:"checkbox",id:"login-remember",checked:true});
  const err=h("div",{class:"login-err small hide"});
  const btn=h("button",{type:"submit",class:"btn pri",style:"width:100%"},"Zaloguj się");
  const form=h("form",{class:"login-form stack",autocomplete:"on"},em,h("div",{class:"pw-wrap"},pw,show1),
    h("label",{class:"chk small",style:"justify-content:flex-start"},rem,"Zapamiętaj mnie na tym urządzeniu"),err,btn);
  form.onsubmit=async e=>{ e.preventDefault(); err.classList.add("hide"); btn.disabled=true; btn.textContent="Loguję…";
    try{ await loginDirect(em.value.trim(),pw.value,rem.checked); }catch(x){ err.textContent=PL_ERR(x); err.classList.remove("hide"); }
    btn.disabled=false; btn.textContent="Zaloguj się"; };
  const forgot=h("button",{type:"button",class:"linkbtn small"},"Nie pamiętasz hasła?");
  forgot.onclick=async()=>{ const mail=em.value.trim(); if(!mail){ err.textContent="Wpisz najpierw swój e-mail, a potem kliknij „Nie pamiętasz hasła?”."; err.classList.remove("hide"); em.focus(); return; }
    try{ const g=NI()&&NI().gotrue; if(!g) throw new Error("network"); await g.requestPasswordRecovery(mail); err.classList.add("hide"); toast("Wysłano maila z linkiem do ustawienia nowego hasła"); }
    catch(x){ err.textContent="Nie udało się wysłać maila. "+PL_ERR(x); err.classList.remove("hide"); } };
  g=h("div",{class:"gate"},h("div",{class:"card stack"},logoEl("vert_color","vert_white","gate-logo"),h("h1",{style:"font-size:26px;margin:0"},"AugustApka"),
    h("p",{class:"small",style:"margin:0"},"Zaloguj się, żeby mieć swój profil i ten sam postęp na telefonie i laptopie."),
    form,forgot,
    h("p",{class:"small muted"},"Konto zakłada się z zaproszenia – poproś o nie administratora rocznika. Zaproszenie przychodzi mailem: kliknij link i ustaw hasło."),
    h("button",{class:"btn sm ghost",onclick:()=>{ try{ localStorage.setItem("augustapka.guest","1"); }catch(e){} gate(false); }},"Kontynuuj bez konta (postęp tylko na tym urządzeniu)")));
  document.body.append(g);
}
function onUser(u){
  const prev=meta().uid;
  user=u||null; window.PROFILE&&PROFILE.refreshBtn();
  if(user){
    gate(false);
    if(prev&&prev!==user.id){ applying=true; Store.load({}); applying=false; render(); } // inny student na tym urządzeniu – zaczyna od swojego konta
    setMeta({uid:user.id}); pull();
  } else {
    let guest=false; try{ guest=localStorage.getItem("augustapka.guest")==="1"; }catch(e){}
    if(!guest) gate(true);
  }
  if(location.hash.slice(1)==="profil") render();
}
window.CLOUD={
  user:()=>user,
  login:()=>{ try{ localStorage.removeItem("augustapka.guest"); }catch(e){} gate(true); },
  logout:async()=>{ clearTimeout(timer); const u=user; if(u){ try{ await push(); }catch(e){} }
    applying=true; Store.load({}); applying=false; setMeta({uid:null,at:null});
    try{ localStorage.removeItem("augustapka.guest"); }catch(e){}
    try{ if(u&&typeof u.logout==="function") await u.logout(); }catch(e){}
    try{ if(NI()) await NI().logout(); }catch(e){}
    try{ localStorage.removeItem("gotrue.user"); }catch(e){}
    if(user){ user=null; onUser(null); render(); } },
  changePassword:async(pw)=>{ if(!user) throw new Error("Niezalogowany"); user=await user.update({password:pw}); return true; },
  syncNow:async()=>{ await push(); },
  status:()=>state,
  updateName:async(n)=>{ user=await user.update({data:{full_name:n}}); window.PROFILE&&PROFILE.refreshBtn(); }
};
function initIdentity(){
  const ni=NI(); if(!ni){ setState("logowanie niedostępne (brak internetu?)"); return; }
  ni.on("init",u=>onUser(u));
  ni.on("login",u=>{ onUser(u); ni.close(); toast("Witaj, "+((u.user_metadata&&u.user_metadata.full_name)||u.email)+"!"); });
  ni.on("logout",()=>{ user=null; onUser(null); render(); });
  // Widżet Netlify sam się uruchamia po wczytaniu strony i wtedy obsługuje linki z maili
  // (#invite_token, #confirmation_token, #recovery_token). Drugie init() psuło zaproszenia,
  // więc tylko ustawiamy język, a init() wołamy wyłącznie, gdyby widżet nie wystartował sam.
  try{ if(typeof ni.setLocale==="function") ni.setLocale("pl"); }catch(e){}
  let started=false; ni.on("init",()=>{ started=true; });
  const fallback=()=>setTimeout(()=>{ if(!started){ try{ ni.init({locale:"pl"}); }catch(e){} } },2500);
  if(document.readyState==="complete") fallback(); else window.addEventListener("load",fallback);
}
if(window.netlifyIdentity) initIdentity(); else window.addEventListener("load",initIdentity);

/* ---- PWA ---- */
if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost")) window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));
})();
