j normie typograficznej numer przypisu umieszcza się przed znakiem interpunkcyjnym kończącym zdanie lub frazę (przed kropką lub przecinkiem). Wyjątkiem są znaki zapytania i wykrzykniki będące integralną częścią cytatu.</li><li><b>Cudzysłów wewnętrzny:</b> Gdy wewnątrz cytatu pojawia się kolejny cytat, stosuje się cudzysłów francuski ostrokątny: « ».</li><li><b>Zasada zapisu nazwisk i tytułów:</b> Za pierwszym razem podaje się pełne imię i nazwisko autora oraz pełny tytuł; w kolejnych powtórzeniach stosuje się nazwisko skrócone oraz skrócony tytuł dzieła.</li><li><b>Krój czcionki cytatu:</b> Cytaty (polskie i obcojęzyczne) pisze się w cudzysłowie czcionką prostą (antykwą), bez kursywy.</li></ul>"}, {"t": "Ćwiczenia – mowa Arystofanesa, Sokrates i Agaton, elenchos", "html": "<div class=\"eyebrow\">HISTORIA FILOZOFII / WSTĘP DO FILOZOFII – Notatka z ćwiczeń</div>\n<div class=\"topic\"><span>Temat</span>Mowa Arystofanesa w „Uczcie”, Sokrates wobec Agatona i Metoda Elenktyczna</div>\n<h4><span class=\"num\">1.</span> Mowa Arystofanesa w Uczcie Platona</h4>\n<p>Co mówi Arystofanes? → Opowiada mit o pierwotnej naturze człowieka (mit o androgynach).</p>\n<p>Jak należy to zinterpretować? → Zeus, karząc ludzi za ich pychę (hybris), przepołowił ich na dwie części. Od tamtej pory każda połówka tęskni i szuka swojej brakującej części – miłość (Eros) jest dążeniem do odzyskania utraconej pełni i jedności.</p>\n<h4><span class=\"num\">2.</span> Rozmowa Sokratesa z Agatonem: Metoda Elenktyczna</h4>\n<ul><li><b>Koniec:</b> Patrzenie bezkrytyczne → Sokrates w dyskusji najpierw zaczął od tego, że pozornie przyznał rację Agatonowi (zastosował ironię sokratejską).</li></ul>\n<p>Następnie poprzez umiejętnie stawiane pytania doprowadził Agatona do zaprzeczenia samemu sobie (do obalenia własnej tezy: skoro miłość jest pragnieniem piękna, to znaczy, że samemu Erosowi tego piękna brakuje, nie może więc być bogiem najpiękniejszym).</p>\n<ul><li><b>Metoda elenktyczna (metoda zbijania):</b> Dialektyczny sposób prowadzenia dialogu przez Sokratesa, polegający na zadawaniu pytań w taki sposób, aby rozmówca sam dostrzegł wewnętrzną sprzeczność swoich przekonań i uznał własną niewiedzę.</li></ul>\n<h4><span class=\"num\">3.</span> Zadanie na następne zajęcia</h4>\n<p>Platon, Państwo, księga VII (Alegoria jaskini, 514a–517a).</p>"}, {"t": "Wykład 4 i ćwiczenia – Heraklit, Parmenides, atomiści, Platon (26.10.2026)", "html": "<div class=\"eyebrow\">HISTORIA FILOZOFII – Wykład 4 i Ćwiczenia</div>\n<div class=\"meta\">🗓 Poniedziałek, 26 października 2026, 09:45</div>\n<h3 class=\"part\">CZĘŚĆ I: WYKŁAD – HERAKLIT (DOKOŃCZENIE), PARMENIDES Z ELEI I ATOMIŚCI</h3>\n<h4><span class=\"num\">1.</span> Heraklit z Efezu – Psychologia, Epistemologia i Etyka</h4>\n<h4><span class=\"num\">A.</span> Koncepcja „suchej duszy” i losy pośmiertne</h4>\n<ul><li><b>Zasada z tablicy:</b> „Dusza sucha jest najlepsza, dusza mokra jest najgorsza”. „Ludzie czuwający mają wspólny świat, a śpiący [zwracają się każdy do własnego]”.</li></ul>\n<p>Czym jest sucha dusza?</p>\n<p>Nie jest to po prostu dusza człowieka fizycznie trzeźwego.</p>\n<p>Sucha dusza to dusza człowieka, który panuje nad sobą i swoimi emocjami, myśli racjonalnie i nie daje się unosić emocjom.</p>\n<h5>Przemiany żywiołów w duszy (droga w dół i droga wzwyż)</h5>\n<p>Dusza uczyniona jest z ognia. Gdy ogień zamienia się w wodę (wilgoć), dusza słabnie.</p>\n<ul><li><b>Droga w dół:</b> Kiedy droga wiodąca w dół osiąga najwyższą przewagę, a ogień w nas przekształca się w wodę, wówczas umieramy – i wszystko, co z nas pozostaje, to woda i ziemia.</li><li><b>Droga wzwyż (możliwość wiary w nieśmiertelność):</b> Istnieje proces odwrotny, dokonujący się na drodze wzwyż – gdy trzeźwiejemy albo gdy budzimy się rano, ogień, który przygasł chwilowo, ożywa na nowo.</li></ul>\n<h5>Aforyzm o śmiertelnych i nieśmiertelnych (wątek orficko-pitagorejski)</h5>\n<ul><li><b>Cytat:</b> „Śmiertelnicy są nieśmiertelni, nieśmiertelni zaś śmiertelni”.</li><li><b>Znaczenie:</b> Niektóre dusze (śmiertelnicy) stają się ostatecznie tak płomieniste, że umierają dla ciała i stają się bogami. Ale i bogowie (nieśmiertelni), kiedy przeważa w nich droga w dół, zstępują ku ziemi i stygną, przez co stają się duszami ludzkimi.</li></ul>\n<h4><span class=\"num\">B.</span> Refleksje epistemologiczne i etyczne (Punkt 6 z tablicy)</h4>\n<p>Heraklit był pierwszym między filozofami przyrody, który wykazał zainteresowania humanistyczne – pozostawił refleksje epistemologiczne i etyczne.</p>\n<h5>Refleksje epistemologiczne</h5>\n<p>Krytycznie zapatrywał się na poznanie zmysłowe.</p>\n<ul><li><b>Cytat:</b> „Złymi świadkami są oczy i uszy ludziom, którzy mają dusze barbarzyńców” – jest to najdawniejsza (najstarsza) refleksja z krytyki poznania, jaka przechowała się w filozofii europejskiej.</li></ul>\n<h5>Refleksje (aforyzmy) etyczne</h5>\n<p>Przejawia się w nich kult prawa oraz kult jednostki wyższej.</p>\n<ul><li><b>Cytat:</b> „Jeden wart tyle, co dziesięć tysięcy, jeśli jest najlepszy”.</li></ul>\n<h5>Dwa typy moralności</h5>\n<ul><li><b>Moralność przeciętna (moralność tłumu):</b> Tłum uważa przeciwieństwa za zbędne – przekłada zdrowie nad chorobę, ciepło nad zimno, radość nad smutek. Skoro tak, to skarży się, gdy przychodzi choroba, zimno czy smutek.</li><li><b>Moralność wyższa (moralność mędrca):</b> Mędrzec wie, że przeciwieństwa są potrzebne – zło czyni dobro przyjemnym, a głód każe cenić nadmiar (sytość). Poczucie panujących wszędzie przeciwieństw było więc wspólnym motywem zarówno fizyki, jak i etyki Heraklita.</li></ul>\n<h4><span class=\"num\">2.</span> Parmenides z Elei (Część V wykładu)</h4>\n<h4><span class=\"num\">A.</span> Wstęp biograficzny i historyczny</h4>\n<p>Wnioski Heraklita spotkały się z gwałtownym sprzeciwem Parmenidesa z Elei (miasto w południowej Italii).</p>\n<p>Pochodził z bogatego i potężnego rodu; działał w początkach V w. p.n.e.</p>\n<ul><li><b>W wieku 65 lat (na tablicy:</b> 60 lat) odwiedził Ateny, gdzie rozmawiał z nim młodociany wówczas Sokrates.</li></ul>\n<p>Początki wiedzy filozoficznej otrzymał prawdopodobnie od pitagorejczyków.</p>\n<h4><span class=\"num\">B.</span> Poglądy Parmenidesa (5 punktów z wykładu i tablicy)</h4>\n<ul><li><b>Punkt 1:</b> Droga prawdy</li></ul>\n<p>Dotąd filozofowie po prostu ogłaszali swoje teorie; Parmenides podbudował swoje poglądy rozumowaniem logicznym.</p>\n<ul><li><b>Pierwszą jego troską było wyłożyć zasady rozumowania:</b> ostatecznym sędzią prawdy jest rozum.</li></ul>\n<p>Kiedykolwiek i gdziekolwiek zmysły pozostają z rozumem w konflikcie, dane dostarczane przez zmysły muszą być fałszywe.</p>\n<ul><li><b>Fundamentalne prawo myśli:</b> żadna koncepcja sama w sobie sprzeczna nie może być słuszna.</li><li><b>Punkt 2:</b> Zmiana (Atak na realność zmiany)</li></ul>\n<p>Według Parmenidesa zmiana jest niemożliwa logicznie.</p>\n<ul><li><b>Przypuścił atak na realność zmiany</b> – skierowany po części przeciw Heraklitowi, a w dużej mierze przeciw całej wcześniejszej filozofii greckiej, która uważała zmianę za zjawisko oczywiste i nieulegające wątpliwości.</li><li><b>Rdzeń uwag krytycznych Parmenidesa:</b> Żadna rzecz nie może być jednocześnie sobą i nie-sobą.</li><li><b>Cytat:</b> „Ciemne pospólstwo utrzymuje, że coś jest i zarazem nie jest tym samym i nie tym samym, jak również, że wszelkie rzeczy wędrują w przeciwnych sobie kierunkach”.</li><li><b>Według niego każda rzecz musi albo być, albo nie być</b> – nie ma drogi pośredniej. Co więcej, to, co jest, nie może się zmienić (zmiana zatem nie może istnieć).</li><li><b>Punkt 3:</b> Teoria bytu (Ontologia)</li><li><b>Punkt wyjścia rozważań o bycie:</b> Niezwykle prosty – polegał na jednej tautologicznie brzmiącej tezie.</li><li><b>Wyjaśnienie pojęcia tautologii:</b> Tautologia to wypowiedź (zdanie), w której wyraz określający nie wzbogaca treści wyrazu określanego, lecz tylko ją powtarza (np. „Masło jest maślane” – wyraz określający „maślane” nie dodaje nic nowego do wyrazu określanego „masło”).</li></ul>\n<h5>Tautologiczna teza Parmenidesa</h5>\n<p>„Trzeba z konieczności powiedzieć i myśleć, że tylko to, co jest, istnieje, bo byt jest, a niebytu nie ma.”</p>\n<ul><li>Z tej jednej prostej zasady Parmenides wywnioskował (wyprowadził) wszystkie własności bytu:</li><li><b>Byt nie ma początku ani końca (jest wieczny i nieśmiertelny):</b> Z czego miałby powstać? Tylko z niebytu, a wiadomo, że niebytu nie ma. Z tej samej racji nie może mieć końca.</li><li><b>Byt jest ciągły:</b> Każda przerwa byłaby niebytem, a niebytu nie ma.</li><li><b>Byt jest nieruchomy i w ogóle niezmienny:</b> Mógłby się zmienić tylko w niebyt, a niebytu nie ma.</li><li><b>Byt jest niepodzielny:</b> Części bytu, nie będąc już całym bytem, musiałyby być niebytem.</li><li><b>Byt nie ma w sobie różnic:</b> To, co różne od bytu, byłoby niebytem.</li><li><b>Byt jest stały i jeden</b> – jest przeciwieństwem stawania się i mnogości.</li><li><b>Cytat:</b> „Słowami jest tylko to, co śmiertelni ustanowili w swym języku, w przekonaniu, że mówią prawdę: stawanie się i ginięcie, istnienie i nieistnienie, zmiana miejsca i świecącej barwy”. (Zerwanie z jończykami, dla których ruch był nieodłączny od rzeczy).</li></ul>\n<p>Czy byt Parmenidesa jest niematerialny?</p>\n<ul><li><b>Nie</b> – rozróżnienie na byt materialny i niematerialny (abstrakcyjny, pozaświatowy) było obce czasom Parmenidesa. Miał on na myśli ten sam byt materialny, o którym rozmyślali inni filozofowie greccy.</li></ul>\n<p>Wynika to z jego twierdzenia, że byt jest ograniczony, zakończony we wszystkich kierunkach, podobny do kuli.</p>\n<h5>Rozbrat z doświadczeniem i zaczątek dualizmu</h5>\n<p>Teoria Heraklita była w zgodzie ze zmysłowym obrazem świata; Parmenides drogą czystego rozumowania doszedł do wyników przeciwnych doświadczeniu.</p>\n<p>Znał zjawiska w ich zmienności i różnorodności, ale uznał je za złudne mniemania ludzkie (doxa), przeciwstawiając im proste, niezmienne, jednolite podłoże (byt).</p>\n<ul><li><b>Tym samym uczynił koniecznym odróżnienie bytu od zjawisk</b> – dlatego jego filozofia jedności, paradoksalnie, nosiła w sobie zaczątek dualizmu (którego nie było u Heraklita).</li><li><b>Punkt 4:</b> Metoda (Metoda dedukcyjna a priori)</li></ul>\n<p>Parmenides po raz pierwszy świadomie i systematycznie zastosował metodę dedukcyjną.</p>\n<p>Stał się prototypem filozofów odrzucających doświadczenie i wywodzących całą wiedzę z założonych a priori przesłanek ogólnych:</p>\n<ul><li><b>a priori</b> – z góry, niezależnie od doświadczenia.</li><li><b>a posteriori</b> – w oparciu o doświadczenie (po doświadczeniu).</li></ul>\n<p>Zaufał wyłącznie rozumowi i poznaniu myślowemu, poznanie zmysłowe uznając za niewiarygodne.</p>\n<p>Odpowiadało to naturalnym skłonnościom umysłu (jakość i stałość są potrzebą umysłu i postulatem badania), jednak Parmenides zlekceważył znajomość faktów, zrywając łączność między bytem a doświadczeniem (stworzył groźny precedens w historii filozofii).</p>\n<ul><li><b>Punkt 5:</b> Postawa epistemologiczna (Tożsamość myśli i bytu)</li></ul>\n<p>Swoją ontologię Parmenides uzasadnił epistemologicznie. Skąd wiemy, że niebytu nie ma? → Bo o niebycie nie można ani pomyśleć, ani go poznać, ani wypowiedzieć.</p>\n<h5>Między myślą a bytem zachodzi najściślejszy związek</h5>\n<p>„Ta sama rzecz jest i jest myślana. Tym samym jest myśl i rzecz, której myśl dotyczy, bo nie znajdziesz myśli bez czegoś istniejącego, co wypowiada się w myśli.”</p>\n<ul><li><b>Sens twierdzenia:</b> Myśl ma naturę odtwórczą (może odtwarzać tylko coś istniejącego); gdy myśl nie jest w błędzie, w swojej treści nie różni się od tego, co rzeczywiście istnieje.</li><li><b>Brak rozróżnienia myśli dyskursywnej i intuicyjnej:</b> Wcześni Grecy nie utożsamiali myśli z abstrakcyjnym procesem rozumowania (dyskursywnym), lecz pojmowali myśl jako intuicję – czyli pewnego rodzaju oglądanie i dotykanie rzeczywistości przez umysł.</li></ul>\n<p>Parmenides utożsamił byt z myślą, a nie ze spostrzeżeniami czy wyobrażeniami (które ulegają złudzeniom). Dokonał w ten sposób epokowego rozróżnienia poznania zmysłowego i myślowego (pierwszy i najważniejszy etap rozróżniania władz umysłowych).</p>\n<ul><li><b>Cytat:</b> „Nie poddawaj się przyzwyczajeniu i nie daj się powodować wzrokowi, który nie umie patrzeć, szumiącemu słuchowi i językowi, ale myślą rozsądź sporne dociekania”.</li></ul>\n<h4><span class=\"num\">3.</span> Demokryt i Atomiści (Część VI wykładu – Wprowadzenie)</h4>\n<ul><li><b>Znaczenie atomizmu:</b> Najdojrzalszy twór, jaki wydała wczesna grecka filozofia przyrody w pierwszym okresie filozofii starożytnej; główna starożytna postać materializmu (materialistycznego poglądu na świat).</li></ul>\n<h5>Twórcy</h5>\n<ul><li><b>Leucyp (połowa V w. p.n.e.):</b> Zainicjował atomizm, stworzył jego zasadniczy zrąb, główne pojęcia i tezy. O jego życiu i dziełach brak pewnych informacji (nawet w starożytności podejrzewano niesłusznie, że był postacią mityczną); prawdopodobnie mieszkał w Abderze i kierował tamtejszą szkołą.</li><li><b>Demokryt z Abdery (ok. 460 – ok. 370 p.n.e.):</b> Uczeń Leucypa; rozwinął teorię i powiązał ją z doświadczeniem, a jego potężna postać przysłoniła nauczyciela.</li></ul>\n<h5>Życie i dzieła Demokryta</h5>\n<p>Uczył się od Leucypa w Abderze, kształcił się w podróżach (korzystał z mądrości Wschodu), odwiedził Ateny, lecz ciche, oddane nauce życie spędził w rodzinnym mieście.</p>\n<p>Dla pogodnego usposobienia otrzymał przydomek „śmiejącego się filozofa”.</p>\n<ul><li><b>Wyjątkowa wszechstronność naukowa:</b> za panowania Tyberiusza Trazjusz (Trasylos) ułożył jego 60 dzieł w 15 tetralogii (pisma z najrozmaitszych dziedzin). W kolejnych pokoleniach nastąpiła już specjalizacja naukowa i oddzielenie filozofii od nauk szczegółowych.</li></ul>\n<p>W poglądach Demokryta widoczna jest reakcja na relatywizm sofistów (z którymi stykał się w Abderze) oraz wymiana myśli z pitagorejczykami w matematycznym traktowaniu przyrody.</p>\n<h3 class=\"part\">CZĘŚĆ II: ĆWICZENIA – PLATON („UCZTA” ORAZ „PAŃSTWO” KS. VII)</h3>\n<h4><span class=\"num\">1.</span> Analiza „Uczty” Platona (Rozdziały XXII–XXIV, XXVII–XXVIII)</h4>\n<h4><span class=\"num\">A.</span> Charakter i cel rozmowy Sokratesa z Diotymą</h4>\n<ul><li><b>Sokrates przytacza swoją rozmowę z kobietą</b> – wieszczką Diotymą.</li><li><b>Cel literacki (forma przeprosin gospodarza):</b> Dialog został tak skonstruowany, by pokazać, że tak jak wcześniej Agaton (gospodarz uczty) został zbity z tropu i doprowadzony do sprzeczności przez Sokratesa, tak dawniej sam Sokrates został potraktowany przez Diotymę. Łagodzi to przykre wrażenie po obaleniu tez gospodarza.</li></ul>\n<p>Kto przemawia przez Sokratesa? Ustami Sokratesa własny poglądy na naturę miłości wykłada sam Platon.</p>\n<h4><span class=\"num\">B.</span> Kim jest Eros? (Między głupotą a mądrością)</h4>\n<ul><li><b>Eros nie jest bogiem ani człowiekiem</b> – jest pośrednikiem (daimonem) pomiędzy boskością a ludzkością (między Bogiem a człowiekiem), synem Porosa i Penii.</li></ul>\n<h5>Eros jako filozof</h5>\n<ul><li><b>Znajduje się pomiędzy mądrością a głupotą</b> – nie jest mędrcem, lecz miłośnikiem mądrości, czyli filozofem (tym, który mądrości nie posiada, ale jej pożąda).</li></ul>\n<h5>Trzy postacie wobec wiedzy</h5>\n<ul><li><b>Filozof (Eros):</b> Wie, że nie wie (uświadamia sobie brak, dlatego pragnie i szuka mądrości).</li><li><b>Głupiec:</b> Nie wie, że nie wie (nie odczuwa braku, więc nie dąży do wiedzy).</li><li><b>Mędrzec (bóg):</b> Wie, że wie (posiada już mądrość, więc nie musi do niej dążyć).</li></ul>\n<h4><span class=\"num\">C.</span> Definicja miłości i droga ku Idei Piękna (Rozdz. XXVII–XXVIII)</h4>\n<ul><li><b>Definicja miłości:</b> Ponieważ u podstaw leży brak, miłość to właściwe duszy dążenie do osiągnięcia i wiecznego posiadania dobra (szczęścia).</li></ul>\n<h5>Droga do osiągnięcia dobra (Drabina Piękna)</h5>\n<p>W starożytnej Grecji pojęcie piękna miało znaczenie szersze niż tylko estetyczne – obejmowało również dobro i prawdę.</p>\n<h5>Kolejne szczeble wznoszenia się</h5>\n<p>Najpierw człowiek zachwyca się pięknem fizycznym / cielesnym (piękne ciała).</p>\n<p>Następnie czyni przedmiotem miłości piękno duchowe (piękne dusze, myśli, zachowania; motyw Sokratesa „zapładniającego dusze” młodych ludzi w rozdz. XXVII).</p>\n<p>Na samym końcu ten, kto udoskonala się w miłości, ogląda Piękno samo w sobie, niezmienne i wieczne – czyli platońską Ideę Piękna (Dobro Najwyższe).</p>\n<h4><span class=\"num\">D.</span> Ocena i krytyka platońskiej koncepcji miłości</h4>\n<ul><li><b>Greckie rozumienie miłości z braku:</b> Według Greków i Platona kocha wyłącznie ten, kto nie posiada (komu brakuje). Gdyby miłość została całkowicie zaspokojona, przestałaby być dążeniem (czyli miłością), a stałaby się samym posiadaniem.</li></ul>\n<p>Czego brakuje w tej koncepcji?</p>\n<p>W ujęciu platońskim nie ma miłości rozumianej jako bezinteresowny dar z samego siebie (poświęcenie dla drugiego).</p>\n<h4><span class=\"num\">2.</span> Analiza „Państwa” Platona – Księga VII: Alegoria Jaskini</h4>\n<ul><li><b>Czas powstania dzieła:</b> między 380 a 370 r. p.n.e. (dokładniej: ok. 380 r. p.n.e.).</li></ul>\n<h4><span class=\"num\">A.</span> Streszczenie i elementy konstrukcyjne mitu jaskini</h4>\n<h5>Wewnątrz jaskini</h5>\n<p>Więźniowie przykuci od dzieciństwa kajdanami za nogi i szyje – siedzą nieruchomo, patrząc tylko na przeciwległą ścianę.</p>\n<p>Ściana jaskini, na którą padają cienie i od której odbija się echo głosów (więźniowie biorą cienie za jedyną prawdę i nadają im nazwy).</p>\n<p>Ścieżka (droga) biegnąca w górę za plecami więźniów oraz zbudowany wzdłuż niej murek (jak parawan u kuglarzy).</p>\n<p>Ludzie idący ścieżką, niosący ponad murkiem różnorodne przedmioty, posągi ludzi i zwierząt z kamienia i drewna (jedni wydają głosy, drudzy milczą).</p>\n<p>Ogień płonący z góry i z daleka za murkiem, oświetlający noszone przedmioty.</p>\n<p>Strome, kamieniste wyjście prowadzące pod górę ku światłu.</p>\n<h5>Świat poza jaskinią (na górze)</h5>\n<p>Cienie oraz odbicia ludzi i przedmiotów w wodzie (pierwsze obiekty, na które może patrzeć oślepiony więzień).</p>\n<p>Same przedmioty, gwiazdy, księżyc i nocne niebo (łatwiejsze do oglądania w nocy niż słońce za dnia).</p>\n<ul><li><b>Słońce samo w sobie</b> – oglądane na końcu na własnym miejscu; więzień odkrywa, że to ono rządzi porami roku, całym światem widzialnym i jest ostateczną przyczyną wszystkiego, co wcześniej widział w jaskini.</li></ul>\n<h4><span class=\"num\">B.</span> Etapy wyzwolenia i powrót do jaskini</h4>\n<ul><li><b>Cierpienie przy wyzwoleniu:</b> Zerwanie kajdan, obrócenie szyi, spojrzenie w blask ognia i wyciąganie siłą po stromiźnie na słońce powodują ból oczu, cierpienie i gniew; więzień początkowo uważa dawne cienie za prawdziwsze.</li><li><b>Przemiana wartości:</b> Po ujrzeniu Słońca wyzwolony człowiek uważa swoją przemianę za szczęście, lituje się nad współwięźniami i gardzi dawnymi zaszczytami jaskini (tych, którzy najlepiej pamiętali kolejność cieni) – wolałby jak u Homera „być parobkiem u biedaka”, niż wrócić do dawnych złudzeń.</li><li><b>Powrót na dół:</b> Gdyby wrócił ze słońca w mrok jaskini, zanim jego oczy przywykną do ciemności, przegrałby w odgadywaniu cieni i naraziłby się na śmiech. Więźniowie uznaliby, że wspinaczka psuje oczy, a gdyby ktoś próbował ich wyzwalać i prowadzić na górę – zabiliby go.</li></ul>\n<h4><span class=\"num\">C.</span> Dwie perspektywy interpretacji alegorii (zapowiedź analizy)</h4>\n<ul><li><b>Perspektywa ontologiczna (dotycząca tego, co istnieje):</b> Poszczególne elementy obrazu symbolizują rodzaje bytów (jaskinia = świat zmysłowy; świat na zewnątrz = świat Idei).</li><li><b>Perspektywa epistemologiczna (dotycząca poznania):</b> Elementy i etapy wyjścia z jaskini symbolizują kolejne poziomy i sposoby ludzkiego poznania.</li></ul>"}, {"t": "Praca semestralna o „Uczcie” – plan działania", "html": "<div class=\"eyebrow\">HISTORIA FILOZOFII – ćwiczenia: praca semestralna</div><div class=\"topic\"><span>Temat</span>Koncepcja miłości w „Uczcie” Platona – analiza i ocena</div><ul><li><b>Termin oddania:</b> do 11.01.2027</li><li><b>Wymogi formalne:</b> 5–7 stron, czcionka 12, konieczne przypisy</li></ul><ul><li><b>Określenie celu pracy:</b> analiza polifonicznej koncepcji Erosa w Uczcie Platona oraz jej krytyczna ocena.</li><li><b>Krótka zapowiedź tezy:</b> Uczta ukazuje miłość nie jako stan posiadania, lecz jako dynamikę braku, pragnienia i wznoszenia się od zmysłowego piękna ku transcendencji.</li><li><b>Analiza tekstowa</b> – wielowymiarowość Erosa (ok. 3–4 strony)</li><li><b>Mowa Arystofanesa:</b> mit o androgynach – miłość jako próba odzyskania pierwotnej całości i leczenie ludzkiej egzystencjalnej rozbiorowości.</li><li><b>Polemika z Agatonem i metoda elenktyczna:</b> wykazanie przez Sokratesa, że miłość zawsze jest pragnieniem tego, czego się nie ma (brak = pragnienie).</li><li><b>Objawienie Diotymy (Kluczowy element na ocenę celującą):</b> Eros jako wielki daimon (pośrednik między bóstwami a śmiertelnikami), miłość jako dążenie do nieśmiertelności poprzez zrodzenie w pięknie (cielesne lub duchowe) oraz słynna drabina miłości (wstęp od piękna ciał, przez piękno dusz i praw, aż po kontakt z ideą Piękna samego w sobie).</li></ul>\n<p>Ocena i krytyka filozoficzna (ok. 1–1,5 strony)</p>\n<ul><li><b>Ocena ontologiczna:</b> Eros jako siła napędowa ludzkiego poznania (epistemologiczny wymiar miłości).</li><li><b>Krytyka / perspektywa porównawcza:</b> Zderzenie platońskiego Erosa (który opiera się na braku i dążeniu \"w górę\" po drabinie braku) z późniejszym ujęciem chrześcijańskim (agape – miłość bezinteresowna, darująca). To punkt, który profesorowie nagradzają najwyższymi ocenami za samodzielność myślenia.</li></ul>\n<p>Zakończenie (ok. 0,5 strony)</p>\n<ul><li><b>Podsumowanie wniosków:</b> synteza miłości jako pośrednika i drogi ku mądrości.</li></ul>\n<h4><span class=\"num\">II.</span> 4 kroki do napisania pracy w ekspresowym tempie</h4>\n<ul><li><b>Krok 1:</b> Zbierz gotowe klocki (0,5 godziny)</li></ul>\n<h5>Nie wymyślaj koła na nowo. Wykorzystaj materiały z zajęć</h5>\n<ul><li><b>Przypomnij sobie omówione motywy:</b> dylemat Eutyfrona, drogę Erosa, pojęcie eidos oraz metodę elenktyczną stosowaną w dialogu z Agatonem.</li><li><b>Sięgnij bezpośrednio do tekstu Uczty Platona</b> – wypisz sobie 3–4 mocne cytaty (np. definicję Erosa jako syna Porosa i Penii oraz fragment o drabinie miłości).</li><li><b>Krok 2:</b> Pisz metodą od środka (2–3 godziny)</li><li><b>Nigdy nie zaczynaj pisania od wstępu</b> – to blokuje.</li><li><b>Zacznij od Partii Analitycznej (Rozdział II):</b> Opisz mowę Arystofanesa i koncepcję Diotymy. To najprostsza część, bo opiera się na czystej egzegezie tekstu źródłowego.</li><li><b>Napisz Ocenę (Rozdział III):</b> Dodaj od siebie 2 akapity refleksji nad tym, czym różni się miłość romantyczna od platońskiego dążenia do absolutnego Piękna.</li><li><b>Na koniec napisz Wstęp i Zakończenie:</b> Kiedy wiesz już, co faktycznie znalazło się w pracy, napisanie wstępu zajmie 10 minut.</li><li><b>Krok 3:</b> Zadbaj o wymogi formalne i przypisy (0,5 godziny)</li><li><b>Czcionka:</b> Times New Roman lub Arial, rozmiar 12, interlinia 1,5.</li><li><b>Złota zasada przypisów:</b> Pamiętaj o rygorystycznym wymogu edytorskim z wykładów – numer przypisu umieszcza się zawsze PRZED znakiem interpunkcyjnym (np. ...wskazuje na naturę Erosa. a nie po kropce).</li></ul>\n<p>Jako przypisy główne stosuj odwołania do stron Uczty Platona (np. Platon, Uczta, 201d–202b) oraz do 1–2 opracowań podręcznikowych (np. Giovanni Reale, Historia filozofii starożytnej).</p>\n<ul><li><b>Krok 4:</b> Szybka korekta logiczna (15 minut)</li></ul>\n<p>Przeleć tekst pod kątem płynności przejść między akapitami. Upewnij się, że nie pomieszałeś poziomu języka przedmiotowego z metajęzykiem i trzymasz się naukowej, precyzyjnej terminologii (używaj pojęć takich jak daimon, penia, poros, eidos).</p>\n<p>Dzięki temu podejściu zamkniesz pisanie w okolicach 3–4 godzin skupionej pracy, a praca będzie miała zwarty, wysoce akademicki charakter, gwarantujący najwyższą ocenę.</p>"}], "teoria": [{"t": "Wykład 1 – wprowadzenie (zeszyt)", "html": "<div class=\"eyebrow\">TEORIA POZNANIA</div>\n<div class=\"meta\">🗓 Data: 5 X 2026</div>\n<ul><li><b>Kontakt:</b> marek.soltysiak@upjp2.edu.pl</li><li><b>(W prawym górnym rogu:</b> LAPTOP!)</li><li>Literatura</li><li>Wykłady</li></ul>\n<h4><span class=\"num\">G.</span> Reale</h4>\n<ul><li>K. Ajdukiewicz</li><li><b>J. Woleński</b> – Epistemologia</li><li><b>Roman Rożdżeński</b> – Teoria poznania ks. Józef Tischner – Teoria poznania</li><li>Ćwiczenia</li><li>Wytyczne do sprawozdania</li><li><b>Objętość:</b> max 2/3 strony</li><li><b>Format:</b> format A4, czcionka 12, interlinia 1,5 między wierszami</li><li><b>Treść:</b> do jakich wniosków doszliśmy, krótka charakterystyka pojęć</li><li>Podstawowe pojęcia i zagadnienia</li><li><b>Filozofia</b> – umiłowanie mądrości.</li></ul>\n<h5>Teoria poznania – poznawanie tego, co istnieje, i sposobu, w jaki to istnieje</h5>\n<ul><li><b>Gnoseologia</b> – nauka o poznaniu.</li><li><b>Kryteriologia</b> – kryterium poznania w związku z odróżnieniem prawdy od fałszu.</li><li>Trójkąt platoński (struktura relacji poznawczo-bytowej):BÓG/ \\/ \\</li><li>CZŁOWIEK ——— ŚWIAT</li><li><b>(Bóg</b> – wierzchołek, Człowiek i Świat – podstawa relacji).</li></ul>\n<h5>Główne problemy epistemologiczne</h5>\n<h5>Źródło poznania</h5>\n<p>Doświadczenie / zmysły (empiryzm)</p>\n<p>Rozum (racjonalizm)</p>\n<p>Intuicja (u niektórych)</p>\n<ul><li><b>Granica poznania:</b> jesteśmy ograniczeni w tym, co możemy poznać.</li></ul>"}, {"t": "Wykład 1 – rozwinięcie akademickie", "html": "<div class=\"eyebrow\">TEORIA POZNANIA – SZCZEGÓŁOWE ROZWINIĘCIE MATERIAŁU</div>\n<h4><span class=\"num\">1.</span> Nazewnictwo i definicja dziedziny</h4>\n<p>Teoria poznania bada relację poznawczą zachodzącą między podmiotem poznającym (subiectum) a przedmiotem poznawanym (obiectum). W tradycji filozoficznej funkcjonują trzy bliskoznaczne terminy:</p>\n<h5>Epistemologia (gr. epistēmē – wiedza pewna, naukowa + logos – nauka, teoria)</h5>\n<p>Używana powszechnie w tradycji anglosaskiej i filozofii analitycznej.</p>\n<p>Kładzie nacisk na analizę pojęcia wiedzy, jej definicję (np. wiedza jako prawdziwe, uzasadnione przekonanie – tzw. definicja platońska), strukturę uzasadniania oraz problem sceptycyzmu.</p>\n<h5>Gnoseologia (gr. gnōsis – poznanie w sensie ogólnym, wgląd + logos)</h5>\n<p>Termin częściej stosowany w tradycji kontynentalnej i neotomistycznej.</p>\n<ul><li><b>Oznacza ogólną teorię poznania</b> – bada samą naturę aktu poznawczego, jego genezę psychologiczną i metafizyczne podstawy (poznanie jako relacja bytu do bytu).</li></ul>\n<h5>Kryteriologia (gr. kritērion – sprawdzian, probierz, narzędzie rozstrzygania)</h5>\n<p>Dział teorii poznania zajmujący się kryteriami prawdy.</p>\n<ul><li><b>Odpowiada na pytanie:</b> Skąd mamy pewność, że to, co poznajemy, jest prawdą, a nie błędem, iluzją czy snem? Jak odróżnić prawdę (veritas) od fałszu (falsitas)?</li></ul>\n<h4><span class=\"num\">2.</span> Klasyczny trójkąt relacji poznawczo-bytowej (Trójkąt platoński)</h4>\n<p>Schemat ten przedstawia trzy bieguny, w obrębie których rozgrywa się problematyka filozoficzna i epistemologiczna:</p>\n<ul><li>BÓG (Absolut / Świat Idei)/\\/ \\/ \\/ \\</li><li>CZŁOWIEK &lt;-------------&gt; ŚWIAT</li></ul>\n<p>(Podmiot) (Przedmiot)</p>\n<h5>Relacja Człowiek – Świat (horyzontalna)</h5>\n<p>Poznanie zmysłowo-empiryczne. Człowiek jako byt cielesny wchodzi w interakcję ze światem materialnym za pomocą zmysłów.</p>\n<p>W ujęciu Platona świat materialny to świat cieni (zmienny, zmysłowy, nietrwały), dający jedynie mniemanie (doxa), a nie wiedzę pewną.</p>\n<h5>Relacja Człowiek – Bóg / Absolut (wertykalna)</h5>\n<p>Człowiek posiada duszę / rozum (nous), który jest zdolny przekroczyć świat zmysłowy.</p>\n<p>U Platona poznanie prawdy dokonuje się przez anamnezę (przypomnienie sobie przez duszę tego, co oglądała w świecie wiecznych Idei przed połączeniem się z ciałem).</p>\n<p>W tradycji chrześcijańskiej (np. św. Augustyn) poznanie prawdy najwyższej dokonuje się na drodze iluminacji – boskiego oświecenia ludzkiego umysłu.</p>\n<h5>Relacja Bóg – Świat</h5>\n<p>Bóg (lub platoński Demiurg / Świat Idei) stanowi rację bytu i rację poznawalności świata materialnego. Świat jest racjonalny i uporządkowany (kosmos, nie chaos), dlatego umysł ludzki w ogóle jest w stanie go zrozumieć.</p>\n<h4><span class=\"num\">3.</span> Główne źródła poznania (Spór o genezę wiedzy)</h4>\n<ul><li><b>Jedno z fundamentalnych pytań epistemologii brzmi:</b> Skąd czerpiemy wiedzę o świecie i co jest ostateczną podstawą jej prawomocności?</li></ul>\n<h4><span class=\"num\">A.</span> Empiryzm (Zmysły / Doświadczenie)</h4>\n<ul><li><b>Teza:</b> Cała nasza wiedza pochodzi z doświadczenia zmysłowego (a posteriori).</li></ul>\n<p>Umysł ludzki w chwili narodzin jest czystą kartą (tabula rasa – John Locke).</p>\n<ul><li><b>Zasada arystotelesowsko-tomistyczna:</b> Nihil est in intellectu quod non sit prius in sensu (Nic nie ma w umyśle, co by wcześniej nie było w zmysłach).</li><li><b>Zagrożenie:</b> Prowadzi do subiektywizmu i sceptycyzmu (David Hume – zmysły rejestrują jedynie następstwo zdarzeń, a nie konieczny związek przyczynowo-skutkowy).</li></ul>\n<h4><span class=\"num\">B.</span> Racjonalizm (Rozum)</h4>\n<ul><li><b>Teza:</b> Źródłem i gwarantem wiedzy pewnej jest sam rozum (a priori), niezależny od zwodniczych danych zmysłowych.</li><li><b>Idee wrodzone (Platon, Kartezjusz):</b> pewne prawdy (np. pojęcia matematyczne, pojęcie Boga, zasada niesprzeczności) są wpisane w strukturę rozumu.</li></ul>\n<p>Wzorem poznania racjonalistycznego jest dedukcja matematyczno-geometryczna.</p>\n<h4><span class=\"num\">C.</span> Intuicjonizm (Intuicja – „u niektórych”)</h4>\n<h5>Czym jest intuicja (łac. intueri – wpatrywać się, oglądać)</h5>\n<p>Bezpośrednie, całościowe ujęcie przedmiotu lub prawdy bez udziału pośredniego wnioskowania logicznego czy analizy dyskursywnej.</p>\n<h5>Odmiany intuicji</h5>\n<ul><li><b>Intuicja intelektualna (racjonalna):</b> Natychmiastowe uchwycenie oczywistości logicznej (np. że część nie może być większa od całości, kartezjańskie Cogito ergo sum).</li><li><b>Intuicja zmysłowa:</b> Bezpośrednie naoczne ujęcie cechy fizycznej w akcie spostrzeżenia.</li><li><b>Intuicja filozoficzna / metafizyczna (np. Henri Bergson):</b> Zdolność wnikania w samą istotę życia i czasu (trwanie), niedostępna dla chłodnego, mechanicznego intelektu.</li></ul>\n<h4><span class=\"num\">4.</span> Problem granic poznania (Agnostycyzm i Granice rozumu)</h4>\n<ul><li><b>Notatka podkreśla:</b> „Granica poznania – jesteśmy ograniczeni w tym, co możemy poznać”.</li></ul>\n<h5>Ograniczenia sensoryczne i biologiczne</h5>\n<p>Nasze zmysły rejestrują zaledwie wąski wycinek spektrum fizycznego (długości fal świetlnych, częstotliwości dźwięków).</p>\n<h5>Ograniczenia kategorialne (Immanuel Kant)</h5>\n<ul><li><b>Kant dokonał rewolucji kopernikańskiej w epistemologii:</b> nie poznajemy „rzeczy samych w sobie” (noumenów), lecz jedynie „zjawiska” (fenomeny), które są ukształtowane przez nasze wrodzone, aprioryczne formy zmysłowości (czas i przestrzeń) oraz kategorie intelektu (np. przyczynowość).</li></ul>\n<h5>Granica metafizyczna / teologiczna</h5>\n<p>Umysł skończony (człowiek) z natury nie jest w stanie w pełni pojąć Bytu Nieskończonego (Boga), co prowadzi do teologii apofatycznej (negatywnej – poznawania Boga przez to, czym On nie jest).</p>\n<h4><span class=\"num\">5.</span> Jak ułożyć wymagane sprawozdanie (Wskazówki praktyczne)</h4>\n<h5>Zgodnie z wymogami wykładowcy (ks. dra Marka Sołtysiaka)</h5>\n<ul><li><b>Objętość:</b> maks. 2/3 strony A4, czcionka 12, interlinia 1,5.</li></ul>\n<h5>Układ treści</h5>\n<ul><li><b>Zwięzła charakterystyka pojęć:</b> Zdefiniowanie czym jest epistemologia/gnoseologia (nauka o poznaniu) oraz kryteriologia (poszukiwanie kryterium odróżniania prawdy od błędu).</li><li><b>Struktura relacji poznawczej:</b> Krótkie odwołanie do trójkąta platońskiego (podmiot–przedmiot–Absolut jako fundament możliwości poznawania).</li><li><b>Wnioski:</b> Konkluzja na temat źródeł (napięcie między zmysłami, rozumem a intuicją) oraz konieczności uświadomienia sobie granic ludzkiego aparatu poznawczego (krytycyzm poznawczy chroni przed dogmatyzmem i naiwnym realizmem).</li></ul>\n<p>Teraz cię bardzo proszę z tych wszystkich specjalistycznych naukowych słów zrób mi słowniczek i jak będę podsylał kolejne zdjęcia w przyszłości to wyłapuj nowe zwroty, słowa, wyrazy itp.</p>\n<ul><li>Słowniczek Terminów Naukowych i Filozoficznych</li></ul>"}, {"t": "Wykład 2 – Prawda przedpredykatywna, jaskinia Platona", "html": "<div class=\"eyebrow\">TEORIA POZNANIA – Wykład 2</div>\n<div class=\"topic\"><span>Temat</span>Prawda przedpredykatywna – Jaskinia Platona</div>\n<ul><li><b>Platon (427/428</b> – 348/347 p.n.e.)</li></ul>\n<h4><span class=\"num\">1.</span> Prawda przedpredykatywna i Jaskinia Platona</h4>\n<ul><li><b>Jaskinia Platona to jeden z najważniejszych tekstów kultury</b> – alegoria drogi ku światłu (świata idei). To, co dostrzegamy oczami, jest przemijające (nie dla nas, ale nie wieczne). Dla empirystów prawda to tylko rzecz/zjawisko, natomiast dla Platona słowem kluczowym jest istota.</li></ul>\n<p>Dobre pytania rodzą się na poziomie przedpredykatywnym (Sokrates szedł pod prąd i to sobie cenił).</p>\n<ul><li><b>Odniesienie artystyczne:</b> Szkoła Ateńska Rafaela Santiego (Platon wskazuje ku górze na idee, Arystoteles dłonią ku ziemi – ku empirii).</li></ul>\n<p>„Bez dobrej filozofii nie ma dobrej teologii”.</p>\n<h5>Metafora jaskini (Państwo, ks. VII)</h5>\n<p>Czym jest jaskinia? → To świat naszego codziennego doświadczenia zmysłowego.</p>\n<p>Cienie na ścianie → to, co poznajemy zmysłami (realizacja idei w materii jest zawsze niedoskonała).</p>\n<p>Wyjście z jaskini → trud nauki i poznania perspektywicznego.</p>\n<p>Światło (Słońce) → prawda i Idea Dobra, która rodzi życie i pozwala rzeczom być poznawalnymi.</p>\n<p>„Cała filozofia europejska to tylko przypisy do Platona” (A.N. Whitehead).</p>\n<h4><span class=\"num\">2.</span> Spór o źródło wiedzy: Platon a Arystoteles</h4>\n<ul><li><b>Platon:</b> człowiek posiada już wiedzę w zarodku w swojej duszy; kształcenie to jedynie wydobywanie jej na jaw poprzez anamnezę (przypomnienie). Jaskinia to przeszłość, jesteśmy w drodze.</li><li><b>Arystoteles:</b> to doświadczenie zmysłowe wnosi pojęcia do naszego umysłu (umysł jako czysta karta).</li></ul>\n<h4><span class=\"num\">3.</span> Mit, symbol i znak</h4>\n<ul><li><b>Mit operuje dwoma elementami:</b> symbolem oraz znakiem.</li><li><b>Symbol:</b> ukazuje głęboką prawdę o kondycji ludzkiej, której nie da się wyrazić wprost (np. labirynt – ludzki los; krzyż – męka, śmierć i zmartwychwstanie; mit o stworzeniu – pokusa, upadek i wolność).</li><li><b>Znak:</b> jest ustalony umownie i sztucznie, wyczerpuje się w tym, do czego bezpośrednio odsyła (np. znak drogowy).</li><li><b>Rozróżnienie Paula Ricœura:</b> problem (kwestia do rozwiązania, poznawalna technicznie) a tajemnica (nieosiągalna w 100%, rzeczywistość stale pogłębiająca się).</li></ul>\n<h4><span class=\"num\">4.</span> Koncepcje prawdy i trójwarstwowa struktura bytu</h4>\n<ul><li><b>Prawda przedpredykatywna:</b> bezpośrednie uchwycenie zgodności bytu z pojęciem przed sformułowaniem orzeczenia (sądu językowego).</li><li><b>Prawda ontologiczna:</b> zgodność bytu ze swoją istotą („Każdy byt ma się tak do prawdy, jak do istnienia” – Arystoteles). Im więcej w bycie zrealizowanej istoty, tym więcej prawdy ontologicznej.</li></ul>\n<h5>Struktura poznania bytu (trzy warstwy – koncentryczne okręgi)</h5>\n<p>Zjawisko (warstwa zewnętrzna / fenomen)</p>\n<p>Istnienie = prawda (warstwa pośrednia)</p>\n<ul><li><b>Istota (rdzeń bytu</b> – to, czym rzecz rzeczywiście jest)</li></ul>"}, {"t": "Wykład 3 – Augustyn, iluminizm, prawda i wolność (19.10.2026)", "html": "<div class=\"eyebrow\">TEORIA POZNANIA – Wykład 3</div>\n<div class=\"meta\">🗓 Poniedziałek, 19 października 2026, 07:58</div>\n<div class=\"topic\"><span>Temat</span>Dualizm antropologiczny, przezwyciężenie sceptycyzmu, teoria iluminizmu św. Augustyna oraz dialektyka prawdy i wolności u Hegla</div>\n<ul><li><b>(Lektura na za tydzień:</b> Platon, Fedon oraz List VII)</li></ul>\n<h4><span class=\"num\">1.</span> Problem psychofizyczny: Dualizm a Monizm</h4>\n<h5>Dualizm duszy i ciała (Platon, św. Augustyn, Kartezjusz)</h5>\n<h5>W człowieku współistnieją dwie odrębne substancje</h5>\n<ul><li><b>Dusza (substancja duchowa):</b> nierozciągła (nie zajmuje miejsca w przestrzeni, brak wymiarów), jednorodna i prosta (niezłożona z części). Ponieważ nie posiada części, nie może ulec rozpadowi – z natury jest nieśmiertelna.</li><li><b>Ciało (substancja materialna):</b> rozciągłe (res extensa – posiada długość, szerokość, wysokość), złożone i podlegające zniszczeniu – z natury jest śmiertelne.</li><li><b>Aporia oddziaływania:</b> Fundamentalne pytanie filozoficzne brzmi: jak to, co bezcielesne i nierozciągłe, może wywierać wpływ przyczynowy na materię (i odwrotnie)? Napięcie to ujawnia się w doświadczeniu: „duch chce, a ciało mdleje” (np. niemoc fizyczna Jana Pawła II w oknie apostolskim mimo pragnienia przemówienia).</li></ul>\n<h5>Monizm antropologiczny (Arystoteles, św. Tomasz z Akwinu)</h5>\n<p>Odrzucenie traktowania duszy i ciała jako dwóch sklejonych substancji. Człowiek to jedna substancja, w której dusza stanowi formę substancjalną materii (hylemorfizm).</p>\n<h5>Materializm i redukcjonizm</h5>\n<p>Odrzucenie dualizmu poprzez sprowadzenie umysłu wyłącznie do procesów w mózgu (materia zorganizowana, obliczenia na wzór komputera). Wyeliminowanie ducha prowadzi bezpośrednio do empiryzmu, scjentyzmu lub agnostycyzmu.</p>\n<h4><span class=\"num\">2.</span> Św. Augustyn (354–430): Przezwyciężenie sceptycyzmu i Iluminizm</h4>\n<h5>Kontekst biograficzny i polemiki</h5>\n<p>Przez 9 lat tkwił w manicheizmie (radykalny dualizm dobra i zła, pogarda dla ciała/materii).</p>\n<ul><li><b>Spór z donatystami:</b> Augustyn sformułował zasadę obiektywnej ważności sakramentów (ex opere operato) – sakrament działa mocą Chrystusa, a nie dzięki moralnej godności szafarza.</li></ul>\n<p>Nawrócenie w Mediolanie pod wpływem kazań św. Ambrożego oraz tajemniczego głosu dziecka: Tolle, lege („Bierz i czytaj”).</p>\n<h5>Przezwyciężenie sceptycyzmu (Si fallor, sum)</h5>\n<ul><li><b>Teza sceptyków:</b> o wszystkim można wątpić, nic nie jest pewne.</li><li><b>Odpowiedź Augustyna:</b> Granicą wątpienia jest sam fakt wątpienia. Nie mogę wątpić w to, że wątpię. Skoro wątpię, to myślę; skoro błądzę, to muszę istnieć:</li></ul>\n<p>Si fallor, sum („Jeśli się mylę, to jestem”)</p>\n<p>(Formuła wyprzedzająca o ponad 1200 lat słynne kartezjańskie Cogito ergo sum).</p>\n<h5>Teoria iluminacji (światła Bożego)</h5>\n<p>U Platona idee istniały w osobnym, zewnętrznym świecie ponad Demiurgiem. U Augustyna idee wieczne (rationes aeternae) znajdują się w Bożym Umyśle.</p>\n<p>Bóg, stwarzając kosmos, uczynił go racjonalnym i matematycznym, a stwarzając człowieka, wszczepił w jego umysł prawdy wieczne (np. prawa logiki, zasady matematyki).</p>\n<ul><li><b>Iluminacja:</b> Światło Boże działa w poznaniu intelektualnym tak, jak słońce w poznaniu wzrokowym. Oświeca ludzki rozum, czyniąc prawdy wiecznymi i bezpośrednio poznawalnymi.</li></ul>\n<h5>Trzy stopnie poznania</h5>\n<ul><li><b>Poznanie zmysłowe</b> – zmienne, cielesne, najniższe.</li><li><b>Poznanie rozumowe (wiedza</b> – scientia) – odkrywanie w intelekcie prawd wiecznych i obiektywnych praw przyrody (dostępne każdemu, także niewierzącemu).</li><li><b>Mądrość (sapientia)</b> – poznanie ukierunkowane na Boga i zbawienie, zdolność odróżniania dobra od zła dzięki łasce Bożej.</li></ul>\n<h5>Wewnętrzny Nauczyciel (Magister Interior)</h5>\n<p>Ziemski wykładowca jest jedynie pomocnikiem, który podaje litery i budzi myślenie.</p>\n<p>Prawdziwym, ostatecznym Nauczycielem w człowieku jest obecny w głębi duszy Chrystus (Logos), który pociąga intelekt ku Prawdzie i Mądrości.</p>\n<ul><li><b>Relacja wiary i rozumu:</b> Crede ut intelligas, intellige ut credas („Wierz, abyś rozumiał; rozumiej, abyś wierzył”).</li></ul>\n<h4><span class=\"num\">3.</span> Dialektyka Prawdy i Wolności: G.W.F. Hegel (1770–1831)</h4>\n<h5>Koncepcja Ducha (Geist) w Fenomenologii ducha</h5>\n<ul><li><b>Rozwój świadomości dokonuje się przez etapy:</b> Duch subiektywny (indywidualna myśl i wola) → Duch obiektywny (realizacja w strukturach prawa, państwa, moralności) → Duch absolutny (samowiedza Ducha w sztuce, religii i filozofii).</li></ul>\n<h5>Zależność prawdy i wolności</h5>\n<p>Warunkiem prawdy jest wolność (wyjście z jaskini zmysłów wymaga zerwania kajdan), ale warunkiem wolności jest prawda.</p>\n<h5>Forma a Treść wolności</h5>\n<ul><li><b>Forma wolności:</b> sam akt wyboru, dyspozycja do decydowania.</li><li><b>Treść wolności:</b> wiedza o tym, co wybieram (treścią wolności jest prawda).</li></ul>\n<p>Wybór pozbawiony prawdy staje się samowolą i prowadzi do zniewolenia (np. mechanizm popadania w uzależnienie lub anarchia rewolucyjna).</p>\n<h5>Lekcja Rewolucji Francuskiej</h5>\n<ul><li><b>Hegel początkowo zachwycony hasłami:</b> Wolność, Równość, Braterstwo.</li></ul>\n<p>Gdy wolność oderwała się od prawdy i rozumu, przekształciła się w krwawy terror (gilotyna, rzeź Wandei, przewrót Napoleona).</p>\n<ul><li><b>Rycina Goi:</b> „Gdy rozum śpi, budzą się demony”.</li><li><b>Wniosek:</b> Autentyczna wolność nie polega na dowolnym wyborze czegokolwiek, lecz na wolnym wyborze prawdy („Prawda was wyzwoli”).</li></ul>\n<h4><span class=\"num\">4.</span> Otwartość człowieka na prawdę vs Redukcjonizm</h4>\n<h5>Otwartość człowieka (Husserl, Heidegger)</h5>\n<p>W odróżnieniu od zwierząt człowiek posiada egzystencjalną potrzebę poszukiwania bezinteresownej prawdy bytu. W naturę ludzką wpisany jest pęd ku wznoszeniu się ponad nizinę jaskini zmysłowej.</p>\n<h5>Krytyka Woltera i materializmu</h5>\n<ul><li><b>Aforyzm Woltera:</b> „Człowiekowi nie potrzeba skrzydeł, ale ołowiu” – przestroga przed ucieczką w metafizykę i niebo idei na rzecz twardego stąpania po ziemi.</li></ul>\n<p>Skrajna kontynuacja tej myśli (Marks, Lenin) doprowadziła do uznania transcendencji za „opium dla ludu” i redukcji człowieka do wymiaru czysto materialno-ekonomicznego.</p>"}], "logika": [{"t": "Wykład 1 – Organon, sylogizm, zaliczenie", "html": "<ul><li><b>Wykład 1:</b> Logika</li></ul>\n<div class=\"meta\">🗓 Niedziela, 30 sierpnia 2026, 20:18</div>\n<ul><li>Kontekst historyczny i wprowadzenie</li><li><b>Pierwszy cel św. Pawła:</b> zhellenizować chrześcijan i zchrystianizować Hellenów.</li><li><b>De doctrina Christiana</b> – O nauce chrześcijańskiej.</li></ul>\n<p>Tradycja nie istnieje bez historii; tradycja to filozofia.</p>\n<p>Uczyć się naukowego słownictwa, bo jest bardziej precyzyjne.</p>\n<ul><li><b>Logika skodyfikowana</b> – dzięki logice powstała filozofia.</li></ul>\n<p>Filozof zaczyna tam, gdzie inni kończą.</p>\n<ul><li>Logika formalna i sylogistyka</li></ul>\n<h5>Logika zajmuje się formą, bo ona jest zawsze ważna</h5>\n<ul><li><b>Przykład:</b> Każdy człowiek jest śmiertelny / Każdy Polak jest człowiekiem // Każdy Polak jest śmiertelny</li><li><b>Postać ogólna rachunku:</b> Każdy x jest y / Każdy z jest x // Każde z jest y</li></ul>\n<p>Logika nazw → Arystotelesowska (rachunek nazw).</p>\n<p>Twórcą logiki jest Arystoteles, początkowo nazywał ją organon (narzędzie).</p>\n<h5>6 ksiąg logicznych Arystotelesa (Organon)</h5>\n<p>Kategorie (ogólna teoria rozumu)</p>\n<ul><li><b>Hermeneutyka (Peri hermeneias</b> – logiczna teoria zdań)</li><li>Analityki pierwsze</li><li>Analityki wtóre</li></ul>\n<p>Topiki (badanie wiedzy prawdopodobnej; stosuje sylogizmy)</p>\n<p>O dowodach sofistycznych (teoria wprowadzania w błąd; sofistyczny = przewrotny)</p>\n<ul><li>Zasady zaliczenia przedmiotu</li><li><b>3 kolokwia po 20 min</b> – zaliczenie od 50%.</li></ul>\n<p>Egzamin końcowy z całości (głównie zadania, np. zastosowanie definicji w praktyce, najważniejsze dzieło Arystotelesa) – zaliczenie od 50%.</p>\n<ul><li><b>Wskazówka:</b> trzymać się skryptu, żeby nie pogubić się w precyzyjnych znaczeniach.</li></ul>\n<p>Podział semiotyczny (Definicja znaku)</p>\n<p>Semantyka → relacja między znakiem a tym, do czego się odnosi (znaczenie i oznaczanie).</p>\n<p>Pragmatyka → relacja między znakiem a jego użytkownikiem (nadawcą/odbiorcą i kontekstem użycia).</p>\n<ul><li><b>(Dopełnienie triady semiotycznej Ch. Morrisa:</b> Syntaktyka – relacje pomiędzy samymi znakami).</li></ul>"}, {"t": "Wykład 2 – czym jest logika, trójkąt semiotyczny (8.10.2026)", "html": "<ul><li><b>Wykład 2:</b> Logika</li></ul>\n<div class=\"meta\">🗓 Czwartek, 8 października 2026, 08:42</div>\n<p>„Mamy być trochę lepsi niż idioci!”</p>\n<ul><li>Kontekst historyczny i język</li></ul>\n<p>Jeszcze w XVII w. pisano pisma naukowe po łacinie, a teologię uczono po łacinie jeszcze w XX w.</p>\n<ul><li>Substancja</li></ul>\n<h5>= Ewolucja</h5>\n<p>Z substancji powstała teologia.</p>\n<p>Ze zjawiska ewolucji wyciągamy to, czym dzisiaj żyjemy.</p>\n<ul><li><b>Pytanie:</b> I jak to połączyć?</li></ul>\n<p>Nurt arystotelesowski → logika nazw.</p>\n<p>Nurt stoicki → logika zdań.</p>\n<p>Według Arystotelesa logika była narzędziem (organon), a nie osobną nauką.</p>\n<p>Ludwig Wittgenstein (1919 r.) → KRZ (Klasyczny Rachunek Zdań).</p>\n<ul><li>Intersubiektywność vs Subiektywność</li></ul>\n<h5>Intersubiektywność</h5>\n<p>Poprzez komunikację muszę to sprawdzić.</p>\n<p>Tylko to obchodzi naukę.</p>\n<p>Wiara jest intersubiektywna, bo Tradycja zawsze jest intersubiektywna (ale bywa też subiektywna, bo dotyczy osobistego doświadczenia).</p>\n<h5>Subiektywność</h5>\n<p>Nasze przeżycia i doznania.</p>\n<p>Jeśli coś jest wiedzą tylko dla mnie, to nie jest to nauka.</p>\n<p>Brak jednoznacznych słów.</p>\n<ul><li>Czym jest logika i jej podział</li></ul>\n<p>Logika to zespół nauk badających język i czynności poznawcze człowieka (nazywanie, definiowanie, wnioskowanie itp.) w aspekcie ich poprawności i skuteczności.</p>\n<h5>Dotyczy rozumowań niezawodnych</h5>\n<ul><li><b>Semiotyka logiczna</b> – logiczna teoria znaku językowego (1. semestr).</li><li><b>Logika formalna</b> – bada formalne prawa wynikania logicznego i wnioskowanie (2. semestr).</li><li><b>Metodologia</b> – logiczna teoria metody naukowej (2. rok).</li></ul>\n<h5>Program i pojęcia</h5>\n<p>Retoryka logiczna lub dialektyka.</p>\n<h5>Pierwszy semestr</h5>\n<p>Logiczna teoria nazw i zdań.</p>\n<p>KRZ, wybrane elementy rachunku predykatów.</p>\n<p>Elementy argumentacji dialektycznej.</p>\n<ul><li>Retor</li></ul>\n<h5>= Sofista</h5>\n<p>Św. Augustyn to najwybitniejszy retor.</p>\n<p>Trójkąt semiotyczny (Ogdena-Richardsa)</p>\n<h5>W każdym znaku wyróżnia się 3 elementy</h5>\n<ul><li><b>Wierzchołek (NZ):</b> Nazwa / Znak (nośnik znaku).</li></ul>\n<p>J: Pojęcie / Treść / Myśl / Interpretant.</p>\n<p>D: Przedmiot / Desygnat oznaczany przez znak.</p>\n<h5>Składowe znaku</h5>\n<p>a) Materialny nośnik znaku → intersubiektywny.</p>\n<p>b) Przedmiot (desygnat) oznaczany przez znak → poznawany przez zmysły.</p>\n<ul><li><b>c) Interpretant:</b> chodzi przede wszystkim o intersubiektywne rozumienie nośnika.</li></ul>"}, {"t": "Wykład 3 – semiotyka logiczna: znak, wyrażenie, język", "html": "<div class=\"eyebrow\">LOGIKA – Wykład 3</div>\n<div class=\"topic\"><span>Temat</span>Semiotyka logiczna – Znak, Wyrażenie, Język i Relacje semiotyczne</div>\n<h4><span class=\"num\">1.</span> Trójdzielna struktura logiki i jej cel badawczy</h4>\n<h5>Rozwój kursu logiki</h5>\n<ul><li><b>Semiotyka logiczna (część teoretyczna – semestr 1):</b> ogólna teoria znaków językowych.</li><li><b>Logika formalna (właściwa teoria wynikania logicznego</b> – semestr 2): badanie schematów wnioskowania i poprawności formalnej.</li><li><b>Metodologia nauk (rok 2):</b> teoria poznania naukowego, badania procedur uzasadniania, weryfikacji i falsyfikacji twierdzeń.</li></ul>\n<h5>Zdanie logiczne jako nośnik wartości logicznej</h5>\n<p>Logika bada przede wszystkim zdania w sensie logicznym, ponieważ wyłącznie zdania orzekają o prawdzie lub fałszu.</p>\n<p>Nazwy bada się jedynie pomocniczo, jako składowe zdań (podmioty lub orzeczniki).</p>\n<ul><li><b>Naczelny cel logiki:</b> Badanie wynikania logicznego – orzekanie, czy z danego zdania (lub układu przesłanek) w sposób konieczny i formalny wynika drugie zdanie.</li></ul>\n<h4><span class=\"num\">2.</span> Pojęcie znaku – definicja ogólna i tomistyczna</h4>\n<ul><li><b>Definicja ogólna:</b> Znak jest to postrzegalny zmysłowo przedmiot</li><li>X (fizyczny nośnik), który u obserwatora</li><li>O (interpretanta) wywołuje myśl o oznaczonym obiekcie</li></ul>\n<p>A (desygnat).</p>\n<h5>Definicja św. Tomasza z Akwinu</h5>\n<ul><li>Signum est res, quae praeter speciem, quam ingerit sensibus, aliud aliquid ex se facit in cognitionem venire</li></ul>\n<p>(„Znak jest rzeczą/przedmiotem postrzegalnym zmysłowo, przez który podmiot dochodzi do poznania czegoś innego”).</p>\n<h5>Kluczowe właściwości znaku</h5>\n<ul><li><b>Transparentność (przezroczystość):</b> Znak nie zatrzymuje uwagi poznawczej na swojej materialnej postaci, lecz odsyła ku swojemu desygnatowi/znaczeniu.</li><li><b>Byt relacyjny:</b> Przedmiot fizyczny staje się znakiem dopiero w relacji do odbiorcy zdolnego go zinterpretować według określonych reguł.</li><li><b>Egzemplarze tego samego znaku:</b> Dystrybutywność posługiwania się fizycznymi kopiami znaku o jednym i tym samym sensie.</li></ul>\n<h5>Pojęcie a Idea</h5>\n<p>Eidos → widzieć, obserwować.</p>\n<p>Idea → ujęcie platońskie.</p>\n<p>Forma → ujęcie arystotelesowskie.</p>\n<p>W logice współczesnej zaleca się stosowanie terminu pojęcie (conceptus, greckie noema → odniesienie noetyczne).</p>\n<h4><span class=\"num\">3.</span> Piramida i relacje semiotyczne (Trójkąt Ogdena-Richardsa)</h4>\n<ul><li>Pomiędzy nośnikami materialnymi ( NZ1,NZ2</li></ul>\n<h5>), interpretantem ( J) a desygnatem ( D) zachodzą trzy relacje</h5>\n<p>Interpretant (J)</p>\n<ul><li>[Pojęcie/Sens]/ \\ pragmatyczna / \\ semantyczna/ \\/ \\</li></ul>\n<p>Materialny Nośnik (NZ1) —————— Desygnat (D)</p>\n<ul><li>| \\ syntaktyczna| \\</li><li>= (tożsamość) NZ2</li></ul>\n<h5>Relacja syntaktyczna (syntaktyka / składnia logiczna)</h5>\n<p>Związek między samymi nośnikami znaków ( NZ1↔NZ2).</p>\n<p>Reguły poprawnego budowania wyrażeń złożonych z prostych (gramatyka logiczna).</p>\n<ul><li><b>Przykład tożsamości formalnej:</b> pies</li></ul>\n<p>≡ pies.</p>\n<h5>Relacja semantyczna (semantyka)</h5>\n<p>Związek między nośnikiem znaku a desygnatem/światem ( NZ↔D).</p>\n<p>Obejmuje oznaczanie (desygnowanie) oraz orzekanie o prawdzie i fałszu.</p>\n<h5>Relacja pragmatyczna (pragmatyka)</h5>\n<p>Związek między nośnikiem a interpretantem/użytkownikiem ( NZ↔J).</p>\n<p>Obejmuje nadawanie i odczytywanie sensu, intencję nadawcy i zrozumienie u odbiorcy.</p>\n<ul><li><b>Aspekt:</b> Punkt widzenia, z którego ujmuje się dany przedmiot (np. góra Matterhorn oglądana z różnych stron ma inne nazwy i perspektywy, ale ten sam desygnat).</li></ul>\n<h5>Przykłady rozpisania trójkąta semiotycznego</h5>\n<h5>KLERYK</h5>\n<ul><li><b>Nośnik materialny ( NZ):</b> ciąg liter K-L-E-R-Y-K.</li><li><b>Interpretant ( J):</b> pojęcie/definicja – student seminarium duchownego przygotowujący się do święceń.</li><li><b>Desygnat ( D):</b> konkretny człowiek (alumn) w świecie fizycznym.</li></ul>\n<h5>POGODA</h5>\n<ul><li><b>Nośnik materialny ( NZ):</b> słowo POGODA.</li><li><b>Interpretant ( J):</b> definicja w języku polskim – stan atmosfery w danym miejscu i czasie.</li><li><b>Desygnat ( D):</b> realne zjawiska atmosferyczne za oknem.</li></ul>\n<h4><span class=\"num\">4.</span> Klasyfikacje znaków</h4>\n<h5>Ze względu na genezę</h5>\n<ul><li><b>Znaki naturalne (oznaki / symptomy):</b> Oparte na naturalnym związku przyczynowo-skutkowym (np. dym jako oznaka ognia; gorączka jako symptom choroby).</li><li><b>Znaki konwencjonalne (umowne / arbitralne):</b> Ustanowione na mocy umowy społecznej (np. język etniczny, znaki drogowe).</li><li><b>Znaki ikoniczne:</b> Oparte na zmysłowym podobieństwie do desygnatu (np. fotografia, rysunek, schemat).</li></ul>\n<h5>Ze względu na strukturę logiczną</h5>\n<ul><li><b>Znak prosty:</b> Taki, którego żadna część właściwa (różna od całości) nie jest samodzielnym znakiem tego samego rodzaju.</li><li><b>Przykład:</b> Kot (poszczególne litery k, o, t nie są samodzielnymi nazwami).</li><li><b>Znak złożony:</b> Zbudowany ze znaków prostych.</li><li><b>Przykłady:</b> kot i pies, czarny kot.</li></ul>\n<h4><span class=\"num\">5.</span> Pięć funkcji znaku</h4>\n<ul><li><b>Oznaczanie (denotowanie, desygnowanie):</b> Wskazywanie na konkretny desygnat lub zbiór desygnatów w świecie.</li><li><b>Współoznaczanie (konotowanie):</b> Wskazywanie na zespół cech konstytutywnych tworzących treść pojęcia.</li><li><b>Sens:</b> Znaczenie pojęciowe i słownikowe przypisane znakowi w danym systemie.</li><li><b>Wyrażanie:</b> Funkcja pragmatyczna / ekspresywna – uzewnętrznianie subiektywnych stanów, emocji i nastawienia nadawcy.</li><li><b>Nazywanie:</b> Przypisywanie nazw i imion obiektom.</li></ul>\n<h5>Użycie dystrybutywne vs kolektywne</h5>\n<ul><li><b>Dystrybutywne:</b> Orzekanie dotyczy każdego poszczególnego elementu zbioru z osobna (np. „Każdy pies jest zwierzęciem domowym”).</li><li><b>Kolektywne:</b> Orzekanie dotyczy zbioru jako niepodzielnej całości/agregatu (np. „Las szumi”).</li></ul>\n<h4><span class=\"num\">6.</span> Logiczna definicja języka i jego reguły</h4>\n<h5>Język w sensie logicznym to</h5>\n<ul><li>Zbiór znaków (słownik / zasób prostych znaków językowych),</li></ul>\n<p>Służący do przekazywania informacji wraz ze zbiorem reguł posługiwania się nimi w celu komunikacji.</p>\n<ul><li><b>Wyrażenie:</b> Wszelki prosty lub złożony znak językowy funkcjonujący w danym języku.</li><li><b>Słownik:</b> Zbiór elementarnych znaków prostych danego języka.</li></ul>\n<h5>Trzy grupy reguł językowych</h5>\n<ul><li><b>Reguły syntaktyczne (składniowe):</b> Reguły tworzenia wyrażeń złożonych z wyrażeń prostych.</li><li><b>Reguły semantyczne (znaczeniowe):</b> Zasady przypisywania nazwom odpowiednich desygnatów (chronią przed błędami kategorialnymi, np. zwrot „zielone pojęcie” czy „zielony sakrament”).</li><li><b>Reguły pragmatyczne:</b> Zasady doboru wyrażeń zależnie od kontekstu i poziomu percepcji odbiorcy (np. kazanie do dzieci a wykład akademicki).</li></ul>\n<h5>Rodzaje języków</h5>\n<ul><li><b>Naturalne (etniczne):</b> Powstałe w drodze spontanicznej umowy społecznej (np. polski, grecki).</li><li><b>Sztuczne:</b> Powstałe w drodze umowy świadomej i celowej (np. KRZ, algebra, języki komputerowe).</li><li><b>(Uwaga:</b> w ujęciu ścisłym nie istnieje język w 100% sztuczny, gdyż każdy odwołuje się w warstwie metajęzykowej do języka naturalnego).</li><li><b>Słowniczek Terminów</b> – Wykład 3 z Logiki</li><li><b>Signum (Znak w ujęciu św. Tomasza)</b> – postrzegalny zmysłowo przedmiot lub zjawisko fizyczne, które na mocy relacji poznawczej prowadzi umysł obserwatora do poznania innego, oznaczonego obiektu.</li><li><b>Transparentność znaku</b> – właściwość polegająca na tym, że znak nie skupia uwagi podmiotu na sobie samym jako przedmiocie fizycznym, lecz odsyła bezpośrednio ku desygnatowi/znaczeniu.</li><li><b>Conceptus (Pojęcie)</b> – łaciński odpowiednik greckiego noema; treść myślowa, akt ujęcia istoty rzeczy w umyśle (źródłosłowo tożsame z biologicznym „poczęciem” – zrodzenie myśli w intelekcie).</li><li><b>Noetyczny (od gr. noema / nous)</b> – intelektualny, poznawczy, dotyczący czystego myślenia i aktów pojęciowych umysłu (w odróżnieniu od poziomu zmysłowego).</li><li><b>Eidos (εἶδος) – pierwotnie:</b> widok, postać, to co widoczne; u Platona źródłosłów dla Idei, a u Arystotelesa dla Formy (morphe).</li><li><b>Obiectum (Przedmiot / Desygnat)</b> – od łac. obicere (rzucać przed, stawiać naprzeciw); to, co stoi naprzeciw podmiotu poznającego w świecie zewnętrznym; stąd: obiektywny = przedmiotowy.</li><li><b>Znak naturalny (oznaka / symptom)</b> – zjawisko fizyczne powiązane z oznaczanym faktem związkiem przyczynowo-skutkowym wynikającym z praw natury (np. dym dla ognia), a nie z umowy społecznej.</li><li><b>Znak konwencjonalny (arbitralny)</b> – znak ustanowiony na mocy umowy, zwyczaju lub konwencji kulturowej (właściwa cecha języka ludzkiego).</li><li><b>Znak ikoniczny</b> – znak, którego relacja z desygnatem opiera się na fizycznym podobieństwie zmysłowym (np. fotografia, ikona, rysunek).</li><li><b>Znak prosty</b> – znak językowy, którego żadna część właściwa nie stanowi samodzielnego znaku tego samego rodzaju (np. pojedynczy wyraz w relacji do liter).</li><li><b>Znak złożony</b> – znak powstały z połączenia co najmniej dwóch znaków prostych według określonych reguł składniowych.</li><li><b>Wyrażenie – w logice:</b> każdy prosty lub złożony znak językowy posiadający określone znaczenie w danym języku.</li><li><b>Słownik (w sensie logicznym)</b> – zasób elementarnych, prostych znaków językowych danego systemu językowego.</li><li><b>Denotowanie (desygnowanie / ekstensja)</b> – funkcja semantyczna polegająca na wskazywaniu przez nazwę zbioru konkretnych przedmiotów (desygnatów) w świecie.</li><li><b>Konotacja (współoznaczanie / intensja)</b> – zespół konstytutywnych cech przysługujących desygnatom danej nazwy, tworzący treść pojęcia.</li><li><b>Funkcja wyrażania (ekspresywna)</b> – funkcja pragmatyczna wypowiedzi polegająca na uzewnętrznianiu przez nadawcę jego subiektywnych stanów emocjonalnych lub nastawienia.</li><li><b>Użycie dystrybutywne nazwy</b> – odniesienie nazwy do poszczególnych elementów klasy z osobna (każdy z osobna posiada daną cechę).</li><li><b>Użycie kolektywne nazwy</b> – odniesienie nazwy do klasy obiektów traktowanej jako zbiorowa całość (agregat).</li><li><b>Błąd kategorialny (naruszenie reguł semantycznych)</b> – logiczno-językowe przypisanie cechy lub orzecznika do przedmiotu należącego do zupełnie innej kategorii ontologicznej (np. „zielone pojęcie”, „zielony sakrament”).</li><li><b>Język naturalny (etniczny)</b> – system znakowy ukształtowany historycznie w drodze umowy spontanicznej w ramach danej wspólnoty narodowej/kulturowej.</li><li><b>Język sztuczny</b> – sformalizowany system znaków stworzony celowo i świadomie do określonych zadań naukowych (np. KRZ, algebra, języki programowania).</li></ul>"}, {"t": "Wykład 4 – poziomy języka, prawda Tarskiego, metalogika", "html": "<div class=\"eyebrow\">LOGIKA – Wykład 4</div>\n<div class=\"meta\">🗓 Czwartek, 15 października 2026, 08:46</div>\n<div class=\"topic\"><span>Temat</span>Poziomy języka (język przedmiotowy, metajęzyk, meta-metajęzyk), semantyczna definicja prawdy i twierdzenia limitacyjne</div>\n<h4><span class=\"num\">1.</span> Problem pomieszania języka z rzeczywistością</h4>\n<ul><li><b>Mowa potoczna a błąd pomieszania poziomów:</b> W codziennym języku stale mieszamy wypowiedzi o rzeczach w świecie z wypowiedziami o samych znakach językowych (słowach, nazwach, pojęciach).</li></ul>\n<h5>Przykład fizyczny vs logiczny</h5>\n<p>„Pociąg dzieli się na wagony i lokomotywę” → fizyczny podział przedmiotu materialnego w świecie.</p>\n<p>„Pociągi dzielą się na dalekobieżne i regionalne” → logiczny podział zakresu pojęcia/nazwy.</p>\n<h5>Przykład ze studentem</h5>\n<p>„Student ma głowę, ręce i nogi” → orzekanie o bycie fizycznym.</p>\n<p>„Studenci dzielą się na stacjonarnych i niestacjonarnych” → logiczny podział pojęcia/zbioru.</p>\n<h5>Użycie cudzysłowu / słowa „słowo” (nazwa cudzysłowowa)</h5>\n<p>Kot ma 4 łapy → zdanie orzeka o zwierzęciu w świecie fizycznym (język przedmiotowy).</p>\n<p>Słowo „kot” ma 3 litery lub \"Kot\" ma 3 litery → zdanie orzeka o znaku językowym, o samym słowie (metajęzyk).</p>\n<ul><li><b>Różnica między cytowaniem a użyciem metajęzykowym:</b> W logice cudzysłów nie oznacza zwykłego cytatu literackiego, lecz tworzy nazwę wyrażenia (przenosi nas na wyższy poziom analizy logicznej).</li></ul>\n<h4><span class=\"num\">2.</span> Hierarchia poziomów języka</h4>\n<h5>W logice formalnej wyróżnia się precyzyjne stopnie języka</h5>\n<h5>Język przedmiotowy (1° stopnia)</h5>\n<p>Język, w którym orzekamy bezpośrednio o świecie i przedmiotach pozajęzykowych.</p>\n<ul><li><b>Przykłady:</b> „Ten kot jest czarny”, „Boston ma 800 tysięcy mieszkańców”.</li></ul>\n<h5>Metajęzyk (2° stopnia)</h5>\n<p>Język, w którym mówimy i orzekamy o języku przedmiotowym (1° stopnia).</p>\n<ul><li><b>Przykłady:</b> „»Kot« ma trzy litery”, „Nazwa »Boston« posiada 2 sylaby”.</li></ul>\n<h5>Meta-metajęzyk (3° stopnia)</h5>\n<p>Język, w którym mówimy o metajęzyku (2° stopnia).</p>\n<ul><li><b>Przykład z tablicy:</b> Zdanie [„Kot” jest wyrazem czteroliterowym] jest zdaniem fałszywym.</li></ul>\n<h5>Przeniesienie na grunt hermeneutyki / teologii</h5>\n<h5>Schemat z tablicy</h5>\n<p>„Św. Tomasz interpretuje słowa Jezusa, i ja je interpretuję”</p>\n<ul><li>Słowa Jezusa → język wyjściowy / poziom</li><li>1° Interpretacja św. Tomasza → poziom</li></ul>\n<p>2° (metapoziom)</p>\n<ul><li>Moja interpretacja dzieła Tomasza → poziom</li></ul>\n<p>3° (meta-metapoziom)</p>\n<h5>Pojęcie „meta” w nauce</h5>\n<p>Greckie meta (μετά) = poza, ponad, po.</p>\n<p>Fizyka bada świat przyrody → Filozofia nauki / Metanauka bada założenia i metodologię samej fizyki.</p>\n<p>Logika bada rachunek zdań → Metalogika bada własności systemów logicznych (ich niesprzeczność, zupełność).</p>\n<h4><span class=\"num\">3.</span> Alfred Tarski i semantyczna definicja prawdy</h4>\n<ul><li><b>Alfred Tarski (1901–1983):</b> Polski logik ze szkoły lwowsko-warszawskiej, uznawany obok Arystotelesa i Fregego za jednego z najważniejszych logików w historii.</li></ul>\n<h5>Rozwiązanie problemu definicji prawdy</h5>\n<p>Aby podać poprawną, wolną od sprzeczności definicję prawdy (semantyczną definicję prawdy), należy bezwzględnie rozróżnić język przedmiotowy od metajęzyka.</p>\n<p>W języku naturalnym pojawiają się antynomie semantyczne (np. paradoks kłamcy: „To zdanie jest fałszywe”), ponieważ język potoczny jest semantycznie zamknięty (jest swoim własnym metajęzykiem).</p>\n<h5>Konwencja T (schemat Tarskiego)</h5>\n<p>Zdanie „Śnieg pada” jest prawdziwe w języku J wtedy i tylko wtedy, gdy śnieg pada.</p>\n<p>(Wyrażenie w cudzysłowie należy do języka przedmiotowego, natomiast orzeczenie o jego prawdzie formułowane jest w metajęzyku).</p>\n<h4><span class=\"num\">4.</span> Twierdzenia limitacyjne (Granice systemów formalnych i poznania)</h4>\n<p>Przez stulecia wierzono, że za pomocą racjonalnego systemu metafizyki lub aksjomatyki matematycznej da się uchwycić rzeczywistość w sposób absolutny (jakby „podglądało się świat przez dziurkę od klucza na sposób boski”). W latach 30. XX wieku seria odkryć logicznych obaliła ten mit:</p>\n<h5>Twierdzenia o niezupełności Kurta Gödla (1931 r.)</h5>\n<ul><li><b>I twierdzenie o niezupełności:</b> W każdym niesprzecznym systemie formalnym dostatecznie bogatym (zawierającym arytmetykę) istnieją zdania prawdziwe, których nie da się w ramach tego systemu udowodnić.</li><li><b>II twierdzenie:</b> Żaden taki system nie jest w stanie dowieść własnej niesprzeczności przy użyciu własnych środków dowodowych.</li></ul>\n<h5>Twierdzenie Churcha-Turinga (problem obliczalności i maszyna Turinga)</h5>\n<p>Alonzo Church i Alan Turing udowodnili, że nie istnieje uniwersalny algorytm zdolny rozstrzygnąć prawdziwość każdego problemu matematycznego (nierozstrzygalność problemu stopu).</p>\n<h5>Twierdzenie Löwenheima-Skolema (problem wielości modeli)</h5>\n<p>Każda niesprzeczna teoria formalna pierwszego rzędu posiada nieskończenie wiele różnych, nierównoważnych modeli interpretacyjnych. Wskazuje to na nieusuwalną wieloznaczność formalnych systemów dedukcyjnych.</p>\n<ul><li><b>Wniosek epistemologiczny:</b> Ani logika formalna, ani matematyka nie mają statusu wiedzy absolutnej. Ludzkie systemy pojęciowe napotykają strukturalne granice możliwości poznawczych.</li></ul>"}, {"t": "Supozycje, paradoks kłamcy, poziomy języka", "html": "<div class=\"eyebrow\">LOGIKA – Notatka z tablicy</div>\n<div class=\"topic\"><span>Temat</span>Teoria supozycji, antynomie semantyczne (paradoks kłamcy) i hierarchia poziomów języka</div>\n<h4><span class=\"num\">1.</span> Wartość logiczna i poprawność orzekania</h4>\n<ul><li><b>Tylko zdanie może być fałszywe (lub prawdziwe):</b> Same nazwy i pojęcia nie posiadają wartości logicznej – orzekają o prawdzie/fałszu dopiero po zestawieniu w strukturę zdania.</li></ul>\n<h5>Orzekanie semantyczne a błąd kategorialny</h5>\n<p>'czarne' jest orzeczone o 'kocie' \\equiv kot jest czarny (orzekanie semantycznie poprawne).</p>\n<p>przymiotnik jest orzeczony o rzeczowniku ≠ rzeczownik jest przymiotnikiem (błąd pomieszania rzędów logicznych i kategorii gramatycznych).</p>\n<h4><span class=\"num\">2.</span> Teoria supozycji nazw (Suppositio – podstawienie / funkcja znaczeniowa)</h4>\n<ul><li>Supozycja określa rolę, w jakiej dana nazwa została użyta w konkretnym kontekście zdaniowym:</li></ul>\n<h5>Supozycja materialna (suppositio materialis)</h5>\n<p>Nazwa odnosi się do samej siebie jako znaku fizycznego (do napisu, kształtu graficznego, brzmienia).</p>\n<ul><li><b>Przykład:</b> Kot (3 litery).</li></ul>\n<h5>Supozycja zwykła (suppositio simplex)</h5>\n<p>Nazwa odnosi się do pojęcia ogólnego, natury lub gatunku jako całości (do powszechnika).</p>\n<ul><li><b>Przykład:</b> kot (wszystkie koty / kociość).</li></ul>\n<h5>Supozycja osobowa (suppositio personalis)</h5>\n<p>Nazwa odnosi się do konkretnego, jednostkowego desygnatu istniejącego w świecie pozajęzykowym.</p>\n<ul><li><b>Przykład:</b> czarny kot (ten oto konkretny kot).</li></ul>\n<h4><span class=\"num\">3.</span> Paradoksy semantyczne i reguła rozgraniczenia poziomów</h4>\n<h5>Paradoks kłamcy (antynomia semantyczna Eubulidesa)</h5>\n<ul><li><b>Kłamca mówi:</b> „Ja zawsze kłamię” (lub: „To zdanie jest fałszywe”).</li><li><b>Pytanie:</b> czy skłamał, czy powiedział prawdę?</li></ul>\n<p>Jeśli mówi prawdę → to kłamie.</p>\n<p>Jeśli kłamie → to mówi prawdę.</p>\n<p>Powstaje nierozstrzygalna pętla sprzeczności.</p>\n<h5>Fundamentalna zasada semantyki logicznej</h5>\n<p>NIE MIESZAMY JĘZYKA PRZEDMIOTOWEGO Z METAJĘZYKIEM!</p>\n<h5>Dylemat metodologiczny</h5>\n<ul><li>Albo swoboda wysławiania się (język naturalny ze swoją wieloznacznością i podatnością na antynomie),</li></ul>\n<p>Albo matematyka / logika formalna (rygorystyczna hierarchia poziomów wykluczająca paradoksy, ale ograniczająca swobodę wypowiedzi).</p>\n<h5>Inne klasyczne aporie i paradoksy przywołane na tablicy</h5>\n<ul><li><b>Paradoks fryzjera / goli brodę wojskowy:</b> dowódca rozkazuje, by fryzjer wojskowy golił tylko tych żołnierzy, którzy nie golą się sami. Pytanie: czy goli samego siebie?</li><li><b>Paradoks wszechmocy:</b> Czy Bóg może stworzyć kamień, którego nie jest w stanie podnieść?</li><li><b>Pytanie teologiczno-metafizyczne:</b> Co robił Bóg przed stworzeniem świata?</li></ul>\n<h4><span class=\"num\">4.</span> Schemat poziomów języka (Analiza wielopoziomowa)</h4>\n<h5>Zapis tablicowy zdania trójstopniowego</h5>\n<ul><li><b>≪Twierdzenie:</b> \"Wyraz ’kot’ jest wyrazem czteroliterowym\" jest prawdziwe≫</li><li><b>1° stopień – Język przedmiotowy:</b> 'kot' (słowo w supozycji materialnej na poziomie bazowym).</li><li><b>2° stopień – Metajęzyk:</b> \"Wyraz 'kot' jest wyrazem czteroliterowym\" (zdanie w cudzysłowie orzekające o wyrazie z poziomu</li></ul>\n<p>1° ).</p>\n<ul><li><b>3° stopień – Meta-metajęzyk:</b> &lt;&lt; Twierdzenie: [...] jest prawdziwe &gt;&gt; (orzeczenie o wartości logicznej prawdy/fałszu formułowane w nawiasie ostrokątnym wobec zdania z poziomu</li></ul>\n<p>2° ).</p>"}, {"t": "Kategorie semantyczne, zdania, funkcje zdaniowe", "html": "<div class=\"eyebrow\">LOGIKA – Notatka z tablicy</div>\n<div class=\"topic\"><span>Temat</span>Kategorie semantyczne, Zdania w sensie logicznym, Funkcje zdaniowe i Semantyczny podział zdań</div>\n<h4><span class=\"num\">1.</span> Kategorie typów (Kategorie semantyczne / składniowe)</h4>\n<h5>W analizie logicznej języka wyróżnia się cztery podstawowe kategorie wyrażeń</h5>\n<ul><li>Zdania</li><li>Nazwy</li><li>Funktory</li><li>Operatory</li></ul>\n<h4><span class=\"num\">2.</span> Zdania w sensie logicznym</h4>\n<ul><li><b>Zdanie jako wyłączny nośnik prawdy:</b> W logice zdania stanowią jedyną kategorię, której przysługuje orzekanie o prawdzie lub fałszu.</li></ul>\n<h4><span class=\"num\">A.</span> Definicja</h4>\n<ul><li>Zdanie w sensie logicznym ( </li><li><b>= zdanie gramatyczne!):</b> Wyrażenie złożone, któremu można jednoznacznie przypisać wartość logiczną: prawdę lub fałsz.</li></ul>\n<h5>Zasada ścisłości logicznej</h5>\n<p>„Logika nie pozostawia domysłów, wszystko trzeba zaartykułować (zakłada wiedzę).”</p>\n<h5>Podział zdań ze względu na tryb orzekania</h5>\n<ul><li><b>Kategoryczne:</b> oznajmujące, stwierdzające stan rzeczy wprost bez zastrzeżeń (np. „S jest P”).</li><li><b>Modalne:</b> zawierające funktory modalne orzekające o stopniu pewności lub konieczności (np. „jest konieczne, że...”, „jest możliwe, że...”).</li></ul>\n<h4><span class=\"num\">3.</span> Funkcje zdaniowe i Zmienna wolna</h4>\n<ul><li><b>Definicja funkcji zdaniowej:</b> Wyrażenie zawierające co najmniej jedną zmienną wolną, które samo w sobie nie jest ani prawdziwe, ani fałszywe, lecz staje się zdaniem w sensie logicznym na jeden z dwóch sposobów:</li></ul>\n<h5>Przez związanie zmiennych wolnych kwantyfikatorem</h5>\n<ul><li><b>Kwantyfikatorem ogólnym:</b> każdy, wszyscy, żaden.</li><li><b>Kwantyfikatorem szczegółowym (egzystencjalnym):</b> pewien, niektórzy, istnieje.</li></ul>\n<h5>Przykład z tablicy</h5>\n<p>Wyrażenie „Człowiek jest wysoki” to funkcja zdaniowa (brak precyzyjnej wartości logicznej) → dopiero po kwantyfikacji staje się zdaniem: „Każdy człowiek jest wysoki”.</p>\n<ul><li><b>Przez podstawienie stałych za zmienne wolne:</b> Podstawienie konkretnej nazwy indywidualnej w miejsce zmiennej (np. za zmienną</li><li><b>x wstawiamy stałą Janek:</b> „Janek jest wysoki”).</li><li><b>Zmienna wolna:</b> Zmienna w formule logicznej, która nie jest związana żadnym operatorem ani kwantyfikatorem (pozostaje „pustym miejscem” do podstawienia stałej lub kwantyfikacji).</li></ul>\n<h4><span class=\"num\">4.</span> Podział zdań ze względu na budowę formalną</h4>\n<ul><li><b>Zdania proste:</b> Nie zawierają w sobie innych zdań jako swoich części właściwych.</li><li><b>Zdania złożone:</b> Zawierają w sobie co najmniej jedno inne zdanie jako swoją część składową połączoną funktorem.</li></ul>\n<h5>Ważna uwaga logiczna z tablicy</h5>\n<p>Negacja zdania prostego jest zdaniem złożonym!</p>\n<ul><li><b>Przykład:</b> „Janek jest wysoki” (zdanie proste) → „Nieprawda, że Janek jest wysoki” (zdanie złożone, ponieważ zawiera w sobie funktor negacji oraz całe zdanie wyjściowe).</li></ul>\n<h4><span class=\"num\">5.</span> Semantyczny podział zdań i desygnat zdania</h4>\n<p>Co jest desygnatem zdania w sensie logicznym? → Desygnatem zdania (przedmiotem, na który wskazuje w świecie) jest stan rzeczy (zapisywany formalnie jako okoliczność, że zachodzi fakt X).</p>\n<h5>Klasyfikacja zdań ze względu na zakres podmiotu (ilość)</h5>\n<ul><li><b>Zdania ogólne:</b> Podmiot jest związany kwantyfikatorem ogólnym (każdy, wszyscy, żaden).</li><li><b>Zdania szczegółowe (egzystencjalne):</b> Podmiot jest związany kwantyfikatorem szczegółowym (istnieje, pewien, niektórzy).</li><li><b>Zdania jednostkowe:</b> Orzekają bezpośrednio o jednym, konkretnym, nazwanym przedmiocie (np. „Sokrates jest filozofem”).</li></ul>"}, {"t": "Symbole: ≠, ≡ i orzekanie", "html": "<ul><li>co to ≠</li><li>Symbol</li></ul>\n<p>= to matematyczny i logiczny znak nierówności lub różności (czytany jako: „nie równa się”, „jest różne od”).</p>\n<p>Powstaje przez przekreślenie klasycznego znaku równości ( =) i oznacza, że dwie strony wyrażenia nie są tożsame, nie mają tej samej wartości lub należą do zupełnie innych kategorii logicznych/gramatycznych.</p>\n<h5>W kontekście notatki z logiki</h5>\n<ul><li>przymiotnik jest orzeczony o rzeczowniku ≠ rzeczownik jest przymiotnikiem</li><li><b>Znak ten wskazuje na błąd logiczny i brak równoważności:</b> fakt, że przymiotnik może pełnić funkcję orzecznika o rzeczowniku (np. „kot jest czarny”), w żadnym wypadku nie jest tożsamy z twierdzeniem, że sam rzeczownik staje się przymiotnikiem.</li></ul>\n<p>\\(\\equiv \\)</p>\n<ul><li>Symbol</li></ul>\n<h5>≡ w logice i matematyce oznacza</h5>\n<h5>Równoważność logiczną (wtedy i tylko wtedy, gdy)</h5>\n<p>Łączy dwa zdania lub formuły, które mają dokładnie taką samą wartość logiczną (albo oba są prawdziwe, albo oba są fałszywe). Czyta się go: „wtedy i tylko wtedy, gdy” (odpowiednik symbolu↔).</p>\n<h5>Tożsamość / relację tożsamościową (identyczność)</h5>\n<p>W semiotyce i logice formalnej jest to znak mocniejszy od zwykłej równości ( =) – oznacza bezwzględną identyczność lub zdefiniowanie czegoś przez to samo.</p>\n<h5>W materiałach z logiki symbol ten pojawił się w dwóch kluczowych miejscach</h5>\n<h5>Przy relacji tożsamościowej znaków</h5>\n<ul><li>pies</li></ul>\n<p>≡ pies (dwa nośniki wskazują na ten sam znak i są tożsame formalnie).</p>\n<h5>Przy definicji orzekania semantycznego</h5>\n<p>'czarne' jest orzeczone o 'kocie' ≡ kot jest czarny (jedno wyrażenie jest semantycznie tożsame i równoważne drugiemu).</p>"}, {"t": "Wykład – nazwy: budowa, deskrypcje, funkcje nazwy; zdania kategoryczne", "html": "\n<div class=\"eyebrow\">LOGIKA – Wykład: nazwy i zdania kategoryczne</div>\n<div class=\"topic\"><span>Temat</span>Nazwa w ujęciu syntaktycznym i semantycznym, nazwy proste i złożone, deskrypcje, negacja nazwowa, funkcje logiczne nazwy; cztery typy zdań kategorycznych (a, e, i, o) i sylogizm</div>\n<h3 class=\"part\">CZĘŚĆ I – NAZWY</h3>\n<h4><span class=\"num\">1.</span> Nazwa w ujęciu syntaktycznym</h4>\n<ul>\n<li><b>Definicja:</b> nazwa to wyrażenie, które może być <b>podmiotem lub orzecznikiem</b> prostego zdania podmiotowo-orzecznikowego typu <i>x jest y</i> / <i>x nie jest y</i>.</li>\n<li>W logice nazwami są nie tylko rzeczowniki (jak w gramatyce, gdzie nazwą jest tylko podmiot): <i>Jan, dom, człowiek, zwierzę rozumne, zielone</i>, ale także <i>idący, piszący, śpiewający</i>.</li>\n<li>Czasownik („śpiewa”) nie jest nazwą – rozbijamy go: <i>śpiewa</i> = <i>jest śpiewający</i>; wtedy „śpiewający” jest nazwą.</li>\n<li>Przymiotniki (cechy) i imiesłowy są w logice traktowane jako nazwy.</li>\n<li>Jesteśmy w <b>metajęzyku</b> (jest nim język polski), dlatego odwołujemy się do gramatyki polskiej – potem się jej „pozbędziemy”.</li>\n<li>Nazwą może stać się wszystko, także całe zdanie – jeśli potraktujemy je metajęzykowo jako podmiot kolejnego zdania.</li>\n</ul>\n\n<h4><span class=\"num\">2.</span> Nazwa w ujęciu semantycznym</h4>\n<ul>\n<li><b>Definicja:</b> nazwa to <b>wyrażenie znaczące</b>, tzn. desygnujące – wskazujące na jakiś przedmiot.</li>\n<li>Funkcja <b>oznaczania</b> przypisana jest <b>wyłącznie nazwom</b>. Pozostałe kategorie (zdania, funktory, operatory) definiuje się przez inne funkcje logiczne.</li>\n<li>Mówienie, że „zdanie oznacza stan rzeczy”, to <b>skrót myślowy</b>. Zdanie oznacza stan rzeczy dopiero wtedy, gdy przekształcimy je w nazwę – wtedy przestaje działać jako zdanie.</li>\n<li>Przykład: <i>Dzisiaj świeci słońce</i> (zdanie) → <i>fakt, że dzisiaj świeci słońce</i> / <i>okoliczność, że dzisiaj świeci słońce</i> (nazwa).</li>\n<li><b>Różnica:</b> okoliczność nie jest ani prawdziwa, ani fałszywa – to stan rzeczy. Zdanie natomiast stwierdza, że coś zachodzi albo nie zachodzi, więc ma wartość logiczną.</li>\n<li>Każde zdanie można przekształcić w nazwę za pomocą odpowiednich funktorów (poznamy je).</li>\n</ul>\n\n<h4><span class=\"num\">3.</span> Podział syntaktyczny: nazwy proste i złożone</h4>\n<ul>\n<li><b>Nazwa prosta</b> – żadna jej część właściwa nie jest nazwą (litery nie są częściami znaczącymi; w słowie „pod” żadna litera nic nie znaczy).</li>\n<li><b>Nazwa złożona</b> – zbudowana za pomocą <b>funktorów nazwotwórczych</b> od argumentów nazwowych lub zdaniowych.</li>\n</ul>\n\n<h4><span class=\"num\">4.</span> Deskrypcje</h4>\n<ul>\n<li>Problem zdań typu <i>„Obecny król Francji jest łysy”</i> – czy można temu zdaniu przypisać prawdę lub fałsz, skoro takiego króla nie ma? Co najwyżej można powiedzieć, że „coś tu jest źle”.</li>\n<li>Pod wpływem takich zdań rozwinęła się współczesna logika (Frege) – np. <i>gwiazda poranna</i> i <i>gwiazda wieczorna</i> mają ten sam desygnat.</li>\n<li>Bertrand Russell – jeden z wybitnych logików tamtych czasów – rozwiązywał ten problem, przekształcając takie wyrażenia w zdania, którym można przypisać prawdę lub fałsz.</li>\n<li><b>Deskrypcja określona</b> – wskazuje dokładnie jeden przedmiot (zakłada, że jest jeden), np. <i>najwyższa góra świata</i>, <i>obecny król Francji</i>.</li>\n<li><b>Deskrypcja nieokreślona</b> – ogólna, np. <i>wysoki budynek</i> (takich budynków jest wiele).</li>\n<li><b>Ukryta deskrypcja</b> – nazwa, która w rzeczywistości jest skróconą deskrypcją.</li>\n<li>Deskrypcję określoną można budować na różne sposoby – może zajmować nawet całą stronę.</li>\n</ul>\n\n<h4><span class=\"num\">5.</span> Funktory nazwotwórcze; negacja nazwowa</h4>\n<ul>\n<li>Są specjalne funktory do tworzenia nazw (np. „i”, „lub” między nazwami) – brzmią tak samo jak funktory zdaniotwórcze, ale logicznie zapisuje się je inaczej. Działają jak <b>iloczyn</b> i <b>suma</b> zbiorów.</li>\n<li><b>Negacja nazwowa „nie-”</b> (pisana z kreseczką): <i>nie-sprawiedliwy</i> oznacza <b>wszystko</b>, co nie jest sprawiedliwe (także buty). Tak samo <i>nie-pies</i> to wszystkie przedmioty, które nie są psami.</li>\n<li><i>pies</i> i <i>nie-pies</i> to <b>nazwy sprzeczne</b> – razem obejmują wszystko i nic nie ma pomiędzy.</li>\n<li><i>sprawiedliwy</i> i <i>niesprawiedliwy</i> (bez kreseczki, zwykłe słowo) to <b>nazwy przeciwne</b>, a nie sprzeczne – może być coś pomiędzy. W mowie akcent na „nie” pokazuje, że użyto negacji logicznej.</li>\n<li>Funktor nazwotwórczy od argumentu zdaniowego („fakt, że…”) – tzw. funktor urzeczowiający (reifikujący).</li>\n<li><b>Parafraza</b> – przekładanie struktur gramatyki na strukturę logiczną.</li>\n</ul>\n\n<h4><span class=\"num\">6.</span> Funkcje logiczne nazwy <span class=\"tag-exam\">będzie pytane</span></h4>\n<h5>a) Nazywanie</h5>\n<ul>\n<li>Potocznie: przypisywanie etykiet rzeczom, żeby móc się porozumiewać.</li>\n<li>Rzeczy jest więcej niż nazw – nazywamy tylko to, co nam potrzebne. Nauka nazywa rzeczy niewidoczne w życiu codziennym i wprowadza nowe nazwy.</li>\n<li>„Nazwanie rzeczy to początek jej historii” (powiedzenie z XIX w.) – dopóki rzecz nie została nazwana, nie była zauważana; <b>nazwa koncentruje uwagę</b>.</li>\n<li>Przykład: ścianę nazywamy całą, a jej tysięcy fragmentów nie; kolorów są miliony (programy graficzne), a nazywamy niewiele. Język upraszcza rzeczywistość – i to uproszczenie działa.</li>\n<li>Filozofia języka zaczęła się właściwie w XIX wieku.</li>\n</ul>\n<h5>b) Znaczenie (sens)</h5>\n<ul>\n<li>Rozumienie treści – to, co rozumiemy przez daną nazwę, nazywamy dziś <b>pojęciem</b>.</li>\n<li>Różni ludzie mają różne pojęcia związane z tą samą nazwą → <b>wieloznaczność</b>. Wyrażeń całkiem jednoznacznych w języku potocznym prawie nie ma.</li>\n</ul>\n<h5>c) Oznaczanie (desygnowanie) – najważniejsza z logicznego punktu widzenia</h5>\n<ul>\n<li><b>Definicja:</b> nazwa N oznacza (desygnuje) przedmiot x wtedy i tylko wtedy, gdy N – przy określonym jej rozumieniu (trzeba ją ujednoznacznić) – jest orzekana prawdziwie o tym przedmiocie.</li>\n<li>Jest to <b>procedura sprawdzania</b>, czy przedmiot jest desygnatem nazwy: budujemy zdanie „x jest N” i pytamy, czy jest prawdziwe. Jeśli obaj uznaje
