ską).</li></ul>\n<h5>Najważniejsi Ojcowie Kościoła i literatura wczesnochrześcijańska</h5>\n<ul><li><b>Klemens Rzymski:</b> Autor Listu do Koryntian (jeden z najstarszych dokumentów interwencji administracyjnej i troski o jedność oraz sukcesję apostolską).</li><li><b>Ignacy Antiocheński:</b> Autor 7 listów pisanych w drodze na męczeństwo; mocno akcentował jedność Kościoła skupionego wokół biskupa.</li><li><b>Polikarp ze Smyrny:</b> Świadek tradycji apostolskiej, znany m.in. ze sporu z Rzymem o datę obchodów Wielkanocy.</li><li><b>Didache (Nauka Dwunastu Apostołów):</b> Najstarszy tekst pozabiblijny (ok. 50 r.), zawierający m.in. „naukę dwóch dróg” (droga życia i droga śmierci) oraz najwcześniejsze świadectwo praktyk liturgicznych (chrzest, Eucharystia w imię Trójcy Świętej).</li><li><b>Hermas (Pasterz):</b> Wczesnochrześcijańska apokalipsa poruszająca problem tzw. pokuty kanonicznej (drugiej pokuty po chrzcie za ciężkie grzechy).</li></ul>\n<h4><span class=\"num\">2.</span> Kryzysy Ideowe: Apokryfy i Herezje (Hairesis)</h4>\n<p>Słowo hairesis pierwotnie oznaczało wybór lub szkołę filozoficzną, dopiero w chrześcijaństwie nabrało negatywnego znaczenia oznaczającego odejście od prawdy (herezję).</p>\n<h4><span class=\"num\">A.</span> Problem Apokryfów i Pseudoepigrafii</h4>\n<ul><li><b>Zjawisko pseudoepigrafii:</b> Przypisywanie fałszywego autorstwa znanych postaci apostolskich w celu nadania tekstom autorytetu i przemycenia własnych treści.</li></ul>\n<p>Apokryfy podważały jednolitość kanonu. W polskiej nauce klasyczne opracowanie tej literatury przedstawił m.in. ks. prof. Marek Starowieyski.</p>\n<h4><span class=\"num\">B.</span> Judeochrześcijaństwo i Ebionici</h4>\n<ul><li><b>Ebionici:</b> Nurt judeochrześcijański (szczególnie silny w pierwszych wiekach), który uważał, że warunkiem zbawienia jest zachowanie prawa mojżeszowego.</li><li><b>Odrzucali boskość Jezusa (głosili adopcjanizm</b> – pogląd, że Jezus był zwykłym człowiekiem, na którego zstąpiła moc Boża w momencie chrztu).</li></ul>\n<p>Używali w Eucharystii wody zamiast wina (dlatego nazywano ich akwalatami).</p>\n<p>Odrzucali listy św. Pawła jako „zdrajcy Zakonu”.</p>\n<h4><span class=\"num\">C.</span> Gnoza i Gnostycyzm</h4>\n<p>Gnoza była potężnym systemem religijno-filozoficznym, który wchodząc w kontakt z chrześcijaństwem, judaizmem czy religiami Wschodu, tworzył synkretyczne systemy (np. Menander, Saturninus).</p>\n<h5>Mit gnostycki</h5>\n<ul><li><b>Istniał doskonały świat duchowy</b> – Pleroma (pełnia) z hierarchią eonów.</li></ul>\n<p>Świat materialny powstał w wyniku błędu (niewiedzy) niższego bóstwa (Sofii), które zapragnęło poznać niepoznawalne.</p>\n<p>Materia jest zmaterializowaną niewiedzą i złem. W materii uwięzione są iskry duchowe (cząstki Pleromy).</p>\n<ul><li><b>Kotwica zbawienia:</b> Zbawienie nie dokonywało się przez wiarę czy łaskę, lecz przez wiedzę (gnosis) – uświadomienie sobie swojego boskiego pochodzenia i ucieczkę od skażonej materii (często wiązało się to z radykalnym rygoryzmem i odrzuceniem małżeństwa).</li></ul>\n<h4><span class=\"num\">D.</span> Marcjonizm</h4>\n<p>Stworzony przez Marcjona, który dokonał radykalnego cięcia w Biblii.</p>\n<h5>Główne założenia</h5>\n<p>Całkowite odrzucenie Starego Testamentu (uznawał Boga Starego Testamentu za boga gniewu, mściwego demiurga).</p>\n<p>Przyjmował jedynie okrojoną Ewangelię Łukasza i wybrane listy Pawła.</p>\n<ul><li><b>Skrajny dualizm:</b> świat materialny jest zły, stworzony przez niższego boga, a prawdziwy Bóg miłosierdzia objawił się dopiero w Jezusie Chrystusie.</li></ul>\n<h4><span class=\"num\">E.</span> Montanizm</h4>\n<p>Ruch charyzmatyczny i proroczy zapoczątkowany przez Montanusa oraz prorokynie Pryscyllę i Maximillę.</p>\n<h5>Cechy ruchu</h5>\n<p>Głosili bliskie, natychmiastowe przyjście Nowego Jeruzalem (Duch Święty miał dokonać pełni objawienia przewyższającej nawet nauczanie Chrystusa).</p>\n<ul><li><b>Skrajny rygoryzm moralny:</b> nakaz surowych postów, zakaz unikania prześladowań (obowiązek szukania męczeństwa).</li></ul>\n<p>Z ruchem tym na pewnym etapie jego życia związał się wybitny pisarze wczesnochrześcijański – Tertulian.</p>"}, {"t": "Sukcesja apostolska i urząd biskupa", "html": ""}], "psych": [{"t": "Wykład 1 – czym jest psychologia (2.10.2026)", "html": "<div class=\"eyebrow\">PSYCHOLOGIA OGÓLNA</div>\n<div class=\"meta\">🗓 Data: 2 X 2026</div>\n<p>„My wiemy, co to oznacza”</p>\n<ul><li>Wprowadzenie do psychologii</li><li><b>Definicja:</b> Psychologia to nauka, która zajmuje się opisem i wyjaśnieniem zachowań i procesów psychicznych.</li><li><b>1879 r. – narodziny nowożytnej psychologii:</b> założenie pierwszego laboratorium psychologicznego (Wilhelm Wundt w Lipsku).</li><li><b>Charakterystyka:</b> Psychologia jest nauką probabilistyczną – opiera się na rachunku prawdopodobieństwa (nigdy nie ma w niej 100% pewności).</li><li><b>Główny cel psychologii:</b> Diagnoza i terapia.</li></ul>\n<p>„Nie można powiedzieć, że ktoś jest już »święty« albo »dojrzały«”.</p>\n<h5>Ewolucja przedmiotu badań</h5>\n<ul><li><b>I etap psychologii:</b> Psychika ⟷ Świadomość (metoda: introspekcja).</li><li><b>II etap:</b> Psychoanaliza (Zygmunt Freud) → Świadomość, Przedświadomość / Podświadomość, Nieświadomość.</li><li>Metodologia psychologii współczesnej</li><li><b>Introspekcja</b> – „spoglądać w głąb”, samoobserwacja własnych stanów psychicznych.</li><li><b>Obserwacja</b> – świadome, systematyczne i planowe spostrzeganie przeżyć wewnętrznych człowieka na podstawie oznak zewnętrznych ( spostrzeganie→interpretacja).</li><li><b>Cechy poprawnej obserwacji:</b> celowa, planowa, selektywna, obiektywna.</li><li><b>Wywiad psychologiczny</b> – prosta rozmowa ukierunkowana na uzyskanie konkretnych informacji.</li></ul>\n<h5>Ankieta – zestaw pytań; jej wartość merytoryczna zależy od</h5>\n<p>sposobu zadawania pytań, warunków i sposobu jej przeprowadzenia (np. kiedy).</p>\n<ul><li><b>Eksperyment</b> – forma obserwacji, w której celowo wywołuje się badane zjawisko, wpływa na jego przebieg i kontroluje zmienne.</li></ul>\n<h5>Testy psychologiczne</h5>\n<p>Kwestionariuszowe (ulepszona ankieta, zazwyczaj pytania zamknięte)</p>\n<ul><li>Skalowe</li></ul>\n<p>Zdań niedokończonych (technika projekcyjna)</p>\n<ul><li>Testy inteligencji</li><li>Analiza wytworów</li><li>Statystyka</li><li><b>(Margines:</b> nawiązanie do Z. Freuda – „Poza zasadą przyjemności” oraz behawioryzmu: reakcja na bodźce psychiczne).</li><li>Historyczne kierunki psychologiczne</li><li><b>2.3.1. Psychologia elementów (strukturalizm)</b> – II poł. XIX w.</li><li><b>Przedstawiciele / spory:</b> Wilhelm Wundt vs szkoła würzburska.</li><li><b>Asocjacja</b> – kojarzenie faktów/zjawisk psychicznych zgodnie z określonymi prawidłami.</li><li><b>Tendencja dominująca</b> – wytworzone i ukierunkowane podczas badania nastawienie poznawcze.</li></ul>\n<h5>Koncepcja Wundta (synteza twórcza)</h5>\n<p>„Wytwór psychiczny, który powstaje z jakiejkolwiek liczby elementów, a więc jest czymś nowym, czymś nieporównywalnym ze swymi składnikami pod względem swych właściwości istotnych.”</p>\n<ul><li>2.3.2. Psychologia aktów</li><li><b>Główny przedstawiciel:</b> Franz Brentano.</li><li><b>Kluczowe założenie:</b> Główną cechą wyróżniającą przedmiot psychologii jest aktywność umysłu skierowana na treść.</li></ul>\n<p>Doświadczenie aktywne i intencjonalne → intencjonalność aktu psychicznego (każdy stan świadomości odnosi się ku jakiemuś przedmiotowi).</p>"}, {"t": "Wykład 1 – rozwinięcie akademickie", "html": "<div class=\"eyebrow\">PSYCHOLOGIA OGÓLNA – ROZSZERZENIE MATERIAŁU</div>\n<h4><span class=\"num\">1.</span> Czym jest psychologia i specyfika jej poznania</h4>\n<ul><li><b>Geneza terminu:</b> Słowo wywodzi się z greki: psyche (ψυχή – dusza, tchnienie życia) oraz logos (λόγος – słowo, nauka, rozum). Początkowo psychologia stanowiła integralną część filozofii (antropologii filozoficznej i teorii poznania).</li></ul>\n<h5>Zadania nauki (Opis i Wyjaśnienie)</h5>\n<ul><li><b>Opis (deskrypcja):</b> Odpowiada na pytanie „jak jest?” – rejestruje faktyczne zachowania, procesy afektywne, dynamikę procesów poznawczych (spostrzeganie, pamięć, myślenie) bez ich wstępnego wartościowania.</li><li><b>Wyjaśnienie (eksplanacja):</b> Odpowiada na pytanie „dlaczego tak się dzieje?” – formułuje hipotezy i teorie wskazujące na związki przyczynowo-skutkowe lub funkcjonalne pomiędzy bodźcami, strukturami biologicznymi, cechami osobowości a zachowaniem.</li></ul>\n<h5>Charakter probabilistyczny</h5>\n<p>W naukach przyrodniczych (jak fizyka klasyczna) zjawiska opisuje się prawami deterministycznymi. Psychologia bada układy otwarte o olbrzymiej złożoności, dlatego formułuje prawa statystyczne / probabilistyczne.</p>\n<p>Oznacza to, że psycholog wnioskuje w kategoriach prawdopodobieństwa wystąpienia określonej reakcji, a nie niezłomnej konieczności. Żadna diagnoza ani predykcja nie ma 100% pewności.</p>\n<h5>Cel praktyczny: Diagnoza i Terapia</h5>\n<ul><li><b>Diagnoza:</b> Identyfikacja mechanizmów funkcjonowania jednostki, jej deficytów, potencjałów rozwojowych, źródeł konfliktów wewnętrznych lub zaburzeń psychicznych.</li><li><b>Terapia:</b> Celowe oddziaływanie mające na celu przywrócenie równowagi psychicznej, integrację osobowości, modyfikację nieadaptacyjnych nawyków i rozwój dojrzałości.</li></ul>\n<h5>Kwestia dojrzałości psychicznej i „świętości”</h5>\n<p>„Nie można powiedzieć, że ktoś jest już dojrzały albo święty” – w psychologii rozwój osobowości jest procesem permanentnym (nie stanem statycznym). Dojrzałość nie jest osiągnięciem raz na zawsze; człowiek w obliczu nowych kryzysów (tzw. kryzysów normatywnych i nienormatywnych) stale redefiniuje swoje mechanizmy adaptacyjne.</p>\n<h4><span class=\"num\">2.</span> Dwa paradygmaty przedmiotu badań</h4>\n<ul><li><b>I etap:</b> Psychika = Świadomość (Introspekcjonizm)</li></ul>\n<p>Dominował od narodzin psychologii eksperymentalnej (1879 r.) do początku XX wieku.</p>\n<p>Utożsamiano zjawiska psychiczne wyłącznie z tym, co jawne, bezpośrednio uświadamiane przez podmiot (świadomy strumień przeżyć).</p>\n<p>Główną metodą badawczą była introspekcja (wgląd we własne stany wewnętrzne).</p>\n<ul><li><b>II etap:</b> Przełom psychoanalityczny (Zygmunt Freud)</li></ul>\n<p>Zygmunt Freud wykazał, że świadomość to jedynie nikły ułamek całego życia psychicznego.</p>\n<p>Wprowadził koncepcję nieświadomości, która w sposób dynamiczny determinuje większość ludzkich motywacji, afektów i symptomów neurotycznych.</p>\n<ul><li><b>Przejście to zrewolucjonizowało psychologię:</b> badacz przestał wierzyć deklaracjom badanego na słowo, a zaczął doszukiwać się ukrytych, nieświadomych sensów za fasadą wypowiedzi i objawów.</li></ul>\n<h4><span class=\"num\">3.</span> Metodologia współczesnych badań psychologicznych</h4>\n<ul><li>Rzetelność w psychologii zależy od ścisłego stosowania triangulacji metodologicznej (łączenia wielu metod):</li></ul>\n<h5>Obserwacja zewnętrzna (ekstrospekcja)</h5>\n<p>Świadome, ustrukturyzowane śledzenie wskaźników behawioralnych (gesty, mimika, czas reakcji, ton głosu, zachowania celowe).</p>\n<h5>Aby obserwacja była naukowa, musi być</h5>\n<ul><li><b>Celowa:</b> podporządkowana z góry określonej hipotezie.</li><li><b>Planowa:</b> realizowana według ustalonego schematu i harmonogramu.</li><li><b>Selektywna:</b> wyodrębniająca z tła tylko zmienne istotne dla badania.</li><li><b>Obiektywna:</b> zredukowana do rejestracji faktów, wyraźnie oddzielona od interpretacji i ocen obserwatora.</li></ul>\n<h5>Introspekcja (samoobserwacja)</h5>\n<p>Metoda historycznie fundamentalna, choć współcześnie traktowana ostrożnie ze względu na subiektywizm, mechanizmy racjonalizacji i zawodność pamięci badanych.</p>\n<h5>Eksperyment psychologiczny</h5>\n<p>Król metod empirycznych. Polega na celowym wywołaniu badanego procesu poprzez manipulację zmienną niezależną (bodziec/warunek) przy jednoczesnej kontroli zmiennych zakłócających i pomiarze zmiennej zależnej (reakcja/zachowanie).</p>\n<h5>Wywiad i rozmowa psychologiczna</h5>\n<p>Metoda jakościowa. Może być ustrukturyzowany, półstrukturalny lub swobodny. Pozwala na nawiązanie kontaktu terapeutycznego i zebranie historii życia (anamnezy).</p>\n<h5>Ankieta i kwestionariusze</h5>\n<p>Służą do badań ilościowych na dużych próbach.</p>\n<p>Kluczowe znaczenie ma poprawność konstrukcji kafeterii pytań (unikanie pytań sugerujących, dwuznacznych, zbyt intymnych na początku) oraz warunki temporalne i środowiskowe badania (np. pora dnia, zmęczenie, poczucie anonimowości).</p>\n<h5>Testy psychologiczne</h5>\n<ul><li><b>Muszą spełniać rygorystyczne kryteria psychometryczne:</b> trafność (mierzy to, co ma mierzyć), rzetelność (dokładność i powtarzalność pomiaru), normalizacja (odniesienie do norm populacyjnych) oraz standaryzacja.</li><li><b>Rodzaje:</b> kwestionariusze osobowościowe, skale szacunkowe, testy zdolności i inteligencji (np. WAIS), testy projekcyjne (np. Test Niedokończonych Zdań Rottera, Rorschach).</li></ul>\n<h5>Analiza wytworów</h5>\n<p>Badanie rysunków, pamiętników, listów, prac plastycznych czy wytworów pracy zawodowej pacjenta – szczególnie cenna w psychologii dziecięcej i klinicznej.</p>\n<h5>Statystyka</h5>\n<p>Aparat matematyczny weryfikujący istotność statystyczną obserwowanych różnic lub korelacji (np. testy t-Studenta, korelacja Pearsona, analiza czynnikowa, regresja).</p>\n<h4><span class=\"num\">4.</span> Historyczne szkoły psychologiczne</h4>\n<h4><span class=\"num\">A.</span> Psychologia elementów (Strukturalizm) – Wilhelm Wundt (1879 r.)</h4>\n<ul><li><b>Geneza:</b> Założenie przez Wundta pierwszego na świecie Instytutu Psychologii Eksperymentalnej na Uniwersytecie w Lipsku w 1879 roku uznaje się za oficjalną cezurę oddzielenia psychologii od filozofii.</li><li><b>Główne założenie:</b> Życie psychiczne składa się z elementarnych, nierozkładalnych „cegiełek” – prostych wrażeń zmysłowych (sensations) oraz elementarnych uczuć (feelings).</li><li><b>Asocjacjonizm:</b> Elementy te łączą się w złożone struktury (idee, wyobrażenia) za pomocą mechanizmów kojarzenia (styczność w czasie i przestrzeni, podobieństwo, kontrast).</li><li><b>Koncepcja twórczej syntezy (schöpferische Synthese):</b> Wundt podkreślał, że psychika to nie zwykła suma składników. Całość posiada jakość nową, emergentną, której nie da się wyprowadzić z prostej addycji jej elementów (cytat z notatki: produkt psychiczny jest czymś nowym, nieporównywalnym ze swoimi składnikami).</li><li><b>Spór ze Szkołą Würzburską (Oswald Külpe i współpracownicy):</b> Badacze z Würzburga wykazali ograniczenia Wundtowskiego atomizmu, udowadniając eksperymentalnie istnienie tzw. myślenia nienaocznego (aktów myślenia pozbawionych zmysłowych obrazów) oraz znaczenie tendencji dominującej / nastawienia (Aufgabe), która steruje przebiegiem kojarzeń wbrew czystemu asocjacjonizmowi.</li></ul>\n<h4><span class=\"num\">B.</span> Psychologia aktów – Franz Brentano (1874 r.)</h4>\n<ul><li><b>Opozycja do Wundta:</b> Austriacki filozof i psycholog Franz Brentano opublikował w 1874 r. przełomowe dzieło „Psychologia z empirycznego punktu widzenia”. Sprzeciwił się wundtowskiemu redukowaniu psychiki do biernych treści i elementów.</li><li><b>Akt vs Treść:</b> Brentano odróżnił treść psychiczną (np. widziany kolor czerwony, usłyszany dźwięk) od aktu psychicznego (samo widzenie, słyszenie, pragnienie, sądzenie). Prawdziwym przedmiotem psychologii są dynamiczne czynności/akty umysłu, a nie martwe treści.</li></ul>\n<h5>Koncepcja Intencjonalności (intentio)</h5>\n<p>Fundamentalna cecha każdego zjawiska psychicznego odróżniająca je bezwzględnie od zjawisk fizycznych.</p>\n<ul><li>Każdy akt psychiczny charakteryzuje się „skierowaniem ku przedmiotowi” (intencjonalnym odniesieniem):</li><li><b>Kiedy spostrzegamy</b> – zawsze spostrzegamy coś.</li><li><b>Kiedy miłujemy</b> – zawsze miłujemy kogoś / coś.</li><li><b>Kiedy wątpimy</b> – zawsze wątpimy w coś.</li></ul>\n<p>Koncepcja ta stała się bezpośrednim fundamentem fenomenologii Edmunda Husserla oraz wpłynęła na całą europejską myśl humanistyczną i psychologię postaci (Gestalt).</p>"}, {"t": "Psychoanaliza Freuda i behawioryzm (9.10.2026)", "html": "<ul><li><b>Wykład</b> – Piątek, 9 października 2026, 07:59</li></ul>\n<h4><span class=\"num\">1.</span> Topograficzny model aparatu psychicznego (Metafora góry lodowej)</h4>\n<ul><li>Freud podzielił ludzki umysł na trzy poziomy dostępności treści psychicznych dla świadomego „ja”:</li></ul>\n<h5>Świadomość (wierzchołek góry lodowej)</h5>\n<p>Niewielka część psychiki znajdująca się ponad powierzchnią wody.</p>\n<p>Obejmuje bieżące myśli, percepcje zmysłowe, intencje i odczucia, z których bezpośrednio zdajemy sobie sprawę w danym momencie.</p>\n<h5>Przedświadomość (warstwa tuż pod powierzchnią)</h5>\n<p>Treści, które w tej chwili nie znajdują się w centrum uwagi, ale nie są zablokowane.</p>\n<p>Uświadamiamy je sobie bez trudu dopiero wtedy, gdy pojawi się taka potrzeba lub odpowiedni impuls (np. przypomnienie sobie numeru telefonu, daty urodzin czy wiedzy nabytej na poprzednim wykładzie).</p>\n<h5>Nieświadomość (masywna podstawa góry lodowej)</h5>\n<p>Największa i zarazem najbardziej determinantna część aparatu psychicznego.</p>\n<p>Składa się z wypartych popędów, lęków, traumatycznych wspomnień i pierwotnych impulsów, do których bezpośredni dostęp jest zablokowany przez cenzurę psychiczną.</p>\n<ul><li><b>Jest to „podstawa góry”, o którą</b> – niczym Titanic – człowiek może się rozbić, jeśli siły nieświadome przejmą kontrolę lub dojdzie do gwałtownego konfliktu wewnętrznego. Treści te determinują ludzkie wybory, sny, objawy nerwicowe oraz przejęzyczenia (lapsusy freudowskie).</li></ul>\n<h4><span class=\"num\">2.</span> Strukturalny model osobowości (Id – Ego – Superego)</h4>\n<p>W późniejszym etapie Freud uzupełnił model topograficzny o model strukturalny, w którym osobowość stanowi dynamiczną arenę ścierających się sił:</p>\n<ul><li>Instancja Główna zasada Rola i charakterystyka psychologiczna Przykłady z notatek</li></ul>\n<p>Id (Ono)</p>\n<p>Zasada przyjemności (lustprinzip)</p>\n<p>Całkowicie nieświadomy „kocioł wrzących popędów”, siła biologiczna, popęd życia (Eros) i popęd śmierci (Thanatos). Dąży do natychmiastowego zaspokojenia bez względu na reguły społeczne czy logikę. Człowiek bywa niewolnikiem Id.</p>\n<ul><li>„Zjedz golonkę!”</li><li>„Chcę auto za 150 tys. zł!”</li></ul>\n<p>Ego (Ja)</p>\n<p>Zasada realności (realitätsprinzip)</p>\n<p>Świadomy i racjonalny negocjator/rozjemca. Równoważy impulsywne żądania Id z restrykcyjnymi nakazami Superego i wymaganiami świata zewnętrznego. Działa w oparciu o system wartości, strategię i narzędzia poznawcze (bez nich jest bezradne wobec nacisków).</p>\n<ul><li>„Poczekaj, przyjdzie Wielkanoc”</li><li>„O, tu jest auto za 50 tys. zł (na to nas stać)”</li></ul>\n<p>Superego (Nad-ja)</p>\n<ul><li>Zasada powinności / moralności</li></ul>\n<p>Wewnętrzny sędzia, cenzor i sumienie ukształtowane w procesie wychowania, socjalizacji oraz interioryzacji norm rodzicielskich i kulturowych. Może funkcjonować skrajnie: od subtelnej oceny (waga apteczna) po bezwzględną, miażdżącą surowość (waga kolejowa).</p>\n<ul><li>„Nie jedz – jest Wielki Piątek, obowiązuje post ścisły!”</li><li>„Za drogie, to nieodpowiedzialne!”</li></ul>\n<h4><span class=\"num\">3.</span> Mechanizmy obronne Ego</h4>\n<p>Gdy kompromis między Id, Superego a rzeczywistością staje się niemożliwy, Ego doświadcza lęku (neurotycznego, moralnego lub realnego). Aby chronić się przed dezintegracją, uruchamia nieświadome mechanizmy obronne:</p>\n<h5>Wyparcie (represja)</h5>\n<p>Podstawowy i najbardziej pierwotny mechanizm obronny.</p>\n<p>Polega na aktywnym wypychaniu ze świadomości do nieświadomości bolesnych wspomnień, traum, zakazanych myśli i impulsów budzących lęk. Wyparte treści nadal jednak wywierają presję energetyczną.</p>\n<h5>Zaprzeczenie (denial)</h5>\n<p>Odmowa uznania obiektywnie istniejącej rzeczywistości, faktów lub uczuć, które są zbyt bolesne do zaakceptowania (np. ignorowanie diagnozy śmiertelnej choroby, odrzucanie faktu własnego uzależnienia).</p>\n<h5>Projekcja</h5>\n<p>Nieświadome przypisywanie własnych, nieakceptowanych cech, wad, pragnień lub wrogich uczuć innym osobom.</p>\n<ul><li><b>Człowiek zamiast uznać:</b> „Czuję nienawiść”, twierdzi: „To on mnie nienawidzi i prowokuje”.</li></ul>\n<h5>Racjonalizacja</h5>\n<p>Pozornie logiczne, społecznie akceptowalne usprawiedliwianie własnych zachowań, błędów lub porażek, maskujące prawdziwe (często niskie) motywy.</p>\n<ul><li><b>Kwaśne winogrona:</b> dewaluowanie celu, którego nie udało się osiągnąć („Wcale mi na tym awansie nie zależało, to stanowisko i tak jest bez sensu”).</li><li><b>Słodkie cytryny:</b> wmawianie sobie, że niekorzystna, niechciana sytuacja, w której się znaleźliśmy, w rzeczywistości jest wspaniała i pożądana („Dobrze, że to stare auto się popsuło, przynajmniej więcej spaceruję”).</li></ul>\n<h5>Sublimacja</h5>\n<p>Jedyny w pełni dojrzały i twórczy mechanizm obronny.</p>\n<p>Przekierowanie nieakceptowanych społecznie popędów (głównie agresywnych i seksualnych) na cele społecznie cenione, artystyczne, naukowe lub użyteczne.</p>\n<ul><li><b>Przykład z wykładu:</b> popęd agresji ukierunkowany destrukcyjnie czyni z kogoś przestępcę (nożownika), podczas gdy zsublimowany w precyzyjną pracę manualną ratuje życie (chirurg).</li></ul>\n<h5>Przemieszczenie (wyładowanie uczuć)</h5>\n<p>Skierowanie reakcji emocjonalnej (najczęściej gniewu) na obiekt zastępczy, bezpieczniejszy lub słabszy, ponieważ bezpośredni sprawca frustracji jest zbyt groźny (np. szef).</p>\n<ul><li><b>Przykład z wykładu:</b> pracownik skarcony przez przełożonego wraca do domu i wyładowuje frustrację na żonie i dzieciach.</li></ul>\n<h5>Regresja</h5>\n<p>Cofnięcie się w sytuacji stresu do zachowań, reakcji i mechanizmów charakterystycznych dla wcześniejszego stadium rozwoju psychoseksualnego (np. dorosły obrażający się jak dziecko, tupanie nogami, płacz, utrata samodzielności).</p>\n<h5>Identyfikacja</h5>\n<p>Przejmowanie cech, postaw lub wartości innych jednostek bądź potężnych instytucji, by podnieść własną samoocenę, zyskać poczucie bezpieczeństwa lub osiągnąć wymierne korzyści psychologiczne.</p>\n<h5>Izolacja (izolacja afektu)</h5>\n<p>Rozdzielenie poznawczego aspektu zdarzenia (faktów, myśli) od ładunku emocjonalnego.</p>\n<p>Człowiek relacjonuje traumatyczne wydarzenie w sposób chłodny, medyczny, pozbawiony jakichkolwiek uczuć.</p>\n<h4><span class=\"num\">4.</span> Kontekst alternatywny: Behawioryzm a Psychoanaliza</h4>\n<ul><li>W opozycji do analizy głębi psychiki (procesów nieświadomych) stoi podejście behawioralne:</li></ul>\n<h5>Paradygmat Bodziec → Reakcja ( S→R)</h5>\n<p>Psychologia powinna badać wyłącznie obiektywnie obserwowalne zachowanie, odrzucając spekulacje o „duszy”, Id czy Superego jako nienaukowe.</p>\n<p>Zachowanie człowieka jest kształtowane przez środowisko poprzez system wzmocnień: nagrody (wzmocnienia pozytywne) oraz kary.</p>\n<p>Moralność i dyscyplina w tym ujęciu wynikają z zewnętrznej kalkulacji: „Przestrzegam prawa, bo boję się mandatu/więzienia”, „Uczeń uczy się dla oceny lub ze strachu przed uwagą”.</p>\n<h5>Edward Thorndike i Prawo Efektu (Law of Effect)</h5>\n<p>Zachowania, po których następuje stan satysfakcji (nagroda), mają tendencję do utrwalania się i częstszego powtarzania.</p>\n<p>Zachowania przynoszące dyskomfort lub karę ulegają wygaszeniu. Jest to fundament warunkowania instrumentalnego i uczenia się u ludzi oraz zwierząt.</p>\n<h4><span class=\"num\">5.</span> Wytyczne organizacyjne do ćwiczeń</h4>\n<p>Zagadnienia z psychoanalizy i behawioryzmu mają być opanowane z pamięci.</p>\n<ul><li><b>Forma zajęć:</b> burza mózgów oraz praktyczna analiza mechanizmów w konkretnych sytuacjach życiowych.</li></ul>"}, {"t": "Jung, Adler, Horney – psychologia głębi", "html": "<div class=\"eyebrow\">PSYCHOLOGIA – Psychologia Głębi, Adler i Psychoanaliza Kulturowa</div>\n<div class=\"topic\"><span>Temat</span>Struktura osobowości według Junga, teleologia Adlera oraz lęk i potrzeby neurotyczne u Karen Horney</div>\n<h4><span class=\"num\">1.</span> Carl Gustav Jung i Struktura Psychiki</h4>\n<ul><li>Jung wyróżnił strukturę ludzkiej psychiki opartą na świadomości oraz dwóch poziomach nieświadomości:</li><li><b>Ego (świadomość):</b> Centrum naszej osobowości, uświadomione myśli, tożsamość oraz imię i nazwisko.</li><li><b>Podświadomość (nieświadomość) indywidualna:</b> Obszar obejmujący to, co zostało wyparte ze świadomości (złe doświadczenia, błędy, popełnione grzechy, ukrywane emocje).</li><li><b>Podświadomość (nieświadomość) zbiorowa:</b> Najgłębsza warstwa psychiki zawierająca to, co odziedziczone po przodkach – nie tylko ludzkich, ale także ślady dziedzictwa zwierzęcego.</li></ul>\n<h5>Główne archetypy w psychologii Junga</h5>\n<ul><li><b>Persona (maska):</b> Osobowość publiczna; wizerunek i rola, jaką człowiek pokazuje na zewnątrz.</li><li><b>Anima i Animus:</b> Nieświadome pierwiastki odmiennej płci obecne w psychice (Anima – kobiecy pierwiastek u mężczyzny; Animus – męski pierwiastek u kobiety).</li><li><b>Cień:</b> Ukryta, ciemna strona osobowości; to, czego człowiek się wstydzi i przed czym się kryje.</li><li><b>Jaźń (Self):</b> Nadrzędny archetyp odpowiedzialny za integrację, stabilność i równowagę całej osobowości.</li><li><b>Wymiary osobowości:</b> Jung wskazał również na podział na ekstrawersję (skierowanie na świat zewnętrzny) oraz introwersję (skierowanie na świat wewnętrzny).</li></ul>\n<h4><span class=\"num\">2.</span> Alfred Adler i Psychologia Indywidualna</h4>\n<ul><li><b>Odejście od Freuda:</b> Adler odrzucił panseksualizm Freuda i za kluczowy czynnik determinujący człowieka uznał celowość (teleologię) oraz wolę mocy.</li><li><b>Poczucie niższości:</b> Każdy człowiek doświadcza w życiu (szczególnie w dzieciństwie) poczucia niższości. Doświadczenie to nie musi być destrukcyjne – przy odpowiednim pokierowaniu staje się ono naturalną trampoliną do sukcesu i rozwoju.</li></ul>\n<h4><span class=\"num\">3.</span> Karen Horney i Psychoanaliza Kulturowa</h4>\n<p>Karen Horney (przedstawicielka psychoanalizy kulturowej) przeniosła akcent z popędów biologicznych na wpływ środowiska społecznego.</p>\n<h5>Trzy wymiary Ja</h5>\n<ul><li><b>Ja realne:</b> Rzeczywiste możliwości i potencjał człowieka.</li><li><b>Ja idealne:</b> Zawyżone, nierealistyczne wyobrażenia i oczekiwania wobec siebie.</li><li><b>Ja aktualne:</b> Zespół aktualnie realizowanych celów.</li><li><b>Neurotyk:</b> Osoba, u której występują drastyczne dysproporcje i wygórowany poziom Ja idealnego.</li><li><b>Lęk podstawowy:</b> Poczucie izolacji i bezsilności jednostki w obliczu potencjalnie wrogiego świata. Powstaje w dzieciństwie na skutek błędów wychowawczych rodziców (np. brak poczucia bezpieczeństwa, nadopiekuńczość lub emocjonalne odrzucenie).</li><li>10 potrzeb neurotycznych</li><li>Horney skategoryzowała 10 potrzeb neurotycznych w trzy główne grupy orientacji interpersonalnej:</li></ul>\n<p>Ku ludziom (np. neurotyczna potrzeba uczucia, uznania oraz potrzeba partnera, który przejmie ster życia).</p>\n<p>Od ludzi (np. potrzeba niezależności, samowystarczalności oraz zamykania swojego życia w wąskich granicach).</p>\n<p>Przeciw ludziom (np. potrzeba władzy, prestiżu, podziwiania oraz wykorzystywania innych).</p>\n<ul><li><b>Uwaga kliniczna:</b> Różnica między potrzebą zdrową a neurotyczną ma charakter ilościowy, a nie jakościowy (np. pragnienie uznania staje się pragnieniem absolutnym i destrukcyjnym).</li></ul>"}, {"t": "Synteza syntez: 4 nurty w 4 słowach; behawioryzm", "html": "\n<div class=\"eyebrow\">PSYCHOLOGIA OGÓLNA – Wykład 30.10.2026</div>\n<div class=\"topic\"><span>Temat</span>„Synteza syntez” – cztery nurty psychologii w czterech słowach; psychoanaliza a psychologia humanistyczna; behawioryzm: zachowanie, nagrody i kary, S–R i S–O–R</div>\n<h4><span class=\"num\">1.</span> Synteza syntez – „jak to wiem, to wiem, czym jest psychologia” <span class=\"tag-exam\">zapamiętać do końca życia</span></h4>\n<p>Prowadzący: z jego uwag trzeba zapamiętać <b>4 słowa</b> – po jednym na każdy nurt.</p>\n<div class=\"table-wrap\"><table class=\"nt\"><thead><tr><th>Nurt</th><th>Słowo-klucz</th><th>O co chodzi</th></tr></thead><tbody>\n<tr><td><b>Psychoanaliza</b> (Freud)</td><td><b>nieświadomość</b></td><td>w człowieku działa to, czego nie jest świadomy; patrzy w przeszłość</td></tr>\n<tr><td><b>Behawioryzm</b></td><td><b>zachowanie</b></td><td>liczy się to, co da się zaobserwować i zmierzyć</td></tr>\n<tr><td><b>Psychologia humanistyczna</b></td><td><b>rozum</b></td><td>człowiek się rozwija, ma możliwości – nie trzeba „cofać się do dzieciństwa”</td></tr>\n<tr><td><b>Psychologia poznawcza</b></td><td><b>rozum</b></td><td>procesy poznawcze, myślenie</td></tr>\n</tbody></table></div>\n<p>Przy tej syntezie: <b>Alfred Adler</b>.</p>\n\n<h4><span class=\"num\">2.</span> Psychoanaliza – „Dziecko jest ojcem człowieka dorosłego”</h4>\n<ul>\n<li>Całą psychoanalizę streszcza jedno zdanie: <b>„Dziecko jest ojcem człowieka dorosłego”</b>. Psychoanaliza <b>patrzy w przeszłość</b>.</li>\n<li>Psychoanalityk pyta o mamę, dzieciństwo, przedszkole, szkołę, miejsce urodzenia – i na tej podstawie wyciąga wszystkie wnioski, <b>tak jakby nie było rozwoju</b>.</li>\n<li><b>Krytyka – „Freud się mylił”:</b> według tego myślenia np. <b>Einstein</b> byłby nikim, bo miał nieudane dzieciństwo i ogromne kłopoty w szkole (według prowadzącego oblał maturę i musiał ją poprawiać; na studia ledwo się dostał dzięki wujkowi fizykowi; po studiach pracował na kolei, a obserwując jeżdżące pociągi, doszedł do teorii względności).</li>\n<li>Gdyby nieudane dzieciństwo przekreślało człowieka, nie należałoby przyjmować do seminarium kleryka po trudnym dzieciństwie. A przecież po to jest <b>6–7 lat formacji</b>, żeby człowiek coś z siebie zrobił.</li>\n</ul>\n<h5>Nieświadomość</h5>\n<ul>\n<li>Dla Freuda najważniejsza była <b>nieświadomość</b> – w człowieku pracuje to, czego nie jest świadomy.</li>\n<li>Dowody na nieświadomość: <b>marzenia senne</b> oraz <b>pomyłki</b> (przejęzyczenia) – mówi się, że człowiek mówi prawdę wtedy, gdy się pomyli, bo informacja z nieświadomości „przeszła do góry”.</li>\n<li>Człowiek jest zdeterminowany przez dwa popędy: <b>popęd seksualny</b> (libido) i <b>popęd śmierci</b>. Stąd według Freuda celibat byłby niemożliwy.</li>\n</ul>\n<h5>Psychologia głębi – następcy Freuda</h5>\n<ul>\n<li>Późniejsi analitycy starali się złagodzić Freuda, ale nadal byli <b>psychologami głębi</b> – czerpali z tego, co jest pod świadomością (podświadomość i nieświadomość).</li>\n<li>Jaźń / <b>self</b> (tożsamość, „ja”) to jakby <b>klej</b>, który skleja poszczególne elementy osobowości, takie jak <b>archetypy</b> (np. persona) – powtórka z Junga.</li>\n</ul>\n\n<h4><span class=\"num\">3.</span> Psychologia humanistyczna – rozwój jest możliwy</h4>\n<ul>\n<li>Psychologia humanistyczna mówi: „wyrzućcie te książki” – po co się cofać do dzieciństwa, skoro jest <b>rozum</b> i w życiu można osiągnąć sukces. Człowiek się <b>rozwija</b>, ma możliwości; nie przestaje się rozwijać.</li>\n<li><b>Michał Anioł</b> został architektem bazyliki św. Piotra po siedemdziesiątce, a pracował do 88. roku życia – mógł powiedzieć „jestem za stary”, ale nie powiedział.</li>\n<li>Przykład z <b>Uniwersytetu Trzeciego Wieku</b> (na inaugurację przyszło prawie 300 osób): seniorka, doktor medycyny, zmarła w wieku 107 lat – do końca chciała się uczyć. Ludzie na emeryturze dalej chcą nad sobą pracować.</li>\n<li>Dygresja duszpasterska: Kościół może stracić seniorów – dzisiejsi seniorzy to pokolenie, które często nie chodziło na religię; trzeba o nich zadbać.</li>\n<li>Są też argumenty za wpływem dzieciństwa (np. dzieci, których ojciec pił) – ale margines rozwoju zawsze istnieje.</li>\n</ul>\n\n<h4><span class=\"num\">4.</span> Behawioryzm – słowo-klucz: ZACHOWANIE</h4>\n<ul>\n<li><b>Zachowanie – najważniejsze słowo!</b> Możemy je <b>formować poprzez nagrody i kary</b>, czyli konsekwencje zachowania:\n<ul><li><b>(+)</b> konsekwencje korzystne i pożyteczne (nagrody),</li>\n<li><b>(−)</b> zagrożenie, dezaprobata grupy, porażka, wyrzucenie z seminarium (kary).</li></ul></li>\n<li><b>Twórcy:</b> Watson, Skinner, Thorndike.</li>\n<li><b>Introspekcja odrzucona:</b> my mierzymy, ważymy, obserwujemy – widzę, że kleryk robi notatki, ale nie wiem, co myśli, i nie jestem w stanie nic o tym powiedzieć.</li>\n</ul>\n<h5>Paradygmat bodziec → reakcja</h5>\n<ul>\n<li><b>Bodziec → Reakcja (S → R)</b> – główny paradygmat behawioryzmu: zależność reakcji od bodźców.</li>\n<li>Między nimi jest <b>„pusta skrzynka”</b> – pytanie, co jest w środku: organizm czy osobowość? Rozszerzenie: <b>Bodziec → Osobowość (Organizm) → Reakcja (S–O–R)</b>.</li>\n<li>Jakie to ma znaczenie dla behawiorysty? <b>Nieistotne</b> – tyle co kolor samochodu dla jego jazdy (liczy się silnik).</li>\n</ul>\n<h5>Skinner, Locke i środowisko</h5>\n<ul>\n<li><b>Skinner</b> – teoria uczenia się.</li>\n<li><b>John Locke – tabula rasa</b> (czysta tablica): środowisko zapisuje tę tablicę, wychowuje nas – nie tylko przełożeni i formatorzy.</li>\n<li>Przykład: bliźniacy – jeden wychowany na Manhattanie, drugi w Amazonii – po 20 latach są kompletnie inni. Taką rolę odgrywa środowisko.</li>\n<li>Człowiek jest kształtowany przez środowisko, ale sam też może na nie oddziaływać – <b>sprzężenie zwrotne</b>.</li>\n</ul>\n<h5>Sterowanie pozytywne i negatywne</h5>\n<ul>\n<li><b>Sterowanie negatywne</b> (stosowanie kary) jest <b>mniej efektywne</b> od <b>sterowania pozytywnego</b> (nagradzania).</li>\n<li><b>Negatywne skutki kary:</b>\n<ul>\n<li><b>Generalizacja hamowania</b> – kara tłumi nie tylko zachowania niepożądane, ale też wiele zachowań dobrych, pozytywnych reakcji.</li>\n<li><b>Zaburzenia emocjonalne</b> – reakcje lękowe, unikanie, lęk, agresja.</li>\n<li><b>Unikanie źródła kary</b> – np. nauczyciel daje kary i upokarza, więc nie chcę mieć z nim kontaktu.</li>\n<li><b>Dostarcza negatywnych wzorców karania</b> – gdy rodzice biją dziecko za agresję w szkole, zamyka to dziecko na rodziców i wzmaga niepożądane zachowania.</li>\n</ul></li>\n<li>Powiązanie: <b>fizjologia Iwana Pawłowa</b> (warunkowanie).</li>\n</ul>\n<p class=\"small muted\">Na początku wykładu dygresja (Szwajcaria jako centrum nauki, Mickiewicz piszący o ojczyźnie na emigracji, szybki rozwój sztucznej inteligencji) – bez związku z materiałem egzaminacyjnym.</p>\n"}], "muzyka": [{"t": "Koło kwintowe i klawiatura (7.10.2026)", "html": "<ul><li>Koło kwintowe i znaki przykluczowe</li></ul>\n<h4><span class=\"num\">1.</span> Tonacje z krzyżykami ( ♯) – ruch zgodnie z ruchem wskazówek zegara (kwinty w górę)</h4>\n<ul><li><b>Kolejność dopisywania krzyżyków:</b> fis, cis, gis, dis, ais, eis, his</li><li><b>C-dur</b> – 0 znaków</li><li><b>G-dur</b> – 1♯ → fis</li><li><b>D-dur</b> – 2♯ → fis, cis</li><li><b>A-dur</b> – 3♯ → fis, cis, gis</li><li><b>E-dur</b> – 4♯ → fis, cis, gis, dis</li><li><b>H-dur</b> – 5♯ → fis, cis, gis, dis, ais</li><li><b>Fis-dur</b> – 6♯ → fis, cis, gis, dis, ais, eis</li><li><b>Cis-dur</b> – 7♯ → fis, cis, gis, dis, ais, eis, his</li></ul>\n<h4><span class=\"num\">2.</span> Tonacje z bemolami ( ♭) – ruch przeciwnie do wskazówek zegara (kwinty w dół / kwarty w górę)</h4>\n<ul><li><b>Kolejność dopisywania bemoli (odwrotność krzyżyków):</b> b, es, as, des, ges, ces, fes</li><li><b>F-dur</b> – 1♭ → b</li><li><b>B-dur</b> – 2♭ → b, es</li><li><b>Es-dur</b> – 3♭ → b, es, as</li><li><b>As-dur</b> – 4♭ → b, es, as, des</li><li><b>Des-dur</b> – 5♭ → b, es, as, des, ges</li><li><b>Ges-dur</b> – 6♭ → b, es, as, des, ges, ces</li><li><b>Ces-dur</b> – 7♭ → b, es, as, des, ges, ces, fes</li></ul>\n<h4><span class=\"num\">3.</span> Klawiatura fortepianowa (oktawa: C–D–E–F–G–A–H)</h4>\n<ul><li><b>Białe klawisze:</b> C, D, E, F, G, A, H</li></ul>\n<h5>Czarne klawisze</h5>\n<ul><li><b>Układ podwójny (2 klawisze):</b> Cis / Des, Dis / Es</li><li><b>Układ potrójny (3 klawisze):</b> Fis / Ges, Gis / As, Ais / B</li><li><b>Półtony naturalne (brak czarnego klawisza pomiędzy):</b> E – F oraz H – C</li></ul>"}], "wloski": [{"t": "Zajęcia – stany, czasowniki -are, słownictwo codzienne", "html": "<div class=\"eyebrow\">JĘZYK WŁOSKI – Notatka z zajęć: Stany fizyczne/emocjonalne, Czasowniki i Słownictwo codzienne</div>\n<h4><span class=\"num\">1.</span> Wyrażanie stanów i samopoczucia (Essere i Avere)</h4>\n<ul><li>W języku włoskim część stanów wyrażamy czasownikiem essere (być), a część czasownikiem avere (mieć):</li></ul>\n<h5>Z essere (być + przymiotnik)</h5>\n<ul><li><b>essere stanchi</b> – być zmęczonym essere tristi – być smutnym</li><li><b>essere felici</b> – być szczęśliwym essere arrabbiati – być zły / wściekłym</li><li><b>essere contento</b> – zadowolony</li></ul>\n<h5>Z avere (mieć + rzeczownik)</h5>\n<ul><li><b>avere freddo</b> – odczuwać zimno (być zimno)</li><li><b>avere caldo</b> – odczuwać ciepło (być ciepło)</li><li><b>avere fame</b> – być głodnym (mieć głód)</li><li><b>avere sete</b> – być spragnionym (mieć pragnienie)</li></ul>\n<h4><span class=\"num\">2.</span> Odmiana czasowników regularnych na -are (np. lavorare – pracować)</h4>\n<h5>Na zajęciach powtarzano odmianę czasowników w czasie teraźniejszym (presente indicativo)</h5>\n<p>Osoba Końcówka Przykład (lavorare)</p>\n<p>io (ja) -o lavoro (pracuję)</p>\n<p>tu (ty) -i lavori (pracujesz)</p>\n<ul><li>lui / lei / Lei (on / ona / Pan, Pani) -a</li></ul>\n<p>lavora (pracuje)</p>\n<p>noi (my) -iamo lavoriamo (pracujemy)</p>\n<p>voi (wy) -ate lavorate (pracujecie)</p>\n<p>loro (oni / one) -ano lavorano (pracują)</p>\n<ul><li><b>Inne przydatne czasowniki:</b> finire (kończyć), parlare (rozmawiać), comprare (kupować).</li></ul>\n<h4><span class=\"num\">3.</span> Przydatne słownictwo i zwroty z dialogu (Pierwszy dzień w pracy)</h4>\n<ul><li><b>allora</b> – więc / zatem come stai? – jak się masz?</li><li><b>molto</b> – bardzo casa mia – mój dom / mój dom rodzinny</li><li><b>buongiorno</b> – dzień dobry pronto – słucham (przy odbiorze telefonu)</li><li><b>domani</b> – jutro oggi – dzisiaj dove – gdzie</li><li><b>un amico di lavoro</b> – kolega z pracy una collega – koleżanka z pracy</li></ul>\n<h4><span class=\"num\">4.</span> Przydatne konstrukcje do autoprezentacji</h4>\n<ul><li><b>Imię:</b> Mi chiamo Kacper / Sono Kacper</li><li><b>Pochodzenie / Narodowość:</b> Sono di Cieszyn / Sono polacco</li><li><b>Studia:</b> Studio teologia / filosofia / psicologia</li></ul>\n<p>Przykładowy typowy odpowiednik „Jana Kowalskiego” we Włoszech: Mario Rossi.</p>"}, {"t": "Zajęcia (z wcześniejszego opisu) – avere, liczby 20–30, przedstawianie się, czasowniki -are", "html": "\n<div class=\"eyebrow\">JĘZYK WŁOSKI – opis zajęć</div>\n<ul>\n<li>Czasownik <b>avere</b> (mieć) – odmiana i zwroty (avere fame, sete, freddo, caldo).</li>\n<li>Liczby <b>20–30</b> (venti, ventuno, ventidue … trenta) – patrz zakładka „Liczebniki”.</li>\n<li><b>Przedstawianie się</b>: Mi chiamo…, Sono di…, Sono polacco, Studio teologia…</li>\n<li>Dialog z podręcznika (w gazecie / pierwszy dzień w pracy – Gianna).</li>\n<li>Czasowniki regularne na <b>-are</b> (lavorare, parlare, comprare) – patrz „Gramatyka”.</li>\n</ul>\n"}, {"t": "Kolokwium 3.11.2026 – zakres, skrypt powtórkowy i materiały z zajęć", "html": "<div class=\"eyebrow\">JĘZYK WŁOSKI – kolokwium 3.11.2026: zakres, skrypt powtórkowy i materiały z zajęć</div>\n<div class=\"topic\"><span>Zakres</span>Cała <i>Unità introduttiva</i> (strony 5–14) + materiał z zadań domowych + materiał realizowany na zajęciach</div>\n<h4><span class=\"num\">1.</span> Zakres testu</h4>\n<ul>\n<li>alfabet, literowanie, zasady wymowy</li>\n<li>liczebniki główne od 0 do 30</li>\n<li>zdania twierdzące, przeczące i pytające</li>\n<li>podstawowe formuły powitania (Ciao, Buongiorno, Buonasera, Salve, Come stai?)</li>\n<li>przedstawianie się i przedstawianie kogoś (imię, narodowość, wiek)</li>\n<li>zaimki podmiotu (io, tu, lui, lei, Lei, noi, voi, loro)</li>\n<li>przymiotniki i rzeczowniki w l. poj. i mnogiej, podstawowe reguły zgodności rzeczownika z przymiotnikiem</li>\n<li>odmiana czasowników <b>essere</b>, <b>avere</b> i <b>chiamarsi</b> w czasie teraźniejszym trybu oznajmującego (presente indicativo)</li>\n<li>rodzajniki określone w l. poj. i mn.</li>\n</ul>\n\n<h4><span class=\"num\">2.</span> Wprowadzenie i fonetyka (Unità Introduttiva, str.\n5–14)</h4>\n<h5>Alfabet i literowanie (Lo spelling)</h5>\n<p>Włoski alfabet składa się z <strong>21 liter podstawowych</strong>\noraz <strong>5 liter obcych</strong> (używanych głównie w wyrazach\nzapożyczonych z innych języków):</p>\n<ul>\n<li><strong>Litery podstawowe:</strong> A (a), B (bi), C (ci), D\n(di), E (e), F (effe), G (gi), H (acca), I (i), L (elle), M (emme), N\n(enne), O (o), P (pi), Q (cu), R (erre), S (esse), T (ti), U (u), V\n(vu), Z (zeta).</li>\n<li><strong>Litery obce / znaki specjalne:</strong> J (i lunga), K\n(cappa), W (doppia vu), X (ics), Y (ipsilon / i greca).</li>\n</ul>\n<h5>Zasady wymowy (Regole di pronuncia)</h5>\n<p>Prawidłowa wymowa we włoskim zależy od połączeń samogłosek i\nspółgłosek. Oto kluczowe reguły fonetyczne:</p>\n<div class=\"table-wrap\"><table class=\"nt\">\n<thead>\n<tr>\n<th><strong>Głoska / Połączenie</strong></th>\n<th><strong>Wymowa [PL]</strong></th>\n<th><strong>Przykłady z wymową</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>c + i</strong></td>\n<td>[cz]</td>\n<td>cappuccino, ciao, cinema</td>\n</tr>\n<tr>\n<td><strong>c + e</strong></td>\n<td>[cze]</td>\n<td>Versace, cena, cellulare</td>\n</tr>\n<tr>\n<td><strong>ch + i / e</strong></td>\n<td>[k]</td>\n<td>espresso macchiato, chiave, perché</td>\n</tr>\n<tr>\n<td><strong>g + i</strong></td>\n<td>[dż]</td>\n<td>Caravaggio, giardino, giorno</td>\n</tr>\n<tr>\n<td><strong>g + e</strong></td>\n<td>[dże]</td>\n<td>gelato, gente</td>\n</tr>\n<tr>\n<td><strong>gh + i / e</strong></td>\n<td>[g]</td>\n<td>spaghetti, Margherita, colleghi</td>\n</tr>\n<tr>\n<td><strong>sc + i</strong></td>\n<td>[sz]</td>\n<td>prosciutto, scivoli</td>\n</tr>\n<tr>\n<td><strong>sc + e</strong></td>\n<td>[sze]</td>\n<td>scena, scendere</td>\n</tr>\n<tr>\n<td><strong>gn</strong></td>\n<td>[ń]</td>\n<td>lasagne, insegnante, spagnolo, lavagna</td>\n</tr>\n<tr>\n<td><strong>gl</strong></td>\n<td>[gl]</td>\n<td>glossario, inglese</td>\n</tr>\n<tr>\n<td><strong>gli</strong></td>\n<td>[li] – miękkie, jak „lj”</td>\n<td>tagliatelle, figlio, famiglia, bottiglia</td>\n</tr>\n<tr>\n<td><strong>s (między samogłoskami)</strong></td>\n<td>[z]</td>\n<td>Pisa, casa, musica, rosa</td>\n</tr>\n<tr>\n<td><strong>z / zz</strong></td>\n<td>[c / dz / cc]</td>\n<td>zero, zaino, azione, canzone, pizza, mezzo</td>\n</tr>\n</tbody>\n</table></div>\n<h4><span class=\"num\">3.</span> Słownictwo i codzienna komunikacja</h4>\n<h5>Podstawowe formuły powitania i zwroty\ngrzecznościowe</h5>\n<div class=\"table-wrap\"><table class=\"nt\">\n<thead>\n<tr>\n<th><strong>Zwrot włoski</strong></th>\n<th><strong>Tłumaczenie polskie</strong></th>\n<th><strong>Kontekst i sposób użycia</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Ciao!</strong></td>\n<td>Cześć! / Pa!</td>\n<td>Nieformalne (na powitanie i pożegnanie)</td>\n</tr>\n<tr>\n<td><strong>Buongiorno!</strong></td>\n<td>Dzień dobry!</td>\n<td>Formalne i nieformalne (rano / do popołudnia)</td>\n</tr>\n<tr>\n<td><strong>Buon pomeriggio!</strong></td>\n<td>Dzień dobry!</td>\n<td>Formalne i nieformalne (po południu)</td>\n</tr>\n<tr>\n<td><strong>Buonasera!</strong></td>\n<td>Dobry wieczór!</td>\n<td>Formalne i nieformalne (wieczorem)</td>\n</tr>\n<tr>\n<td><strong>Salve!</strong></td>\n<td>Witaj! / Cześć!</td>\n<td>Uniwersalne / półformalne</td>\n</tr>\n<tr>\n<td><strong>Piacere!</strong></td>\n<td>Miło mi!</td>\n<td>Używane przy przedstawianiu się</td>\n</tr>\n<tr>\n<td><strong>Come stai?</strong></td>\n<td>Jak się masz?</td>\n<td>Nieformalne pytanie o samopoczucie</td>\n</tr>\n<tr>\n<td><strong>Come sta?</strong></td>\n<td>Jak się Pan/Pani miewa?</td>\n<td>Formalne pytanie o samopoczucie</td>\n</tr>\n<tr>\n<td><strong>Arrivederci!</strong></td>\n<td>Do widzenia!</td>\n<td>Pożegnanie formalne i półformalne</td>\n</tr>\n<tr>\n<td><strong>A presto!</strong></td>\n<td>Do zobaczenia wkrótce!</td>\n<td>Pożegnanie nieformalne</td>\n</tr>\n<tr>\n<td><strong>A dopo!</strong></td>\n<td>Do zobaczenia później!</td>\n<td>Pożegnanie nieformalne</td>\n</tr>\n<tr>\n<td><strong>Buona giornata!</strong></td>\n<td>Miłego dnia!</td>\n<td>Życzenie przy pożegnaniu</td>\n</tr>\n<tr>\n<td><strong>Buona serata!</strong></td>\n<td>Miłego wieczoru!</td>\n<td>Życzenie przy pożegnaniu</td>\n</tr>\n<tr>\n<td><strong>Alla prossima!</strong></td>\n<td>Do następnego razu!</td>\n<td>Pożegnanie</td>\n</tr>\n</tbody>\n</table></div>\n<p>Odpowiedzi na pytanie <strong>Come stai?</strong> (Jak się\nmasz?):</p>\n<ul>\n<li><strong>Bene, grazie.</strong> – Dobrze, dziękuję.</li>\n<li><strong>Così, così.</strong> – Tak sobie.</li>\n<li><strong>Male.</strong> – Źle.</li>\n</ul>\n<h5>Przedstawianie siebie oraz innych osób</h5>\n<h5>Autopresentazione (Przedstawianie siebie)</h5>\n<ul>\n<li><strong>Mi chiamo...</strong> – Nazywam się...</li>\n<li><strong>Sono polacco / polacca.</strong> – Jestem Polakiem /\nPolką. (narodowości z zajęć: ucraino/a, bielorusso/a, americano/a,\naustraliano/a, spagnolo/a, brasiliano/a, marocchino/a, italiano/a,\nargentino/a, tedesco/a, svizzero/a, inglese)</li>\n<li><strong>Sono di Cracovia.</strong> – Jestem z Krakowa. (Wzór:\nSono di + miasto)</li>\n<li><strong>Studio psicologia / teologia / giornalismo...</strong> –\nStudiuję psychologię / teologię / dziennikarstwo...</li>\n<li><strong>Ho ... anni.</strong> – Mam ... lat.</li>\n<li><strong>Il mio numero di telefono è...</strong> – Mój numer\ntelefonu to...</li>\n</ul>\n<h5>Presentare qualcuno (Przedstawianie innej\nosoby)</h5>\n<ul>\n<li><strong>Questo è... [r. męski]</strong> – To jest... (np. Questo\nè Paolo.)</li>\n<li><strong>Questa è... [r. żeński]</strong> – To jest... (np. Questa\nè Maria.)</li>\n<li><strong>Lui / Lei si chiama...</strong> – On / Ona nazywa\nsię...</li>\n<li><strong>Lui / Lei è polacco / polacca.</strong> – On / Ona jest\nPolakiem / Polką.</li>\n<li><strong>Lui / Lei ha ... anni.</strong> – On / Ona ma ...\nlat.</li>\n</ul>\n<h5>Liczebniki główne od 0 do 30 (I numeri da 0 a\n30)</h5>\n<div class=\"table-wrap\"><table class=\"nt\">\n<thead>\n<tr>\n<th><strong>Liczba</strong></th>\n<th><strong>Włoski</strong></th>\n<th><strong>Liczba</strong></th>\n<th><strong>Włoski</strong></th>\n<th><strong>Liczba</strong></th>\n<th><strong>Włoski</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>0</strong></td>\n<td>zero</td>\n<td><strong>11</strong></td>\n<td>undici</td>\n<td><strong>21</strong></td>\n<td>ventuno</td>\n</tr>\n<tr>\n<td><strong>1</strong></td>\n<td>uno</td>\n<td><strong>12</strong></td>\n<td>dodici</td>\n<td><strong>22</strong></td>\n<td>ventidue</td>\n</tr>\n<tr>\n<td><strong>2</strong></td>\n<td>due</td>\n<td><strong>13</strong></td>\n<td>tredici</td>\n<td><strong>23</strong></td>\n<td>ventitré</td>\n</tr>\n<tr>\n<td><strong>3</strong></td>\n<td>tre</td>\n<td><strong>14</strong></td>\n<td>quattordici</td>\n<td><strong>24</strong></td>\n<td>ventiquattro</td>\n</tr>\n<tr>\n<td><strong>4</strong></td>\n<td>quattro</td>\n<td><strong>15</strong></td>\n<td>quindici</td>\n<td><strong>25</strong></td>\n<td>venticinque</td>\n</tr>\n<tr>\n<td><strong>5</strong></td>\n<td>cinque</td>\n<td><strong>16</strong></td>\n<td>sedici</td>\n<td><strong>26</strong></td>\n<td>ventisei</td>\n</tr>\n<tr>\n<td><strong>6</strong></td>\n<td>sei</td>\n<td><strong>17</strong></td>\n<td>diciassette</td>\n<td><strong>27</strong></td>\n<td>ventisette</td>\n</tr>\n<tr>\n<td><strong>7</strong></td>\n<td>sette</td>\n<td><strong>18</strong></td>\n<td>diciotto</td>\n<td><strong>28</strong></td>\n<td>ventotto</td>\n</tr>\n<tr>\n<td><strong>8</strong></td>\n<td>otto</td>\n<td><strong>19</strong></td>\n<td>diciannove</td>\n<td><strong>29</strong></td>\n<td>ventinove</td>\n</tr>\n<tr>\n<td><strong>9</strong></td>\n<td>nove</td>\n<td><strong>20</strong></td>\n<td>venti</td>\n<td><strong>30</strong></td>\n<td>trenta</td>\n</tr>\n<tr>\n<td><strong>10</strong></td>\n<td>dieci</td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Działania matematyczne (Operazioni matematiche):</strong> +\npiù (plus) | - meno (minus) | = uguale (równa się) | : diviso (podzielić\nprzez)</p>\n<div class=\"table-wrap\"><table class=\"nt\">\n<tbody>\n<tr>\n<td><strong>Przykłady pytań z liczebnikami:<br />\n</strong>• Qual è il tuo numero di telefono? – Jaki jest Twój numer\ntelefonu?<br />\nOdpowiedź: Il mio numero di telefono è zero-sei-otto...<br />\n• Quanti anni hai? – Ile masz lat?<br />\nOdpowiedź: Ho venti anni. (Mam 20 lat.)</td>\n</tr>\n</tbody>\n</table></div>\n<h4><span class=\"num\">4.</span> Gramatyka języka włoskiego</h4>\n<h5>Zaimki osobowe podmiotu (Pronomi personali\nsoggetto)</h5>\n<div class=\"table-wrap\"><table class=\"nt\">\n<thead>\n<tr>\n<th><strong>Zaimek włoski</strong></th>\n<th><strong>Znaczenie polskie</strong></th>\n<th><strong>Liczba (Numero)</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>io</strong></td>\n<td>ja</td>\n<td>pojedyncza (singolare)</td>\n</tr>\n<tr>\n<td><strong>tu</strong></td>\n<td>ty</td>\n<td>pojedyncza (singolare)</td>\n</tr>\n<tr>\n<td><strong>lui</strong></td>\n<td>on</td>\n<td>pojedyncza (singolare)</td>\n</tr>\n<tr>\n<td><strong>lei</strong></td>\n<td>ona</td>\n<td>pojedyncza (singolare)</td>\n</tr>\n<tr>\n<td><strong>Lei</strong></td>\n<td>Pan / Pani (forma grzecznościowa)</td>\n<td>pojedyncza (singolare)</td>\n</tr>\n<tr>\n<td><strong>noi</strong></td>\n<td>my</td>\n<td>mnoga (plurale)</td>\n</tr>\n<tr>\n<td><strong>voi</strong></td>\n<td>wy</td>\n<td>mnoga (plurale)</td>\n</tr>\n<tr>\n<td><strong>loro</strong></td>\n<td>oni / one</td>\n<td>mnoga (plurale)</td>\n</tr>\n</tbody>\n</table></div>\n<h5>Budowa zdań: twierdzące, przeczące i pytające</h5>\n<p>W języku włoskim przeczenie tworzymy stawiając partykułę\n<strong>non</strong> bezpośrednio przed czasownikiem. Oto schemat budowy\nzdań:</p>\n<ul>\n<li><strong>Zdanie twierdzące (Frase affermativa):</strong> Tu sei\nstanca. (Jesteś zmęczona.)</li>\n<li><strong>Zdanie przeczące (Frase negativa):</strong> Tu non sei\nstanca. (Nie jesteś zmęczona.)</li>\n<li><strong>Zdanie pytające (Frase interrogativa):</strong> Sei\nstanca? (Czy jesteś zmęczona?) [tworzone intonacją]</li>\n<li><strong>Odpowiedzi (Risposte):</strong> Sì, sono stanca. (Tak,\njestem zmęczona.) / No, non sono stanca. (Nie, nie jestem\nzmęczona.)</li>\n</ul>\n<h5>Odmiana czasowników w presente indicativo</h5>\n<h5>Czasownik posiłkowy 1 – essere (być)</h5>\n<div class=\"table-wrap\"><table class=\"nt\">\n<thead>\n<tr>\n<th><strong>Zaimek</strong></th>\n<th><strong>Forma czasownika</strong></th>\n<th><strong>Przykład zdania z tłumaczeniem</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>io</strong></td>\n<td><strong>sono</strong></td>\n<td>Io sono polacco. (Ja jestem Polakiem.)</td>\n</tr>\n<tr>\n<td><strong>tu</strong></td>\n<td><strong>sei</strong></td>\n<td>Di dove sei? (Skąd jesteś?)</td>\n</tr>\n<tr>\n<td><strong>lui / lei / Lei</strong></td>\n<td><strong>è</strong></td>\n<td>Lei è stanca. (Ona jest zmęczona.)</td>\n</tr>\n<tr>\n<td><strong>noi</strong></td>\n<td><strong>siamo</strong></td>\n<td>Noi siamo studenti. (My jesteśmy studentami.)</td>\n</tr>\n<tr>\n<td><strong>voi</strong></td>\n<td><strong>siete</strong></td>\n<td>Voi siete italiani? (Wy jesteście Włochami?)</td>\n</tr>\n<tr>\n<td><strong>loro</strong></td>\n<td><strong>sono</strong></td>\n<td>Loro sono brasiliani. (Oni są Brazylijczykami.)</td>\n</tr>\n</tbody>\n</table></div>\n<h5>Czasownik posiłkowy 2 – avere (mieć)</h5>\n<div class=\"table-wrap\"><table class=\"nt\">\n<thead>\n<tr>\n<th><strong>Zaimek</strong></th>\n<th><strong>Forma czasownika</strong></th>\n<th><strong>Przykład zdania z tłumaczeniem</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>io</strong></td>\n<td><strong>ho</strong></td>\n<td>Ho venti anni. (Mam 20 lat.)</td>\n</tr>\n<tr>\n<td><strong>tu</strong></td>\n<td><strong>hai</strong></td>\n<td>Quanti anni hai? (Ile masz lat?)</td>\n</tr>\n<tr>\n<td><strong>lui / lei / Lei</strong></td>\n<td><strong>ha</strong></td>\n<td>Lui ha ventidue anni. (On ma 22 lata.)</td>\n</tr>\n<tr>\n<td><strong>noi</strong></td>\n<td><strong>abbiamo</strong></td>\n<td>Noi abbiamo fame. (Jesteśmy głodni.)</td>\n</tr>\n<tr>\n<td><strong>voi</strong></td>\n<td><strong>avete</strong></td>\n<td>Voi avete freddo? (Czy jest wam zimno?)</td>\n</tr>\n<tr>\n<td><strong>loro</strong></td>\n<td><strong>hanno</strong></td>\n<td>Loro hanno molti amici. (Oni mają wielu przyjaciół.)</td>\n</tr>\n</tbody>\n</table></div>\n<h5>Czasownik zwrotny – chiamarsi (nazywać się)</h5>\n<div class=\"table-wrap\"><table class=\"nt\">\n<thead>\n<tr>\n<th><strong>Zaimek</strong></th>\n<th><strong>Forma czasownika</strong></th>\n<th><strong>Przykład zdania z tłumaczeniem</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>io</strong></td>\n<td><strong>mi chiamo</strong></td>\n<td>Mi chiamo Marco. (Nazywam się Marco.)</td>\n</tr>\n<tr>\n<td><strong>tu</strong></td>\n<td><strong>ti chiami</strong></td>\n<td>Come ti chiami? (Jak się nazywasz?)</td>\n</tr>\n<tr>\n<td><strong>lui / lei / Lei</strong></td>\n<td><strong>si chiama</strong></td>\n<td>Lei si chiama Maria. (Ona nazywa się Maria.)</td>\n</tr>\n<tr>\n<td><strong>noi</strong></td>\n<td><strong>ci chiamiamo</strong></td>\n<td>Noi ci chiamiamo Rossi. (Nazywamy się Rossi.)</td>\n</tr>\n<tr>\n<td><strong>voi</strong></td>\n<td><strong>vi chiamate</strong></td>\n<td>Come vi chiamate? (Jak się nazywacie?)</td>\n</tr>\n<tr>\n<td><strong>loro</strong></td>\n<td><strong>si chiamano</strong></td>\n<td>Loro si chiamano Anna e Paolo. (Oni nazywają się Anna i Paolo.)</td>\n</tr>\n</tbody>\n</table></div>\n<h5>Wzór odmiany czasowników regularnych I koniugacji (-are) na\nprzykładzie lavorare (pracować)</h5>\n<p><strong>•</strong> io <strong>lavor-o</strong> | tu\n<strong>lavor-i</strong> | lui/lei/Lei <strong>lavor-a</strong> | noi\n<strong>lavor-iamo</strong> | voi <strong>lavor-ate</strong> | loro\n<strong>lavor-ano</strong></p>\n<div class=\"table-wrap\"><table class=\"nt\">\n<tbody>\n<tr>\n<td><strong>Kluczowe wyrażenia z essere oraz avere (Ważne zagadnienie na\nkolokwium!):<br />\n</strong>• Essere + przymiotnik (zgodność rodzaju i liczby):<br />\n- essere stanco/a/i/e (być zmęczonym)<br />\n- essere triste/i (być smutnym)<br />\n- essere felice/i (być szczęśliwym)<br />\n- essere arrabbiato/a/i/e (być złym, wściekłym)<br />\n<br />\n• Avere + rzeczownik (forma rzeczownika NIEODMIENNA!):<br />\n- avere freddo (odczuwać zimno)<br />\n- avere caldo (odczuwać gorąco)<br />\n- avere fame (być głodnym)<br />\n- avere sete (chcieć pić)</td>\n</tr>\n</tbody>\n</table></div>\n<h5>Rzeczowniki i przymiotniki: rodzaj, liczba oraz reguły\nzgodności</h5>\n<h5>Reguły tworzenia liczby mnogiej (Singolare →\nPlurale)</h5>\n<ul>\n<li><strong>Rodzaj męski (Maschile):</strong> Końcówka -o → -i\n(ragazzo → ragazzi, libro → libri, treno → treni) oraz -e → -i (studente\n→ studenti, pesce → pesci).</li>\n<li><strong>Rodzaj żeński (Femminile):</strong> Końcówka -a → -e\n(ragazza → ragazze, casa → case, finestra → finestre) oraz -e → -i\n(chiave → chiavi, notte → notti, lezione → lezioni).</li>\n</ul>\n<h5>Rzeczowniki szczególne / nieodmienne</h5>\n<ul>\n<li><strong>Nieodmienne (akcent na ostatnią samogłoskę lub\nspółgłoskę):</strong> la città → le città, il caffè → i caffè, il bar →\ni bar, lo sport → gli sport.</li>\n<li><strong>Rzeczowniki na -ema (rodzaju męskiego):</strong> il\nproblema → i problemi.</li>\n<li><strong>Oboczności fonetyczne (zachowanie brzmienia):</strong>\nl'amico → gli amici, l'amica → le amiche, la chitarra → le\nchitarre.</li>\n</ul>\n<h5>Zgodność rzeczownika z przymiotnikiem\n(Concordanza)</h5>\n<p>Przymiotnik w języku włoskim zawsze dopasowuje się do rzeczownika pod\nwzględem rodzaju i liczby:</p>\n<ul>\n<li><strong>ragazzo italiano</strong> → ragazzi italiani</li>\n<li><strong>ragazza italiana</strong> → ragazze italiane</li>\n<li><strong>casa nuova</strong> → case nuove</li>\n<li><strong>borsa rossa</strong> → borse rosse</li>\n<li><strong>Federica è bella.</strong> → Federica e Gabriella sono\nbelle.</li>\n</ul>\n<h5>Podstawowe pary przymiotników przeciwstawnych</h5>\n<ul>\n<li><strong>alto (wysoki)</strong> ↔︎ basso (niski)</li>\n<li><strong>nuovo (nowy)</strong> ↔︎ vecchio (stary)</li>\n<li><strong>aperto (otwarty)</strong> ↔︎ chiuso (zamknięty)</li>\n<li><strong>bello (ładny)</strong> ↔︎ brutto (brzydki)</li>\n<li><strong>piccolo (mały)</strong> ↔︎ grande (duży)</li>\n<li><strong>moderno (nowoczesny)</strong> ↔︎ antico (starożytny /\nzabytkowy)</li>\n<li><strong>giovane (młody)</strong> ↔︎ anziano (stary / w starszym\nwieku)</li>\n</ul>\n<h5>Rodzajniki określone (Articoli determinativi)</h5>\n<div class=\"table-wrap\"><table class=\"nt\">\n<thead>\n<tr>\n<th><strong>Rodzaj</strong></th>\n<th><strong>L. poj. (Sing.)</strong></th>\n<th><strong>L. mn. (Plur.)</strong></th>\n<th><strong>Reguła stosowania</strong></th>\n<th><strong>Przykłady</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Maschile (Męski)</td>\n<td><strong>il</strong></td>\n<td><strong>i</strong></td>\n<td>Przed większością spółgłosek</td>\n<td>il ragazzo → i ragazzi<br />\nil gatto → i gatti</td>\n</tr>\n<tr>\n<td>Maschile (Męski)</td>\n<td><strong>lo</strong></td>\n<td><strong>gli</strong></td>\n<td>Przed s + spółgłoska, z, gn, ps, x, y</td>\n<td>lo zaino → gli zaini<br />\nlo studente → gli studenti</td>\n</tr>\n<tr>\n<td>Maschile (Męski)</td>\n<td><strong>l'</strong></td>\n<td><strong>gli</strong></td>\n<td>Przed samogłoską</td>\n<td>l'amico → gli amici<br />\nl'aereo → gli aerei</td>\n</tr>\n<tr>\n<td>Femminile (Żeński)</td>\n<td><strong>la</strong></td>\n<td><strong>le</strong></td>\n<td>Przed spółgłoską</td>\n<td>la ragazza → le ragazze<br />\nla casa → le case</td>\n</tr>\n<tr>\n<td>Femminile (Żeński)</td>\n<td><strong>l'</strong></td>\n<td><strong>le</strong></td>\n<td>Przed samogłoską</td>\n<td>l'amica → le amiche<br />\nl'isola → le isole</td>\n</tr>\n</tbody>\n</table></div>\n<h4><span class=\"num\">5.</span> Słowniczek tematyczny (Leksyka z Unità\nIntroduttiva)</h4>\n<h5>Rzeczowniki (Sostantivi)</h5>\n<div class=\"table-wrap\"><table class=\"nt\">\n<thead>\n<tr>\n<th><strong>Słowo włoskie</strong></th>\n<th><strong>Tłumaczenie PL</strong></th>\n<th><strong>Słowo włoskie</strong></th>\n<th><strong>Tłumaczenie PL</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>il libro</strong></td>\n<td>książka</td>\n<td><strong>lo zaino</strong></td>\n<td>plecak</td>\n</tr>\n<tr>\n<td><strong>il quaderno</strong></td>\n<td>zeszyt</td>\n<td><strong>lo stivale</strong></td>\n<td>but z wysoką cholewką / kozak</td>\n</tr>\n<tr>\n<td><strong>la penna</strong></td>\n<td>długopis</td>\n<td><strong>l'albero</strong></td>\n<td>drzewo</td>\n</tr>\n<tr>\n<td><strong>la borsa</strong></td>\n<td>torba</td>\n<td><strong>l'isola</strong></td>\n<td>wyspa</td>\n</tr>\n<tr>\n<td><strong>la bottiglia</strong></td>\n<td>butelka</td>\n<td><strong>la casa</strong></td>\n<td>dom</td>\n</tr>\n<tr>\n<td><strong>il cellulare</strong></td>\n<td>telefon komórkowy</td>\n<td><strong>il ristorante</strong></td>\n<td>restauracja</td>\n</tr>\n<tr>\n<td><strong>il caricatore</strong></td>\n<td>ładowarka</td>\n<td><strong>il museo</strong></td>\n<td>muzeum</td>\n</tr>\n<tr>\n<td><strong>la porta</strong></td>\n<td>drzwi</td>\n<td><strong>la piazza</strong></td>\n<td>plac</td>\n</tr>\n<tr>\n<td><strong>la finestra</strong></td>\n<td>okno</td>\n<td><strong>la lingua</strong></td>\n<td>język</td>\n</tr>\n<tr>\n<td><strong>la chiave (r. żeński)</strong></td>\n<td>klucz</td>\n<td><strong>il calcio</strong></td>\n<td>piłka nożna</td>\n</tr>\n<tr>\n<td><strong>la frase (r. żeński)</strong></td>\n<td>zdanie</td>\n<td><strong>la musica</strong></td>\n<td>muzyka</td>\n</tr>\n<tr>\n<td><strong>la lezione</strong></td>\n<td>lekcja</td>\n<td><strong>l'arte</strong></td>\n<td>sztuka</td>\n</tr>\n<tr>\n<td><strong>lo studente / la studentessa</strong></td>\n<td>student / studentka</td>\n<td><strong>la moda</strong></td>\n<td>moda</td>\n</tr>\n<tr>\n<td><strong>l'insegnante</strong></td>\n<td>nauczyciel / nauczycielka</td>\n<td><strong>il gelato</strong></td>\n<td>lody</td>\n</tr>\n<tr>\n<td><strong>il ragazzo / la ragazza</strong></td>\n<td>chłopiec / dziewczyna</td>\n<td><strong>il cappuccino</strong></td>\n<td>cappuccino</td>\n</tr>\n<tr>\n<td><strong>il gatto</strong></td>\n<td>kot</td>\n<td><strong>l'espresso</strong></td>\n<td>kawa espresso</td>\n</tr>\n<tr>\n<td><strong>il pesce</strong></td>\n<td>ryba</td>\n<td><strong>gli spaghetti</strong></td>\n<td>spaghetti</td>\n</tr>\n<tr>\n<td><strong>il treno</strong></td>\n<td>pociąg</td>\n<td><strong>il prosciutto</strong></td>\n<td>szynka</td>\n</tr>\n<tr>\n<td><strong>la macchina</strong></td>\n<td>samochód</td>\n<td><strong>il parmigiano</strong></td>\n<td>parmezan</td>\n</tr>\n<tr>\n<td><strong>l'autobus</strong></td>\n<td>autobus</td>\n<td><strong>lo zucchero</strong></td>\n<td>cukier</td>\n</tr>\n<tr>\n<td><strong>l'aereo</strong></td>\n<td>samolot</td>\n<td></td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<h5>Zaimki pytajne (Interrogativi)</h5>\n<ul>\n<li><strong>Come?</strong> – Jak? (np. Come ti chiami? – Jak masz na\nimię?)</li>\n<li><strong>Di dove?</strong> – Skąd? (np. Di dove sei? – Skąd\njesteś?)</li>\n<li><strong>Che cosa? / Che?</strong> – Co? (np. Che cosa studi? – Co\nstudiujesz?)</li>\n<li><strong>Chi?</strong> – Kto?</li>\n<li><strong>Quanto / quanta / quanti / quante?</strong> – Ile / ilu?\n(np. Quanti anni hai? – Ile masz lat?)</li>\n<li><strong>Qual è...?</strong> – Jaki / Jaka jest...? (np. Qual è il\ntuo numero di telefono?)</li>\n</ul>\n\n<h4><span class=\"num\">6.</span> Z zajęć – ćwiczenia ze slajdów</h4>\n<h5>Che cosa vedi? + articoli</h5>\n<p>Opis obrazków z rodzajnikiem: <i>la macchina, il ragazzo, la studentessa, l'ufficio, il pallone…</i></p>\n<h5>Di dov'è questa targa?</h5>\n<ul>\n<li>BO 4782J – IT · WA 79B32 – PL · AR 7361M – E · KR 28A35 – PL · MI 2693F – IT · BWH 5234 – D</li>\n<li>Odpowiedź: <b>Questa targa è italiana / polacca / spagnola / tedesca / francese…</b></li>\n</ul>\n<h5>Pytania do rozmowy</h5>\n<ul><li>Come ti chiami? · Di dove sei? · Quanti anni hai? · Che cosa studi?</li></ul>\n\n<h4><span class=\"num\">7.</span> Zadanie domowe</h4>\n<ul><li><b>A casa:</b> Esercizi 10–14, p. 8–10.</li></ul>\n<h4><span class=\"num\">8.</span> Materiali extra per praticare</h4>\n<ul>\n<li><b>Ćwiczenia z zajęć:</b> <a href=\"https://learningapps.org/display?v=p8effiptt26\" target=\"_blank\" rel=\"noopener\">LearningApps</a> · <a href=\"https://wordwall.net/it/resource/28368554/italiano-l2/espressioni-con-essere-e-avere\" target=\"_blank\" rel=\"noopener\">Wordwall – espressioni con essere e avere</a> · <a href=\"https://learningapps.org/display?v=p31oegwjn26\" target=\"_blank\" rel=\"noopener\">LearningApps – liczenie</a> · <a href=\"https://www.youtube.com/watch?v=TYtdYslLY9I\" target=\"_blank\" rel=\"noopener\">piosenka (YouTube)</a></li>\n<li><b>Essere:</b> <a href=\"https://www.culturaitaliana.eu/blog/esercizi/grammatica-e-lessico/livello-a/verbo-essere/\" target=\"_blank\" rel=\"noopener\">culturaitaliana.eu</a> · <a href=\"https://lingua.com/it/italiano/grammatica/coniugazione-verbo-essere/\" target=\"_blank\" rel=\"noopener\">lingua.com</a></li>\n<li><b>Avere:</b> <a href=\"https://lingua.com/it/italiano/grammatica/coniugazione-verbo-avere/\" target=\"_blank\" rel=\"noopener\">lingua.com</a> · <a href=\"https://www.culturaitaliana.eu/blog/esercizi/grammatica-e-lessico/livello-a/verbo-avere/\" target=\"_blank\" rel=\"noopener\">culturaitaliana.eu</a></li>\n<li><b>Chiamarsi:</b> <a href=\"https://learningapps.org/watch?v=p8htytxon17\" target=\"_blank\" rel=\"noopener\">LearningApps</a> · <a href=\"https://wordwall.net/it/resource/76168050/verbo-chiamarsi\" target=\"_blank\" rel=\"noopener\">Wordwall</a></li>\n<li><b>Essere, avere, chiamarsi:</b> <a href=\"https://wordwall.net/pl/resource/5393926/completiamo-le-frasi-essere-avere-chiamarsi\" target=\"_blank\" rel=\"noopener\">Wordwall – completiamo le frasi</a></li>\n<li><b>Numeri:</b> <a href=\"https://wordwall.net/resource/9621430/italian/italian-numbers-1-30\" target=\"_blank\" rel=\"noopener\">Wordwall 1–30</a> · <a href=\"https://wordwall.net/resource/92427069/italian/italian-numeri-0-30\" target=\"_blank\" rel=\"noopener\">Wordwall 0–30</a></li>\n<li><b>Rodzajniki określone:</b> <a href=\"https://lingua.com/it/italiano/grammatica/articoli-derterminativi/\" target=\"_blank\" rel=\"noopener\">lingua.com</a> · <a href=\"https://www.italianoinonda.net/e131\" target=\"_blank\" rel=\"noopener\">italianoinonda.net</a></li>\n<li><b>Liczba mnoga:</b> <a href=\"https://www.impariamoitaliano.com/plur03.htm\" target=\"_blank\" rel=\"noopener\">impariamoitaliano – plur03</a> · <a href=\"https://www.impariamoitaliano.com/plur04.htm\" target=\"_blank\" rel=\"noopener\">plur04</a></li>\n<li><b>Zgodność rzeczownika z przymiotnikiem:</b> <a href=\"https://www.parlo-italiano.it/risorse/esercizi-sulla-concordanza-tra-aggettivi-e-sostantivi/\" target=\"_blank\" rel=\"noopener\">parlo-italiano.it</a></li>\n</ul>\n<div class=\"tip\"><b>W aplikacji przećwiczysz:</b> Gramatyka → lekcje 1, 1a, 2, 4, 5, 8, 9, 11 · Ćwiczenia → „Chiamarsi, essere, avere”, „Rodzajnik określony”, „Liczba mnoga”, „Essere czy avere?”, „Rachunki po włosku”, „Liczebniki” · Słownictwo → „Alfabet i literowanie”, „Przedstawianie się”, „Liczenie i tablice rejestracyjne”.</div>"}], "lacina": [{"t": "Lektorat 12.10.2026 – terminarz kolokwiów, zwroty, zadania domowe", "html": "<h5>Terminarz kolokwiów</h5>\n<ul><li><b>Termin 26.10:</b> Kolokwium z modlitw oraz pytań o znaczenie słów z modlitw: Pater Noster, Ave Maria, Gloria Patri, Signum Crucis.</li><li><b>Termin 16.11:</b> Druga część kolokwium, obejmująca modlitwy Credo oraz Angele Dei.</li></ul>\n<h5>Zwroty grzecznościowe i formuły łacińskie</h5>\n<ul><li>Benedicamus Domino → Szczęść Boże</li><li>Deo Gratias → Bóg zapłać</li><li>Valete studentes / discipuli → żegnajcie / niech wam się powodzi</li></ul>\n<h5>Zagadnienia i słownictwo z modlitw</h5>\n<p>Analiza słownictwa z modlitw (m.in. słowo quotidianum, formy zaimkowe eis → ei, oraz zmiana liczby w zwrocie Requiescant na Requiescat).</p>\n<p>Nacisk na rozumienie znaczenia słów, aby wiedzieć, co się modli.</p>\n<h5>Zadania domowe</h5>\n<p>Posłuchać Gaudeamus igitur.</p>\n<p>Przeczytać z teczki tekst na temat tego, dlaczego warto uczyć się łaciny.</p>\n<h5>Informacje dodatkowe</h5>\n<p>Istnieje możliwość dodatkowego zaliczenia pojęć z teczki.</p>"}, {"t": "21 czasowników z tablicy – formy i koniugacje (opracowanie)", "html": "<h4><span class=\"num\">1.</span> Legenda: Jak rozpoznać koniugację po dwóch pierwszych formach?</h4>\n<p>W łacinie o przynależności czasownika do danej koniugacji decyduje zestawienie 1. formy (1. os. lp. czasu teraźniejszego) z 2. formą (bezokolicznikiem – infinitivus, zakończonym na -re). Na tablicy masz podkreślone na czerwono dokładnie te samogłoski tematowe, które o tym decydują:</p>\n<p>Koniugacja Końcówka 1. formy (Praesens) Końcówka 2. formy (Infinitivus) Temat czasu teraźniejszego Jak ją odróżnić w sekundę?</p>\n<ul><li>I koniugacja -o (z kontrakcji -a-o) -āre (długie a) kończy się na -a-</li></ul>\n<p>W 1. formie jest samo -o (bez -e- lub -i- przed nim), a bezokolicznik ma -are (np. err-o, err-are).</p>\n<ul><li>II koniugacja -eo -ēre (długie e) kończy się na -e-</li><li><b>Klucz:</b> W 1. formie przed -o stoi literka -e- (-eo), a w 2. formie jest -ere (np. hab-eo, hab-ere).</li><li>III koniugacja (spółgłoskowa) -o -ĕre (krótkie e) kończy się na spółgłoskę</li><li><b>Pułapka z II koniugacją:</b> Bezokolicznik też ma -ere, ALE w 1. formie NIE MA -e- przed -o (jest samo -o, np. leg-o, leg-ere, a nie legeo!).</li><li>IV koniugacja -io -īre (długie i) kończy się na -i-</li></ul>\n<p>W 1. formie jest -io, a w bezokoliczniku -ire (np. ven-io, ven-ire).</p>\n<ul><li><b>(Uwaga na przyszłość:</b> istnieje jeszcze koniugacja III na -io, tzw. mieszana, gdzie 1. forma ma -io, a 2. ma -ere, np. capio, capere – ale wśród słówek z tablicy nie ma ani jednego takiego czasownika).</li></ul>\n<h4><span class=\"num\">2.</span> Cztery formy podstawowe i uzasadnienie koniugacji dla każdego słowa</h4>\n<h5>W słownikach łacińskich podaje się 4 formy podstawowe</h5>\n<ul><li><b>Praesens (1. os. lp. czasu teraźniejszego</b> – co robię?)</li><li><b>Infinitivus (bezokolicznik</b> – co robić?)</li><li><b>Perfectum (1. os. lp. czasu przeszłego dokonanego</b> – co zrobiłem?)</li></ul>\n<p>Supinum (rzeczownik odsłowny na -tum/-sum, służący do tworzenia imiesłowów)</p>\n<p>(W nawiasach kwadratowych skorygowałem drobne literówki z pośpiesznego zapisu na tablicy, np. „scribpsis” czy „vinvici”, podając poprawne formy klasyczne).</p>\n<ul><li><b>Koniugacja I (temat na -a-):</b> końcówki -o, -are (standardowe formy przeszłe to -avi, -atum)</li><li><b>erro, errāre, errāvī, errātum</b> – błądzić, tułać się</li></ul>\n<p>Dlaczego I? Bo 1. os. ma -o (erro), a bezokolicznik -are (errare). Temat: erra-.</p>\n<ul><li><b>pecco, peccāre, peccāvī, peccātum</b> – grzeszyć, błądzić</li><li><b>Dlaczego I? Końcówki -o, -are. Temat:</b> pecca-.</li><li><b>servo, servāre, servāvī, servātum</b> – pilnować, zachowywać, ocalać</li><li><b>Dlaczego I? Końcówki -o, -are. Temat:</b> serva-.</li><li><b>sano, sanāre, sanāvī, sanātum</b> – leczyć, uzdrawiać</li><li><b>Dlaczego I? Końcówki -o, -are. Temat:</b> sana-.</li><li><b>creo, creāre, creāvī, creātum</b> – tworzyć, stwarzać</li></ul>\n<p>Dlaczego I? Choć w 1. osobie widać cre-o, to -e- należy tu do rdzenia, a w bezokoliczniku jest wyraźne -are (cre-are). Temat: crea-.</p>\n<ul><li><b>voco, vocāre, vocāvī, vocātum</b> – wołać, wzywać (z dołu tablicy)</li><li><b>Dlaczego I? Końcówki -o, -are. Temat:</b> voca-.</li><li><b>Koniugacja II (temat na -e-):</b> końcówki -eo, -ēre</li><li><b>habeo, habēre, habuī, habitum</b> – mieć, posiadać</li></ul>\n<p>Dlaczego II? W 1. osobie przed -o jest -e- (habeo), a w bezokoliczniku -ēre (habere). Temat: habe-.</p>\n<ul><li><b>fleo, flēre, flēvī, flētum</b> – płakać</li></ul>\n<p>Dlaczego II? 1. osoba kończy się na -eo (fleo), a bezokolicznik na -ēre (flere; na tablicy zapisano podwójne e: fleere, żeby pokazać, że rdzeń fle- łączy się z końcówką -re). Temat: fle-.</p>\n<ul><li>video, vidēre, vīdī, vīsum (na tablicy omyłkowo powtórzono rdzeń: „vidvidi, vidvisum”) – widzieć</li></ul>\n<p>Dlaczego II? 1. osoba ma -eo (video), bezokolicznik -ēre (videre). Temat: vide-.</p>\n<ul><li><b>respondeo, respondēre, respondī, respōnsum</b> – odpowiadać (z dołu tablicy)</li><li><b>Dlaczego II? Końcówki -eo, -ēre. Temat:</b> responde-.</li><li><b>taceo, tacēre, tacuī, tacitum</b> – milczeć (z dołu tablicy)</li><li><b>Dlaczego II? Końcówki -eo, -ēre. Temat:</b> tace-.</li><li><b>Koniugacja III (spółgłoskowa):</b> końcówki -o, -ĕre (spółgłoska przed -o)</li></ul>\n<p>W III koniugacji temat kończy się na spółgłoskę (np. toll-, scrib-, leg-). Ponieważ w łacinie trudno wymówić zbitkę spółgłosek (np. leg-s, leg-t, leg-re), między temat a końcówkę osobową wstawia się spójkę (samogłoskę tematyczną):</p>\n<ul><li>przed -r w bezokoliczniku wchodzi krótkie -e- (leg-e-re),</li><li>w 2. i 3. os. lp. oraz 1. i 2. os. lm. wchodzi -i- (leg-i-s, leg-i-t, leg-i-mus, leg-i-tis),</li></ul>\n<p>w 3. os. lm. wchodzi -u- (leg-u-nt).</p>\n<ul><li><b>tollo, tollĕre, sustulī, sublātum</b> – podnosić, usuwać (czasownik supletywny w formach przeszłych)</li></ul>\n<p>Dlaczego III? W bezokoliczniku jest -ere (tollere), ale w 1. osobie jest samo -o po spółgłosce (toll-o, brak -eo!). Temat: toll-.</p>\n<ul><li><b>scribo, scribĕre, scrīpsī, scrīptum (na tablicy:</b> „scribpsis”) – pisać, rysować</li></ul>\n<p>Dlaczego III? W 1. os. samo -o po spółgłosce (scrib-o), a w bezokoliczniku -ere (scrib-ere). Temat: scrib-.</p>\n<ul><li><b>lego, legĕre, lēgī, lēctum (uwaga:</b> na tablicy pomieszano formy z czasownikiem I koniugacji „lēgo, lēgare, lēgavi, lēgatum – wysyłać posła/wyznaczać”; właściwe „lego, legere – czytać/zbierać” z III koniugacji ma formy: lēgi, lēctum)</li></ul>\n<p>Dlaczego III? Bo jest leg-o (bez -e-), a bezokolicznik ma -ere (legere). Temat: leg-.</p>\n<p>vinco, vincĕre, vīcī, victum (na tablicy dopisano prefiks rdzenia z teraźniejszości: „vinvici, vinvictum” – w klasycznej łacinie w perfectum wypada „n”: vīcī, victum) – zwyciężać</p>\n<p>Dlaczego III? W 1. os. samo -o (vinc-o), w bezokoliczniku -ere (vinc-ere). Temat: vinc-.</p>\n<ul><li><b>eligo, eligĕre, ēlēgī, ēlēctum (na tablicy:</b> „elilegi, elilectum”) – wybierać, zbierać (złożenie ex + lego)</li></ul>\n<p>Dlaczego III? W 1. os. samo -o (elig-o), w bezokoliczniku -ere (elig-ere). Temat: elig-.</p>\n<ul><li><b>pono, ponĕre, posuī, positum</b> – kłaść, stawiać</li></ul>\n<p>Dlaczego III? W 1. os. samo -o (pon-o), w bezokoliczniku -ere (pon-ere). Temat: pon-.</p>\n<ul><li><b>pello, pellĕre, pepulī, pulsum</b> – pędzić, uderzać, wyganiać (z dołu tablicy)</li><li><b>Dlaczego III? Końcówki -o, -ĕre. Temat:</b> pell-.</li><li><b>tango, tangĕre, tetigī, tāctum</b> – dotykać (z dołu tablicy)</li><li><b>Dlaczego III? Końcówki -o, -ĕre. Temat:</b> tang-.</li><li><b>quaero, quaerĕre, quaesīvī, quaesītum</b> – szukać, pytać (z dołu tablicy)</li><li><b>Dlaczego III? Końcówki -o, -ĕre. Temat:</b> quaer-.</li><li><b>surgo, surgĕre, surrēxī, surrēctum</b> – wstawać, podnosić się (z dołu tablicy)</li><li><b>Dlaczego III? Końcówki -o, -ĕre. Temat:</b> surg-.</li><li><b>Koniugacja IV (temat na -i-):</b> końcówki -io, -īre</li><li><b>venio, venīre, vēnī, ventum (na tablicy:</b> „veventum”) – przychodzić, zbliżać się</li></ul>\n<p>Dlaczego IV? W 1. osobie ma -io (venio), a w bezokoliczniku -īre (venire). Temat: veni- (Uwaga: w 3. os. lm. między temat „veni-” a końcówkę „-nt” wchodzi spójka „-u-”, dając: veniunt).</p>\n<ul><li><b>finio, finīre, finīvī, finītum</b> – kończyć, oznaczać granice czegoś</li></ul>\n<p>Dlaczego IV? W 1. osobie ma -io (finio), a w bezokoliczniku -īre (finire). Temat: fini-.</p>\n<h4><span class=\"num\">3.</span> Pełna odmiana wszystkich czasowników (Praesens Indicativi Activi)</h4>\n<h5>Końcówki osobowe strony czynnej dla wszystkich koniugacji są identyczne</h5>\n<ul><li><b>Liczba pojedyncza (Singular):</b> 1. -o (ja), 2. -s (ty), 3. -t (on/ona/ono)</li><li><b>Liczba mnoga (Plural):</b> 1. -mus (my), 2. -tis (wy), 3. -nt (oni/one)</li></ul>\n<h4><span class=\"num\">A.</span> Czasowniki Koniugacji I (temat na -a-)</h4>\n<p>(W 1. os. lp. tematyczne -a- zlewa się z końcówką -o w samo -o; w pozostałych osobach mamy regularne: -as, -at, -amus, -atis, -ant)</p>\n<p>Osoba erro, errare (tułać się)</p>\n<p>pecco, peccare (błądzić)</p>\n<p>servo, servare (pilnować)</p>\n<p>sano, sanare (leczyć)</p>\n<p>creo, creare (tworzyć)</p>\n<p>voco, vocare (wołać)</p>\n<h4><span class=\"num\">1.</span> sg. (ja)</h4>\n<ul><li>erro pecco servo sano creo voco</li></ul>\n<h4><span class=\"num\">2.</span> sg. (ty) erras peccas servas sanas creas vocas</h4>\n<h4><span class=\"num\">3.</span> sg. (on) errat peccat servat sanat creat vocat</h4>\n<h4><span class=\"num\">1.</span> pl. (my) erramus peccamus servamus sanamus creamus vocamus</h4>\n<h4><span class=\"num\">2.</span> pl. (wy) erratis peccatis servatis sanatis creatis vocatis</h4>\n<h4><span class=\"num\">3.</span> pl. (oni) errant peccant servant sanant creant vocant</h4>\n<h4><span class=\"num\">B.</span> Czasowniki Koniugacji II (temat na -e-)</h4>\n<ul><li><b>(We wszystkich osobach utrzymuje się tematyczne -e-:</b> -eo, -es, -et, -emus, -etis, -ent)</li></ul>\n<p>Osoba habeo, habere (mieć)</p>\n<p>fleo, flere (płakać)</p>\n<p>video, videre (widzieć)</p>\n<p>respondeo, respondere (odpowiadać)</p>\n<p>taceo, tacere (milczeć)</p>\n<h4><span class=\"num\">1.</span> sg. (ja)</h4>\n<ul><li>habeo fleo video respondeo taceo</li></ul>\n<h4><span class=\"num\">2.</span> sg. (ty) habes fles vides respondes taces</h4>\n<h4><span class=\"num\">3.</span> sg. (on) habet flet videt respondet tacet</h4>\n<h4><span class=\"num\">1.</span> pl. (my) habemus flemus videmus respondemus tacemus</h4>\n<h4><span class=\"num\">2.</span> pl. (wy) habetis fletis videtis respondetis tacetis</h4>\n<h4><span class=\"num\">3.</span> pl. (oni) habent flent vident respondent tacent</h4>\n<h4><span class=\"num\">C.</span> Czasowniki Koniugacji III (temat spółgłoskowy + spójki -i- / -u-)</h4>\n<ul><li><b>(Końcówki ze spójkami:</b> -o, -is, -it, -imus, -itis, -unt)</li></ul>\n<h3 class=\"part\">Część 1 (z głównej listy):</h3>\n<p>Osoba tollo, tollere (usuwać)</p>\n<p>scribo, scribere (pisać)</p>\n<p>lego, legere (czytać/wyznaczać)</p>\n<p>vinco, vincere (zwyciężać)</p>\n<p>eligo, eligere (wybierać)</p>\n<p>pono, ponere (kłaść)</p>\n<h4><span class=\"num\">1.</span> sg. (ja)</h4>\n<ul><li>tollo scribo lego vinco eligo pono</li></ul>\n<h4><span class=\"num\">2.</span> sg. (ty) tollis scribis legis vincis eligis ponis</h4>\n<h4><span class=\"num\">3.</span> sg. (on) tollit scribit legit vincit eligit ponit</h4>\n<h4><span class=\"num\">1.</span> pl. (my) tollimus scribimus legimus vincimus eligimus ponimus</h4>\n<h4><span class=\"num\">2.</span> pl. (wy) tollitis scribitis legitis vincitis eligitis ponitis</h4>\n<h4><span class=\"num\">3.</span> pl. (oni) tollunt scribunt legunt vincunt eligunt ponunt</h4>\n<h3 class=\"part\">Część 2 (czasowniki z dołu tablicy):</h3>\n<p>Osoba pello, pellere (pędzić)</p>\n<p>tango, tangere (dotykać)</p>\n<p>quaero, quaerere (szukać/pytać)</p>\n<p>surgo, surgere (wstawać)</p>\n<h4><span class=\"num\">1.</span> sg. (ja)</h4>\n<ul><li>pello tango quaero surgo</li></ul>\n<h4><span class=\"num\">2.</span> sg. (ty) pellis tangis quaeris surgis</h4>\n<h4><span class=\"num\">3.</span> sg. (on) pellit tangit quaerit surgit</h4>\n<h4><span class=\"num\">1.</span> pl. (my) pellimus tangimus quaerimus surgimus</h4>\n<h4><span class=\"num\">2.</span> pl. (wy) pellitis tangitis quaeritis surgitis</h4>\n<h4><span class=\"num\">3.</span> pl. (oni) pellunt tangunt quaerunt surgunt</h4>\n<h4><span class=\"num\">D.</span> Czasowniki Koniugacji IV (temat na -i-)</h4>\n<p>(We wszystkich osobach utrzymuje się tematyczne -i-, a w 3. os. lm. dochodzi spójka -u-: -io, -is, -it, -imus, -itis, -iunt)</p>\n<p>Osoba venio, venire (zbliżać się / przychodzić)</p>\n<p>finio, finire (oznaczać granice / kończyć)</p>\n<h4><span class=\"num\">1.</span> sg. (ja)</h4>\n<ul><li>venio finio</li></ul>\n<h4><span class=\"num\">2.</span> sg. (ty) venis finis</h4>\n<h4><span class=\"num\">3.</span> sg. (on) venit finit</h4>\n<h4><span class=\"num\">1.</span> pl. (my) venimus finimus</h4>\n<h4><span class=\"num\">2.</span> pl. (wy) venitis finitis</h4>\n<h4><span class=\"num\">3.</span> pl. (oni) veniunt (uwaga na -iu-!) finiunt (uwaga na -iu-!)</h4>\n<h5>Szybka ściągawka pamięciowa na kolokwium (porównanie 3. os. lp. i 3. os. lm.)</h5>\n<ul><li><b>I kon. (-are):</b> on ma -at (errat), oni mają -ant (errant).</li><li><b>II kon. (-eo, -ere):</b> on ma -et (habet), oni mają -ent (habent).</li><li><b>III kon. (-o, -ere):</b> on ma -it (legit), oni mają -unt (legunt – bez „i”!).</li><li><b>IV kon. (-io, -ire):</b> on ma -it (venit), oni mają -iunt (veniunt – z „i”!).</li></ul>"}]};
