<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}img{max-width:100%}
/* AugustApka — layout: lewy panel z przedmiotami (desktop) / dolny pasek (telefon); treść w kolumnie do 1100px.
   Kolory z księgi znaku Rocznika św. Augustyna: butelkowa zieleń, terakota płomienia, jasne tło. */
:root{
  --paper:#F7F3F4; --card:#FFFDFD; --sunk:#EFE8EA; --ink:#1E2A26; --muted:#5E6A66; --line:#E2D9DB;
  --green:#2B4F45; --green-ink:#2B4F45; --green-soft:#E3ECE8; --terra:#C2573D; --terra-soft:#F6E3DD;
  --gold:#B8862F; --ok:#2F7A4F; --ok-soft:#E0F0E6; --bad:#B23A2E; --bad-soft:#F8E1DE;
  --shadow:0 1px 2px rgba(30,42,38,.06),0 6px 20px rgba(30,42,38,.06);
  --f-ui:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-read:"Source Serif 4","Georgia","Times New Roman",serif;
  --f-music:"Noto Music","Segoe UI Symbol","Apple Symbols",serif;
  --r:14px; --r-s:9px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111714; --card:#18201C; --sunk:#1F2925; --ink:#E8EDEA; --muted:#9AA8A2; --line:#2C3833;
  --green:#3E7363; --green-ink:#8CC3B0; --green-soft:#1E2E28; --terra:#E07A5F; --terra-soft:#3A231D;
  --gold:#D9A94E; --ok:#5DBB86; --ok-soft:#173326; --bad:#E5776B; --bad-soft:#3A1E1B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111714; --card:#18201C; --sunk:#1F2925; --ink:#E8EDEA; --muted:#9AA8A2; --line:#2C3833;
  --green:#3E7363; --green-ink:#8CC3B0; --green-soft:#1E2E28; --terra:#E07A5F; --terra-soft:#3A231D;
  --gold:#D9A94E; --ok:#5DBB86; --ok-soft:#173326; --bad:#E5776B; --bad-soft:#3A1E1B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-ui);font-size:15px;line-height:1.5;margin:0;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--green)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--terra);outline-offset:2px}
h1,h2,h3,h4,h5{text-wrap:balance;margin:0}
a{color:var(--green-ink)}
.mono{font-variant-numeric:tabular-nums}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--green);color:#fff;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;color:#fff;padding:0;text-align:left}
.brand svg,.brand .brand-syg{width:38px;height:38px;flex:none;display:block}
.brand b{display:block;font-weight:800;font-size:18px;letter-spacing:.01em;line-height:1}
.brand small{display:block;font-size:11px;opacity:.8;letter-spacing:.04em;margin-top:3px}
.search{flex:1;min-width:0;position:relative;max-width:440px;margin-left:auto}
.search input{width:100%;border:0;border-radius:999px;padding:9px 14px 9px 36px;background:rgba(255,255,255,.14);color:#fff}
.search input::placeholder{color:rgba(255,255,255,.7)}
.search input:focus{background:rgba(255,255,255,.22);outline:none}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;opacity:.8}
.search-res{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--card);color:var(--ink);border-radius:12px;box-shadow:var(--shadow);
  max-height:70vh;overflow:auto;border:1px solid var(--line);padding:6px}
.search-res .sr{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:8px}
.search-res .sr:hover,.search-res .sr:focus{background:var(--sunk)}
.search-res .sr small{display:block;color:var(--muted);font-size:12px}
.search-res .sr-h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 10px 2px;font-weight:700}
.icon-btn{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:999px;width:36px;height:36px;display:grid;place-items:center;flex:none}
.icon-btn svg{width:18px;height:18px}

/* ---------- shell ---------- */
.shell{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;
  padding-block:22px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.side{position:sticky;top:76px;align-self:start;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 96px);overflow:auto}
.side button{display:flex;align-items:center;gap:10px;background:none;border:0;border-radius:10px;padding:7px 10px;text-align:left;color:var(--ink);font-weight:600;font-size:14px}
.side button:hover{background:var(--sunk)}
.side button.on{background:var(--green);color:#fff}
.side .lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:10px 10px 4px}
.badge{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:12px;letter-spacing:.02em;color:#fff;background:var(--c,var(--green))}
.side button.on .badge{background:rgba(255,255,255,.18)}
main{min-width:0}
.bottom{display:none}

@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);padding-bottom:90px}
  .side{display:none}
  .brand small{display:none}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .bottom button{flex:1;background:none;border:0;padding:8px 2px 7px;font-size:11px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
  .bottom button svg{width:22px;height:22px}
  .bottom button.on{color:var(--terra)}
}

/* ---------- common ---------- */
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-h h1{font-size:clamp(24px,4vw,34px);font-weight:800;letter-spacing:-.01em;line-height:1.1}
.page-h .sub{color:var(--muted);margin-top:6px;max-width:62ch}
.eyebrow-s{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--terra)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card h2{font-size:18px;font-weight:800}
.card h3{font-size:15px;font-weight:800}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font-weight:700;font-size:14px;color:var(--ink)}
.btn:hover{border-color:var(--green-ink)}
.btn.pri{background:var(--green);border-color:var(--green);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.terra{background:var(--terra);border-color:var(--terra);color:#fff}
.btn.ghost{background:none}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 12px}
.input:focus{outline:2px solid var(--green-ink);outline-offset:0;border-color:transparent}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700;color:var(--muted)}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:800;letter-spacing:.04em;background:var(--sunk);color:var(--muted)}
.pill.terra{background:var(--terra-soft);color:var(--terra)}
.pill.green{background:var(--green-soft);color:var(--green-ink)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin-bottom:18px;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font-weight:700;color:var(--muted);font-size:14px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--terra)}
.feedback{border-radius:10px;padding:10px 12px;font-weight:600}
.feedback.ok{background:var(--ok-soft);color:var(--ok)}
.feedback.bad{background:var(--bad-soft);color:var(--bad)}
.kbd{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em;background:var(--sunk);border-radius:5px;padding:1px 5px}
.hide{display:none!important}

/* ---------- home ---------- */
.hero{background:var(--green);color:#fff;border-radius:18px;padding:22px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;margin-bottom:22px;position:relative;overflow:hidden}
.hero h1{font-size:clamp(22px,3.6vw,30px);font-weight:800;line-height:1.15}
.hero p{margin:8px 0 0;opacity:.85;max-width:56ch}
.hero .quote{font-family:var(--f-read);font-style:italic;font-size:15px;opacity:.9;margin-top:12px}
.hero-logo img{display:block;width:118px;height:auto}
@media (max-width:560px){.hero{grid-template-columns:1fr}.hero-logo{display:none}}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 0 12px;flex-wrap:wrap}
.sec-h h2{font-size:20px;font-weight:800}
.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
.subj{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;color:var(--ink);transition:transform .15s,border-color .15s}
.subj:hover{border-color:var(--c);transform:translateY(-2px)}
.subj .t{display:flex;align-items:center;gap:10px}
.subj .t b{font-size:15px;line-height:1.2}
.subj .meta{font-size:12px;color:var(--muted)}
.bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--green))}
@media (prefers-reduced-motion:reduce){.subj{transition:none}}

/* terminarz */
.agenda{display:flex;flex-direction:column;gap:8px}
.ev{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c,var(--green));border-radius:12px;padding:10px 12px}
.ev .d{text-align:center;line-height:1}
.ev .d b{display:block;font-size:22px;font-weight:800}
.ev .d small{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.ev .x{min-width:0}
.ev .x b{display:block;font-size:14px}
.ev .x span{font-size:12px;color:var(--muted)}
.ev .left{font-size:12px;font-weight:800;white-space:nowrap}
.ev.soon .left{color:var(--terra)}
.ev.done{opacity:.55}
.ev.done .x b{text-decoration:line-through}
.ev .acts{display:flex;gap:4px}
.addform{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;align-items:end}

/* ---------- notes ---------- */
.lec-list{display:flex;flex-direction:column;gap:8px}
.lec{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--ink)}
.lec:hover{border-color:var(--green-ink)}
.lec .n{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--sunk);color:var(--muted)}
.lec.read .n{background:var(--ok-soft);color:var(--ok)}
.lec b{font-size:14px;display:block}
.lec small{color:var(--muted);font-size:12px}
.reader{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:clamp(16px,3.5vw,34px)}
.reader-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.note{font-family:var(--f-read);font-size:17px;line-height:1.62;max-width:72ch}
.note p{margin:.5em 0}
.note ul{margin:.3em 0 .7em;padding-left:1.25em}
.note li{margin:.22em 0}
.note li::marker{color:var(--terra)}
.note b{font-weight:700}
.note .eyebrow{font-family:var(--f-ui);font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--terra);margin:.2em 0 .6em}
.note .meta{font-family:var(--f-ui);font-size:13px;color:var(--muted);margin:.3em 0}
.note .topic{font-family:var(--f-ui);background:var(--green-soft);border-radius:12px;padding:12px 14px;margin:.6em 0 1em;font-weight:600;font-size:15px;line-height:1.45}
.note .topic span{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--green-ink);font-weight:800;margin-bottom:2px}
.note h3.part{font-family:var(--f-ui);font-size:15px;letter-spacing:.06em;text-transform:uppercase;font-weight:800;color:var(--green-ink);margin:1.6em 0 .4em;padding-top:.8em;border-top:2px solid var(--line)}
.note h4{font-family:var(--f-ui);font-size:18px;font-weight:800;margin:1.3em 0 .35em;line-height:1.3}
.note h4 .num{color:var(--terra)}
.note h5{font-family:var(--f-ui);font-size:15px;font-weight:800;margin:1em 0 .2em;color:var(--green-ink)}
.note .note-src{font-family:var(--f-ui);font-size:12px;color:var(--muted)}
.note .check{font-family:var(--f-ui);font-size:14px;background:var(--terra-soft);border-radius:10px;padding:10px 12px;margin-top:1.4em}
.note .tag-exam{font-family:var(--f-ui);font-size:11px;font-weight:800;letter-spacing:.04em;background:var(--terra);color:#fff;border-radius:999px;padding:2px 8px;vertical-align:middle;margin-left:6px;text-transform:uppercase}
.table-wrap{overflow-x:auto;margin:.6em 0 1em;max-width:100%}
table.nt{border-collapse:collapse;font-family:var(--f-ui);font-size:14px;min-width:100%}
table.nt th,table.nt td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
table.nt th{background:var(--sunk);font-weight:800;font-size:13px}
.lesson{font-family:var(--f-ui);font-size:15px;line-height:1.6}
.lesson .lead{font-size:16px}
.rule,.tip,.warn{border-radius:12px;padding:12px 14px;margin:12px 0}
.rule{background:var(--green-soft)}
.tip{background:var(--sunk)}
.warn{background:var(--terra-soft)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}

/* glossary */
.gl{display:flex;flex-direction:column;gap:2px}
.gl-sec{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:18px 0 6px}
.gl-item{padding:10px 0;border-bottom:1px solid var(--line)}
.gl-item b{font-size:15px}
.gl-item p{margin:3px 0 0;font-family:var(--f-read);font-size:16px;line-height:1.5}
mark{background:var(--terra-soft);color:inherit;border-radius:3px;padding:0 2px}

/* ---------- flashcards (Leitner) ---------- */
.boxes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.box .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:800;color:var(--muted)}
.box .v{font-size:22px;font-weight:800;line-height:1.2}
.box .hb{height:4px;border-radius:9px;background:var(--sunk);margin-top:6px;overflow:hidden}
.box .hb i{display:block;height:100%;background:var(--green)}
.box.on{border-color:var(--terra);box-shadow:0 0 0 2px var(--terra-soft)}
.flash{background:var(--card);border:1px solid var(--line);border-radius:18px;min-height:230px;padding:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px;position:relative}
.flash .fbox{position:absolute;top:12px;left:14px}
.flash .front{font-size:clamp(20px,3.6vw,28px);font-weight:800;line-height:1.25;max-width:40ch}
.flash .front.long{font-family:var(--f-read);font-weight:500;font-size:18px;line-height:1.5}
.flash .back{font-family:var(--f-read);font-size:18px;line-height:1.5;max-width:62ch;border-top:1px solid var(--line);padding-top:12px;width:100%}
.flash .back b{font-family:var(--f-ui)}
.flash-acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.flash-acts .btn{min-width:150px;padding:12px 16px}

/* quiz */
.q-opts{display:grid;gap:8px}
.q-opt{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px}
.q-opt:hover{border-color:var(--green-ink)}
.q-opt.ok{background:var(--ok-soft);border-color:var(--ok)}
.q-opt.bad{background:var(--bad-soft);border-color:var(--bad)}
.q-prompt{font-family:var(--f-read);font-size:19px;line-height:1.45}
.score{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.score b{color:var(--ink);font-size:15px}

/* latin */
.conj-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.conj-card{border-radius:14px;padding:14px;background:var(--card);border:1px solid var(--line);border-top:5px solid var(--c)}
.conj-card h3{font-size:16px}
.verb-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%;color:var(--ink)}
.verb-row:hover{background:var(--sunk)}
.verb-row b{font-size:15px}
.verb-row small{color:var(--muted)}
.c-pill{font-size:12px;font-weight:800;border-radius:999px;padding:3px 9px;color:#fff;background:var(--c)}
.paradigm td .r{color:var(--ink)}
.paradigm td .s{color:var(--terra);font-weight:800}
.paradigm td .e{color:var(--green-ink);font-weight:800}
.legend-key{display:flex;gap:12px;flex-wrap:wrap;font-size:13px}
.legend-key span b{font-weight:800}
.sim-grid{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 10px;align-items:center;max-width:520px}
.sim-grid .p{font-weight:700;color:var(--muted);font-size:13px}
.sim-grid .input.ok{border-color:var(--ok);background:var(--ok-soft)}
.sim-grid .input.bad{border-color:var(--bad);background:var(--bad-soft)}
.prayer{font-family:var(--f-read);font-size:20px;line-height:1.9}
.prayer .w{cursor:pointer;border-radius:5px;padding:1px 2px}
.prayer .w:hover{background:var(--green-soft)}
.prayer .w.sel{background:var(--terra);color:#fff}
.prayer .gap{display:inline-block;min-width:4ch;border:0;border-bottom:2px solid var(--terra);background:var(--terra-soft);border-radius:4px 4px 0 0;padding:0 4px;font-family:var(--f-read);font-size:18px}
.prayer .gap.ok{border-color:var(--ok);background:var(--ok-soft)}
.prayer .gap.bad{border-color:var(--bad);background:var(--bad-soft)}
.gloss-pop{position:sticky;bottom:80px;background:var(--ink);color:var(--paper);border-radius:12px;padding:10px 14px;font-size:14px;margin-top:12px;box-shadow:var(--shadow)}
.dict-row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) auto;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);align-items:baseline}
.dict-row b{font-weight:700}
.dict-row .tr{font-family:var(--f-read);font-size:16px}
@media (max-width:560px){.dict-row{grid-template-columns:minmax(0,1fr) auto}.dict-row .tr{grid-column:1/-1;order:3}}

/* music */
.staff-wrap{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;overflow-x:auto}
svg.staff{display:block;width:100%;max-width:560px;height:auto;margin:0 auto}
svg.staff .ln{stroke:var(--ink);stroke-width:1.3}
svg.staff .lg{stroke:var(--ink);stroke-width:1.3}
svg.staff .nh{fill:var(--ink)}
svg.staff .nh.ok{fill:var(--ok)} svg.staff .nh.bad{fill:var(--bad)} svg.staff .nh.ghost{fill:var(--terra);opacity:.55}
svg.staff text{fill:var(--ink);font-family:var(--f-music)}
svg.staff .gly{fill:var(--ink)} svg.staff .gly.ok{fill:var(--ok)} svg.staff .gly.bad{fill:var(--bad)} svg.staff .gly.ghost{fill:var(--terra);opacity:.6}
svg.staff .clef{font-size:58px}
svg.staff .acc{font-size:30px}
svg.staff .hit{fill:transparent;cursor:pointer}
svg.staff .hit:hover{fill:var(--terra-soft)}
.note-btns{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:560px;margin:0 auto}
.note-btns .btn{padding:14px 0;font-size:18px}
.cof-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:760px){.cof-wrap{grid-template-columns:1fr}}
svg.cof{width:100%;max-width:440px;height:auto;display:block;margin:0 auto}
svg.cof .seg{cursor:pointer}
svg.cof .seg path{fill:var(--card);stroke:var(--line);stroke-width:1.5;transition:fill .15s}
svg.cof .seg.minor path{fill:var(--sunk)}
svg.cof .seg:hover path{fill:var(--green-soft)}
svg.cof .seg.on path{fill:var(--green)}
svg.cof .seg.on text{fill:#fff}
svg.cof text{fill:var(--ink);font-family:var(--f-ui);font-weight:800;text-anchor:middle;dominant-baseline:central;pointer-events:none}
svg.cof .acc-t{font-size:11px;font-weight:700;fill:var(--muted)}
.piano{position:relative;height:150px;width:100%;max-width:560px;margin:0 auto;user-select:none}
.piano button{position:absolute;top:0;border:1px solid var(--line);border-radius:0 0 8px 8px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-size:12px;font-weight:800}
.piano .wk{background:#fffdfd;color:#1e2a26;height:150px;z-index:1}
.piano .bk{background:#1e2a26;color:#f7f3f4;height:92px;z-index:2;font-size:9px;line-height:1.1;text-align:center;border-color:#1e2a26}
.piano button.hl{background:var(--terra);color:#fff}

/* tables in dictionary/verbs */
.scroll-y{max-height:560px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:0 10px;background:var(--card)}
.foot{margin-top:40px;color:var(--muted);font-size:12px;text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;z-index:90;box-shadow:var(--shadow)}

.cof-wrap svg.staff{max-width:340px}

/* ---------- jak się uczyć ---------- */
.study-strip{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;margin-bottom:6px}
@media (max-width:760px){.study-strip{grid-template-columns:1fr}}
.start-btn{display:flex;flex-direction:column;justify-content:center;gap:6px;text-align:left;border:2px solid var(--terra);background:var(--terra-soft);color:var(--ink)}
.start-btn b{font-size:22px;font-weight:800;color:var(--terra)}
.lec.due{border-color:var(--terra)}
.lec.due .n{background:var(--terra-soft);color:var(--terra)}
.cornell{display:grid;grid-template-columns:230px minmax(0,1fr);gap:22px;align-items:start}
.c-side{position:sticky;top:80px;background:var(--sunk);border-radius:12px;padding:12px;max-height:calc(100vh - 110px);overflow:auto}
@media (max-width:900px){.cornell{grid-template-columns:1fr}.c-side{position:static;max-height:none;order:2}}
.c-lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--green-ink);margin-bottom:8px}
.cq{font-size:13px;font-weight:600;background:var(--card);border-radius:8px;padding:7px 9px;border-left:3px solid var(--terra);display:flex;justify-content:space-between;gap:6px;align-items:flex-start}
.cq.auto{border-left-color:var(--green)}
.cq .x{background:none;border:0;color:var(--muted);padding:0 2px}
.c-sum{margin-top:18px;border-top:2px solid var(--line);padding-top:14px}
.rq{margin:0 0 12px;padding-left:1.3em;font-weight:600}
.rq li{margin:4px 0}
.mm{display:flex;flex-direction:column;align-items:center;gap:18px}
.mm-root{background:var(--green);color:#fff;border-radius:16px;padding:14px 20px;text-align:center;max-width:560px}
.mm-root b{display:block;font-size:17px}
.mm-root small{display:block;opacity:.85;margin-top:4px;font-size:13px}
.mm-br{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;width:100%;position:relative}
.mm-b{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:12px;padding:12px}
.mm-bt{font-weight:800;font-size:15px;color:var(--c);margin-bottom:8px}
:root[data-theme="dark"] .mm-bt{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mm-bt{color:var(--ink)}}
.mm-l{display:flex;flex-wrap:wrap;gap:6px}
.mm-leaf{font-size:12px;font-weight:600;background:var(--sunk);border-radius:999px;padding:3px 9px}
.mm-sub{width:100%;border-left:2px solid var(--line);padding-left:8px;margin:4px 0}
.mm-st{font-size:13px;font-weight:800;margin-bottom:4px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;font-weight:600}
.chk input{width:18px;height:18px;margin-top:2px;accent-color:var(--green)}
.timer{text-align:center;max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding:28px;border:2px solid var(--terra)}
.timer.brk{border-color:var(--green)}
.timer .clock{font-size:clamp(64px,16vw,110px);font-weight:800;line-height:1;letter-spacing:-.02em}
.timer .now{font-size:16px}
.mm-leaf.strong{background:var(--green-soft);color:var(--green-ink);font-weight:800}

.giant{display:block;width:100%;margin:0 0 16px;border:0;border-radius:14px;background:var(--terra);color:#fff;font-family:var(--f-ui);font-weight:800;font-size:clamp(15px,2.6vw,22px);letter-spacing:.03em;padding:12px 16px;text-align:center;line-height:1.25;text-wrap:balance}
.giant.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:translateX(0) scale(1)}20%{transform:translateX(-6px) scale(1.02)}40%{transform:translateX(6px) scale(1.03)}60%{transform:translateX(-4px) scale(1.02)}80%{transform:translateX(4px)}}
.egg{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:95;background:var(--ink);color:var(--paper);font-weight:800;font-size:clamp(20px,4vw,30px);padding:18px 26px;border-radius:18px;box-shadow:var(--shadow);text-align:center;animation:pop .35s ease-out}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.6);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.giant.shake,.egg{animation:none}}
.kbdp{height:130px;max-width:none;width:100%}
.kbdp .wk{height:130px;font-size:11px}
.kbdp .bk{height:80px;font-size:8px;white-space:pre-line;padding:0 1px 5px}
.piano button.between{background:var(--terra-soft);color:#1e2a26}
.piano .bk.between{background:#7a4a3e;color:#fff}
.kbd-info{font-size:15px;min-height:24px;text-align:center}
@media (max-width:560px){.kbdp .wk{font-size:9px}.kbdp .bk{font-size:6.5px}}
.kbd-name{font-weight:800;font-size:17px;color:var(--terra);margin-top:6px}
.note ol.topics{columns:2;column-gap:28px;padding-left:1.6em}.note ol.topics li{break-inside:avoid;margin:.2em 0}@media (max-width:700px){.note ol.topics{columns:1}}

/* deklinacje */
.decl td,.decl th{white-space:nowrap}
.decl-pick,.decl-fill{display:grid;grid-template-columns:minmax(110px,auto) 1fr 1fr;gap:6px 8px;align-items:center;max-width:560px}
.q-opt.sm{padding:8px;min-height:38px;font-size:14px;color:transparent}
.q-opt.sm.on{background:var(--green);color:#fff;border-color:var(--green)}
.q-opt.sm.ok,.q-opt.sm.bad{color:var(--ink)}
.q-opt.sm:disabled{opacity:.35}
.decl-fill .input{min-width:0;padding:8px 10px}
.rel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.rel-grid svg{display:block;margin:0 auto}
.lec.own .n{background:var(--terra-soft);color:var(--terra)}
.my-ed{align-items:start}
.my-ed textarea{min-height:320px;font-size:14px;line-height:1.5}
.note mark{background:#f5e3a3;padding:0 2px;border-radius:3px}
/* profil */
.prof-head{display:flex;gap:16px;align-items:center}
.avatar{width:64px;height:64px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px;flex:none}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.stat{background:var(--sunk);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:22px;color:var(--green-ink)} .stat span{font-size:12px;color:var(--muted)}
.prog-row{display:grid;grid-template-columns:auto minmax(0,1fr) 30% 44px;gap:10px;align-items:center;background:none;border:0;padding:4px 0;text-align:left;color:var(--ink);font:inherit;cursor:pointer}
.prog-row .pr-name{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me-btn{margin-right:6px}
.me-btn .me-ini{font-size:12px;font-weight:800;letter-spacing:.02em}
.me-btn.synced{box-shadow:0 0 0 2px var(--terra)}
/* bramka logowania */
.gate{position:fixed;inset:0;z-index:200;background:var(--paper);display:grid;place-items:center;padding:24px}
.gate .card{max-width:420px;width:100%;text-align:center;align-items:center}
.gate svg{width:72px;height:72px}
.sync-dot{position:fixed;right:12px;bottom:84px;z-index:60;font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px;box-shadow:var(--shadow);opacity:0;transition:opacity .3s;pointer-events:none}
.sync-dot.show{opacity:1}
@media(min-width:900px){.sync-dot{bottom:16px}}

/* logotypy */
.logo-swap{display:inline-block;line-height:0}
.logo-swap img{display:block;width:100%;height:auto}
.logo-swap .lg-d{display:none}
:root[data-theme="dark"] .logo-swap .lg-l{display:none}
:root[data-theme="dark"] .logo-swap .lg-d{display:block}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo-swap .lg-l{display:none}:root:not([data-theme="light"]) .logo-swap .lg-d{display:block}}
.side-logo{margin:22px 10px 8px;padding-top:18px;border-top:1px solid var(--line)}
.side-logo .logo-swap{width:100%;max-width:200px}
.gate-logo{width:150px}

@media (max-width:420px){.brand>span{display:none}}

/* okno logowania Netlify musi być nad bramką */
#netlify-identity-widget{z-index:1000!important}

/* formularz logowania */
.login-form{width:100%;gap:10px;text-align:left}
.pw-wrap{position:relative}
.pw-wrap .input{padding-right:46px;width:100%}
.pw-wrap .pw-eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);padding:4px 8px}
.login-err{color:var(--bad);background:var(--bad-soft);border-radius:10px;padding:8px 10px}
.linkbtn{background:none;border:0;color:var(--green-ink);text-decoration:underline;cursor:pointer;padding:2px}
.ok-t{color:var(--ok)} .bad-t{color:var(--bad)}
.gate{overflow-y:auto;align-items:safe center}

</style>
</head>

window.AUG_NOTES={"wstep": [{"t": "Wykład 1 – Czym jest filozofia? (7.10.2026)", "html": "<ul><li><b>Wykład 1:</b> Wstęp do filozofii</li></ul>\n<div class=\"meta\">🗓 Środa, 7 października 2026, 11:30</div>\n<ul><li>Sprawy organizacyjne</li><li>Notować! To, co na wykładzie</li></ul>\n<p>= skrypt.</p>\n<ul><li><b>Wykład</b> – zakaz nagrywania!</li><li>Skrypt</li></ul>\n<p>Notatki → koniecznie wyrobić sobie nawyk notowania.</p>\n<p>„Pobożność wynika ze studiowania. Pobożność może przeminąć, a wiedza nie, dlatego warto studiować.”</p>\n<ul><li>Wstęp do filozofii</li></ul>\n<p>O wstępie do filozofii można mówić, będąc w niej lub poza nią.</p>\n<p>Nie można mówić o filozofii bez filozofowania (pytanie „Co to filozofia?” jest pytaniem filozoficznym).</p>\n<h4><span class=\"num\">1.</span> Streszczenie albo zarys</h4>\n<p>Pierwsze spojrzenie na treści/problemy specyficzne dla filozofii.</p>\n<ul><li><b>Powinno być dokładne</b> – „jak fundament będzie zły, to cały dom runie”.</li></ul>\n<h4><span class=\"num\">2.</span> Meta (μετά)</h4>\n<ul><li><b>Metafilozofia</b> – filozofia na temat filozofii; metodologia danej dziedziny.</li><li><b>Metanoia</b> – nawrócenie (odbywa się przez rozum, a nie przez uczucia).</li><li><b>Meta</b> – dokonuje się razem albo po; ma związek z przemyśleniem (podczas lub po czymś).</li></ul>\n<h4><span class=\"num\">3.</span> Prześledzenie historii myśli ludzkiej</h4>\n<p>Historia → nabycie świadomości i jej zrozumienie.</p>\n<ul><li><b>Immanuel Kant</b> – czym jest Oświecenie.</li></ul>\n<p>Filozofia to sztuka zadawania pytań, ale też odpowiadania na nie.</p>\n<p>Wszyscy ludzie z natury chcą wiedzieć.</p>\n<p>Filozofia zmierza do odpowiedzi, ale nie zawsze ją daje; bierze się ze zdziwienia.</p>\n<p>„Wiem, że nic nie wiem.”</p>\n<p>Proces Sokratesa → Zapytać ks. Pawła Andryszczaka.</p>\n<ul><li><b>Doxa / Dogma</b> – przekonanie, opinia na temat czegoś; wyrażanie, że coś takie jest.</li><li><b>Episteme (ἐπιστήμη)</b> – ustalenie, pewność (że coś jest i jakie jest).</li></ul>\n<p>Napięcie między doxa a episteme.</p>\n<p>Wyznanie wiary (nicejskie) → pierwsze słowo pisteuomen (czyli: oni stwierdzają / ustalamy, że „Jest jeden Bóg...”).</p>\n<p>Sofiści → uwodzą ludzi swoją mową.</p>\n<h4><span class=\"num\">4.</span> Przygotowanie do studiowania i uprawiania filozofii</h4>\n<p>Logika.</p>\n<ul><li><b>Studiowanie języków starożytnych</b> – greka (klucz do filozofii).</li></ul>\n<p>Stawianie sobie pytań, które wcześniej ktoś zadał, i odpowiadanie na nie.</p>\n<h4><span class=\"num\">5.</span> Charakter literacki i pojęcia</h4>\n<ul><li><b>Isagoga</b> – wprowadzenie w podstawowe pojęcia filozoficzne, u podstaw filozofii.</li></ul>\n<p>Mistagogia.</p>\n<ul><li><b>Tekna theou</b> – jesteśmy dziećmi Boga, zrodzeni z Boga.</li></ul>\n<p>Philosophia → sophia (σοφία) + phileo (φιλέω) = umiłowanie mądrości (jest podstawą).</p>\n<ul><li><b>Dialekty starogreckie</b> – sprawdzić/dopytać.</li></ul>\n<p>Wyrazem mądrości jest przyznanie się do niewiedzy.</p>"}, {"t": "Wykład 2 – Thaumazein, droga Erosa i źródła kultury", "html": "<div class=\"eyebrow\">WSTĘP DO FILOZOFII – Wykład 2</div>\n<div class=\"meta\">🗓 Środa, 14 października 2026, 11:39</div>\n<h4><span class=\"num\">1.</span> Etymologia i specyfika miłowania (przedrostek philo-)</h4>\n<h5>Złożenia ze słowem philos / phileo</h5>\n<ul><li><b>filoaitos</b> – miłośnik życia filofilos – miłośnik miłowania</li><li><b>filippos (philippos)</b> – miłośnik koni filoksenios (philoxenos) – miłośnik przybyszów / gościnny</li><li><b>filozofia (philosophia)</b> – umiłowanie wiedzy / mądrości</li></ul>\n<h5>Paradoks i istota pragnienia</h5>\n<p>„Mogę tego mieć pod dostatkiem i to miłować, ale mogę miłować coś, czego nie mam”.</p>\n<p>„Kiedy zaczynamy studiować, zaczynamy miłować to, czego nie mamy”.</p>\n<h5>Anegdota o Pitagorasie</h5>\n<p>Gdy zapytano Pitagorasa, czy jest sofos (mędrcem), odpowiedział, że jest jedynie filozofem (filosofos – miłośnikiem mądrości). Bo tylko Bóg jest sofos (mądry).</p>\n<h4><span class=\"num\">2.</span> Źródła i geneza postawy filozoficznej</h4>\n<h5>Platon, Teajtet (155 D)</h5>\n<ul><li><b>Początkiem filozofowania jest thaumazein (θαυμάζειν</b> – zdziwienie / zdumienie). Filozofia rodzi się ze zdumienia.</li><li><b>Wszyscy ludzie z natury dążą do poznania (Arystoteles)</b> – dziwiąc się, uświadamiają sobie własną niewiedzę.</li></ul>\n<h5>Wątpliwość jako źródło mądrości</h5>\n<p>Siedliskiem wiedzy jest ona sama.</p>\n<h5>Anamneza (anamnesis)</h5>\n<ul><li><b>W anamnezie chodzi o to, by wejść w pamięć</b> – przypomnieć sobie, kim naprawdę jestem.</li></ul>\n<h5>Doświadczenie piękna i dylemat Eutyfrona (Platon)</h5>\n<p>Oglądanie piękna jest sprawą mądrości i miłości. Zachwyt nad czymś jest czymś boskim.</p>\n<ul><li><b>Problem z dialogu Eutyfron:</b> „Czy bogowie miłują coś, bo to jest godne miłości, czy dopiero coś, co kochają, staje się godne miłości?” (Co jest pierwotną przyczyną, a co wtórnym skutkiem?).</li></ul>\n<h4><span class=\"num\">3.</span> Filozofowanie jako droga życia i ćwiczenie w umieraniu</h4>\n<h5>Droga Erosa i oczyszczenie duszy (katharsis)</h5>\n<ul><li><b>Filozofować to postępować drogą Erosa</b> – kontemplować Piękno samo w sobie, ale zarazem odwiązywać duszę od ciała.</li></ul>\n<p>„Czy można umierać żyjąc, albo żyjąc umierać? Ćwiczenie się w umieraniu – to jest nasze życie (Memento Mori tego dotyczy). Nie boimy się samej śmierci, tylko procesu umierania”.</p>\n<ul><li><b>Prawdziwy cel:</b> kochać oglądanie tego, co prawdziwe.</li></ul>\n<h5>Filodoksja vs Filozofia</h5>\n<ul><li><b>Filodoksja (philodoxia)</b> – miłośnik opinii (plotek, mniemań, pozorów – doxa).</li></ul>\n<p>Filozofowanie to ujmowanie tego, co jest zawsze takie samo wobec siebie (niezmienne). Jeśli wszystko płynie i jest czystą zmianą, filozofia nie jest możliwa.</p>\n<h5>Spelunca (jaskinia) i pryzmat Dobra</h5>\n<p>Oglądać całą rzeczywistość przez pryzmat Idei Dobra.</p>\n<p>Postępować dobrze → budować sprawy według umiejętności demiurgicznej (na wzór boskiego Demiurga tworzącego ład z chaosu).</p>\n<h4><span class=\"num\">4.</span> Źródła kultury i konteksty teologiczno-filozoficzne</h4>\n<h5>Trzy źródła kultury europejskiej (trójkąt kulturowy)</h5>\n<ul><li><b>Żydzi (chrześcijaństwo)</b> – wiara, etyka, transcendencja, objawienie.</li><li><b>Grecy</b> – filozofia, racjonalizm, logos, nauka.</li><li><b>Rzymianie</b> – prawo, państwowość, ustrój republikański, organizacja.</li><li><b>Kultura bizantyjska:</b> Często zapominane, kluczowe źródło syntezy chrześcijaństwa z klasyczną myślą grecką.</li></ul>\n<h5>Islam jako źródło filozofii i teologii</h5>\n<ul><li><b>Mutazylizm (mutazylia):</b> Wczesny, racjonalistyczny nurt teologii muzułmańskiej, który stosował arystotelesowski aparat pojęciowy i racjonalne metody do interpretacji Koranu i pism natchnionych.</li></ul>"}, {"t": "Wykład 3 – Mądrość semicka a grecka; podział nauk (21.10.2026)", "html": "<ul><li>Zło (dialogiczne, intencjonalne, między osobami) a Nieszczęście (na poziomie sceny/natury: trzęsienie ziemi, choroba, wypadek).</li></ul>\n<div class=\"eyebrow\">WSTĘP DO FILOZOFII – Wykład 3</div>\n<div class=\"meta\">🗓 Środa, 21 października 2026, 11:35</div>\n<div class=\"topic\"><span>Temat</span>Dwa modele mądrości (semicki a grecki) oraz arystotelesowski podział wiedzy i nauk</div>\n<h4><span class=\"num\">1.</span> Dwa modele mądrości: Semicki (judaizm) a Grecki (hellenizm)</h4>\n<h4><span class=\"num\">A.</span> Model semicki (Hebrajski / Biblijny)</h4>\n<ul><li><b>Hebrajskie pochodzenie:</b> Hebrajczycy – dosł. ludzie zza wody / zza rzeki (Eufratu), niosący wiarę w jednego Boga (monoteizm).</li></ul>\n<h5>Mądrość jako postawa życiowa i sztuka egzystencji</h5>\n<p>Dla Semitów pytanie o mądrość nie jest pytaniem czysto teoretycznym o istotę bytu, lecz pytaniem egzystencjalnym: jak żyć → jak przeżyć w wierności Bogu. Mądry to ten, kto potrafi mądrze i sprawiedliwie pokierować swoim życiem.</p>\n<h5>Kultura pamiętania i przymierza (Izrael / kultura zbawienia / Toda)</h5>\n<p>Człowiek jest mądry, bo pamięta (pamiętać oznacza nieustannie uświadamiać sobie, kim jestem wobec Boga i skąd pochodzę – pamięć o przodkach i historii zbawienia).</p>\n<p>Mądry to ten, kto wiernie zachowuje przymierze z Bogiem i wydaje owoce tego przymierza w codziennym postępowaniu.</p>\n<h4><span class=\"num\">B.</span> Model grecki (Hellenistyczny / Teoretyczny)</h4>\n<ul><li><b>Pojęcia kluczowe:</b> Sofia (σοφία) – mądrość jako wiedza najwyższa; Episteme (ἐπιστήμη) – wiedza obiektywna, naukowa, uzasadniona.</li></ul>\n<h5>Poznanie jako widzenie i ogląd</h5>\n<p>W tradycji greckiej poznanie intelektualne wywodzi się bezpośrednio z metaforyki wzroku – poznać to mieć ogląd (ściana dłoni).</p>\n<h5>Greckie terminy poznawcze zakorzenione w widzeniu</h5>\n<ul><li><b>eidenai (εἰδέναι) – wiedzieć (etymologicznie:</b> zobaczyłem, więc wiem).</li><li><b>idein (ἰδεῖν)</b> – widzieć, spostrzegać (źródłosłów dla Idei).</li><li><b>horao (ὁράω)</b> – widzę, patrzę, dostrzegam.</li><li><b>aitia (αἰτία)</b> – przyczyna, powód, racja zaistnienia rzeczy.</li></ul>\n<h4><span class=\"num\">2.</span> Podział wiedzy i klasyfikacja nauk według Arystotelesa</h4>\n<h4><span class=\"num\">A.</span> Filozofia pierwsza a filozofia druga</h4>\n<p>Filozofia pierwsza (prote philosophia) → Metafizyka / Ontologia; nauka o bycie jako bycie (to on he on), badająca pierwsze zasady i ostateczne przyczyny rzeczywistości.</p>\n<p>Filozofia druga → Fizyka (filozofia przyrody badająca byty zmienne i materialne) oraz Matematyka (badająca byty idealne i ilościowe).</p>\n<h4><span class=\"num\">B.</span> Trójpodział aktywności rozumu i nauk</h4>\n<ul><li>Arystoteles podzielił ludzką wiedzę i aktywność intelektualną na trzy komplementarne dziedziny:</li></ul>\n<h5>Theoria (θεωρία – nauki teoretyczne / kontemplacja)</h5>\n<p>Ogląd tego, co jest konieczne i zawsze takie samo wobec siebie; wiedza bezinteresowna, poszukiwana dla niej samej, biorąca swój początek z doświadczenia zmysłowego (ontologia, teologia, fizyka, matematyka).</p>\n<h5>Praxis (πρᾶξις – nauki praktyczne / ludzkie działanie)</h5>\n<p>Wiedza dotycząca wolnego działania człowieka, mająca na celu ustalenie stałych praw i reguł postępowania umożliwiających osiągnięcie pełni szczęścia – eudajmonii (εὐδαιμονία).</p>\n<h5>Główne działy praxis</h5>\n<ul><li><b>Etyka – odpowiada na pytanie:</b> jak działać, by osiągnąć dobro? Badanie ludzkiego ethosu.</li><li><b>Zasada Heraklita:</b> ethos anthropo daimon (ἦθος ἀνθρώπῳ δαίμων) – „charakter/ethos człowieka jest jego losem (demonem)” → źródłem nieszczęścia, zguby lub ocalenia człowieka jest on sam i jego wewnętrzne wybory moralne.</li><li><b>Ekonomia (oikonomia)</b> – ustalenie reguł prawnych i organizacyjnych, aby dom (oikos) i jego mieszkańcy mieli zapewnione wszystko, co niezbędne do godnego życia.</li><li><b>Polityka</b> – nauka o sprawiedliwym ustroju i wspólnym dobru obywateli w ramach polis.</li><li><b>Retoryka, Homiletyka, Erystyka</b> – sztuki sprawnego, logicznego i przekonującego argumentowania słowem (odpowiednio: w mowie publicznej, kaznodziejstwie kościelnym i dyspucie logicznej; oparte na życzliwym tłumaczeniu i wyjaśnianiu).</li></ul>\n<h5>Poiesis / Poietike (ποίησις / ποιητική – nauki pojetyczne / wytwórcze)</h5>\n<ul><li><b>Zasada dobrej twórczości umysłowej</b> – wiedza i umiejętności nakierowane na wytworzenie konkretnego dzieła materialnego, artystycznego lub technicznego (sztuka, poezja, rzemiosło, architektura).</li></ul>"}, {"t": "Wykład – Rzym, rekapitulacja cech filozofii, źródła filozofowania wg Jaspersa", "html": "\n<div class=\"eyebrow\">WSTĘP DO FILOZOFII – Wykład</div>\n<div class=\"topic\"><span>Temat</span>Rzymski sposób rozumienia mądrości (ars vitae, prawo rzymskie), rekapitulacja genezy i specyfiki filozofii zachodniej, transcendencja i transcendentalność, psychologiczne źródła filozofowania (K. Jaspers)</div>\n<h4><span class=\"num\">1.</span> Kontekst: Imperium Osmańskie i rzymska praktyczność</h4>\n<ul>\n<li>Renesans w świecie muzułmańskim – rozkwit nauki, poezji i sztuki; sam Sulejman był ponoć poetą i publikował pod pseudonimem.</li>\n<li><b>Hamam</b> – to, co u Rzymian było łaźnią; Rzymianie nazywali system ogrzewania <b>hypokaustum</b> (ogrzewanie podłogowe ciepłym powietrzem). Pokazuje to rzymską praktyczność.</li>\n</ul>\n\n<h4><span class=\"num\">2.</span> Rzymski sposób rozumienia mądrości</h4>\n<ul>\n<li>Na wykładzie historii filozofii starożytnej zwykle nie ma osobnego działu „filozofia rzymska” – rzymscy autorzy to w gruncie rzeczy <b>stoicy albo cynicy</b>: np. <b>Marek Aureliusz</b> (filozofujący cesarz), <b>Julian Apostata</b> (z ostatniej fazy, raczej Grek).</li>\n<li>Rzymskie rozumienie mądrości to <b>sztuka praktyczna</b> – <i>ars</i>:\n<ul>\n<li><b><i>Ars vitae</i></b> – sztuka życia: jak żyć dobrze i pięknie, jak w codzienności czerpać radość i należną przyjemność z tego, co zwykłe (stoicy, ale także epikurejczycy).</li>\n<li><b><i>Ars moriendi</i></b> – sztuka umierania (skoro sztuka życia, to i tego, co w życie wpisane).</li>\n<li>Sztuka <b>wyboru</b> między dobrem a złem; umiejętność korzystania.</li>\n</ul></li>\n<li><b>Horacy</b> – „Non omnis moriar”; w innym wierszu mówi, że swoją poezją zbudował pomnik „trwalszy niż ze spiżu” (<i>exegi monumentum aere perennius</i>) – figuratywne: poezja trwalsza niż spiż.</li>\n<li>Rzymianie sięgali po kulturę grecką na własną potrzebę, <b>asymilując</b> ją (podobnie jak Aleksandria); potem chrześcijaństwo zrobi coś podobnego.</li>\n</ul>\n\n<h4><span class=\"num\">3.</span> Prawo rzymskie – fundament kultury europejskiej</h4>\n<ul>\n<li>Nie ma Europy ani kultury prawnej dzisiejszego świata bez <b>prawa rzymskiego</b>; studia prawnicze zaczynają się od jego zasad.</li>\n<li><b><i>Lex</i></b> – prawo (gr. <i>nomos</i>). <b><i>Dura lex, sed lex</i></b> – „twarde prawo, ale prawo”: powszechność (obowiązuje wszystkich) i surowość, przekonanie o nieuchronności.</li>\n<li>Ciekawostka: cesarz, wymagając prawa, sam był pod prawem.</li>\n<li><b>Imperator</b> – ten, który włada państwem w granicach, które <b>sam ustanawia</b> (<i>imperium</i>) – nikt mu ich nie narzuca. Odniesienia do współczesnych „imperatorów”.</li>\n<li><i>Lex</i> ma charakter materialny – to zapis, <b>litera prawa</b>. Opisuje, co słuszne i niesłuszne; w wymiarze regulacyjnym ma <b>funkcję negatywną</b>: nie nagradza dobrych czynów, wskazuje, co zakazane, i przewiduje sankcje.</li>\n<li><i>Lex</i> opiera się na uprzednim <b>wyczuciu tego, co należy do prawa</b> – Rzymianie nazywali to <b><i>ius</i></b>. Z tym wiąże się <b><i>iustitia</i></b> – sprawiedliwość: postawa, cnota, umiejętność <b>oddania każdemu tego, co mu się należy</b>.</li>\n<li>Prawo kodyfikowane: dotyczące miast, handlu, dziedziczenia, praw obywatelskich, państwa.</li>\n<li><b><i>Nasciturus</i></b> – „ten, który ma się narodzić”: dziecko jeszcze nienarodzone posiadało już w prawie rzymskim prawa, np. <b>dziedziczyło</b>.</li>\n</ul>\n\n<h4><span class=\"num\">4.</span> Rekapitulacja: geneza i specyfika filozofii świata zachodniego (grecko-rzymskiego)</h4>\n<h5>a) Kiedy i gdzie</h5>\n<ul>\n<li>Pojawia się ok. <b>VII–VI w. p.n.e.</b>, najpierw na obrzeżach – w koloniach greckiego świata – potem także w stolicach (V–IV w.: Ateny, sofiści).</li>\n<li><b>Transfer geograficzny i społeczny</b>: filozofowanie przestaje być zajęciem elitarnym, właściwym arystokracji („nie mają co robić, to filozofują”) – staje się postawą dostępną dla wszystkich, bo do filozofowania wszyscy ludzie są zdolni z natury. Dla Greków nie było to oczywiste (filozofia nie może być barbarzyńska – jest „nasza”).</li>\n<li>Demokracja wyraża ideał współdecydowania wszystkich obywateli (realizacja była oczywiście nieidealna). Filozofują nie tylko obywatele: także <b>metojkowie</b> (mieszkający obok polis, z częściowymi prawami) i <b>niewolnicy</b> – np. <b>Epiktet z Hierapolis</b>, „drugi Sokrates”: szukał optymalnej kondycji człowieka, nie pozostawił pism, nauczał przez dialog.</li>\n<li><b>Kobiety-filozofki</b>: nazywane „niebezpiecznymi”, wyróżniały się mądrością i niezależnością poglądów; niektóre prowadziły szkoły, np. <b>Arete</b>, córka Arystypa Starszego. Część nazywano <b>heterami</b> (dosł. „inne” – inny sposób bycia niż zwykle u kobiet w Grecji). <b>Aspazja z Miletu</b>, żona Peryklesa – Sokrates miał u niej pobierać lekcje „erotyki”, czyli zgłębiania mądrości, która jest jak eros. Także <b>Hypatia z Aleksandrii</b> (późny antyk), zabita przez chrześcijan.</li>\n</ul>\n<h5>b) Od mitu do logosu</h5>\n<ul>\n<li>Przejście od <b>teogonii do teologii</b>, od <b>antropogonii do antropologii</b>, od <b>kosmogonii do kosmologii</b> – wspólny mianownik: od <b>mitu do logosu</b>.</li>\n<li>Błędne, naiwne rozumienie: że filozofia porzuciła mit i religię („ludzie nie myśleli, a potem nagle zaczęli”). Naprawdę przejście polega na <b>krytyce mitu</b> – próbie zrozumienia, co mit chce nam powiedzieć. Mity pozostają obecne (Sokrates opowiada mit Diotymy o Erosie).</li>\n</ul>\n<h5>c) Rozumność i krytyczność</h5>\n<ul>\n<li>Wyrażają się w założeniach, metodzie i celu: poszukiwanie tego, co <b>wspólne, ogólne, podstawowe</b> – w teorii i w praktyce (sztuka życia).</li>\n<li>Poszukiwanie rozstrzygnięcia w sposób <b>bezzałożeniowy</b> (na ile się da) i <b>otwarty</b> – filozofia nie zakłada z góry odpowiedzi, nie chodzi o udowodnienie tego, co „należy udowodnić”.</li>\n</ul>\n<h5>d) Naturalność (bez objawienia)</h5>\n<ul>\n<li>Odwołanie tylko do tego, co <b>naturalne</b> – to natura pokazuje. Brak czynnika nadnaturalnego, objawionego (choć Grecy mówią o bogach, którzy się odsłaniają).</li>\n<li><b>Rewelacja</b> (łac. <i>revelatio</i>) = objawienie, odsłonięcie. Greckim odpowiednikiem jest <b>apokalipsa</b> – to nie „straszna księga o końcu”, lecz <b>odsłonięcie zamysłu Boga</b>. Por. Ewangelia: „Wysławiam Cię, Ojcze… że odsłoniłeś (<i>apekalypsas</i>) to prostaczkom”.</li>\n</ul>\n<h5>e) Pytanie o całość – „katolickie”</h5>\n<ul>\n<li>Filozofia pyta o to, co ogólne, obecne we wszystkim, w całości – po grecku <b>katholikos</b> (<i>kath’ holou</i>): <b>powszechne</b>, wszędzie obecne, dotyczące wszystkich (choć wszędzie na swój sposób). To nie żaden ekskluzywizm.</li>\n<li>Dziś słowo nabrało innego sensu („nie taki jak inni”: rzymskokatolicki, polskokatolicki, starokatolicki, greckokatolicki) – dookreślenie przeczy pierwotnemu znaczeniu powszechności.</li>\n<li>Filozofia wyznacza <b>pole racjonalności</b> obejmujące całość (uniwersum) – nie ma „czegoś poza polem”.</li>\n</ul>\n<h5>f) Dyskurs oparty na twierdzeniach</h5>\n<ul>\n<li>Twierdzenie to nie „powiedzieć cokolwiek” – wyraża zastosowanie metody i założeń; dotyczy tego, co <b>konieczne</b>, a nie przygodne.</li>\n<li>Przykład: twierdzenie Pitagorasa <i>a² + b² = c²</i> – wyraża coś koniecznego niezależnie od tego, czy je rozumiemy.</li>\n</ul>\n<h5>g) Immanencja i transcendencja</h5>\n<ul>\n<li>Pytanie o całość jest <b>metaprzedmiotowe</b> (por. pierwsze zajęcia).</li>\n<li><b>Immanencja</b> – to, co obecne wszędzie, co pozostaje „wewnątrz”.</li>\n<li><b>Transcendencja</b> (łac. <i>transcendere</i>) – to, co <b>wykracza, przekracza</b>, a zarazem jest obecne w tym, o co pytamy. Nie musi mieć znaczenia teologicznego – np. decyzje człowieka, które wykraczają ponad to, co zwykle.</li>\n<li><b>Transcendentalne</b> (inaczej niż transcendentne) = <b>warunki możliwości</b> czegoś. <b>Kant</b> buduje filozofię transcendentalną – zawsze w odniesieniu do <b>podmiotu</b>: np. jakie są warunki możliwości poznania (<i>Krytyka czystego rozumu</i>). Więcej w skrypcie.</li>\n</ul>\n\n<h4><span class=\"num\">5.</span> Psychologiczne źródła postaw filozoficznych – Karl Jaspers</h4>\n<ul>\n<li><b>Karl Jaspers</b> (1883–1969) – psycholog, psychiatra i filozof; wskazał psychologiczne źródła poszczególnych postaw filozoficznych.</li>\n<li>(Dygresja prowadzącego o „psychologizacji” i komentarzach pewnego profesora wobec młodych księży – kompetencje profesora są wąskie; wypowiadając się poza dyscypliną, mówi się jako człowiek, nie jako autorytet. „Łaska wystarczy” – to nie znaczy, by rezygnować z rozumu, nauki i techniki.)</li>\n</ul>\n<h5>Źródło 1: Zdziwienie (thaumazein) → metafizyka</h5>\n<ul>\n<li>Dziwimy się i filozofujemy. Przeżywanie ma ładunek emocjonalny, ale <b>umiarkowany</b> (raczej neutralny).</li>\n<li>Postawa zdziwienia to w tradycji późniejsza <b>kontemplacja</b> – ogląd tego, co budzi zdziwienie (w średniowieczu nabierze szczególnego znaczenia).</li>\n<li>Zdziwienie dotyczy tego, co <b>zwyczajne i codzienne</b>: dlaczego jest tak jak zawsze, a nie inaczej? Nie chodzi o szukanie sensacji („cudów na szybie”).</li>\n<li>Z takiego zdziwienia rodzi się <b>metafizyka</b>.</li>\n</ul>\n<h5>Źródło 2: Wątpienie („zdziwienie plus”)</h5>\n<ul>\n<li>Postawa już nie neutralna, bardziej złożona: wątpię w coś, co jest dla mnie <b>istotne, ważne</b>. Łac. <i>dubitatio</i>.</li>\n<li><b>Kartezjusz</b> uczynił wątpienie filarem swojej metody: <b>wątpienie metodyczne</b> we wszystko, by znaleźć to, czego nie da się podważyć (pewne). Nie oznacza to krytykanctwa ani podważania wszystkiego dla zasady – to testowanie, szukanie kryteriów pewności.</li>\n</ul>\n"}], "histfil": [{"t": "Wykład 1 i ćwiczenia – narodziny filozofii, praca semestralna", "html": "<div class=\"eyebrow\">HISTORIA FILOZOFII</div>\n<ul><li><b>Ćwiczenia</b> – zadanie semestralne</li><li><b>Forma:</b> Pisemna praca semestralna.</li></ul>\n<div class=\"topic\"><span>Temat</span>Koncepcja miłości w „Uczcie” Platona – analiza i ocena.</div>\n<ul><li><b>Termin oddania:</b> do 11.01.2027.</li><li><b>Wymogi formalne:</b> 5–7 stron, czcionka 12, konieczne przypisy.</li></ul>\n<h4><span class=\"num\">1.</span> Geneza filozofii europejskiej (Grecja)</h4>\n<ul><li><b>Filozofia grecka wyróżnia Greków na tle innych kultur</b> – jest czymś zupełnie nowym (ludy Wschodu nie miały odpowiednika ani niczego podobnego).</li><li><b>Warunki powstania:</b> szczególne miejsce i ranga wolności u Greków.</li><li><b>Polis staje się horyzontem całego życia Greka</b> – cele państwa to cele jednostki (dobro wspólne, ustrój republikański).</li><li><b>Ekspansja terytorialna:</b> Filozofia narodziła się najpierw na peryferiach (w koloniach – Jonii i Wielkiej Grecji), a dopiero później dotarła do Grecji macierzystej.</li></ul>\n<h4><span class=\"num\">2.</span> Specyfika i wartość filozofii</h4>\n<h5>Trzy fundamentalne cechy konstytuujące filozofię</h5>\n<ul><li><b>Przedmiot:</b> Chce wyjaśnić wszystko – całą rzeczywistość (w ten sposób różni się od nauk szczegółowych badających jedynie wycinki; np. Tales: „Co jest zasadą [arche] wszystkiego?”).</li><li><b>Metoda:</b> Dąży do bycia racjonalnym wyjaśnieniem owej całości. Liczy się wyłącznie argument rozumowy, logiczne uzasadnienie (logos), a nie samo bezkrytyczne stwierdzenie czy potoczne doświadczenie. Szuka racji, przyczyny i zasady.</li><li><b>Cel:</b> Ma charakter czysto teoretyczny (theoria – bezinteresowna kontemplacja prawdy). Zmierza do prawdy dla niej samej, bez względu na doraźną korzyść materialną. Jest wolna od pragmatyzmu.</li></ul>\n<p>Pytania filozoficzne (np. o sens) są pierwotnym źródłem filozofii – od tych pytań i odpowiedzi na nie zależy to, jak żyję.</p>\n<h4><span class=\"num\">3.</span> Działy filozofii</h4>\n<h4><span class=\"num\">I.</span> Ogólna nauka o bycie – Metafizyka / Ontologia</h4>\n<h5>Klasyczny podział grecki (Fizyka)</h5>\n<ul><li>Nauka o przyrodzie</li><li>Nauka o duszy → Psychologia</li></ul>\n<p>Nauka o Bogu → Teologia (w ujęciu filozoficznym / teologia naturalna)</p>\n<h4><span class=\"num\">II.</span> Ogólna nauka o poznaniu – Epistemologia / Gnoseologia</h4>\n<h5>Klasyczny podział grecki (Logika)</h5>\n<ul><li>Teoria poznania</li><li>Krytyka poznania</li></ul>\n<h4><span class=\"num\">III.</span> Ogólna nauka o wartościach – Aksjologia</h4>\n<h5>Współczesny / tradycyjny podział</h5>\n<p>Etyka (nauka o dobru i moralności)</p>\n<p>Estetyka (nauka o pięknie i sztuce)</p>"}, {"t": "Wykład 1 – rozwinięcie akademickie", "html": "<div class=\"eyebrow\">HISTORIA FILOZOFII – SZCZEGÓŁOWE ROZWINIĘCIE MATERIAŁU</div>\n<h4><span class=\"num\">1.</span> Geneza filozofii europejskiej: „Cud grecki”</h4>\n<p>Filozofia w ścisłym znaczeniu narodziła się na przełomie VII i VI wieku p.n.e. w starożytnej Grecji. Nie powstała ona w izolacji kulturowej, jednak stanowiła radykalne novum na tle cywilizacji Bliskiego Wschodu (Egiptu, Babilonii czy Persji).</p>\n<h5>Mit a Logos (Przejście od mitu do rozumu)</h5>\n<p>Ludy Wschodu gromadziły potężną wiedzę praktyczną (np. geometrię potrzebną Egipcjanom do wytyczania pól po wylewach Nilu czy babilońską astrologię do wróżbiarstwa), lecz ich wyjaśnienia świata miały charakter mitologiczno-religijny (mythos).</p>\n<ul><li><b>Grecy jako pierwsi dokonali demitologizacji</b> – przestali wyjaśniać burzę gniewem Zeusa, a zaćmienie słońca walką bóstw. Zastąpili opowieść mitologiczną dociekaniem racjonalnym (logos), szukając w samej naturze wewnętrznych praw nią rządzących.</li></ul>\n<h5>Społeczno-polityczne warunki narodzin filozofii</h5>\n<ul><li><b>Idea wolności (eleutheria):</b> Grek uważał się za obywatela, a nie poddanego teokratycznego monarchy czy niewolnika despoty (jak w państwach wschodnich).</li><li><b>Fenomen Polis:</b> Miasto-państwo stanowiło przestrzeń publicznej debaty na agorze. Ustrój republikańsko-demokratyczny wymusił konieczność argumentacji – w zgromadzeniu nie decydował autorytet czy siła, lecz siła logicznego argumentu przekonującego współobywateli.</li><li><b>Religia bez dogmatów i kasty kapłańskiej:</b> W Grecji nie było świętych ksiąg o statusie nienaruszalnego objawienia ani kasty kapłanów strzegących ortodoksji. Pozwalało to na nieskrępowaną swobodę myślenia i stawiania pytań.</li></ul>\n<p>Dlaczego kolonie (Jonia i Wielka Grecja)?</p>\n<p>Pierwsze szkoły filozoficzne nie powstały w Atenach czy Sparcie, lecz na wybrzeżach Azji Mniejszej (Milet – Tales, Anaksymander, Anaksymenes; Efez – Heraklit) oraz w południowych Włoszech (Krotona – pitagorejczycy; Elea – Parmenides).</p>\n<p>Kolonie były węzłami handlowymi, w których krzyżowały się różne kultury, religie i zwyczaje. Ta różnorodność rodziła krytycyzm: skoro każdy lud wierzy w innych bogów, to co jest obiektywną prawdą o świecie? Dopiero po wojnach perskich (V w. p.n.e.) centrum myśli filozoficznej przeniosło się do Aten.</p>\n<h4><span class=\"num\">2.</span> Istota, specyfika i cel filozofii</h4>\n<ul><li>Filozofia odróżnia się od mitu, religii i nauk szczegółowych trzema konstytutywnymi wymiarami:</li></ul>\n<h4><span class=\"num\">A.</span> Przedmiot – Totum (Całość rzeczywistości)</h4>\n<p>Nauki szczegółowe (fizyka, biologia, ekonomia) wyodrębniają pewien wycinek bytu i badają go pod określonym kątem (np. biologia bada wyłącznie organizmy żywe).</p>\n<p>Filozofia pyta o całość bytu jako bytu (to on he on). Jej fundamentalne pytanie to: Dlaczego istnieje raczej coś niż nic? oraz Co stanowi ostateczną zasadę rzeczywistości (archē)? (np. dla Talesa wodą, dla Anaksymandra bezkresem – apeiron, dla Pitagorasa liczbą).</p>\n<h4><span class=\"num\">B.</span> Metoda – Logos (Czysty rozum i argumentacja)</h4>\n<p>Religia opiera się na wierze i autorytecie objawienia.</p>\n<p>Filozofia przyjmuje wyłącznie twierdzenia uzasadnione drogą racjonalną – poprzez dowód dedukcyjny, analizę pojęciową i logikę. Nie wystarczy autorytatywne orzeczenie; teza musi obronić się w dyskursie dialektycznym przed kontrargumentami.</p>\n<h4><span class=\"num\">C.</span> Cel – Theoria (Bezinteresowna kontemplacja prawdy)</h4>\n<p>Arystoteles pisał, że filozofia jest nauką „najbardziej boską” i wolną, ponieważ istnieje sama dla siebie. Nie służy żadnemu celowi techniczno-użytkowemu ani zyskowi.</p>\n<ul><li><b>Theoria (od theorein</b> – wpatrywać się, kontemplować) to czysta radość poznawania prawdy o strukturze wszechświata. Paradoksalnie, choć filozofia nie ma bezpośredniej użyteczności praktycznej, to – jak głosi notatka – „od tych pytań i odpowiedzi na nie zależy to, jak żyję”. Kształtuje bowiem ostateczny sens ludzkiej egzystencji.</li></ul>\n<h4><span class=\"num\">3.</span> Trójdzielna struktura systemu filozoficznego</h4>\n<p>Podział utrwalony w epoce hellenistycznej (głównie przez stoików i perypatetyków) dzieli filozofię na trzy filary:</p>\n<div class=\"eyebrow\">FILOZOFIA</div>\n<ul><li>┌───────────────────┼───────────────────┐</li><li>▼ ▼ ▼</li><li>METAfizyka EPISTEMOLOGIA AKSjologia</li></ul>\n<p>(nauka o bycie) (nauka o poznaniu) (nauka o wartościach)</p>\n<ul><li>│ │ │</li><li>┌────┴────┐ ┌────┴────┐ ┌────┴────┐</li><li>Fizyka Dusza/Bóg Logika Krytyka Etyka Estetyka</li></ul>\n<p>kosm. (Psychol./ formalna poznania (Dobro) (Piękno)</p>\n<p>Teologia)</p>\n<h5>Metafizyka / Ontologia (dawna „Fizyka” szeroko rozumiana)</h5>\n<ul><li><b>Kosmologia / filozofia przyrody:</b> bada świat materialny, ruch, czas, przestrzeń i materię.</li><li><b>Psychologia filozoficzna:</b> nauka o duszy (psyche) jako zasadzie życia, poznania i samoświadomości.</li><li><b>Teologia filozoficzna (teologia naturalna):</b> dociekanie istnienia i przymiotów Pierwszej Przyczyny / Boga w oparciu o sam rozum, bez odwoływania się do tekstów natchnionych.</li></ul>\n<h5>Epistemologia / Gnoseologia (Logika w ujęciu szerokim)</h5>\n<ul><li><b>Logika:</b> nauka o poprawności form myślenia, wynikania i dowodzenia.</li><li><b>Teoria i krytyka poznania:</b> bada granice, źródła i kryteria prawdziwości ludzkiego poznania (Czy poznajemy rzeczy takimi, jakie są naprawdę, czy tylko takimi, jakimi nam się jawią?).</li></ul>\n<h5>Aksjologia (Nauka o wartościach)</h5>\n<ul><li><b>Etyka:</b> bada naturę dobra, cnoty (arete), szczęścia (eudaimonia) i obowiązków moralnych człowieka.</li><li><b>Estetyka:</b> bada kryteria piękna, harmonii, wzniosłości oraz naturę sztuki i twórczości artystycznej.</li></ul>\n<h4><span class=\"num\">4.</span> Wytyczne do pracy semestralnej: Koncepcja miłości w „Uczcie” Platona</h4>\n<p>Zadana praca (5–7 stron, czcionka 12, aparat przypisów, termin do 11.01.2027) wymaga krytycznej analizy dialogu Platona. Warto oprzeć jej strukturę na dynamice poszczególnych mów:</p>\n<h5>Wstęp</h5>\n<p>Okoliczności uczty u Agatona (świętowanie zwycięstwa w konkursie tragedii).</p>\n<p>Przejście od potocznych wyobrażeń o Erosie do jego filozoficznej interpretacji.</p>\n<h5>Część analityczna – stopnie ujęcia miłości</h5>\n<ul><li><b>Fajdros:</b> Eros jako najstarszy z bogów, źródło męstwa i honoru na polu walki.</li><li><b>Pauzaniasz:</b> Rozróżnienie na Erosa Wszechpowszechnego (zmysłowego, cielesnego) i Erosa Niebiańskiego (duchowego, cnotliwego).</li><li><b>Eryksymachos:</b> Eros jako uniwersalna zasada harmonii w całej przyrodzie i medycynie.</li><li><b>Arystofanes:</b> Mit o Androgynach – miłość jako tęsknota za utraconą całością i poszukiwanie „drugiej połówki”.</li><li><b>Agaton:</b> Poetycka pochwała Erosa jako najmłodszego, najpiękniejszego i najdelikatniejszego z bogów.</li></ul>\n<h5>Kulminacja – Mowa Sokratesa (Nauka Diotymy z Mantinei)</h5>\n<ul><li><b>Geneza Erosa:</b> Jest synem Porosa (Dostatku) i Penii (Biedy) – nie jest bogiem, lecz wielkim Demonem (daimonion), pośrednikiem między tym, co ludzkie, a tym, co boskie. Jest wiecznie głodny, ale przedsiębiorczy w poszukiwaniu dobra.</li><li><b>Drabina miłości Diotymy (anabasis):</b> Droga wznoszenia się od miłości do jednego pięknego ciała → do wszystkich pięknych ciał → do piękna dusz i charakterów → do piękna praw, nauk i instytucji → aż do Idei Piękna samego w sobie (absolutnego, wiecznego i niezmiennego).</li></ul>\n<h5>Zakończenie i ocena</h5>\n<p>Wtargnięcie pijanego Alkibiadesa jako żywa ilustracja i test teorii: Sokrates jako ucieleśnienie prawdziwego filozofa odpornego na czysto zmysłowe pokusy.</p>\n<ul><li><b>Ocena krytyczna:</b> platoniczny wzniosły spirytualizm a niebezpieczeństwo instrumentalizacji człowieka z krwi i kości na drodze do czystej idei.</li></ul>"}, {"t": "Uczta Platona – mowy na cześć Erosa po kolei", "html": "<h4><span class=\"num\">1.</span> Fajdros – Eros jako najstarszy bóg i źródło męstwa</h4>\n<ul><li><b>Kim jest:</b> Młody entuzjasta retoryki.</li><li><b>Główna myśl:</b> Eros to najstarszy z bogów, który nie ma rodziców (zrodził się zaraz po Chaosie i Ziemi).</li><li><b>Sens mowy:</b> Miłość jest największym źródłem odwagi, honoru i męstwa moralnego. Zakochany boi się popełnić czyn haniebny na oczach ukochanego; oddział złożony z kochanków byłby niezwyciężony na polu walki (gotowość do poświęcenia życia za drugiego, jak Alkestis czy Achilles).</li></ul>\n<h4><span class=\"num\">2.</span> Pauzaniasz – Rozróżnienie dwóch Erosów (moralista / prawnik)</h4>\n<ul><li><b>Kim jest:</b> Dojrzały erudyta, kochanek gospodarza uczty, Agatona.</li><li><b>Główna myśl:</b> Eros nie jest jeden – towarzyszy Afrodycie, a skoro są dwie Afrodyty, istnieją też dwa Erosy:</li><li><b>Eros Wszeteczny (Pospolity / Afrodyta Pandemos):</b> Płytki, zmysłowy, skierowany na ciało (zarówno kobiet, jak i mężczyzn), zmienny i pożądliwy.</li><li><b>Eros Niebiański (Afrodyta Urania):</b> Szlachetny, stały, skierowany na duszę i umysł, zmierzający do cnoty i mądrości.</li><li><b>Sens mowy:</b> Wartość miłości zależy od tego, jak i ku czemu dąży. Prawdziwa miłość uszlachetnia i ma wymiar etyczny.</li></ul>\n<h4><span class=\"num\">3.</span> Eryksymachos – Eros jako uniwersalna zasada harmonii (lekarz)</h4>\n<p>(Zabiera głos przed Arystofanesem, bo ten dostał ataku czkawki).</p>\n<ul><li><b>Kim jest:</b> Lekarz przywiązujący wagę do ładu naturalnego i nauki.</li><li><b>Główna myśl:</b> Poszerza koncepcję Pauziasza z relacji międzyludzkich na całą naturę i kosmos.</li><li><b>Sens mowy:</b> Eros to siła harmonizująca przeciwieństwa (ciepło–zimno, suchość–wilgoć). Dobry Eros zaprowadza równowagę (zdrowie w ciele, harmonię w muzyce, dobre pory roku w rolnictwie), a zły Eros wprowadza chaos, zarazy i choroby. Miłość jest więc kosmologiczną zasadą harmonii.</li></ul>\n<h4><span class=\"num\">4.</span> Arystofanes – Mit o androgynach (komediopisarz)</h4>\n<ul><li><b>Kim jest:</b> Mistrz komedii ateńskiej.</li><li><b>Główna myśl:</b> Słynny mit o pierwotnej naturze ludzkiej. Kiedyś istniały trzy płcie (męska od słońca, żeńska od ziemi i androgyniczna – obupłciowa – od księżyca). Ludzie mieli po 4 ręce, 4 nogi, 2 twarze i byli tak potężni, że zbuntowali się przeciw bogom.</li><li><b>Sens mowy:</b> Zeus w karze przeciął każdego człowieka na pół. Od tamtej pory każda połowa tęskni za swoją drugą częścią i próbuje się z nią zrosnąć. Eros to pragnienie i poszukiwanie utraconej całości – uleczenie naszej rozciętej natury.</li></ul>\n<h4><span class=\"num\">5.</span> Agaton – Poetycka pochwała samego bóstwa (gospodarz / tragik)</h4>\n<ul><li><b>Kim jest:</b> Młody, piękny poeta tragiczny świętujący zwycięstwo w konkursie dramatycznym.</li><li><b>Główna myśl:</b> Zauważa, że poprzednicy chwalili dary Erosa, a nie samego boga. Przeczy Fajdrosowi i twierdzi, że Eros jest najmłodszym z bogów (ucieka przed starością), najdelikatniejszym (mieszka w miękkich duszach) oraz posiadającym wszystkie cnoty (sprawiedliwość, umiarkowanie, męstwo i mądrość).</li><li><b>Sens mowy:</b> Efektowny, retoryczny pean ukazujący Erosa jako absolutne ucieleśnienie piękna i dobra.</li></ul>\n<h4><span class=\"num\">6.</span> Sokrates (Nauka Diotymy) – Eros jako pragnienie piękna i wiedzy</h4>\n<ul><li><b>Kim jest:</b> Filozof; zanim zacznie, delikatnie obala mowę Agatona pytaniem: Skoro miłość to pragnienie piękna, to czy Eros sam jest piękny? (Pragnie się tylko tego, czego się nie ma).</li></ul>\n<h5>Główna myśl (przekazana od wieszczki Diotymy z Mantinei)</h5>\n<ul><li><b>Pochodzenie Erosa:</b> Nie jest bogiem ani człowiekiem, lecz wielkim demonem (pośrednikiem). Został spłodzony na urodzinach Afrodyty przez Porosa (Dostatek / Pomysłowość) i Penię (Biedę). Dlatego jest wiecznie ubogi i głodny, ale też zaradny, odważny i wiecznie dążący do dobra.</li><li><b>Cel miłości:</b> Rodzenie w pięknie (zarówno cieleśnie – potomstwo, jak i duchowo – dzieła sztuki, prawa, cnoty, mądrość).</li></ul>\n<h5>Drabina miłości (anabasis): Wspinaczka duszy</h5>\n<p>Zakochanie w jednym pięknym ciele.</p>\n<p>Dostrzeżenie piękna we wszystkich ciałach.</p>\n<p>Dostrzeżenie wyższości piękna duszy i umysłu nad pięknem ciała.</p>\n<p>Piękno w ludzkich prawach, obyczajach i naukach.</p>\n<ul><li><b>Szczyt:</b> Kontemplacja Idei Piękna samego w sobie (wiecznego, niezmiennego i absolutnego).</li></ul>\n<h4><span class=\"num\">7.</span> Alkibiades – Żywy portret i pochwała Sokratesa (wtargnięcie)</h4>\n<ul><li><b>Kim jest:</b> Pijany, charyzmatyczny wódz i polityk ateński, wieniec na głowie.</li><li><b>Główna myśl:</b> Zamiast chwalić abstrakcyjnego boga Erosa, wygłasza mowę pochwalną na cześć Sokratesa.</li><li><b>Sens mowy:</b> Porównuje Sokratesa do figurek sylenów – z zewnątrz brzydki i ironiczny, wewnątrz kryje złote posągi boskich cnót. Opowiada, jak próbował uwieść Sokratesa swoją urodą, ale mędrzec pozostał całkowicie obojętny na cielesne zaloty. Jest to praktyczny test i dowód na to, że Sokrates rzeczywiście osiągnął szczyt drabiny Diotymy.</li></ul>"}, {"t": "Wykład 2 – okresy filozofii starożytnej, Tales (12.10.2026)", "html": "<div class=\"eyebrow\">HISTORIA FILOZOFII – Wykład 2</div>\n<div class=\"meta\">🗓 Poniedziałek, 12 października 2026, 08:44</div>\n<div class=\"topic\"><span>Temat</span>Okresy filozofii starożytnej, przejście od mitu do nauki oraz Tales z Miletu i hylozoizm</div>\n<h4><span class=\"num\">1.</span> Wprowadzenie do filozofii starożytnej</h4>\n<ul><li><b>Filozofia</b> – miłość mądrości (od phileo i sophia).</li></ul>\n<p>VI w. p.n.e. – moment, kiedy termin ten po raz pierwszy pojawia się w użyciu (tradycja przypisuje go Pitagorasowi).</p>\n<ul><li><b>Przedmiot:</b> wiedza o zjawiskach, wiedza o bycie. Filozofia to pierwotnie wszechstronna, uniwersalna dziedzina wiedzy.</li><li><b>Arystoteles:</b> dążenie do oddzielenia filozofii od mitów; filozofia to „najwyższe poznanie rzeczy, sedna”.</li></ul>\n<h4><span class=\"num\">2.</span> Periodyzacja filozofii europejskiej i starożytnej</h4>\n<h5>Główne epoki filozofii europejskiej</h5>\n<ul><li><b>Starożytna:</b> VI w. p.n.e. – ok. 600 r. n.e. (koniec starożytności).</li><li><b>Średniowieczna:</b> do XIV/XV w.</li><li><b>Nowożytna:</b> od początku XV w. (wraz z późniejszym okresem współczesnym: XIX–XX w.).</li></ul>\n<h5>Pięć okresów filozofii starożytnej (Grecja)</h5>\n<ul><li><b>Powstanie filozofii (okres przedsokratejski):</b> VII/VI–V w. p.n.e. – charakter kosmologiczny (filozofia przyrody, badanie kosmosu i poszukiwanie arche).</li><li><b>Oświecenie starożytne (okres klasyczny – faza sokratejska):</b> V w. p.n.e. – charakter humanistyczny / antropologiczny (działalność sofistów i Sokratesa; zwrot ku człowiekowi).</li><li><b>Systemy starożytności (okres klasyczny – wielkie syntezy):</b> IV w. p.n.e. – charakter wiedzy wszechstronnej / całościowej (Platon, Arystoteles).</li><li><b>Wiek starożytny (okres hellenistyczny):</b> III w. p.n.e. – I w. n.e. – charakter zagadnień etycznych (stoicyzm, epikureizm, sceptycyzm; poszukiwanie recepty na szczęście).</li><li><b>Synkretyzm (okres schyłkowy / rzymski):</b> I w. n.e. – 529 r. n.e. – charakter religijny (neoplatonizm, synteza z motywami wschodnimi i chrześcijańskimi aż do zamknięcia Akademii Platońskiej przez Justyniana w 529 r.).</li></ul>\n<h4><span class=\"num\">3.</span> Tales z Miletu (VII–VI w. p.n.e., ok. 625–547 p.n.e.) – początek filozofii</h4>\n<p>Uznawany za ojca i pierwszego przedstawiciela europejskiej filozofii przyrody.</p>\n<h5>Przejście od mitu do nauki / rozumu</h5>\n<ul><li><b>Dokonał przełomowego kroku:</b> odrzucił wyjaśnienia mitologiczne na rzecz racjonalnych dociekań przyrodniczych.</li><li><b>Przewidział zaćmienie słońca (ok. 585 r. p.n.e.)</b> – poprawnie, choć jeszcze bez pełnej znajomości nowoczesnych praw astrofizyki; wykorzystał w tym celu dorobek Babilonii i Egiptu.</li></ul>\n<h5>Dystynkcja: Mit a Nauka</h5>\n<ul><li><b>Mit:</b> wyjaśnienia zmysłowo-obrazowe, poetyckie, emocjonalne; daje gotowe, arbitralne odpowiedzi bez krytycznego uzasadnienia.</li><li><b>Nauka / Filozofia:</b> dąży do prawdy obiektywnej, logicznego uzasadnienia (logos), docieka przyczyn i skutków, opiera się na weryfikowalnych przesłankach.</li></ul>\n<h5>Prazasada (Arche) u Talesa – WODA</h5>\n<p>„Wszystko jest z wody, z wody powstało i z wody się składa.”</p>\n<h5>Uzasadnienie empiryczno-biologiczne</h5>\n<p>Nasiona i zarodki wszelkich bytów są wilgotne; wysuszenie oznacza śmierć.</p>\n<p>Pokarm i soki roślinne mają naturę płynną.</p>\n<p>Woda wykazuje zdolność do zmiany stanów skupienia (lód, ciecz, para), tworząc wrażenie uniwersalnego tworzywa wszechświata.</p>\n<h4><span class=\"num\">4.</span> Pierwotne zagadnienia filozoficzne i Hylozoizm</h4>\n<h5>Physis (φύσις – przyroda / natura)</h5>\n<p>Arystoteles pierwszych filozofów jońskich nazwał fizjologami (fysiologoi – badaczami natury), ponieważ ich dociekania koncentrowały się wokół pytania o tworzywo materialne i dynamiczną zasadę rządzącą przyrodą.</p>\n<h5>Hylozoizm (hylezoizm)</h5>\n<ul><li><b>Złożenie słów:</b> hyle (ὕλη – materia) + zoe (ζωή – życie).</li></ul>\n<p>Pogląd pierwszych filozofów z Miletu, według którego cała materia jest wewnętrznie ożywiona i posiada w sobie zdolność do samoistnego ruchu i działania („Wszystko jest pełne bogów / wszystko jest ożywione, jak to widać w bursztynie przyciągającym skrawki i w magnesie”).</p>\n<p>Jońscy filozofowie przyrody nie znali jeszcze dualistycznego podziału na martwą materię i niematerialnego ducha – traktowali materię jako żywą i samoorganizującą się jedność.</p>"}, {"t": "Wykład 3 – Jońscy filozofowie przyrody i Heraklit", "html": "<div class=\"eyebrow\">HISTORIA FILOZOFII – Wykład 3</div>\n<div class=\"meta\">🗓 Poniedziałek, 19 października 2026, 09:48</div>\n<div class=\"topic\"><span>Temat</span>Jońscy filozofowie przyrody (Tales, Anaksymander, Anaksymenes) oraz wariabilizm i dialektyka Heraklita z Efezu</div>\n<h4><span class=\"num\">1.</span> Przełom joński: od mitu do logosu</h4>\n<p>Dlaczego woda u Talesa? Tales uznał wodę za zasadę wszechrzeczy, ponieważ można badać logos – czyli racjonalne, logiczne i sprawdzalne uzasadnienie wywiedzione z obserwacji natury, a nie z mitologicznego obrazu świata.</p>\n<ul><li><b>Najważniejsza zasługa Talesa:</b> Nie tyle konkretna odpowiedź (woda), ile zadanie właściwego pytania o to, co pierwotne, stałe i wspólne w całej zmienności bytu.</li></ul>\n<h5>Ewolucja kluczowych pojęć</h5>\n<ul><li><b>Arche (ἀρχή):</b> Pierwotnie oznaczało po prostu „początek / punkt wyjścia w czasie”, z czasem zaczęło oznaczać zasadę bytu (principium) – to, co nie tylko było na początku, ale stale podtrzymuje rzeczy i stanowi ich niezmienną osnowę.</li><li><b>Physis (φύσις – przyroda / natura):</b> W języku potocznym oznaczała to, co wzrasta, rodzi się i ulega zmianie; w filozofii zaczęła oznaczać stałe prawo i naturę rzeczy rządzącą zmiennymi zjawiskami.</li></ul>\n<h5>Zjawiska a Natura</h5>\n<ul><li><b>Zjawiska:</b> zmienne, dostępne zmysłom, różnorodne, przypadkowe.</li><li><b>Natura (istota):</b> stała, jedyna, konieczna, niezależna od woli i ustanowień człowieka.</li></ul>\n<h4><span class=\"num\">2.</span> Szkoła z Miletu (Trzej filozofowie przyrody)</h4>\n<h4><span class=\"num\">A.</span> Tales z Miletu (VII/VI w. p.n.e.)</h4>\n<ul><li><b>Arche:</b> Woda (uzasadnienie biologiczno-empiryczne: nasiona są wilgotne, pokarm zawiera soki, woda zmienia stany skupienia).</li></ul>\n<h4><span class=\"num\">B.</span> Anaksymander z Miletu (ok. 610–545 p.n.e.)</h4>\n<ul><li><b>Dzieło:</b> Napisał pierwsze greckie dzieło filozoficzne (O naturze – zachowane we fragmentach).</li><li><b>Arche:</b> Apeiron (ἄπειρον – bezkres / bezgraniczność / nieokreśloność).</li></ul>\n<h5>Argumentacja dedukcyjna (wyjście poza czyste zmysły)</h5>\n<p>Zasada musi być nieograniczona ilościowo i bezgraniczna, ponieważ w przeciwnym razie wyczerpałaby się w procesie powstawania nieskończonej liczby bytów i światów.</p>\n<p>Zasada nie może być żadnym z określonych żywiołów (jak woda czy ogień), gdyż żywioły te zwalczają się wzajemnie i przekształcają jeden w drugi. Zasada musi być jakościowo neutralna i nieokreślona.</p>\n<h5>Mechanizm powstawania przyrody (Kosmogonia)</h5>\n<p>Świat nie powstaje przez prostą przemianę jednego żywiołu w drugi, lecz przez wyłanianie się przeciwieństw (ciepło–zimno, suchość–wilgoć) z pierwotnego apeironu.</p>\n<p>Proces ten napędza wieczny ruch, który jest immanentną cechą materii (założenie hilozoizmu).</p>\n<h4><span class=\"num\">C.</span> Anaksymenes z Miletu (ok. 585–525 p.n.e.)</h4>\n<p>Trzeci z filozofów z Miletu; autor traktatu o przyrodzie pisanego prostym, zwięzłym stylem.</p>\n<ul><li><b>Arche:</b> Powietrze (aer – ἀήρ).</li></ul>\n<p>Dlaczego powietrze?</p>\n<ul><li><b>Stanowi syntezę poglądów Talesa i Anaksymandra:</b> wydaje się przestrzennie i ilościowo bezkresne (wypełnia przestrzeń kosmiczną), a jednocześnie jest konkretną materią uchwytną w doświadczeniu.</li></ul>\n<p>Cechuje je nieustanny ruch i ogromna łatwość przemiany (kondensacja/zagęszczenie tworzy wiatr, chmury, wodę, ziemię i kamienie; rozrzedzenie/rozprężenie tworzy ogień).</p>\n<ul><li><b>Związek z życiem i duszą:</b> tchnienie (pneuma) i powietrze podtrzymują życie człowieka i kosmosu.</li></ul>\n<h4><span class=\"num\">3.</span> Heraklit z Efezu (przełom VI/V w. p.n.e., ok. 540–480 p.n.e.)</h4>\n<ul><li><b>Osobowość i dzieło:</b> Pochodził z arystokratycznego rodu w Efezie; zrzekł się dziedzicznych godności i wycofał z życia publicznego, pełen pesymizmu wobec ludzi. Ze względu na aforystyczny, wieloznaczny styl pisania nazwany „Ciemnym” (Skoteinos). Dzieło dzieliło się na 3 traktaty: kosmologiczny, polityczny i teologiczny (zachowało się ponad 130 fragmentów).</li><li><b>Metoda:</b> Obok obserwacji przyrody jako pierwszy zastosował introspekcję (samoobserwację: „Badałem samego siebie”).</li></ul>\n<h4><span class=\"num\">A.</span> Arche: Żywy Ogień (pyr – πῦρ)</h4>\n<p>Kosmosu nie stworzył żaden z bogów ani ludzi; był, jest i będzie wiecznie żywym ogniem, zapalającym się według miary i według miary gasnącym.</p>\n<p>Ogień to nie statyczny surowiec, lecz faza wiecznej przemiany i uniwersalny ekwiwalent bytu („Wszystko wymienia się na ogień, a ogień na wszystko, jak towary na złoto, a złoto na towary”).</p>\n<ul><li><b>Drogi przemiany:</b> Droga w dół (ogień → powietrze → woda → ziemia) i droga w górę (ziemia → woda → parowanie → ogień) są jedną i tą samą drogą.</li></ul>\n<h4><span class=\"num\">B.</span> Wariabilizm i relatywizm (Panta rhei)</h4>\n<ul><li><b>Panta rhei (πάντα ῥεῖ – wszystko płynie):</b> Teoria powszechnej zmienności wszechrzeczy (wariabilizm). Trwanie jest złudzeniem zmysłów; jedyną stałą rzeczą jest samo stawanie się.</li><li><b>Metafora rzeki:</b> „Niepodobna wstąpić dwukrotnie do tej samej rzeki, bo już inne napłynęły w nią wody”.</li><li><b>Relatywizm cech i jedność przeciwieństw:</b> W nieustannym ruchu zacierają się granice między przeciwieństwami (dzień i noc, sen i jawa, młodość i starość, życie i śmierć w swej osnowie są jednym).</li></ul>\n<h4><span class=\"num\">C.</span> Rozumność świata – Kosmiczny Logos i dialektyka</h4>\n<ul><li><b>Rozumność przyrody (Logos – λόγος):</b> Choć zjawiska stale płyną, procesem tym rządzi jedno, wieczne prawo – boski, kosmiczny Rozum (Logos). Rozum nie jest wyłączną własnością człowieka, lecz obiektywną siłą kosmiczną, w której człowiek jedynie partycypuje.</li><li><b>Walka przeciwieństw:</b> „Wojna (polemos) jest ojcem i królem wszechrzeczy”. Napięcie i konflikt przeciwieństw są konieczne do istnienia wszechświata: ukryta harmonia jest wyższa i piękniejsza od widocznej.</li></ul>\n<h4><span class=\"num\">4.</span> Aneks metodologiczny (Reguły tworzenia przypisów i cytatów w pracach naukowych)</h4>\n<ul><li><b>Lokalizacja odsyłacza przypisu:</b> W polskie
