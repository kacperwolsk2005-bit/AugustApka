my je za prawdziwe – zgadzamy się, że x jest desygnatem (to jest okno, to jest łóżko…).</li>\n<li>Tak dziecko uczy się języka. Tak samo <b>egzamin</b>: sprawdza, czy student używa słów w tym samym znaczeniu co profesor. Pełnej zgodności się nie osiągnie – jest pewna granica zgodności.</li>\n<li><b>Desygnat w znaczeniu wąskim</b> – przedmiot istniejący realnie (skrajny empiryzm). <b>W znaczeniu szerokim</b> – także przedmioty możliwe, intencjonalne (np. przyszłe). Na egzaminie pytania dotyczą desygnatów realnych.</li>\n</ul>\n<h5>d) Denotacja (zakres)</h5>\n<ul>\n<li>Zbiór <b>wszystkich desygnatów</b> nazwy – przeszłych, teraźniejszych i przyszłych (np. „człowiek”: wszyscy, którzy żyli, żyją i będą żyć, także ci, o których nigdy nie słyszeliśmy).</li>\n<li>Niektórzy autorzy odróżniają denotację (tylko desygnaty realne) od pojęcia szerszego.</li>\n</ul>\n<h5>e) Konotacja (współoznaczanie)</h5>\n<ul>\n<li>Łac. <i>con-</i> = „razem z”, „współ-”. Nazwa „pies” oznacza nie tylko przedmiot, ale „współoznacza” jego cechy – bez znajomości cech nie umiałbym wskazać desygnatu (wiem, że był Einstein, ale bez cech nie wskażę go).</li>\n<li><b>Konotacja</b> = zbiór cech <b>charakterystycznych</b> (specyficznych), przysługujących <b>łącznie wszystkim i tylko</b> desygnatom danej nazwy.</li>\n<li>Brak choćby jednej cechy charakterystycznej sprawia, że przedmiot nie jest desygnatem nazwy.</li>\n<li>Relacja między oznaczaniem a konotacją jest skomplikowana – od czasów Fregego piszą o tym całe książki, zawsze znajdzie się jakiś wyjątek.</li>\n</ul>\n<h5>f) Treść pełna</h5>\n<ul>\n<li>Zbiór <b>wszystkich</b> cech przysługujących wszystkim desygnatom (np. pies musi mieć serce – ale to nie jest cecha charakterystyczna psa, bo mają je też inne zwierzęta).</li>\n<li>Treści pełnej żadnej nazwy nie znamy – to pojęcie idealne, bardzo potrzebne w filozofii. Negatywnie potrafimy powiedzieć, co do niej nie należy (np. kwadratowość u psa).</li>\n<li>Twierdzenia matematyczne udowadniają kolejne cechy danych figur.</li>\n<li><b>Treść pleonastyczna</b> – dwa razy to samo, „masło maślane” („w dniu dzisiejszym”).</li>\n</ul>\n\n<h3 class=\"part\">CZĘŚĆ II – ZDANIA KATEGORYCZNE I SYLOGIZM</h3>\n<h4><span class=\"num\">7.</span> Cztery typy zdań kategorycznych</h4>\n<p>Arystoteles zbudował całą logikę (szerszą od nauki swoich czasów) w oparciu o 4 typy zdań kategorycznych. Do XX wieku tak dzielono zdania.</p>\n<div class=\"table-wrap\"><table class=\"nt\">\n<thead><tr><th>Symbol</th><th>Schemat</th><th>Nazwa</th><th>Przykład</th></tr></thead>\n<tbody>\n<tr><td><b>SaP</b></td><td>Każde S jest P</td><td>ogólnotwierdzące</td><td>Każdy człowiek jest śmiertelny</td></tr>\n<tr><td><b>SeP</b></td><td>Żadne S nie jest P</td><td>ogólnoprzeczące</td><td>Żaden człowiek nie jest kamieniem</td></tr>\n<tr><td><b>SiP</b></td><td>Pewne S jest P</td><td>szczegółowotwierdzące</td><td>Pewien punkt jest czarny</td></tr>\n<tr><td><b>SoP</b></td><td>Pewne S nie jest P</td><td>szczegółowoprzeczące</td><td>Pewien punkt nie jest czarny</td></tr>\n</tbody></table></div>\n<ul>\n<li><b>Skąd litery?</b> Z łaciny: <i><b>a</b>ff<b>i</b>rmo</i> – stwierdzam (a – ogólne, i – szczegółowe twierdzące); <i>n<b>e</b>g<b>o</b></i> – przeczę (e – ogólne, o – szczegółowe przeczące). Pierwsza samogłoska = ogólne, druga = szczegółowe; to czysto mechaniczne.</li>\n<li><b>S</b> – podmiot (łac. <i>subiectum</i>), stąd „subiektywny” = podmiotowy. <b>P</b> – orzecznik (<i>praedicatum</i>).</li>\n<li>Dawne znaczenie „subiektywny” nie ma nic wspólnego z dzisiejszym. W średniowieczu: Bóg jest „najbardziej subiektywny” (podmiotowy), czyli najbardziej istniejący – istnienie podmiotowe było najsilniejsze, a obiektywne (przedmiotowe, w umyśle) najsłabsze.</li>\n<li><b>„Kategoryczny”</b> w tym kontekście nie oznacza konieczności – znaczy tyle co <b>orzekający</b> (oznajmujący). Zdanie konieczne to zdanie <b>apodyktyczne</b>. Zmiana znaczenia słowa „kategoryczny” w polszczyźnie zaczęła się jeszcze przed wojną – warto szukać w starszych podręcznikach.</li>\n<li>Słowo <b>„pewien”</b> ma w logice specyficzne znaczenie, inne niż potoczne: co najmniej jeden (może to być jeden przypadek, najczęściej kilka; nie wyklucza, że wszystkie).</li>\n<li>Wśród zdań szczegółowych wyróżniano <b>zdania jednostkowe</b> – podmiot jest jednostką (np. „Jan jest wysoki”).</li>\n<li>Język polski ma podwójną negację – czasem nie wiadomo, co się powiedziało; negacje w zdaniach złożonych bywają skomplikowane.</li>\n</ul>\n\n<h4><span class=\"num\">8.</span> Koniunkcja i alternatywa (zapowiedź KRZ)</h4>\n<ul>\n<li>Z dwóch zdań („Jan jest wysoki”, „Jan jest studentem”) budujemy koniunkcję (i) albo alternatywę (lub).</li>\n<li><b>Alternatywa</b> traktowana jest jak <b>suma</b>: 1 + 0 = 1, 1 + 1 = 1 – suma nigdy nie może być większa niż 1 (nie ma takiej wartości).</li>\n<li><b>Klasyczny rachunek zdań</b> – najprostszy: nie patrzy, jak zdanie jest zbudowane w środku, przyjmuje zdania p, q jako całości. Interesują nas tylko wartości logiczne (2 wartości) – to właściwie kombinatoryka. Cała logika to „składanie funktorów”.</li>\n<li>Funktorów dwuargumentowych może być <b>16</b>; najpopularniejsze są 4 (poznamy je). „Nieprawda, że p” – funktor zdaniotwórczy od jednego argumentu zdaniowego.</li>\n</ul>\n\n<h4><span class=\"num\">9.</span> Wnioskowania i sylogizm</h4>\n<ul>\n<li>Na zdaniach kategorycznych opiera się: wnioskowanie z jednego zdania (kwadrat logiczny) oraz <b>sylogizmy</b> – przyjmuje się 2 zdania (przesłanki) i pyta, co z nich wynika.</li>\n<li>W poprawnym sylogizmie mogą być tylko <b>3 różne terminy</b>: S, P i M. S i P pełnią funkcję terminu <b>mniejszego</b> i <b>większego</b>, M – terminu <b>średniego</b>. Trzecią literkę wprowadza się na poziomie wyższym (w metajęzyku).</li>\n<li>Sylogizm uchodził za najdoskonalsze rozumowanie naukowe. Trybów sylogizmu jest 256, z czego 24 są poprawne; o samym sylogizmie można by wykładać cały rok.</li>\n</ul>\n\n<h4><span class=\"num\">10.</span> Dygresja: Kościół, logika i nowa nauka</h4>\n<ul>\n<li>Logika Arystotelesa powstała jako analiza istniejącej wtedy nauki. Nowa nauka pojawiła się dopiero w <b>XVII wieku</b> (od Galileusza); nowa logika potrzebowała czasu, by ją przeanalizować, a teologia – jeszcze ok. 100 lat, by to przyswoić.</li>\n<li>Okazało się, że fizyki nie da się budować tak jak dawniej – pojęcie nauki „przewróciło się do góry nogami”. Kościół długo nie umiał sobie poradzić z nową koncepcją wiedzy.</li>\n<li>Teorię kopernikańską „rehabilitowano” na początku XIX wieku – gdy odkryto paralaksę.</li>\n<li>Dawniej wszelką dynamikę wiązano z pojęciem ducha (pojęcie z Grecji); planetom przypisywano inteligencje. <b>Kepler</b> jako pierwszy „pozbawił planety inteligencji” (ok. 1600–1620).</li>\n<li>Po Trydencie zwykły człowiek nie miał prawa czytać Pisma Świętego (obawa przed własną interpretacją). Ponad 90% ludzi przedwojennych nie miało wykształcenia – nie było szkół powszechnych, uczyły szkoły parafialne.</li>\n<li>Teoria (krytyka) źródeł pojawia się dopiero w XIX wieku – zaczęto krytycznie wydawać źródła. Wcześniej cytowano Tomasza czy Augustyna, ale ich nie studiowano; <b>patrologia</b> jako dziedzina rozwinęła się naprawdę w XIX–XX wieku.</li>\n<li>Idea wolności religijnej (prawo do wiary zgodnie z sumieniem) była kiedyś potępiana – groziła za nią ekskomunika.</li>\n<li>W 1943 r. papież (Pius XII, encyklika <i>Divino afflante Spiritu</i>) po raz pierwszy zezwolił na nowoczesne metody badania Pisma Świętego.</li>\n<li>Trzeba było Kościół „przewietrzyć” – w tym celu zwołano Sobór Watykański II. Zmiany były rewolucyjne z zewnątrz, ale nie w tym, co istotne. <b>Zmienia się wyraz wiary, nie wiara.</b> Kościół jest dzieckiem swoich czasów i mówi swoim językiem.</li>\n<li>„Nie da się dzisiaj być duszpasterzem, nie mając głowy” – serce najważniejsze, ale trzeba rozumieć.</li>\n</ul>\n"}, {"t": "Wykład 29.10.2026 – konotacja, typy cech, rodzaj i gatunek, podziały nazw", "html": "\n<div class=\"eyebrow\">LOGIKA – Wykład z 29.10.2026</div>\n<div class=\"topic\"><span>Temat</span>Konotacja i treść pełna, typy cech, prawo odwrotnej proporcjonalności, rodzaj i gatunek, sześć podziałów nazw</div>\n<h4><span class=\"num\">1.</span> Konotacja i treść pełna</h4>\n<ul>\n<li><b>Treść pełna</b> = zbiór <b>wszystkich</b> cech desygnatów. To pojęcie idealne – nie znamy jej pozytywnie.</li>\n<li>Dogmat się nie zmienia – zmienia się sposób pojmowania (przykład z grzebaniem samobójców).</li>\n<li><b>Konotacja nazwy</b> = zbiór cech charakterystycznych = definicja przy określonym rozumieniu (zakończenie wykładu).</li>\n</ul>\n<h4><span class=\"num\">2.</span> Typy cech</h4>\n<div class=\"table-wrap\"><table class=\"nt\"><thead><tr><th>Cecha</th><th>Co to znaczy</th><th>Przykład</th></tr></thead><tbody>\n<tr><td><b>Konstytutywne (istotne)</b></td><td>tworzą istotę, wyrażają się w definicji</td><td>człowiek = zwierzę rozumne</td></tr>\n<tr><td><b>Konsekutywne</b></td><td>wynikają koniecznie z definicji</td><td>cała matematyka to ich wyprowadzanie</td></tr>\n<tr><td><b>Konieczne niecharakterystyczne</b></td><td>ma je każdy desygnat, ale nie definiują</td><td>człowiek ma serce</td></tr>\n<tr><td><b>Przygodne (niekonieczne)</b></td><td>mogą być lub nie</td><td>student z Polski</td></tr>\n<tr><td><b>Proprium</b> (łac. <i>proprietas</i>)</td><td>konieczne, właściwe tylko danej nazwie, ale nie tworzą istoty</td><td>–</td></tr>\n<tr><td><b>Treść pleonastyczna / redundantna</b></td><td>za dużo w definicji</td><td>masło maślane</td></tr>\n</tbody></table></div>\n<ul><li><b>Definicja arystotelesowska:</b> najbliższy rodzaj + różnica gatunkowa. Słowo „specyficzny” pochodzi od <i>species</i>.</li></ul>\n<h4><span class=\"num\">3.</span> Prawo odwrotnej proporcjonalności</h4>\n<ul>\n<li>Im bogatsza treść (więcej cech), tym węższy zakres.</li>\n<li><b>Uogólnianie</b> = odejmowanie cech z konotacji; <b>ograniczanie</b> = dodawanie cech do treści.</li>\n<li>Przykład: prostokąt równoboczny → odejmując „równoboczny” otrzymujemy prostokąt; odejmując „prostokąt” – równoboczność.</li>\n</ul>\n<h4><span class=\"num\">4.</span> Rodzaj i gatunek</h4>\n<ul>\n<li><b>Genus</b> (rodzaj, szerszy) i <b>species</b> (gatunek, węższy). Rodzaj obejmuje wiele gatunków.</li>\n<li>Zapisuje się diagramami kół (Eulera). Słowa: generalny (genus), specjalny/specyficzny (species).</li>\n</ul>\n<h4><span class=\"num\">5.</span> Podziały nazw (6 kryteriów)</h4>\n<h5>Ze względu na zakres</h5>\n<ul><li><b>Ostre</b> – łatwo wskazać desygnaty (pies, stół).</li><li><b>Nieostre</b> – granica rozmyta (szlachetny, żółty/pomarańczowy).</li></ul>\n<h5>Ze względu na treść</h5>\n<ul><li><b>Wyraźne</b> – potrafimy podać cechy (kwadrat, koło matematyczne).</li><li><b>Niewyraźne (intuicyjne)</b> – wiemy, ale nie potrafimy opisać (pies, religia). Religia jest intuicyjna. Na egzaminie trzeba umieć wyrazić wiedzę intuicyjną pojęciami.</li></ul>\n<h5>Ze względu na charakter przedmiotów</h5>\n<ul><li><b>Konkretne</b> – arystotelesowskie substancje: rzeczy, osoby.</li><li><b>Abstrakcyjne</b> – oderwane od podmiotu: sprawiedliwość, biel, relacja, zbiór.</li></ul>\n<h5>Zbiorowe i niezbiorowe</h5>\n<ul><li>Las, ręce – kolektywnie (całość) lub dystrybutywnie (każdy element). Logika ma z tym podziałem problem.</li></ul>\n<h5>Ze względu na realność</h5>\n<ul>\n<li><b>Analitycznie puste</b> (wewnętrznie sprzeczne): koło kwadratowe, żonaty kawaler, większa połowa – nie mogą istnieć; według Tomasza nawet Bóg ich nie stworzy. <i>Coincidentia oppositorum</i> – średniowieczna technika przekraczania sprzeczności przy mówieniu o Bogu.</li>\n<li><b>Empirycznie puste</b>: Kubuś Puchatek, flogiston, eter (jako nośnik fal; eksperyment Michelsona-Morleya, koniec XIX w.). Eter do usypiania to inna nazwa – wieloznaczność.</li>\n</ul>\n<h5>Ze względu na ilość desygnatów <span class=\"tag-exam\">najważniejszy – będzie na ćwiczeniach</span></h5>\n<p>Logika ekstensjonalna (zakresowa) – liczy się tylko zakres; nazwy o tym samym zakresie można podstawiać.</p>\n<div class=\"table-wrap\"><table class=\"nt\"><thead><tr><th>Typ</th><th>Desygnaty</th><th>Przykłady</th></tr></thead><tbody>\n<tr><td><b>Pusta</b></td><td>0</td><td>szklana góra (zakres = ∅), flogiston</td></tr>\n<tr><td><b>Jednostkowa</b></td><td>dokładnie 1</td><td>Jowisz, „najwyższa góra świata”, zbiór wszystkich liczb parzystych</td></tr>\n<tr><td><b>Ogólna</b></td><td>co najmniej 2</td><td>człowiek, Polak, zbiór liczb parzystych (dowolny)</td></tr>\n<tr><td><b>Uniwersalna</b> (szczególny przypadek ogólnej)</td><td>nieskończenie wiele</td><td>człowiek, ptak, ser</td></tr>\n</tbody></table></div>\n<ul>\n<li>Każda nazwa własna jest jednostkowa (konwencja), choć może być wiele miejsc o tej nazwie.</li>\n<li>Liczba gramatyczna nie decyduje o typie – liczymy desygnaty.</li>\n<li>„Ręka Fryderyka Chopina” – ogólna (2 desygnaty); „ręce Fryderyka Chopina” jako zbiór – jednostkowa (1).</li>\n<li>Wszechświat – jednostkowa z nazwy; fizyka dopuszcza wielość, ale to niesprawdzalne (jak nieśmiertelność).</li>\n<li>„Coś” – najbardziej ogólna nazwa. „Polacy” – wieloznaczne (zbiór wszystkich vs. niektórzy).</li>\n<li>Zbiór liczb parzystych (dowolny) – ogólna; zbiór <b>wszystkich</b> liczb parzystych – jednostkowa.</li>\n<li>Każda nazwa o określonym znaczeniu ma tylko <b>jedną denotację</b> (zbiór wszystkich desygnatów).</li>\n</ul>\n"}], "fczl": [{"t": "Wykład 1 – filozofia człowieka i teologia", "html": "<ul><li><b>Wykład 1:</b> Filozofia człowieka i teologia</li><li>Uwagi wstępne</li></ul>\n<p>Filozofia fundamentem teologii. Filozofia jest najważniejsza, uczy ona myślenia krytycznego.</p>\n<p>Uczyć się dla siebie, a jak nie, to dla Kościoła. Studiowanie jest „w bibliotece”, czyli w ciszy.</p>\n<h5>Sylabus: 5 książek, które każdy kleryk ma przeczytać</h5>\n<ul><li><b>Wyznania</b> – św. Augustyn → jako lektura duchowa</li></ul>\n<p>Cztery pytania Immanuela Kanta (logika myślenia o człowieku)</p>\n<ul><li><b>(Zestawienie z Heideggerem</b> – odwrócony wektor pytań)</li><li><b>Najpierw zadaj pytanie o wiedzę:</b> Co wiem? (Heidegger: 4)</li><li><b>Co powinienem czynić? → filozofia moralna (Heidegger:</b> 3)</li></ul>\n<p>Czego mogę się spodziewać? → pytam o religię, o religijną perspektywę istnienia (Heidegger: 2)</p>\n<ul><li><b>Kim jest człowiek? → pytanie antropologiczne (Heidegger:</b> 1)</li><li>Człowiek, wolność i zło</li><li><b>Schelling:</b> Jak człowiek uświadomi sobie kim jest, to zaraz zada sobie pytanie: jaki powinien być. Człowiek dąży do ciągłego odkrywania i ulepszania.</li></ul>\n<p>Jak człowiek zaczyna zdumiewać się nad sobą, to zaczyna być świadomy swojej inności (wielkości).</p>\n<p>Mamy w sobie pierwiastek Boży i od nas zależy, jak go wykorzystamy.</p>\n<p>Dlaczego jest zło? → Bo Bóg dał nam wolność. My wybraliśmy zło i ponosimy tego konsekwencje. Wolność możemy wykorzystać dobrze i źle.Zło</p>\n<h5>= nieszczęście</h5>\n<ul><li><b>Zło:</b> rodzi się z dialogu, wyrządza je człowiek człowiekowi.</li><li><b>Nieszczęście:</b> coś, co wynika z natury, na co nie mamy wpływu (choroby, trzęsienia ziemi itp.).</li><li>Współczesność, nadzieja i kondycja człowieka</li><li><b>Transhumanizm:</b> nauka o tym, by człowiek był nieśmiertelny (większość jest ateistami, nie wierzą, bo nie chcą śmierci). Pokazuje to, że mają tęsknotę za nieśmiertelnością. Wszyscy jesteśmy powołani do nieśmiertelności, ale oni ją źle rozumieją – chodzi o nieśmiertelność duchową, a nie fizyczną.</li></ul>\n<p>Chrześcijaństwo to religia nadziei. Gdy nie ma nadziei, to jest rozpacz.</p>\n<ul><li><b>Kierkegaard:</b> rozpacz jest wtedy, gdy sytuacja jest tak beznadziejna, że jedyną nadzieją na rozwiązanie jest śmierć, która nie chce przyjść. Życie psychiczne jest narzędziem życia duchowego. Badania pokazują, że nawet ludzie psychicznie zdrowi popełniają samobójstwa, bo tracą nadzieję.</li></ul>\n<h5>Freud → wielkość człowieka nie jest uzasadniona (kryzysy antropologiczne)</h5>\n<ul><li><b>Teoria Kopernika:</b> jesteśmy mali, nie jesteśmy w centrum.</li><li><b>Teoria Darwina:</b> jesteśmy bardzo podobni do małpy.</li><li><b>Freud:</b> człowiek jest kompletnie zawładnięty przez nieuświadomione popędy (np. seksualny).</li><li>Odniesienia historyczno-teologiczne</li><li><b>Protestanci:</b> dualizm między dobrą duszą a złym ciałem.</li></ul>\n<p>Palili kobiety na stosie → ciało kobiety uznawali za gorsze, jako źródło pożądania.</p>"}, {"t": "Wykład 2 – personalizm, dramat, dialog, horyzont agatologiczny (opracowanie kompleksowe)", "html": "<div class=\"eyebrow\">FILOZOFIA CZŁOWIEKA – Wykład: Chrześcijański Personalizm i Filozofia Dramatu (Opracowanie Kompleksowe)</div>\n<ul><li><b>Wprowadzenie:</b> Kontekst narodzin personalizmu chrześcijańskiego</li></ul>\n<p>Refleksja nad człowiekiem w tradycji chrześcijańskiej rodziła się nie w próżni, lecz w kontekście wielkich sporów dogmatycznych (chrystologicznych i trynitarnych – jak rozumieć tajemnicę Chrystusa i Trójcy Świętej). Filozofia ta stała się pomostem łączącym starożytną myśl grecką (ontologię) z nowym, biblijnym spojrzeniem na ludzką egzystencję. W przeciwieństwie do zdrowego rozsądku, który zadowala się powierzchownym stwierdzeniem („to jest krzesło i koniec”), filozofia pyta o ostateczną istotę trzech wielkich przedmiotów: Boga, człowieka i świata.</p>\n<h4><span class=\"num\">1.</span> Trzy perspektywy patrzenia na człowieka</h4>\n<h4><span class=\"num\">A.</span> Patrzenie „z góry” (Perspektywa teologiczna / św. Augustyn)</h4>\n<ul><li><b>Kluczowe pojęcie:</b> Człowiek jako imago Dei (obraz Boży).</li><li><b>Założenie i metoda:</b> Punktem wyjścia jest Bóg. Filozof patrzy na człowieka z perspektywy Stwórcy – skoro człowiek jest obrazem Boga, to w jego wnętrzu należy szukać śladów samego Boga.</li><li><b>Przykład:</b> Słynne wyznanie św. Augustyna: „Niespokojne jest serce nasze, dopóki nie spocznie w Tobie”.</li></ul>\n<h4><span class=\"num\">B.</span> Patrzenie „od dołu” (tzw. Mistrzowie Podejrzeń: Marks, Freud, Nietzsche)</h4>\n<ul><li><b>Charakterystyka ogólna:</b> Są to antropologie ateistyczne i redukcjonistyczne. Odrzucają wymiar wertykalny (transcendencję, duszę, Boga), sprowadzając człowieka wyłącznie do wymiaru ziemskiego i biologicznego. Podejrzewają człowieka o to, że jest gorszy, niż twierdzi, a jego religijność czy wzniosłe motywy to jedynie maska.</li><li><b>Karol Marks:</b> Człowiek zredukowany do materii, pracy i determinizmu ekonomicznego; istota uwikłana w pożądanie posiadania bytu i uwarunkowania społeczne.</li><li><b>Zygmunt Freud:</b> Człowiek jako sprytny manipulator i istota zakłamana, rządzona przez nieświadome popędy biologiczno-seksualne (libido), które musi sublimować (np. poprzez twórczość).</li><li><b>Fryderyk Nietzsche:</b> Człowiek napędzany wyłącznie wolą mocy (Wille zur Macht); cała jego natura to dążenie do dominacji i manifestacji siły.</li></ul>\n<h4><span class=\"num\">C.</span> Patrzenie „wprost” / relacyjne (Personalizm chrześcijański)</h4>\n<ul><li><b>Charakterystyka:</b> Bezpośrednie wejście w tajemnicę człowieczeństwa (kim jest człowiek w swojej istocie?), badając go nie w abstrakcyjnej izolacji, lecz w jego żywych relacjach: Ja – Ty (międzyludzkiej) oraz Ja – Bóg.</li><li><b>Postać kluczowa / pomost:</b> Myśl rozwijana m.in. w polskim środowisku krakowskim (z udziałem m.in. ks. prof. Józefa Tischnera czy kard. Karola Wojtyły), łącząca metafizykę z doświadczeniem osoby.</li></ul>\n<h4><span class=\"num\">2.</span> Filozofia Dramatu (Nurt ks. Józefa Tischnera)</h4>\n<h4><span class=\"num\">A.</span> Człowiek jako uczestnik dramatu</h4>\n<p>Człowiek nie jest statycznym przedmiotem badania ani biernym widzem na „scenie” świata – jest czynnym aktorem w wielkim dramacie obejmującym stworzenie, grzech, upadek oraz odkupienie.</p>\n<h4><span class=\"num\">B.</span> Czas dramatyczny a czas matematyczny</h4>\n<ul><li><b>Czas fizykalno-matematyczny:</b> Jednorodny, mechaniczny pomiar ruchu (zegar, matematyczna ciągłość).</li></ul>\n<h5>Czas dramatyczny</h5>\n<p>Toczy się między osobami, jest nieodwracalny i wypełniony napięciami.</p>\n<p>Jest radykalnie wychylony ku przyszłości (wymiar eschatologiczny, o którym pisał św. Paweł: „Nasza ojczyzna jest w niebie”). Przeszłość stanowi podłoże, ale to przyszłość, nadzieja i ostateczne spełnienie nadają sens teraźniejszości. (Kościół i życie ludzkie kierują się ku przyszłości, nie unieważniając przeszłości, lecz integrując ją w procesie wzrostu).</p>\n<h4><span class=\"num\">C.</span> Świadomość bytu (rzeczy) vs Świadomość osoby</h4>\n<ul><li><b>Świadomość bytu (intencjonalna obiektywizacja):</b> Traktowanie otaczającego świata i innych ludzi jak przedmiotów („rzeczy” na scenie), które można analizować, kontrolować lub obsobaczyć.</li><li><b>Świadomość osoby (Relacja personalna):</b> Drugi człowiek staje przede mną nie jako obojętny obiekt, lecz jako roszczenie moralne. Jego obecność budzi w nas poczucie obowiązku i wzywa do odpowiedzi („Gdzie jesteś?”). W ujęciu dramatycznym: „W twoim ręku jest moja zguba i ocalenie, a w moim ręku twoja”.</li></ul>\n<h4><span class=\"num\">3.</span> Filozofia Dialogu: Dwa rodzaje dialogu</h4>\n<h4><span class=\"num\">A.</span> Dialog dialektyczny (wewnętrzny / platoński)</h4>\n<p>Ruch myśli, ścieranie się sprzecznych racji i argumentów w obrębie jednego umysłu (wewnętrzna rozmowa duszy ze sobą, logika dedukcyjna).</p>\n<h4><span class=\"num\">B.</span> Dialog interpersonalny (biblijny / personalistyczny)</h4>\n<p>Rzeczywiste, faktyczne spotkanie dwóch odrębnych wolności (Ja – Ty lub Bóg – Człowiek).</p>\n<ul><li><b>Warunek konieczny:</b> Wzajemny wybór i uznanie godności oraz wartości drugiego człowieka (nie ma autentycznego dialogu tam, gdzie drugiego traktuje się instrumentalnie).</li><li><b>Wzorzec biblijny:</b> Przymierze z Abrahamem (gdzie Bóg wchodzi w historię przez wybór i zaproszenie do relacji) oraz fundamentalne pytanie Boga skierowane do Adama w raju: „Gdzie jesteś?” – pytanie o obecność i relację, a nie o abstrakcyjną definicję geograficzną czy biologiczną.</li></ul>\n<h4><span class=\"num\">4.</span> Horyzont Agatologiczny: Dobro, Zło i Nieszczęście</h4>\n<ul><li><b>Horyzont agatologiczny (od gr. agathon – dobro):</b> Fundament i płaszczyzna, na której rozgrywa się ludzkie życie i dialog. Człowiek w swoich wyborach nieustannie porusza się w polu napięcia między dobrem a złem.</li></ul>\n<p>Krytyka tradycyjnej definicji zła jako czystego braku (privatio boni): Choć w ujęciu klasycznym zło bywa definiowane jako brak dobra, w egzystencjalnym dramacie człowieka zło jawi się jako realna, agresywna siła, z którą trzeba toczyć realną walkę.</p>\n<ul><li><b>Kluczowe rozróżnienie:</b> Zło kontra Nieszczęście</li></ul>\n<h5>Zło (charakter dialogiczny i intencjonalny)</h5>\n<p>Rodzi się wyłącznie w relacji wolnych osób.</p>\n<ul><li><b>Jest świadome, celowe i zamierzone</b> – stanowi akt, w którym człowiek dobrowolnie wyrządza krzywdę drugiemu człowiekowi.</li></ul>\n<h5>Nieszczęście (poziom natury i „sceny”)</h5>\n<p>Obejmuje trzęsienia ziemi, powodzie, katastrofy naturalne, choroby czy niezawinione tragiczne wypadki (np. potrącenie pieszego przez kierowcę jadącego w pełni przepisowo).</p>\n<ul><li><b>W nieszczęściu nie ma intencji zła ani moralnej winy</b> – wynika ono ze skończoności, kruchości i ograniczeń ludzkiej kondycji w świecie materialnym.</li></ul>"}, {"t": "Wykład 2 – notatka szczegółowa", "html": "<div class=\"eyebrow\">FILOZOFIA CZŁOWIEKA – Wykład: Personalizm Chrześcijański, Filozofia Dramatu i Horyzont Agatologiczny</div>\n<h4><span class=\"num\">1.</span> Sposoby rozumienia człowieka</h4>\n<p>Każda refleksja nad człowiekiem zakłada jakieś wstępne przerozumienie (horyzont wyjściowy), które w toku formacji, nauki i filozofii ulega pogłębieniu lub weryfikacji. Wyróżnia się trzy główne podejścia:</p>\n<ul><li><b>Podejście obiektywizujące (statystyczne / naukowe):</b> Traktuje człowieka jak przedmiot badania, obiekt biologiczny lub element statystyk.</li><li><b>Podejście hermeneutyczne:</b> Opiera się na poszerzaniu wstępnego rozumienia człowieka w miarę wchodzenia w głąb doświadczenia i refleksji.</li><li><b>Podejście maieutyczne (Sokratejskie):</b> Sokrates jako „akuszer mądrości” – poprzez stawianie pytań pomaga uczniom „narodzić się” w dyskusji i odsłonić prawdę o człowieku (gr. genese-polis – narodzić się razem, wydobyć prawdę w relacji dialogicznej).</li></ul>\n<h4><span class=\"num\">2.</span> Trzy perspektywy w antropologii filozoficznej</h4>\n<ul><li>W historii myśli chrześcijańskiej i europejskiej wykrystalizowały się trzy sposoby patrzenia na człowieka:</li></ul>\n<h4><span class=\"num\">A.</span> Perspektywa „od góry” (np. św. Augustyn)</h4>\n<ul><li><b>Założenie:</b> Człowiek jest obrazem Boga.</li><li><b>Metoda:</b> Punktem wyjścia jest Bóg; w głąb istoty człowieka wchodzi się przez odniesienie do Stwórcy, szukając w człowieku śladów Boga (np. Wyznania: „Niespokojne jest serce nasze, dopóki nie spocznie w Tobie”).</li></ul>\n<h4><span class=\"num\">B.</span> Perspektywa „od dołu” – Filozofowie Podejrzeń</h4>\n<p>Reprezentowana przez myślicieli XIX/XX wieku, takich jak Karol Marks (interesy, baza ekonomiczna), Zygmunt Freud (pożądania, nieświadomość, libido) oraz Fryderyk Nietzsche (wola mocy).</p>\n<ul><li><b>Założenie:</b> Człowiek jest gorszy, niż mu się wydaje; jest istotą zakłamaną, pełną skrywanych popędów i redukowaną do wymiaru czysto ziemskiego/biologicznego (homo faber), z odrzuceniem wymiaru wertykalnego (Boga).</li></ul>\n<h4><span class=\"num\">C.</span> Perspektywa „wprost” – Personalizm i Filozofia Dramatu (m.in. ks. Józef Tischner, kard. Karol Wojtyła)</h4>\n<ul><li><b>Badanie człowieka wprost w jego relacjach</b> – nie jako martwy przedmiot, lecz jako osoba uczestnicząca w dramacie istnienia.</li></ul>\n<p>Filozofia ta odróżnia się od zdrowego rozsądku tym, że nie zadowala się powierzchownym stwierdzeniem („to jest krzesło i koniec”), lecz pyta o istotę bytu, stawiając w centrum relację: Bóg – człowiek – świat.</p>\n<h4><span class=\"num\">3.</span> Filozofia Dramatu i Koncepcja Osoby</h4>\n<ul><li><b>Idea osoby jako pomost:</b> Chrześcijański personalizm połączył grecką myśl ontologiczną z biblijną wizją człowieka jako relacji.</li><li><b>Wymiar dramatyczny:</b> Życie ludzkie to dramat pełen napięć, wyborów i relacji.</li><li><b>Kluczowa formuła relacyjna:</b> „Ja jestem sobą dzięki tobie” – człowiek staje się w pełni osobą nie w samotności, lecz we wspólnocie i poprzez wzajemne odniesienie do drugiego Ty.</li><li><b>Czas dramatyczny:</b> W przeciwieństwie do matematycznego czasu fizyki przyrodoznawstwa, czas dramatyczny jest skierowany ku przyszłości (wybory, nadzieja, eschatologia), nie unieważnia przeszłości, lecz integruje ją w horyzoncie dokonywania się człowieka.</li></ul>\n<h4><span class=\"num\">4.</span> Świadomość intencjonalna a Roszczenie Drugiego Człowieka</h4>\n<ul><li><b>Stosunek obiektywizacji intencjonalnej:</b> Kiedy patrzymy na świat wokół nas (przedmioty, narzędzia, a czasem niestety także na drugiego człowieka), traktujemy je jak obiekty poddane naszej manipulacji (urzeczowienie).</li><li><b>Drugi człowiek jako Roszczenie:</b> W personalizmie chrześcijańskim drugi człowiek stający przede mną nie jest obojętnym przedmiotem – staje jako roszczenie. Budzi w nas poczucie moralnego obowiązku i wzywa do odpowiedzi („Gdzie jesteś?” – fundamentalne pytanie Boga skierowane do człowieka).</li></ul>\n<h4><span class=\"num\">5.</span> Horyzont Agatologiczny: Zło kontra Nieszczęście</h4>\n<p>Wprowadzone (m.in. w myśli inspirowanej przez ks. Tischnera) pojęcie horyzontu agatologicznego (od gr. agatos – dobro) bada napięcie między dobrem a złem. Niezwykle ważne jest rozróżnienie dwóch pojęć, które często są ze sobą mylone:</p>\n<h5>Nieszczęście</h5>\n<p>Ma charakter czysto losowy.</p>\n<p>Brak w nim celowości, złej woli i świadomego zamierzenia (np. klęski żywiołowe: trzęsienie ziemi, powódź; albo nieszczęśliwy wypadek drogowy, w którym kierowca jechał zgodnie z przepisami, lecz doszło do tragedii).</p>\n<p>Nieszczęście nie jest moralnym złem.</p>\n<h5>Zło</h5>\n<p>Ma charakter dialogiczny i personalny.</p>\n<ul><li><b>Jest świadome i zamierzone</b> – zakłada wolny wybór, celowe działanie wymierzone w drugiego człowieka, niszczenie relacji i sprzeciw wobec dobra.</li></ul>"}, {"t": "Wykład 3 – dobro i zło a wolność, rodzaje więzi, źródła personalizmu", "html": "\n<div class=\"eyebrow\">FILOZOFIA CZŁOWIEKA – Wykład 3</div>\n<div class=\"topic\"><span>Temat</span>Wolność jako warunek dobra i zła, dobra wola (Kant), rodzaje więzi między ludźmi, chrześcijańskie źródła personalizmu</div>\n<h4><span class=\"num\">1.</span> Dobro i zło a wolność</h4>\n<ul>\n<li><b>Nie ma zła ani dobra bez wolności.</b> Dobro i zło moralne pojawiają się tylko tam, gdzie jest wolny wybór osoby.</li>\n<li><b>Na scenie nie ma zła</b> – na poziomie „sceny” (natury, świata rzeczy) zdarzają się nieszczęścia, ale zło rodzi się dopiero między osobami (por. wykład 2: zło dialogiczne a nieszczęście).</li>\n<li>Dobro i zło rozgrywają się w <b>horyzoncie agatologicznym</b> (gr. <i>agathon</i> – dobro) – <b>Tischner</b>.</li>\n</ul>\n<h4><span class=\"num\">2.</span> Dobra wola – Kant</h4>\n<ul>\n<li>Według <b>Kanta</b> nie można pomyśleć niczego, co bez ograniczenia mogłoby być uważane za dobre – z wyjątkiem <b>dobrej woli</b>.</li>\n<li>Nic nie jest bardziej nieograniczenie dobre niż dobra wola.</li>\n</ul>\n<h4><span class=\"num\">3.</span> Jaki rodzaj więzi łączy ludzi?</h4>\n<div class=\"table-wrap\"><table class=\"nt\"><thead><tr><th>Ujęcie</th><th>Więź</th></tr></thead><tbody>\n<tr><td><b>Bez osoby</b></td><td>nie ma żadnej więzi – <b>samotność</b>; człowiek jest zdany na siebie</td></tr>\n<tr><td><b>Liczne ukryte więzi</b></td><td><b>fatum</b> – przeznaczenie (ślepy los, który wiąże ludzi bez ich wiedzy i woli)</td></tr>\n<tr><td><b>Więź łaski</b></td><td>więź pochodząca <b>od Boga</b> – daru, a nie konieczności</td></tr>\n</tbody></table></div>\n<h4><span class=\"num\">4.</span> Źródła personalizmu</h4>\n<ul>\n<li><b>Personalizm</b> ma źródło już w <b>pierwszych wiekach chrześcijaństwa</b> – rodził się w kontekście religijnym.</li>\n<li>Człowiek rozumiany jako osoba pochodząca od Boga, przez Niego chciana i powołana.</li>\n<li><b>Osoba jest bytem otwartym</b> – na drugiego człowieka i na Boga.</li>\n<li>Pytanie na kolejny wykład: <b>jak rozumiano osobę w starożytności?</b></li>\n</ul>\n<div class=\"rule\"><b>Przed następnym wykładem:</b> przypomnieć wykładowcy, że tematem ma być <b>teatr grecki</b> – jak rozumiano osobę w starożytności (osoba – maska aktora: gr. <i>prosopon</i>, łac. <i>persona</i>).</div>\n"}], "fprz": [{"t": "Tematy wypracowań – pytania filozofii przyrody, kosmologii, fizyki i biologii", "html": "<div class=\"eyebrow\">FILOZOFIA PRZYRODY – Wykład 1 (slajdy 12–15)</div>\n<div class=\"topic\"><span>Wypracowania</span>Tematy do wyboru: 2 × 500 słów (30.11 i 31.12.2026, po 25%) oraz 1 × 1500 słów (28.01.2027, 30%)</div>\n<h4><span class=\"num\">1.</span> Pytania zadawane w filozofii przyrody</h4>\n<ol start=\"1\" class=\"topics\"><li>Czym jest natura i rzeczywistość?</li><li>Z czego zbudowany jest świat?</li><li>Czy materia jest podzielna w nieskończoność?</li><li>Czym jest zmiana i ruch?</li><li>Czy istnieje początek i koniec świata?</li><li>Czy czas i przestrzeń istnieją niezależnie od człowieka?</li><li>Czym jest przyczynowość?</li><li>Czy wszystko, co się wydarza, ma swoją przyczynę?</li><li>Czy świat jest deterministyczny, czy istnieje przypadek?</li><li>Jaka jest relacja między materią a świadomością?</li><li>Czy człowiek jest częścią natury, czy czymś od niej różnym?</li><li>Czy prawa przyrody są obiektywne i niezmienne?</li><li>Czy można poznać rzeczywistość wyłącznie za pomocą nauk przyrodniczych?</li><li>Czy istnieje pierwsza przyczyna istnienia świata?</li><li>Czy przyroda ma jakiś cel lub sens?</li></ol>\n<h4><span class=\"num\">2.</span> Pytania w kosmologii</h4>\n<ol start=\"16\" class=\"topics\"><li>Jak powstał Wszechświat?</li><li>Czy Wszechświat ma początek?</li><li>Jak wyglądał Wszechświat na początku swojego istnienia?</li><li>Czy Wszechświat będzie miał koniec?</li><li>Czy Wszechświat jest nieskończony?</li><li>Z czego zbudowany jest Wszechświat?</li><li>Czym jest ciemna materia?</li><li>Czym jest ciemna energia?</li><li>Dlaczego Wszechświat się rozszerza?</li><li>Jak powstały galaktyki, gwiazdy i planety?</li><li>Czy istnieją inne wszechświaty?</li><li>Czy poza Ziemią istnieje życie?</li><li>Czy prawa fizyki są takie same w całym Wszechświecie?</li><li>Czy czas i przestrzeń miały początek?</li><li>Czy można poznać całą historię i przyszłość Wszechświata?</li></ol>\n<h4><span class=\"num\">3.</span> Pytania w fizyce</h4>\n<ol start=\"31\" class=\"topics\"><li>Czym jest materia?</li><li>Czym jest energia?</li><li>Jak działa grawitacja?</li><li>Czym jest ruch i co go powoduje?</li><li>Jakie są podstawowe prawa ruchu?</li><li>Czym jest siła?</li><li>Jak działa światło?</li><li>Czym jest elektryczność i magnetyzm?</li><li>Jak zbudowany jest atom?</li><li>Czym są cząstki elementarne?</li><li>Jak działa czas i przestrzeń?</li><li>Czy czas może płynąć inaczej dla różnych obserwatorów?</li><li>Czym jest temperatura i ciepło?</li><li>Jak powstają fale?</li><li>Czy energia może zostać zniszczona?</li><li>Jak działa mechanika kwantowa?</li><li>Czy wszystko w przyrodzie można dokładnie przewidzieć?</li><li>Jak powstają gwiazdy i planety?</li><li>Jak prawa fizyki opisują początek Wszechświata?</li><li>Czy istnieje jedna teoria wyjaśniająca wszystkie prawa fizyki?</li></ol>\n<h4><span class=\"num\">4.</span> Pytania w biologii</h4>\n<ol start=\"51\" class=\"topics\"><li>Czym jest życie?</li><li>Jak powstało życie na Ziemi?</li><li>Jak zbudowana jest komórka?</li><li>Jak komórki się rozmnażają?</li><li>Jak organizmy dziedziczą cechy?</li><li>Czym jest DNA i jak działa?</li><li>Jak zachodzi ewolucja?</li><li>Dlaczego organizmy przystosowują się do środowiska?</li><li>Jak funkcjonuje ludzki organizm?</li><li>Jak działa układ nerwowy?</li><li>Jak organizmy pozyskują energię?</li><li>Czym jest fotosynteza?</li><li>Jak powstają choroby?</li><li>Jak działa układ odpornościowy?</li><li>Dlaczego organizmy się starzeją?</li><li>Jak powstała różnorodność gatunków?</li><li>Czym jest ekosystem?</li><li>Jak organizmy wpływają na środowisko?</li><li>Dlaczego niektóre gatunki wymierają?</li><li>Czy istnieje życie poza Ziemią?</li></ol>\n<div class=\"tip\"><b>Wskazówka:</b> zaznacz wybrany temat w trybie <b>Czytam (Cornell)</b> – dopisz go jako własne pytanie, a w polu „Podsumowanie” zbieraj pomysły do wypracowania.</div>"}, {"t": "Zasady zaliczenia i literatura", "html": "<ul><li><b>Filozofia przyrody</b> – zasady zaliczenia i literatura</li><li>Warunki zaliczenia</li></ul>\n<h5>2 × wypracowanie (500 słów) na tematy z wykładów – 2 × 25% (łącznie 50%)</h5>\n<ul><li><b>termin:</b> 30.11 termin: 31.12</li></ul>\n<h5>1 × wypracowanie (1500 słów) – 30%</h5>\n<ul><li><b>Termin:</b> 28.01.2027</li><li><b>Quiz</b> – 10%</li><li><b>Uczestnictwo w zajęciach</b> – 10%</li><li>Literatura</li></ul>\n<h5>Podręcznik podstawowy</h5>\n<ul><li><b>Elementy filozofii przyrody</b> – Michał Heller</li></ul>\n<h5>Lektury dodatkowe</h5>\n<ul><li><b>Filozofia przyrody</b> – Michał Heller</li><li>Mała księga kosmologii</li><li>Richard P. Feynman</li></ul>\n<p>What Is Real?</p>"}, {"t": "Wykład 1 – filozofia nauki (6.10.2026)", "html": "<ul><li><b>Wykład 1:</b> Filozofia nauki</li></ul>\n<div class=\"meta\">🗓 Wtorek, 6 października 2026, 09:58</div>\n<ul><li>Filozofia wymaga pytań</li><li>Esej o nałogach</li></ul>\n<p>Filozofia nauki pokazuje nie tylko co odkryła, ale dlaczego można to uznać za naukę.</p>\n<p>Przedmiotem badania jest nauka, ale stawiane pytania mają charakter filozoficzny.</p>\n<ul><li>Czas i przestrzeń</li></ul>"}, {"t": "Wykład 1 – materiały z prezentacji (PDF)", "html": "<h5>Zasady zaliczenia przedmiotu</h5>\n<p>Student ma do napisania dwa wypracowania po 500 słów na tematy z wykładów.</p>\n<p>Wymagane jest również jedno dłuższe wypracowanie na 1500 słów.</p>\n<p>W skład oceny wchodzi także quiz składający się z 10 pytań z wykładów.</p>\n<p>Uczestnictwo w wykładach stanowi 10% końcowej oceny.</p>\n<h5>Zakres tematyczny kursu</h5>\n<p>Wprowadzenie do filozofii przyrody i określenie jej koncepcji.</p>\n<p>Zagadnienia związane z problematyką czasu i przestrzeni.</p>\n<p>Analiza struktury materii oraz wprowadzenie do kosmologii.</p>\n<p>Zagadnienia dotyczące życia, ewolucji oraz statusu informacji jako elementu natury.</p>\n<h5>Filozofia przyrody a filozofia nauki</h5>\n<p>Filozofia przyrody (traktowana jako ontologia) stawia fundamentalne pytanie „Jaki jest świat?” i bada materię, ruch, czas, przestrzeń oraz przyczynowość.</p>\n<p>Filozofia nauki (łącząca epistemologię i ontologię) skupia się wokół pytania „Jak poznajemy świat?” oraz bada metody naukowe, teorie, dowody i granice poznania.</p>\n<h5>Koncepcje czasu w ujęciu historycznym</h5>\n<p>Platon w dialogu Timajos definiuje czas jako „ruchomy obraz wieczności”, który powstał równocześnie ze światem materialnym.</p>\n<p>Czas u Platona jest ściśle powiązany z regularnym i cyklicznym ruchem ciał niebieskich, które wyznaczają miarę dni, miesięcy i lat.</p>\n<p>Arystoteles powiązuje czas z pojęciem ruchu i zmiany rozumianego jako przejście od możliwości do aktu.</p>\n<p>Arystotelesowska definicja określa czas jako „ilość ruchu ze względu na przed i po”, odróżniając go od samego ruchu m.in. ze względu na powszechność występowania i brak własnej prędkości.</p>\n<h5>Ewolucja pojęcia przestrzeni</h5>\n<p>W starożytności przestrzeń nie miała abstrakcyjnego charakteru i była postrzegana jako miejsce (topos u Arystotelesa, który odrzucał istnienie próżni) lub matryca (chōra u Platona).</p>\n<p>Średniowieczna scholastyka przejęła wizję kosmosu jako zbioru jakościowych „miejsc naturalnych”, podtrzymując dogmat o braku próżni (horror vacui).</p>\n<p>Przełom XIV wieku przyniósł spekulacje na temat przestrzeni urojonej (spatium imaginarium), a renesans (Mikołaj z Kuzy, Giordano Bruno) doprowadził do koncepcji nieskończonej i jednorodnej przestrzeni.</p>\n<p>Kartezjusz utożsamił przestrzeń z materią jako rzecz rozciągłą (res extensa), uznając, że świat stanowi całkowicie wypełnione plenum bez próżni.</p>\n<h5>Literatura podstawowa i dodatkowa</h5>\n<p>Podstawowym podręcznikiem do zajęć jest książka Michała Hellera i Tadeusza Pabjana pt. Elementy filozofii przyrody.</p>\n<p>Jako lektury dodatkowe wskazano m.in. dzieła Michała Hellera, Wernera Heisenberga, Carla Rovelliego, Seana Carrolla, Stephena Hawkinga czy Rogera Penrose'a.</p>"}, {"t": "Czas, przestrzeń i ruch – od Platona do Newtona i Leibniza", "html": "<div class=\"eyebrow\">FILOZOFIA PRZYRODY / FILOZOFIA NAUKI</div>\n<div class=\"topic\"><span>Temat</span>Ewolucja pojęcia czasu, przestrzeni i ruchu – od Platona i Arystotelesa do Newtona i Leibniza</div>\n<h4><span class=\"num\">1.</span> Świat form a świat zmiany – koncepcja czasu u Platona</h4>\n<ul><li><b>Matematyczność wszechświata:</b> Świat form/idei cechuje wieczność i niezmienność, natomiast świat materialny to domena nieustannego stawania się, zmiany i przemijania.</li></ul>\n<h5>Platon (Timajos)</h5>\n<ul><li><b>Demiurg</b> – boski budowniczy/architekt, który porządkuje pierwotną materię, wzorując się na wiecznym, niezmiennym świecie form.</li></ul>\n<p>Czas jako „ruchomy obraz wieczności” (eikon kineton tes aionos): Świat materialny nie może uczestniczyć w wieczności bezpośrednio, dlatego demiurg powołał czas. Czas i świat powstały równocześnie.</p>\n<p>Miarą czasu są regularne obroty ciał niebieskich (dni, miesiące, lata).</p>\n<h5>Koncepcje czasu w kulturach</h5>\n<ul><li><b>Czas cykliczny:</b> Dominujący w kosmologiach starożytnych (Grecja, Indie, Majowie, tradycja chińska). Wywodzi się z powtarzalności cykli przyrody i orbit planetarnych.</li><li><b>Czas linearny:</b> Ufundowany w tradycji judeochrześcijańskiej – posiada absolutny początek (akt stworzenia creatio ex nihilo), nieodwracalny bieg przez historię i ukierunkowanie ku ostatecznemu wypełnieniu (eschatologia).</li></ul>\n<h4><span class=\"num\">2.</span> Przełom nowożytny: Od Arystotelesa do Newtona (Alexandre Koyré)</h4>\n<h5>Alexandre Koyré (Od zamkniętego świata do nieskończonego wszechświata)</h5>\n<p>Rewolucja naukowa nie polegała wyłącznie na odkryciu nowych faktów empirycznych, lecz na fundamentalnej zmianie ontologicznego obrazu świata.</p>\n<p>Zastąpienie skończonego, jakościowego i zhierarchizowanego kosmosu greckiego przez nieskończony, zgeometryzowany i jednorodny wszechświat nowożytny.</p>\n<ul><li><b>Odrzucenie teleologii:</b> Usunięcie z opisu przyrody arystotelesowskich przyczyn celowych na rzecz przyczyn sprawczych i praw mechaniki.</li><li><b>Matematyzacja przyrody:</b> Matematyczna idealizacja (linie proste, punkty materialne, ruch bez oporów w próżni) uzyskała prymat nad bezpośrednim, codziennym doświadczeniem zmysłowym.</li></ul>\n<h4><span class=\"num\">3.</span> Ruch i dynamika: Arystoteles vs Newton (1687 r., Principia Mathematica)</h4>\n<ul><li>Zagadnienie Dynamika Arystotelesa Mechanika klasyczna Isaaca Newtona</li><li><b>Pojęcie ruchu Proces ontologiczny</b> – aktualizacja możności (potentia → actus), dążenie ciała do swego „miejsca naturalnego” (np. kamień ku ziemi, dym ku górze). Stan fizyczny – ruch jednostajny prostoliniowy jest stanem fizycznym równoważnym stanowi spoczynku.</li></ul>\n<p>Rola siły Konieczna do nieustannego podtrzymywania każdego ruchu (brak siły = natychmiastowe zatrzymanie). Potrzebna wyłącznie do zmiany stanu ruchu (zmiany wartości prędkości lub kierunku).</p>\n<p>Przestrzeń Zbiór jakościowych, skończonych „miejsc” ciał; brak próżni. Nieskończona, jednorodna, izotropowa; istnieje próżnia.</p>\n<p>Aparat pojęciowy Intuicyjny, jakościowy (ciężar, bodziec, cel). Definicje operacyjne (ścisły przepis pomiaru: masa, pęd, siła).</p>\n<h5>Trzy zasady dynamiki Newtona</h5>\n<ul><li><b>I zasada (bezwładność):</b> Ciało zachowuje stan spoczynku lub ruchu jednostajnego prostoliniowego, dopóki nie zadziała na nie wypadkowa siła zewnętrzna.</li><li><b>II zasada ( F=m⋅a):</b> Przyspieszenie ciała jest wprost proporcjonalne do działającej siły i odwrotnie proporcjonalne do jego masy.</li><li><b>III zasada (akcja i reakcja):</b> Oddziaływania ciał są wzajemne – sile akcji towarzyszy równa co do wartości, lecz przeciwnie skierowana siła reakcji.</li></ul>\n<h4><span class=\"num\">4.</span> Klasyczna zasada względności (Galileusz / Newton)</h4>\n<p>Prawa mechaniki mają tę samą postać we wszystkich inercjalnych układach odniesienia.</p>\n<ul><li><b>Eksperyment myślowy z pociągiem:</b> Za pomocą jakichkolwiek doświadczeń mechanicznych przeprowadzanych wewnątrz zamkniętego układu (np. podrzucenie piłki w poruszającym się jednostajnie pociągu) nie da się rozstrzygnąć, czy układ spoczywa, czy porusza się ruchem jednostajnym prostoliniowym.</li></ul>\n<h4><span class=\"num\">5.</span> Wielki spór metafizyczny o czas i przestrzeń: Newton vs Leibniz</h4>\n<h4><span class=\"num\">A.</span> Koncepcja absolutna (substancjalna / „kontenerowa”) – Isaac Newton</h4>\n<ul><li><b>Przestrzeń absolutna:</b> Istnieje obiektywnie, sama z siebie, niezależnie od ciał materialnych. Jest nieruchomym, nieskończonym, trójwymiarowym „kontenerem/pojemnikiem”, który może być pusty (istnienie próżni). Wszędzie jednakowa (jednorodna i izotropowa).</li><li><b>Czas absolutny:</b> Płynie jednostajnie sam przez się, bez odniesienia do czegokolwiek zewnętrznego. Istnieje absolutna, uniwersalna równoczesność dla całego wszechświata („jeden kosmiczny zegar”).</li></ul>\n<h4><span class=\"num\">B.</span> Koncepcja relacyjna – Gottfried Wilhelm Leibniz</h4>\n<p>Czas i przestrzeń nie są osobnymi substancjami ani „pojemnikami”, lecz strukturą relacji między rzeczami i zdarzeniami:</p>\n<p>Przestrzeń to porządek współistnienia rzeczy (gdyby usunąć wszystkie ciała, nie pozostałaby żadna przestrzeń).</p>\n<ul><li><b>Czas to porządek następstwa zdarzeń (relacje:</b> wcześniej – równocześnie – później; bez zachodzących zmian czas nie istnieje).</li></ul>\n<h5>Dwa argumenty metafizyczne Leibniza przeciw przestrzeni i czasowi absolutnemu</h5>\n<ul><li><b>Zasada racji dostatecznej (principium rationis sufficientis):</b> Bóg nie miałby żadnego rozumnego powodu (racji dostatecznej), aby stworzyć wszechświat przesunięty w przestrzeni absolutnej o metr w bok lub w czasie o godzinę wcześniej, skoro wszystkie relacje wzajemne między rzeczami pozostałyby identyczne.</li></ul>\n<p>Zasada tożsamości rzeczy nierozróżnialnych (principium identitatis indiscernibilium): Dwa stany, które nie różnią się żadną wewnętrzną, uchwytną własnością relacyjną, są w istocie jednym i tym samym stanem.</p>"}, {"t": "Wykład 2 – materiały z prezentacji (PDF)", "html": "<h4><span class=\"num\">1.</span> Informacje organizacyjne i programowe</h4>\n<h5>Zasady zaliczenia przedmiotu</h5>\n<ul><li><b>Dwa wypracowania po 500 słów na tematy z wykładów (terminy:</b> 30.11 oraz 31.12; każde warte</li><li>25%, łącznie</li></ul>\n<p>50%).</p>\n<ul><li><b>Jedno wypracowanie na 1500 słów (termin:</b> 28.01.2027; warte</li></ul>\n<p>30%).</p>\n<p>Quiz składający się z 10 pytań z wykładów ( 10%).</p>\n<p>Uczestnictwo w wykładach ( 10%).</p>\n<ul><li><b>Podstawowa literatura:</b> Podręcznik Elementy filozofii przyrody autorstwa Michała Hellera i Tadeusza Pabjana.</li></ul>\n<h4><span class=\"num\">2.</span> Podsumowanie i kontynuacja zagadnień z wykładu pierwszego</h4>\n<p>Przypomniano podstawowe pytania stawiane w filozofii przyrody oraz relację między naukami empirycznymi (fizyką, kosmologią, biologią) a refleksją filozoficzną.</p>\n<p>Omówiono historyczne koncepcje czasu (Platon jako „ruchomy obraz wieczności”, Arystoteles jako miara ruchu) oraz ewolucję pojęcia przestrzeni – od greckiego pojęcia miejsca (topos u Arystotelesa, odrzucenie próżni) po nowożytną przestrzeń geometryczną.</p>\n<h4><span class=\"num\">3.</span> Mechanika klasyczna i zasady dynamiki Newtona</h4>\n<p>W 1687 roku Izaak Newton opublikował dzieło Philosophiæ Naturalis Principia Mathematica, w którym sformułował trzy zasady dynamiki oraz prawo powszechnego ciążenia.</p>\n<p>Wprowadził definicje operacyjne kluczowych pojęć (takich jak masa, pęd czy siła), które stanowią „przepis na zmierzenie” danej wielkości fizycznej i obowiązują do dzisiaj.</p>\n<h4><span class=\"num\">4.</span> Ontologia ruchu według Alexandre'a Koyrégo</h4>\n<p>Przejście od dynamiki Arystotelesa do dynamiki Newtona zostało zinterpretowane przez historyka nauki Alexandre'a Koyrégo nie jako proste gromadzenie faktów, lecz jako głęboka rewolucja ontologiczna i pojęciowa.</p>\n<h5>Główne aspekty tej rewolucji to</h5>\n<ul><li><b>Dewaloryzacja natury:</b> Odrzucenie arystotelesowskiej teleologii (wyjaśniania ruchu przez cel i dążenie do „miejsca naturalnego”) na rzecz opisu mechanistycznego.</li><li><b>Matematyzacja i idealizacja:</b> Nadanie prymatu abstrakcji matematycznej nad bezpośrednim doświadczeniem zmysłowym (np. posługiwanie się pojęciem idealnej próżni czy nieskończonej linii prostej).</li></ul>\n<h4><span class=\"num\">5.</span> Klasyczna zasada względności (Galileusza)</h4>\n<p>Głosi ona, że prawa mechaniki mają taką samą postać we wszystkich inercjalnych układach odniesienia.</p>\n<p>Ruch jednostajny prostoliniowy przestał być procesem wymagającym ciągłego działania siły podtrzymującej (jak u Arystotelesa) i stał się stanem fizycznym równoważnym spoczynkowi. Przykładowo, doświadczenia mechaniczne wewnątrz poruszającego się ze stałą prędkością pociągu (np. podrzucanie piłki) nie pozwalają odróżnić tego ruchu od spoczynku.</p>\n<h4><span class=\"num\">6.</span> Czas i przestrzeń absolutna u Isaaca Newtona</h4>\n<ul><li><b>Czas absolutny:</b> Płynie równomiernie i z tej samej natury, bez odniesienia do czegokolwiek zewnętrznego; zakłada absolutną równoczesność zdarzeń we wszechświecie ( t′</li></ul>\n<p>=t).</p>\n<ul><li><b>Przestrzeń absolutna:</b> Istnieje niezależnie od materii, ciał fizycznych czy obserwatorów; jest nieruchoma, jednorodna, izotropowa, nieskończona i ma geometrię euklidesową.</li></ul>\n<p>Jako dowód na istnienie rzeczywistego ruchu obrotowego względem przestrzeni absolutnej Newton przywołał słynny eksperyment z obracającym się wiadrem z wodą (wklęsłość powierzchni wody).</p>\n<h4><span class=\"num\">7.</span> Relacyjna koncepcja czasu i przestrzeni Gottfrida Wilhelma Leibniza</h4>\n<p>Gottfried Wilhelm Leibniz sprzeciwił się ujęciu Newtona, twierdząc, że czas i przestrzeń nie posiadają niezależnego statusu ontologicznego, lecz są systemem relacji:</p>\n<p>Przestrzeń to porządek współistnienia rzeczy (ordo coexistendi).</p>\n<p>Czas to porządek następstwa zdarzeń (ordo successionis).</p>\n<p>Leibniz argumentował przeciwko przestrzeni absolutnej za pomocą swoich filozoficznych zasad: zasady racji dostatecznej oraz zasady tożsamości rzeczy nierozróżnialnych (np. argumentując, że przesunięcie całego wszechświata w przestrzeni absolutnej nie zmieniłoby relacji między ciałami, więc taki byt nie ma racji bytu).</p>"}, {"t": "Wykład 2 – czas, przestrzeń, czasoprzestrzeń", "html": "<div class=\"eyebrow\">FILOZOFIA PRZYRODY / FIZYKA WSPÓŁCZESNA – Wykład: Czas, Przestrzeń i Czasoprzestrzeń</div>\n<h4><span class=\"num\">1.</span> Czasoprzestrzeń (Perspektywa relatywistyczna)</h4>\n<ul><li><b>Wiązanie czasu i przestrzeni:</b> Szczególna i ogólna teoria względności (Einstein) pokazuje, że czas i przestrzeń nie są niezależnymi, absolutnymi bytami, lecz dwoma aspektami (własnościami) tej samej struktury – czasoprzestrzeni (czterowymiarowego continuum).</li><li><b>Niezmienniczość interwału (ds²):</b> Długość wektora w czasoprzestrzeni (interwał czasoprzestrzenny) pozostaje niezmienna niezależnie od układu odniesienia (współrzędnych obserwatora), co oznacza, że czas i przestrzeń są ze sobą ściśle powiązane.</li><li><b>Grawitacja a zakrzywienie:</b> Masa i energia zakrzywiają czasoprzestrzeń. Obiekty o wielkich masach (np. galaktyki, czarne dziury) działają jak gigantyczne soczewki grawitacyjne – zakrzywiają bieg światła, co pozwala nam obserwować obiekty kosmiczne, które w normalnych warunkach byłyby zasłonięte (tzw. soczewkowanie grawitacyjne, dające m.in. wielokrotne obrazy tego samego źródła).</li></ul>\n<h4><span class=\"num\">2.</span> Ontologia obiektu w czasie: Enduryzm vs Perdurantyzm</h4>\n<p>W filozofii przyrody i metafizyce istnieje poważny spór o to, jak obiekty fizyczne istnieją i trwają w czasie:</p>\n<ul><li><b>Enduryzm:</b> Obiekt w każdym momencie swojego istnienia jest w całości obecny; zachowuje swoją tożsamość jako całość w kolejnych chwilach czasu.</li><li><b>Perdurantyzm (widmo światła / czterowymiarowa rozciągłość):</b> Obiekt jest rozciągnięty w czasoprzestrzeni. To, co widzimy jako „obiekt”, to w rzeczywistości jego czterowymiarowy trakt (linia świata), będący sumą kolejnych stanów (zdarzeń) w czasie (np. samochód istniejący od godziny 8:00 do 11:00 to całościowy obiekt rozciągnięty w tym przedziale czasoprzestrzennym).</li><li><b>Problem ontologiczny:</b> Czy czterowymiarowa matematyczna reprezentacja obiektu oznacza, że jest on realnym bytem fizycznym, czy tylko użytecznym modelem opisu?</li></ul>\n<h4><span class=\"num\">3.</span> Strzałka Czasu i Termodynamika</h4>\n<p>Prawa fizyki na poziomie mikro (mikroskopowym) są w większości symetryczne względem czasu (równania nie zależą od kierunku upływu czasu). Dlaczego więc w świecie makroskopowym czas płynie w jedną stronę (od przeszłości do przyszłości)?</p>\n<h4><span class=\"num\">A.</span> Termodynamiczna strzałka czasu</h4>\n<ul><li><b>Druga zasada termodynamiki:</b> W układach izolowanych entropia (miara nieuporządkowania / chaosu) zawsze rośnie w czasie.</li></ul>\n<p>Wzrost entropii wyznacza jednoznaczny kierunek procesów makroskopowych (np. rozproszony gaz nie zbiera się samorzutnie z powrotem w jednym rogu pojemnika, choć czysto mechanicznie/statystycznie nie jest to całkowicie wykluczone, a jedynie skrajnie nieprawdopodobne).</p>\n<ul><li><b>Paradoks odwracalności:</b> Skoro prawa mikroskopowe są odwracalne, to skąd bierze się makroskopowa asymetria czasu? Odpowiedź daje mechanika statystyczna – kierunek czasu wiąże się ze wzrostem prawdopodobieństwa (stanów mikroskopowych odpowiadających danemu stanowi makroskopowemu) oraz tzw. warunkiem brzegowym wszechświata (wszechświat musiał zacząć swoją ewolucję w stanie o niezwykle niskiej entropii).</li></ul>\n<h4><span class=\"num\">B.</span> Inne rodzaje strzałek czasu</h4>\n<ul><li><b>Strzałka kosmologiczna:</b> Związana z ekspansją (rozszerzaniem się) wszechświata.</li><li><b>Strzałka psychologiczna:</b> Nasze odczuwanie upływu czasu, pamięć o przeszłości i otwartość na nieznaną przyszłość.</li></ul>\n<h4><span class=\"num\">4.</span> Koncepcje Czasu: Teoria A vs Teoria B</h4>\n<ul><li><b>Teoria A (Czas dynamiczny / presentizm):</b> Zakłada realność \"teraz\". Przeszłość już minęła, przyszłość jeszcze nie nadeszła, a teraźniejszość przesuwa się dynamicznie w czasie.</li><li><b>Teoria B (Czas statyczny / eternalizm):</b> Zakłada, że przeszłość, teraźniejszość i przyszłość współistnieją w strukturze czasoprzestrzeni, a relacje „wcześniej” i „później” są stałymi relacjami porządkującymi zdarzenia (czas jako gotowy, rozciągnięty blok).</li></ul>\n<h4><span class=\"num\">5.</span> Spór o status przestrzeni i czasu: Newton vs Leibniz</h4>\n<h5>W historii filozofii i fizyki ścierały się dwa podejścia do natury przestrzeni i czasu</h5>\n<ul><li><b>Absolutyzm (I. Newton):</b> Przestrzeń i czas istnieją obiektywnie i absolutnie, niezależnie od znajdującej się w nich materii. Przestrzeń to swoiste „naczynie”, w którym dopiero umieszczone są ciała.</li><li><b>Relacjonizm (G. W. Leibniz):</b> Przestrzeń i czas nie są niezależnymi substancjami, lecz systemami relacji między ciałami i zdarzeniami. Nie ma przestrzeni „przed” stworzeniem materii – przestrzeń i czas rodzą się z relacji między obiektami.</li><li>Podsumowanie i Wnioski Metodologiczne</li></ul>\n<p>Współczesna fizyka (szczególnie teoria względności) pokazuje, że zmiany w opisie fizycznym (np. przejście od mechaniki klasycznej do relatywistycznej) mogą radykałnie modyfikować nasz obraz ontologiczny rzeczywistości.</p>"}], "hk": [{"t": "Kościół w Antiochii, misje św. Pawła, Sobór Jerozolimski", "html": "<div class=\"eyebrow\">HISTORIA KOŚCIOŁA / PATROLOGIA</div>\n<div class=\"topic\"><span>Temat</span>Kościół w Antiochii Syryjskiej, Misje św. Pawła i Sobór Jerozolimski</div>\n<h4><span class=\"num\">1.</span> Kontekst historyczno-kulturowy Antiochii</h4>\n<ul><li><b>Geneza miasta:</b> Założona przez Seleukosa I Nikatora (jednego z wodzów Aleksandra Macedońskiego – diadochów), nazwana na cześć jego ojca Antiocha. Kluczowa metropolia hellenistyczna na Bliskim Wschodzie.</li></ul>\n<h5>Tygiel kulturowy i językowy</h5>\n<ul><li><b>Przecięcie szlaków handlowych; współistnienie kultur:</b> syryjskiej, greckiej i semickiej.</li><li><b>Język jako funkcja kultury:</b> Język jest nośnikiem idei i mentalności społeczeństwa; znajomość języków epoki pozwala zrozumieć proces inkulturacji orędzia ewangelicznego.</li></ul>\n<h5>Tło religijno-filozoficzne i społeczne</h5>\n<ul><li><b>Stoicyzm:</b> Wiara w kosmiczny Logos przenikający świat; brak osobowego Boga; cykliczność kosmosu (pożar świata – ekpyrosis i ponowne narodziny, co przypomina pulsacyjne modele kosmologiczne).</li><li><b>Kulty misteryjne:</b> Wprowadzenie w tajemnicę i zjednoczenie z bóstwem przez obrzędy inicjacyjne.</li><li><b>Magia a brak wczesnych ksiąg liturgicznych:</b> Do IV w. unikano spisywania formuł liturgicznych, by nie kojarzyły się one z pogańskimi księgami magicznymi/zaklęciami.</li><li><b>Struktura społeczna i kryzys moralny:</b> Gospodarka oparta na niewolnictwie – niewolnik traktowany przedmiotowo jako rzymskie instrumentum vocale („mówiące narzędzie”), którego pan mógł bezkarnie zabić.</li></ul>\n<h4><span class=\"num\">2.</span> Przełom antiocheński i otwarcie na pogan</h4>\n<ul><li><b>Nowy wymiar Kościoła:</b> Ewangelia początkowo głoszona w synagogach Żydom w diasporze, z czasem dociera do pogan (etnochrześcijan).</li></ul>\n<p>Termin „poganin” (anachronizm historyczny): Łacińskie słowo paganus (wieśniak, mieszkaniec wsi) to pojęcie późniejsze/średniowieczne. W Biblii mówi się po prostu o „narodach” (gentes / goje) w opozycji do Ludu Wybranego.</p>\n<h5>Postacie kluczowe</h5>\n<ul><li><b>Barnaba</b> – rozpoznał otwartość pogan i sprowadził Pawła z Tarsu.</li><li><b>Św. Paweł z Tarsu</b> – wychowany w diasporze, znał aramejski, hebrajski i grekę; łączył rygorystyczne wykształcenie faryzejskie z kulturą hellenistyczną.</li><li><b>Św. Ignacy Antiocheński (zm. ok. 107/110 r.)</b> – jeden z pierwszych biskupów Antiochii, męczennik w Rzymie.</li></ul>\n<p>W Antiochii po raz pierwszy nazwano uczniów Chrystusa chrześcijanami (Christianoi).</p>\n<h4><span class=\"num\">3.</span> Misje św. Pawła i kwestia kanonu Pisma Świętego</h4>\n<ul><li><b>Metoda misyjna:</b> Najpierw głoszenie w synagodze → po odrzuceniu przez większość Żydów → przejście do pogan.</li><li><b>I podróż misyjna:</b> Cypr i Azja Mniejsza.</li><li><b>II podróż misyjna:</b> Macedonia, Achaja (Korynt, Ateny).</li><li><b>III podróż misyjna:</b> Azja Prokonsularna (m.in. Efez).</li></ul>\n<h5>Teologia kanonu biblijnego</h5>\n<p>Paweł napisał prawdopodobnie 3 listy do Koryntian (zachowały się 2).</p>\n<p>O kanoniczności nie decyduje sam fakt napisania listu czy jego ewentualne odnalezienie archeologiczne, lecz rozeznanie i autorytet wspólnoty Kościoła, która pod natchnieniem Ducha Świętego rozpoznaje Słowo Boże (w odróżnieniu np. od islamskiej koncepcji dyktanda z nieba).</p>\n<h4><span class=\"num\">4.</span> Spór o Prawo i tzw. Sobór Jerozolimski (49 r.)</h4>\n<h5>Istota sporu: Napięcie między dwoma nurtami pierwotnego chrześcijaństwa</h5>\n<ul><li><b>Nurt judeochrześcijański (piotrowy):</b> Utrzymanie tradycji świątynnych, obrzezania i całego Prawa Mojżeszowego.</li><li><b>Nurt etnochrześcijański (pawłowy):</b> Usprawiedliwienie człowieka wynika z wiary w Chrystusa i łaski, a nie z zachowywania przepisów Tory.</li></ul>\n<h5>Decyzja zgromadzenia apostolskiego (Dz 15)</h5>\n<ul><li><b>Słynna formuła eklezjalna:</b> „Postanowiliśmy bowiem, Duch Święty i my...”.</li></ul>\n<p>Zwolniono chrześcijan z pogaństwa z obowiązku obrzezania i Prawa Mojżeszowego, nakładając jedynie 4 podstawowe zakazy (tzw. klauzule Jakubowe / prawa przymierza):</p>\n<p>Zakaz spożywania ofiar składanych bożkom (zakaz bałwochwalstwa/apostazji).</p>\n<p>Zakaz spożywania krwi.</p>\n<p>Zakaz spożywania mięsa zwierząt duszonych.</p>\n<p>Zakaz nierządu (porneia).</p>\n<h5>Ewolucja dyscypliny kościelnej (kontekst historyczny)</h5>\n<p>Dekalog (10 przykazań) jako podstawowa norma katechetyczna i spowiedziowa wszedł powszechnie dopiero za reform Karola Wielkiego (przełom VIII/IX w.).</p>\n<p>Odejście od starożytnej pokuty publicznej (jednorazowej) na rzecz spowiedzi usznej (wielokrotnej) sformalizował definitywnie IV Sobór Laterański (1215 r.).</p>\n<h4><span class=\"num\">5.</span> Życie, struktura i eschatologia wczesnych gmin</h4>\n<ul><li><b>Napięcie eschatologiczne:</b> Poczucie natychmiastowej bliskości Paruzji (powtórnego przyjścia Chrystusa za życia pierwszego pokolenia). Stąd aramejski okrzyk liturgiczny: Marana tha (Przyjdź, Panie nasz!).</li><li><b>Urząd i posługa w gminach pawłowych:</b> Struktura oparta na kolegium starszych – prezbiterach (presbyteroi) i biskupach/nadzorcach (episkopoi).</li></ul>\n<h5>Tradycyjne tereny działalności Apostołów</h5>\n<ul><li><b>Andrzej:</b> Tracja, Grecja, Scytia.</li><li><b>Filip:</b> Azja Mniejsza.</li><li><b>Bartłomiej:</b> Arabia Południowa, Indie.</li><li><b>Tomasz:</b> Syria, Persja, Indie.</li><li><b>Mateusz i Juda Tadeusz:</b> Palestyna, Syria, Mezopotamia.</li></ul>"}, {"t": "Ćwiczenia – Sobór Jerozolimski, prawa noachickie, wspólnota stołu", "html": "<div class=\"eyebrow\">HISTORIA KOŚCIOŁA / PATROLOGIA – ĆWICZENIA</div>\n<div class=\"topic\"><span>Temat</span>Sobór Jerozolimski, Prawa Noachickie i Wspólnota Stołu</div>\n<h4><span class=\"num\">1.</span> Prawa noachickie (Przymierze z Noem) jako biblijny punkt odniesienia</h4>\n<ul><li><b>Pojęcie i adresaci:</b> Według tradycji żydowskiej to uniwersalny kodeks moralny dany przez Boga nie tylko Izraelowi, ale całej ludzkości (potomkom Noego, czyli nie-Żydom / narodom).</li><li><b>Symbol:</b> Tęcza – znak przymierza Boga z wszelkim stworzeniem po potopie.</li><li><b>Główne zakazy:</b> Zakaz bałwochwalstwa, bluźnierstwa, morderstwa, kradzieży, niemoralności seksualnej oraz spożywania mięsa odciętego z żywego zwierzęcia (zakaz spożywania krwi jako szacunek dla daru życia).</li><li><b>Stanowiły one w tradycji biblijnej precedens:</b> nie-Żyd nie musiał przyjmować Tory mojżeszowej, by podobać się Bogu – wystarczyło zachowywanie przymierza z Noem.</li></ul>\n<h4><span class=\"num\">2.</span> Przyczyny i podłoże konfliktu w Jerozolimie (Dz 15)</h4>\n<ul><li><b>Kwestia obrzezania:</b> Część nawróconych chrześcijan pochodzenia żydowskiego (zwłaszcza z tradycji faryzejskiej w Jerozolimie) domagała się, aby nawróceni poganie poddawali się obrzezaniu i zachowywali Prawo Mojżeszowe jako warunek zbawienia.</li></ul>\n<h5>Problem „wspólnoty stołu” (commensalitas)</h5>\n<ul><li><b>Spór miał wymiar dogmatyczny i codzienno-praktyczny:</b> czy chrześcijanin Żyd może zasiąść do jednego stołu i spożywać posiłki z chrześcijaninem pochodzenia pogańskiego bez zaciągania nieczystości rytualnej?</li><li><b>Tło historyczne rygoryzmu:</b> Po wojnach machabejskich (w reakcji na przymusową hellenizację) faryzeusze wprowadzili skrajnie rygorystyczne przepisy czystości rytualnej i separacji od pogan jako wyraz wierności Bogu.</li><li><b>Wewnętrzny spór apostolski (incydent w Antiochii):</b> Paweł otwarcie sprzeciwił się Piotrowi (Ga 2), zarzucając mu nieszczerość, gdy ten początkowo jadał z poganami, a po przybyciu ludzi Jakuba zaczął się wycofywać z obawy przed zwolennikami obrzezania.</li></ul>\n<h4><span class=\"num\">3.</span> Postanowienia tzw. Soboru Jerozolimskiego (49 r.)</h4>\n<ul><li><b>Misja do Jerozolimy:</b> Paweł i Barnaba udają się do Jerozolimy, aby przedstawić sprawę Apostołom i starszym.</li><li><b>Decyzja zgromadzenia:</b> Słynna formuła: „Duch Święty i my postanowiliśmy...”.</li></ul>\n<p>Zamiast nakładać na nawróconych pogan ponad 600 szczegółowych przepisów Tory (613 micwot), przyjęto 4 minimalne zalecenia (tzw. klauzule Jakubowe) umożliwiające zachowanie jedności stołu:</p>\n<p>Powstrzymanie się od ofiar składanych bożkom (bałwochwalstwo).</p>\n<p>Powstrzymanie się od krwi (szacunek dla życia / zabójstwo).</p>\n<p>Powstrzymanie się od tego, co uduszone (mięso z krwią / apostazja).</p>\n<ul><li><b>Powstrzymanie się od nierządu (porneia</b> – niemoralność seksualna, związki kazirodcze).</li></ul>\n<h4><span class=\"num\">4.</span> Skutki historyczne i teologiczne</h4>\n<ul><li><b>Uniwersalizm chrześcijaństwa:</b> Chrześcijaństwo nie zostało zamknięte w ciasnych ramach sekty judaizmu (jak faryzeusze, saduceusze czy esseńczycy), lecz stało się religią otwartą na cały świat.</li><li><b>Zniesienie barier rytualnych:</b> Rozbicie barier pokarmowych i obyczajowych umożliwiło jedność stołu i Eucharystii pomiędzy Żydami a poganami.</li></ul>\n<h5>Źródło wczesnej dyscypliny pokutnej</h5>\n<p>Złamanie tych czterech praw w pierwotnym Kościele traktowano jako zerwanie przymierza i grzech ciężki (kapitalny: bałwochwalstwo, zabójstwo, nierząd, apostazja).</p>\n<p>Na tej podstawie rozwinęła się w starożytności instytucja tzw. drugiej pokuty (jednorazowej, publicznej pokuty po chrzcie).</p>\n<ul><li><b>Kontekst historyczno-prawny:</b> Choć chrześcijaństwo odeszło od 613 przepisów Talmudu, z czasem wypracowało własne prawo kanoniczne (współczesny Kodeks Prawa Kanonicznego z 1983 r. liczy 1752 kanony).</li></ul>"}, {"t": "Ćwiczenia – geneza urzędów i sukcesji", "html": "<div class=\"eyebrow\">HISTORIA KOŚCIOŁA / PATROLOGIA – ĆWICZENIA</div>\n<div class=\"topic\"><span>Temat</span>Geneza urzędów, posług i sukcesji w Kościele pierwotnym (Struktura Dwunastu, Siedmiu, Prezbiterzy i Biskupi)</div>\n<h4><span class=\"num\">1.</span> Źródło i charakter władzy w Kościele pierwotnym</h4>\n<ul><li><b>Pochodzenie urzędu:</b> Władza i struktura Kościoła nie mają charakteru czysto demokratycznego ani korporacyjnego. Wywodzą się z mandatu Chrystusa (z powołania i zadania Bożego) oraz przekazywania posługi prawnej w Duchu Świętym.</li><li><b>Kwestia anachronizmu kapłaństwa:</b> W I wieku i na początku II wieku nie mówi się jeszcze o „kapłaństwie” w dzisiejszym, sakramentalno-hierarchicznym znaczeniu (kapłaństwie urzędowym / kultycznym).</li></ul>\n<p>Jezus przyszedł, aby służyć (diakonia), a nie sprawować świecką władzę.</p>\n<p>Zredefiniował On pojęcie ofiary (nie jako rytuał krwawy w świątyni, lecz dar z samego siebie).</p>\n<ul><li><b>Potrzeba organizacji:</b> Wraz z dynamicznym rozrostem gmin chrześcijańskich i wymieraniem naocznych świadków pojawiła się naturalna potrzeba ustrukturyzowania wspólnot, wyłonienia odpowiedzialnych za nauczanie, charytatywną pomoc i zachowanie jedności wiary.</li></ul>\n<h4><span class=\"num\">2.</span> Kolegium Dwunastu i pojęcie „Apostoła”</h4>\n<ul><li><b>Wybranie przed męką – świadkowie zmartwychwstania:</b> Dwunastu zostało wybranych przez Jezusa osobiście jeszcze przed męką i śmiercią, stając się po Zmartwychwstaniu gwarantami ciągłości między ziemską działalnością Jezusa a rodzącym się Kościołem.</li><li><b>Symbolika 12 pokoleń:</b> Grupa 12 nawiązuje wprost do 12 pokoleń Izraela (12 patriarchów) – symbolizuje, że Kościół jest nowym, odnowionym Ludem Bożym opartym na fundamencie obietnic danych Izraelowi.</li></ul>\n<h5>Szerszy zakres terminu „apostoł” (apostolos – wysłannik)</h5>\n<p>Tytuł ten przysługiwał nie tylko ścisłemu gronu Dwunastu, ale także innym powołanym przez Chrystusa misjonarzom (np. św. Paweł, św. Barnaba).</p>\n<h5>Zagadka Junii (Rz 16,7)</h5>\n<ul><li><b>Święty Paweł pisze:</b> „Pozdrówcie Andronika i Junię... którzy cieszą się wielkim poważaniem wśród apostołów”.</li></ul>\n<p>W tradycji patrystycznej I tysiąclecia (np. u Jana Chryzostoma) postać ta jednomyślnie uznawana była za kobietę – Junię. Dopiero w łacińskim średniowieczu (np. u Idziego Rzymianina w XIII w.) zaczęto maskulinizować jej imię do formy „Junias” z racji późniejszego utożsamienia apostolstwa wyłącznie z mężczyznami.</p>\n<h4><span class=\"num\">3.</span> Rozwój posług i urzędów w gminach</h4>\n<h5>Ustanowienie Siedmiu (Dz 6)</h5>\n<p>Powstało w wyniku konfliktu wewnętrznego między chrześcijanami pochodzenia hellenistycznego a hebrajskiego na tle codziennego zaopatrywania wdów przy stole.</p>\n<p>Apostołowie, by nie zaniedbywać posługi słowa i modlitwy, ustanowili Siedmiu mężów cieszących się dobrą sławą – był to historyczny prototyp posługi diakonatu (zarząd dobrami, pomoc ubogim, posługa stołu).</p>\n<h5>Starszyzna (Prezbiterzy – presbyteroi)</h5>\n<p>Instytucja wywodząca się bezpośrednio z żydowskiej tradycji synagogalnej.</p>\n<p>Byli odpowiedzialni za pasterzowanie, ład wspólnotowy oraz rozstrzyganie sporów wewnątrz gminy.</p>\n<h5>Nadzorcy (Biskupi – episkopoi)</h5>\n<p>Pojęcie zapożyczone z greckiego kręgu kulturowego (nadzorca, strażnik).</p>\n<p>W tekstach z I wieku (np. w listach Pawłowych czy Dziejach Apostolskich) terminy prezbiter i episkop były stosowane zamiennie na określenie zwierzchników lokalnego kościoła.</p>\n<h5>Urzędy charyzmatyczne a urzędy stałe</h5>\n<p>Pierwotnie ogromną rolę odgrywały wędrowne posługi charyzmatyczne: prorocy, nauczyciele i ewangeliści, cieszący się wielkim autorytetem w Duchu Świętym.</p>\n<p>Stopniowo, w miarę osłabiania się nurtu charyzmatycznego i pojawiania się fałszywych nauczycieli, ich funkcje przejęły stałe, lokalne urzędy.</p>\n<h4><span class=\"num\">4.</span> Sukcesja apostolska i wykształcenie hierarchii</h4>\n<ul><li><b>Konieczność sukcesji:</b> Po śmierci Apostołów kluczowym kryterium autentyczności wiary stało się zachowanie nauce apostolskiej (apostolicitas) i ciągłości przekazu.</li><li><b>Ryt nałożenia rąk (chirotonia):</b> Ustanawianie na urzędy dokonywało się poprzez rozeznanie wspólnoty, modlitwę oraz gest nałożenia rąk starszych/apostołów jako widzialny znak przekazania daru Ducha i mandatu pasterskiego.</li></ul>\n<h5>Wykształcenie episkopatu monarchicznego</h5>\n<p>Na przełomie II i III wieku ugruntowała się trójstopniowa struktura hierarchiczna: jeden biskup (episkopos) stojący na czele lokalnego Kościoła, wspierany przez kolegium prezbiterów oraz diakonów.</p>\n<p>Wtedy też po raz pierwszy zaczyna się kształtować wyraźne teologiczne rozumienie kapłaństwa hierarchicznego, nawiązujące do wzorców starotestamentalnych.</p>"}, {"t": "Gmina rzymska, Piotr i Paweł, prześladowania (20.10.2026)", "html": "<div class=\"eyebrow\">HISTORIA KOŚCIOŁA / PATROLOGIA – Wykład</div>\n<div class=\"meta\">🗓 Wtorek, 20 października 2026</div>\n<div class=\"topic\"><span>Temat</span>Gmina rzymska, męczeństwo Piotra i Pawła oraz geneza rzymskich prześladowań (Neron, Flawiusze)</div>\n<h4><span class=\"num\">1.</span> Geneza gminy rzymskiej i diaspora żydowska</h4>\n<ul><li><b>Droga napływu:</b> Ewangelia dotarła do stolicy Imperium Rzymskiego za pośrednictwem diaspory żydowskiej (poprzez wspólnoty synagogalne), a nie bezpośrednio od pogan.</li><li><b>Skala diaspory w Rzymie:</b> W mieście liczącym ok. 1 mln mieszkańców społeczność żydowska liczyła 30–50 tysięcy osób skupionych wokół 11–12 synagog.</li><li><b>Edykt cesarza Klaudiusza (ok. 49 r. n.e.):</b> Wygnanie Żydów z Rzymu w wyniku zamieszek wywołanych sporem o „Chrestosa” (zniekształcona grecka forma imienia Chrystus). Świadectwo to potwierdza Swetoniusz oraz Dzieje Apostolskie (Dz 18,2 – spotkanie Pawła w Koryncie z Akwilą i Pryscyllą wygnanymi z Rzymu).</li></ul>\n<h4><span class=\"num\">2.</span> Męczeństwo Apostołów Piotra i Pawła w Rzymie</h4>\n<h5>Św. Piotr</h5>\n<p>Przybył do Rzymu, gdzie poniósł śmierć męczeńską ok. 64/67 r. n.e. (według starożytnej tradycji ukrzyżowany głową w dół na Wzgórzu Watykańskim za panowania Nerona).</p>\n<ul><li><b>Świadectwa archeologiczne:</b> Badania pod Bazyliką św. Piotra potwierdziły istnienie wczesnochrześcijańskiego grobu Piotra na rzymskiej nekropolii, otoczonego kultem od I wieku.</li></ul>\n<h5>Św. Paweł</h5>\n<p>Przebywał w areszcie domowym w Rzymie (ok. 61–63 r.), głosząc Ewangelię bez przeszkód.</p>\n<p>Zginął ok. 67 r. za murami miasta przez ścięcie mieczem (ścięcie przysługiwało mu jako przywilej obywatela rzymskiego).</p>\n<ul><li><b>Fundament rzymski:</b> Obydwaj Apostołowie stali się filarami autorytetu, tradycji i sukcesji Kościoła rzymskiego.</li></ul>\n<h4><span class=\"num\">3.</span> Prześladowanie za Nerona (64 r. n.e.) – Tacyt i Tertulian</h4>\n<ul><li><b>Wielki pożar Rzymu (lipiec 64 r.):</b> Podejrzenia o umyślne podpalenie miasta w celu budowy Złotego Domu (Domus Aurea) padły na samego Nerona. Cesarz, szukając kozła ofiarnego, skierował oskarżenie na wyodrębniającą się z judaizmu grupę chrześcijan.</li></ul>\n<h5>Świadectwo Tacyta (Roczniki, XV, 44)</h5>\n<p>Tacyt określa chrześcijaństwo mianem „zgubnego zabobonu” (exitiabilis superstitio).</p>\n<p>Chrześcijanom zarzucono odium humani generis („nienawiść do rodzaju ludzkiego”) – wyraz ich izolacji od pogańskiego życia publicznego, świąt, teatru i kultów państwowych.</p>\n<ul><li><b>Okrucieństwo egzekucji:</b> zaszywanie w skóry dzikich zwierząt i rozszarpywanie przez psy, krzyżowanie oraz oblewanie smołą i palenie jako nocne „żywe pochodnie” w cesarskich ogrodach.</li></ul>\n<h5>Status prawny prześladowań</h5>\n<p>Za Nerona nie wydano jeszcze ogólnego edyktu prawnego dla całego Imperium. Była to lokalna akcja policyjno-karna w Rzymie, która jednak stworzyła groźny precedens prawny (tzw. institutum Neronianum – według Tertuliana zasada: non licet esse vos – „nie wolno wam istnieć”).</p>\n<h5>Konflikt polityczno-religijny</h5>\n<p>Odrzucenie kultu cesarza i bogów rzymskich odbierano jako zerwanie pax deorum (pokoju z bogami) – Rzymianie wierzyli, że klęski żywiołowe, pożary czy zarazy są karą bogów za bezbożność chrześcijan.</p>\n<h4><span class=\"num\">4.</span> Prześladowania pod koniec I wieku: Dynastia Flawiuszy (Domicjan)</h4>\n<ul><li><b>Domicjan (81–96 n.e.):</b> Żądał dla siebie boskich zaszczytów i oficjalnego tytułowania go Dominus et Deus („Pan i Bóg”).</li><li><b>Zarzuty:</b> Chrześcijan oskarżano o ateizm (brak świątyń, ołtarzy i posągów) oraz przyjmowanie „obyczajów żydowskich”. Represje dotknęły także patrycjuszy i członków rodziny cesarskiej sprzyjających chrześcijaństwu (m.in. konsul Flawiusz Klemens i Flawia Domicella).</li></ul>\n<h4><span class=\"num\">5.</span> Przyczyny wrogości pogańskiego społeczeństwa</h4>\n<h5>Oskarżenia i plotki społeczne</h5>\n<ul><li><b>Ateizm:</b> odmowa czci dla bogów opiekuńczych państwa.</li><li><b>Kanibalizm / ludożerstwo (thyestejskie uczty):</b> zniekształcona przez pogan interpretacja Eucharystii (spożywanie Ciała i Krwi Chrystusa).</li><li><b>Nierząd / kazirodztwo (edypejskie związki):</b> błędne rozumienie chrześcijańskiego pocałunku pokoju i nazywania się „braćmi i siostrami”.</li><li><b>Bojkot życia społecznego:</b> chrześcijanie unikali amfiteatrów (krwawych walk gladiatorów), wyuzdanych sztuk teatralnych oraz uroczystości państwowych powiązanych ze składaniem ofiar pogańskich.</li><li><b>Skutek męczeństwa:</b> Słynna sentencja Tertuliana: Sanguis martyrum semen christianorum („Krew męczenników jest nasieniem chrześcijan”) – cierpienie i heroizm pierwszych wyznawców wbrew intencjom prześladowców przyczyniały się do wzrostu Kościoła.</li></ul>"}, {"t": "Ćwiczenia – konflikt z judaizmem i prześladowania", "html": "<div class=\"eyebrow\">HISTORIA KOŚCIOŁA / PATROLOGIA – Ćwiczenia</div>\n<div class=\"topic\"><span>Temat</span>Źródła konfliktu z judaizmem, świadectwa historyczne i prześladowania w Cesarstwie Rzymskim</div>\n<h4><span class=\"num\">1.</span> Źródła konfliktu między rodzącym się chrześcijaństwem a judaizmem</h4>\n<h5>Konflikt chrystologiczny a monoteizm</h5>\n<p>W ortodoksyjnym judaizmie fundamentem wiary jest absolutny monoteizm (Szema Izrael – „Słuchaj Izraelu, Pan jest jeden”).</p>\n<p>Wyznanie przez chrześcijan bóstwa Jezusa Chrystusa jako Syna Bożego, równego Ojcu, było traktowane przez środowiska faryzejskie i kapłańskie jako zdrada monoteizmu i bluźnierstwo.</p>\n<h5>Autorytet Chrystusa wobec Prawa (Tory)</h5>\n<p>Jezus występował z autorytetem przewyższającym samą literę Prawa Mojżeszowego („Słyszeliście, że powiedziano... a Ja wam powiadam”).</p>\n<p>Odejście od obowiązku obrzezania pogan i zniesienie rygoryzmu rytualnego stanowiło dla judaizmu złamanie przymierza.</p>\n<h5>Nowa teologia Świątyni</h5>\n<p>Świątynia Jerozolimska stanowiła jedyne sanktuarium kultu ofiarniczego.</p>\n<p>Jezus zapowiedział jej zburzenie i odbudowanie w trzy dni (świątynia Jego Ciała), a św. Paweł przeniósł ideę przybytku na wspólnotę wiernych („Czyż nie wiecie, żeście świątynią Boga?”).</p>\n<h5>Tożsamość Nowego Izraela (Verus Israel)</h5>\n<p>Wspólnota chrześcijańska, do której masowo dołączali nawróceni poganie, zaczęła mianować się duchowym, prawdziwym Izraelem i spadkobiercą obietnic Przymierza.</p>\n<h4><span class=\"num\">2.</span> Źródła historyczne potwierdzające prześladowania ze strony judaizmu</h4>\n<h5>Źródła chrześcijańskie</h5>\n<ul><li><b>Dzieje Apostolskie:</b> kamienowanie diakona Szczepana (Dz 7 – protomęczennik); śmierć Jakuba Większego, brata Jana, z rozkazu Heroda Agryppy I (Dz 12).</li><li><b>Listy św. Pawła:</b> najstarsze wzmianki w 1 Liście do Tesaloniczan oraz świadectwo kar biczowania wymierzanych w synagogach (2 Kor 11,24: „pięciokrotnie otrzymałem po czterdzieści uderzeń bez jednego”).</li><li><b>Świadectwa apologetów i pisarzy:</b> św. Justyn Męczennik, Orygenes, św. Epifaniusz.</li></ul>\n<h5>Źródła judaistyczne</h5>\n<p>Dawne dzieje Izraela Józefa Flawiusza (wzmianka o bezprawnym skazaniu i ukamienowaniu Jakuba Sprawiedliwego, biskupa Jerozolimy).</p>\n<ul><li><b>Birkat ha-Minim (błogosławieństwo/przekleństwo minimów):</b> Formuła włączona pod koniec I wieku (po synodzie w Jamnii) do modlitwy Szmone Esre (Osiemnastu Błogosławieństw), nakierowana na wykluczenie i wyklęcie heretyków, w tym nazarejczyków (judeochrześcijan), z synagog.</li></ul>\n<h4><span class=\"num\">3.</span> Stosunek Rzymu do chrześcijan i oskarżenia społeczne</h4>\n<h5>Domus ecclesiae (Kościół domowy)</h5>\n<p>Ze względu na brak legalnego statusu kult chrześcijański nie odbywał się w świątyniach publicznych, lecz w prywatnych domach najzamożniejszych wyznawców (dysponujących obszernymi dziedzińcami i atriami). Właściciele tych domów często zostawali naturalnymi liderami, zarządcami i biskupami gmin.</p>\n<h5>Główne zarzuty pogańskie</h5>\n<ul><li><b>Ateizm:</b> Podstawowe oskarżenie polityczno-religijne – brak posągów, ołtarzy i świątyń oraz odmowa udziału w kulcie bogów państwowych.</li><li><b>Rytualny kanibalizm (uczty tyestejskie):</b> Zniekształcone wyobrażenie o sprawowaniu Eucharystii (pogłoski o zabijaniu dziecka ukrytego w mące i spożywaniu jego krwi i ciała).</li><li><b>Kazirodztwo i rozwiązłość (związki edypejskie):</b> Błędne odczytanie chrześcijańskiego pocałunku pokoju i nazywania się „braćmi i siostrami”.</li><li><b>Mizantropia (odium humani generis):</b> Wycofanie się chrześcijan z widowisk cyrkowych, krwawych walk gladiatorów i niemoralnego teatru.</li><li><b>Magia:</b> Podejrzenie o stosowanie czarów i nielegalnych zaklęć w zamkniętych zgromadzeniach.</li></ul>\n<h4><span class=\"num\">4.</span> Ewolucja prześladowań rzymskich i męczeństwo</h4>\n<ul><li><b>Charakter represji:</b> Od lokalnych i doraźnych interwencji policyjnych (Neron w 64 r., Domicjan pod koniec I w., Marek Aureliusz w II w.) do zorganizowanych, systemowych edyktów ogólnopaństwowych w III i IV wieku.</li></ul>\n<h5>Wielkie prześladowanie za Dioklecjana (303–305 r. n.e.)</h5>\n<h5>Cztery kolejne edykty cesarskie</h5>\n<p>Nakaz zburzenia kościołów i spalenia ksiąg liturgicznych oraz Pisma Świętego.</p>\n<p>Uwięzienie wszystkich kapłanów i biskupów.</p>\n<p>Przymuszanie uwięzionych torturami do złożenia ofiar bogom rzymskim.</p>\n<p>Powszechny nakaz składania ofiar przez wszystkich mieszkańców imperium pod karą śmierci.</p>\n<ul><li><b>Abdykacja Dioklecjana (305 r.):</b> Niespodziewane zrzeczenie się władzy przez cesarza uważającego się za bóstwo (syna Jowisza) doprowadziło do załamania pogańskiej teologii cesarskiej i politycznego chaosu, który utorował drogę do wolności religijnej (Edykt Mediolański 313 r.).</li><li><b>Kluczowi męczennicy:</b> Poza apostołami (jedynie św. Jan zmarł śmiercią naturalną): św. Polikarp, św. Ignacy Antiocheński, św. Perpetua i Felicyta, św. Wawrzyniec, św. Agnieszka.</li><li><b>Sanguis martyrum semen christianorum:</b> Heroizm męczenników stał się najsilniejszym narzędziem ewangelizacji – im surowsze były represje, tym dynamiczniej wzrastała liczba wiernych.</li></ul>"}, {"t": "Kanon, Ojcowie apostolscy, apokryfy, herezje II w.", "html": "<div class=\"eyebrow\">HISTORIA KOŚCIOŁA / PATROLOGIA – Wykład: Ojcowie Apostolscy, Kształtowanie się Kanonu i Kryzysy Doktrynalne (Gnoza, Marcjonizm, Montanizm)</div>\n<h4><span class=\"num\">1.</span> Kształtowanie się Kanonu Pisma Świętego i Ojcowie Apostolscy</h4>\n<p>W okresie postapostolskim Kościół musiał precyzyjnie określić, które teksty stanowią autentyczne świadectwo wiary (Pismo Święte), oraz uporządkować struktury hierarchiczne oparte na sukcesji apostolskiej.</p>\n<h5>Trzy rodzaje kanonów w tradycji chrześcijańskiej</h5>\n<ul><li><b>Kanon krótki</b> – przyjęty przez protestantów.</li><li><b>Kanon średni</b> – tradycyjny kanon katolicki.</li><li><b>Kanon rozszerzony</b> – m.in. w Kościele etiopskim (zawierający m.in. credo rozszerzone etiopskie).</li><li><b>Podstawowe kryterium kanoniczności:</b> Apostolskość (zgodność nauki z tradycją apostol
