[build]
  publish = "."
  # Netlify (plan darmowy): każde wdrożenie produkcyjne kosztuje 15 z 300 kredytów miesięcznie.
  # Wdrażamy tylko commity z „[deploy]” w opisie – pozostałe tylko aktualizują GitHub (koszt 0).
  ignore = "git log -1 --pretty=%B | grep -qF '[deploy]' && exit 1 || exit 0"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/muzyka.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/widget.html"
  [headers.values]
    Cache-Control = "no-cache"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/widget.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
