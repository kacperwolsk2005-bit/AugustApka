[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/muzyka.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/widget.html"
  [headers.values]
    Cache-Control = "no-cache"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/widget.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
