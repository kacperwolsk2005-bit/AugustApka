<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Plan dnia</title>
<link rel="manifest" href="/widget.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#2B4F45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plan dnia">
<style>
:root{--bg:#F7F3EC;--card:#FFFDF8;--ink:#1E2A26;--mut:#6B746F;--line:#E4DCCD;--acc:#2B4F45;--hi:#B5612F;--hiS:rgba(181,97,47,.10);--now:rgba(43,79,69,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#121A17;--card:#1A2420;--ink:#EDE7DC;--mut:#9DB0A8;--line:#2A3833;--acc:#7FB5A3;--hi:#E9C46A;--hiS:rgba(233,196,106,.12);--now:rgba(127,181,163,.10)}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:max(12px,env(safe-area-inset-top)) 14px 14px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.date{font-weight:800;font-size:17px}
.clock{font:700 26px/1 ui-monospace,"SF Mono",Consolas,monospace;color:var(--acc)}
.now{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c,var(--acc));border-radius:12px;padding:10px 12px;margin-bottom:12px}
.now .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:700}
.now .t{font-size:18px;font-weight:700;margin:2px 0}
.now .s{font-size:13px;color:var(--mut)}
.bar{height:5px;background:var(--line);border-radius:3px;margin-top:7px;overflow:hidden}.bar i{display:block;height:100%;background:var(--c,var(--acc))}
h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:12px 0 6px}
.list{display:flex;flex-direction:column;gap:3px}
.b{display:grid;grid-template-columns:4px 92px 1fr;gap:8px;align-items:center;padding:5px 6px;border-radius:8px}
.b .k{align-self:stretch;border-radius:2px;background:var(--c)}
.b .h{font:600 13px ui-monospace,"SF Mono",Consolas,monospace;color:var(--mut)}
.b.past{opacity:.45}.b.cur{background:var(--hiS)}.b.cur .h{color:var(--hi)}
.b.done .x::after{content:" ✓";color:var(--acc);font-weight:700}
.note{color:var(--mut);font-size:14px;padding:6px}
.week{display:none}
.foot{margin-top:12px;font-size:12px;color:var(--mut);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.foot a{color:var(--mut)}
.warn{background:var(--hiS);border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:14px}
.hideDom .b.dom{display:none}
/* tapeta: miejsce na ikony pulpitu po lewej, bez przycisków, zawsze widok tygodnia */
.wall,.wall body{background:radial-gradient(circle at 85% 0%,var(--hiS),transparent 55%),var(--bg);background-attachment:fixed}
.wall body{padding:4vh 3vw 0 8vw}
.wall .foot .tg,.wall .foot a{display:none}
/* tapeta: zwarte wiersze (godzina + nazwa w jednej linii), całość skalowana tak, żeby zmieścił się cały tydzień */
.wall body{overflow:hidden}
.wall .col .b{grid-template-columns:3px 34px 1fr;gap:5px;padding:2px 4px;align-items:start}
.wall .col .b .k{grid-row:auto;align-self:stretch}
.wall .col .b .h{grid-column:auto;font-size:10.5px;line-height:1.5}
.wall .col .b .h i{display:none}
.b .h i{font-style:normal}
.wall .wrap{grid-template-columns:minmax(230px,20%) 1fr}
.wall .col .b .x{grid-column:auto;font-size:12px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wall.tight .col .b .x{-webkit-line-clamp:1}
.wall .col .list{gap:1px}
.wall .now{margin-bottom:8px}
/* dzień liturgiczny, terminy, słówko, silentium */
.lit{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);margin:-4px 0 10px;flex-wrap:wrap}
.lit .dot{width:10px;height:10px;border-radius:50%;background:var(--litc);box-shadow:0 0 0 1px rgba(127,127,127,.45),0 0 0 4px color-mix(in srgb,var(--litc) 22%,transparent);flex:none}
.lit b{color:var(--ink)}
.lit .mem{flex-basis:100%;color:var(--mut);font-style:italic;line-height:1.35}
.lit .sig{flex-basis:100%;color:var(--ink);opacity:.85;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.litbar{position:fixed;left:0;right:0;top:0;height:4px;background:var(--litc);display:none;z-index:2}
.wall .litbar{display:block}
.mc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:10px}
.mc .l{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:700;margin-bottom:5px;display:flex;justify-content:space-between;gap:8px}
.ev{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline;padding:3px 0;font-size:13px}
.ev .d{white-space:nowrap;font:700 12px ui-monospace,"SF Mono",Consolas,monospace;color:var(--hi);min-width:66px}.ev .d.soon{color:#E26C5A}
.ev small{color:var(--mut)}
.voc .w{font:600 18px Georgia,"Times New Roman",serif}.voc .g{color:var(--mut);font-size:12.5px;font-style:italic}.voc .t{font-size:14px;margin-top:2px}
.sil{position:fixed;inset:0;background:rgba(6,9,8,.9);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#E9E4DA;z-index:5;text-align:center}
.wall.silent .sil{display:flex}
.sil .sa{font:italic 600 clamp(36px,3.2vw,64px) Georgia,"Times New Roman",serif;letter-spacing:.02em}.sil .sb{font-size:clamp(16px,1.15vw,24px);opacity:.8}.sil .sc{font:700 clamp(14px,.9vw,19px) ui-monospace,Consolas,monospace;color:#E9C46A}
.tg{background:none;border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:2px 10px;font-size:12px;cursor:pointer}
/* szeroko (laptop): bieżący dzień + cały tydzień */
@media (min-width:900px){
  .wrap{display:grid;grid-template-columns:320px 1fr;gap:18px;align-items:start}
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
  .col{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;min-width:0}
  .col.today{border-color:var(--hi);box-shadow:0 0 0 1px var(--hi) inset}
  .col .hd{font-weight:700;font-size:13px;padding:2px 4px 6px;display:flex;justify-content:space-between;text-transform:capitalize}
  .col .b{grid-template-columns:3px 1fr;gap:6px;padding:3px 4px}
  .col .b .h{font-size:11px;grid-column:2}.col .b .x{grid-column:2;font-size:12.5px;line-height:1.25}
  .col .b .k{grid-row:1/3}
  .tmr{display:none}
}
/* ---- pory roku (paleta + efekty; silnik wstawiany przy budowaniu) ---- */
/* ===== Pory roku – efekty i paleta (wspólne dla apki i tapety) ===== */
.season-fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;contain:strict}
.season-fx i{position:absolute;top:-40px;display:block;will-change:transform;animation-name:sf-fall,sf-sway;animation-timing-function:linear,ease-in-out;animation-iteration-count:infinite,infinite;animation-direction:normal,alternate}
.season-fx.winter i{color:#9DB8CC}
.season-fx.summer i{top:auto;bottom:-20px;animation-name:sf-rise,sf-sway}
.season-fx .mote{display:block;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle,#FFF6C8 0%,#F4C95D 45%,rgba(244,201,93,0) 72%);box-shadow:0 0 8px 2px rgba(244,201,93,.35)}
.season-fx.paused i{animation-play-state:paused}
@keyframes sf-fall{from{transform:translate3d(0,-5vh,0) rotate(0)}to{transform:translate3d(var(--drift),110vh,0) rotate(var(--spin))}}
@keyframes sf-rise{0%{transform:translate3d(0,0,0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translate3d(var(--drift),-108vh,0);opacity:0}}
@keyframes sf-sway{from{margin-left:-14px}to{margin-left:14px}}
@media (prefers-reduced-motion:reduce){.season-fx{display:none}}

#app{position:relative;z-index:1}
html[data-season="spring"]{--bg:#F3F7EF;--card:#FFFFFC;--line:#D8E4D1;--hi:#C2507A;--hiS:rgba(232,137,168,.16)}
html[data-season="summer"]{--bg:#FAF5E6;--card:#FFFEF7;--line:#E9DDBB;--hi:#C9851B;--hiS:rgba(244,201,93,.22)}
html[data-season="autumn"]{--bg:#F8F0E7;--card:#FFFBF6;--line:#E8D5C3;--hi:#B9532C;--hiS:rgba(217,138,43,.16)}
html[data-season="winter"]{--bg:#EFF4F8;--card:#FCFEFF;--line:#D3DFE7;--hi:#3F6E8F;--hiS:rgba(120,165,200,.18)}
@media (prefers-color-scheme:dark){
 html[data-season="spring"]{--bg:#0F150E;--card:#161E15;--line:#283826;--hi:#E886A9;--hiS:rgba(232,134,169,.13)}
 html[data-season="summer"]{--bg:#13130C;--card:#1B1B13;--line:#36331F;--hi:#F0C04E;--hiS:rgba(240,192,78,.14)}
 html[data-season="autumn"]{--bg:#14110D;--card:#1C1813;--line:#372D22;--hi:#E2844F;--hiS:rgba(226,132,79,.14)}
 html[data-season="winter"]{--bg:#0D1317;--card:#141D23;--line:#253641;--hi:#8FC1E3;--hiS:rgba(143,193,227,.12)}}
.wall[data-season="spring"],.wall[data-season="spring"] body{background:radial-gradient(circle at 88% 0%,rgba(244,182,200,.28),transparent 45%),radial-gradient(circle at 0% 100%,rgba(111,163,90,.18),transparent 40%),var(--bg);background-attachment:fixed}
.wall[data-season="summer"],.wall[data-season="summer"] body{background:radial-gradient(circle at 92% -6%,rgba(255,214,102,.42),transparent 42%),var(--bg);background-attachment:fixed}
.wall[data-season="autumn"],.wall[data-season="autumn"] body{background:radial-gradient(circle at 88% 0%,rgba(217,138,43,.22),transparent 45%),radial-gradient(circle at 0% 100%,rgba(168,67,42,.14),transparent 40%),var(--bg);background-attachment:fixed}
.wall[data-season="winter"],.wall[data-season="winter"] body{background:radial-gradient(circle at 85% 0%,rgba(157,184,204,.30),transparent 48%),linear-gradient(180deg,transparent 80%,rgba(220,232,240,.35)),var(--bg);background-attachment:fixed}
@media (prefers-color-scheme:dark){.wall[data-season="winter"],.wall[data-season="winter"] body{background:radial-gradient(circle at 85% 0%,rgba(143,193,227,.16),transparent 48%),var(--bg);background-attachment:fixed}}
</style>
</head>
<body>
<div id="app"><p class="note">Wczytuję plan…</p></div>
<script>
/* ===== Pory roku – wspólny silnik efektów (apka + tapeta) =====
   wiosna 21.03–20.06 · lato 21.06–22.09 · jesień 23.09–20.12 · zima 21.12–20.03 */
window.SEASONFX=(function(){
function seasonOf(d){ const md=(d.getMonth()+1)*100+d.getDate();
  if(md>=321&&md<=620) return "spring"; if(md>=621&&md<=922) return "summer";
  if(md>=923&&md<=1220) return "autumn"; return "winter"; }
const NAME={spring:"wiosenny",summer:"letni",autumn:"jesienny",winter:"zimowy"};
const ICON={spring:"🌸",summer:"☀️",autumn:"🍂",winter:"❄️"};
const LEAF=["#C0562F","#D98A2B","#A8432A","#C9A227","#8E5B2E","#B5652A"];
const PETAL=["#F4B6C8","#F9D3DE","#FFFFFF","#E89AB3","#F7C6D4"];
const leaf=c=>`<svg viewBox="0 0 24 24" width="100%" height="100%"><path fill="${c}" d="M12 2c3.2 3.1 6.6 5.3 8 9.3-1.6-.4-2.9-.2-3.9.6 1.3 1.4 1.8 3.1 1.6 4.9-1.8-1.3-3.5-1.6-5-1.1L12 22l-.7-6.3c-1.5-.5-3.2-.2-5 1.1-.2-1.8.3-3.5 1.6-4.9-1-.8-2.3-1-3.9-.6C5.4 7.3 8.8 5.1 12 2z"/><path d="M12 5v16" stroke="rgba(0,0,0,.25)" stroke-width=".8" fill="none"/></svg>`;
const petal=c=>`<svg viewBox="0 0 24 24" width="100%" height="100%"><path fill="${c}" stroke="rgba(200,90,130,.35)" stroke-width=".6" d="M12 2C7 6 5.5 11 7.5 16c1.2 3 3 5 4.5 6 1.5-1 3.3-3 4.5-6 2-5 .5-10-4.5-14zm0 0l-1.2 3.2L12 4.6l1.2.6z"/></svg>`;
const FLAKE=`<svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7M12 2l-2 2.2M12 2l2 2.2M12 22l-2-2.2M12 22l2-2.2"/></svg>`;
const MOTE=`<span class="mote"></span>`;
/* count: mnożnik liczby cząstek (tapeta ~0.6) */
function build(s,opts){
  opts=opts||{}; const k=opts.count||1, small=innerWidth<700;
  const base={autumn:small?5:10,winter:small?16:32,spring:small?6:12,summer:small?8:16}[s];
  const n=Math.max(3,Math.round(base*k));
  const L=document.createElement("div"); L.className="season-fx "+s; L.setAttribute("aria-hidden","true");
  const r=Math.random;
  for(let i=0;i<n;i++){
    const e=document.createElement("i");
    const size=s==="autumn"?14+r()*14:s==="spring"?10+r()*9:s==="summer"?4+r()*7:5+r()*9;
    const dur=s==="autumn"?14+r()*14:s==="spring"?16+r()*14:s==="summer"?18+r()*16:10+r()*14;
    const op=s==="autumn"?.3+r()*.28:s==="spring"?.45+r()*.35:s==="summer"?.35+r()*.45:.35+r()*.4;
    e.style.cssText=`left:${(r()*100).toFixed(2)}%;width:${size.toFixed(1)}px;height:${size.toFixed(1)}px;`+
      `animation-duration:${dur.toFixed(1)}s,${(3+r()*4).toFixed(1)}s;animation-delay:-${(r()*30).toFixed(1)}s,-${(r()*5).toFixed(1)}s;`+
      `--drift:${((r()-.5)*(s==="winter"?90:s==="summer"?120:220)).toFixed(0)}px;--spin:${((r()>.5?1:-1)*(180+r()*540)).toFixed(0)}deg;opacity:${op.toFixed(2)}`;
    e.innerHTML=s==="autumn"?leaf(LEAF[i%LEAF.length]):s==="spring"?petal(PETAL[i%PETAL.length]):s==="summer"?MOTE:FLAKE;
    L.append(e);
  }
  return L;
}
return {seasonOf,build,NAME,ICON};
})();

</script>
<script>
(function(){
const API="/.netlify/functions/widget";
const LK="plan-dnia.k", LC="plan-dnia.cache", LD="plan-dnia.dom";
let k=(location.hash.match(/k=([A-Za-z0-9_-]{20,64})/)||[])[1];
try{ if(k) localStorage.setItem(LK,k); else k=localStorage.getItem(LK); }catch(e){}
// tryb tapety (Lively Wallpaper na Windows, Plash na Macu): link z „&tapeta” – adres zostaje, żeby przeżył odświeżenie
const WALL=/(^#|&)tapeta\b/.test(location.hash);
if(WALL){ document.documentElement.classList.add("wall"); addEventListener("resize",()=>draw()); }
else if(location.hash) history.replaceState(null,"",location.pathname);
// dopasuj tapetę do ekranu: zmniejszaj, aż cały tydzień się zmieści (zostaw miejsce na pasek zadań)
function fit(){ const app=document.getElementById("app"), R=document.documentElement; R.classList.remove("tight");
  let z=Math.max(1,Math.min(2.2,innerWidth/1600)); const over=()=>app.getBoundingClientRect().bottom>innerHeight-56;
  app.style.zoom=z; while(over()&&z>0.62){ z-=0.04; app.style.zoom=z.toFixed(2); }
  if(over()){ R.classList.add("tight"); z=Math.max(1,Math.min(2.2,innerWidth/1600)); app.style.zoom=z; while(over()&&z>0.5){ z-=0.04; app.style.zoom=z.toFixed(2); } } }

let data=null; try{ data=JSON.parse(localStorage.getItem(LC)||"null"); }catch(e){}
let showDom=true; try{ showDom=localStorage.getItem(LD)!=="0"; }catch(e){}
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const toMin=t=>{ const [a,b]=t.split(":").map(Number); return a*60+b; };
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const MON=["stycznia","lutego","marca","kwietnia","maja","czerwca","lipca","sierpnia","września","października","listopada","grudnia"];
const DNF=["niedziela","poniedziałek","wtorek","środa","czwartek","piątek","sobota"];
const app=document.getElementById("app");

async function load(){
  if(!k) return;
  try{ const r=await fetch(API+"?k="+encodeURIComponent(k),{cache:"no-store"}); const j=await r.json();
    if(!r.ok) throw new Error(j.error||("HTTP "+r.status));
    data={snap:j.snap,at:j.at,mem:j.mem||{},got:Date.now()}; try{ localStorage.setItem(LC,JSON.stringify(data)); }catch(e){} draw();
  }catch(e){ draw(String(e.message||e)); }
}
function row(b,m,isToday){ const s=toMin(b.s), e=toMin(b.e); const cls=["b"]; if(isToday&&e<=m) cls.push("past"); if(isToday&&s<=m&&e>m) cls.push("cur"); if(b.st==="done") cls.push("done"); if(b.dom) cls.push("dom");
  return `<div class="${cls.join(" ")}" style="--c:${esc(b.col||"#7A7A7A")}"><span class="k"></span><span class="h">${b.s}<i>–${b.e}</i></span><span class="x">${esc(b.t)}</span></div>`; }
// pora roku: paleta zawsze (chyba że wyłączona w apce), spadające liście/płatki tylko na tapecie
let sfxLayer=null, sfxKey="";
function seasonFx(){
  if(!window.SEASONFX) return;
  const pref=(data&&data.snap&&data.snap.sfx)||"on", noAnim=/(^#|&)bezanimacji\b/.test(location.hash)||matchMedia("(prefers-reduced-motion: reduce)").matches;
  const s=SEASONFX.seasonOf(new Date()), r=document.documentElement;
  if(pref==="off"){ r.removeAttribute("data-season"); } else r.setAttribute("data-season",s);
  const want=WALL&&pref==="on"&&!noAnim?s:"";
  if(want===sfxKey) return; sfxKey=want;
  if(sfxLayer){ sfxLayer.remove(); sfxLayer=null; }
  if(want){ sfxLayer=SEASONFX.build(want,{count:.6}); document.body.prepend(sfxLayer); }
}
document.addEventListener("visibilitychange",()=>{ if(sfxLayer) sfxLayer.classList.toggle("paused",document.hidden); });
function draw(err){ try{ seasonFx(); }catch(e){}
  const now=new Date(), T=iso(now), m=now.getHours()*60+now.getMinutes();
  if(!k){ app.innerHTML=`<div class="warn"><b>Brak klucza.</b> Otwórz ten widget z linku w AugustApce: <b>Kalendarz → Ustawienia → Widget z planem dnia</b>.</div>`; return; }
  const days=(data&&data.snap&&data.snap.days)||[]; const D=days.find(x=>x.d===T);
  const tm=new Date(now); tm.setDate(tm.getDate()+1); const J=days.find(x=>x.d===iso(tm));
  const bs=D?D.b:[]; const vis=b=>showDom||!b.dom;
  const cur=bs.find(b=>vis(b)&&toMin(b.s)<=m&&toMin(b.e)>m), nxt=bs.find(b=>vis(b)&&toMin(b.s)>m);
  let nowH="";
  if(cur){ const s=toMin(cur.s), e=toMin(cur.e), p=Math.round((m-s)/(e-s)*100);
    nowH=`<div class="now" style="--c:${esc(cur.col)}"><div class="l">Teraz · jeszcze ${e-m} min</div><div class="t">${esc(cur.t)}</div><div class="s">${cur.s}–${cur.e}${nxt?` · potem ${nxt.s} ${esc(nxt.t)}`:""}</div><div class="bar"><i style="width:${p}%"></i></div></div>`; }
  else if(nxt){ nowH=`<div class="now" style="--c:${esc(nxt.col)}"><div class="l">Następne za ${toMin(nxt.s)-m} min</div><div class="t">${esc(nxt.t)}</div><div class="s">${nxt.s}–${nxt.e}</div></div>`; }
  else if(D){ const jf=J&&J.b.find(vis);
    nowH=`<div class="now"${jf?` style="--c:${esc(jf.col)}"`:""}><div class="l">${bs.length?"Koniec planu na dziś":esc(D.note||"Dziś nic nie zaplanowano")}</div><div class="t">${jf?"Jutro "+jf.s+" · "+esc(jf.t):"Dobranoc 🌙"}</div></div>`; }
  const list=(Dx,isT)=>Dx?(Dx.b.length?Dx.b.map(b=>row(b,m,isT)).join(""):`<div class="note">${esc(Dx.note||"—")}</div>`):`<div class="note">—</div>`;
  // tydzień (na szerokim ekranie)
  const mon=new Date(now); mon.setDate(mon.getDate()-((now.getDay()+6)%7));
  let week=""; for(let i=0;i<7;i++){ const d=new Date(mon); d.setDate(mon.getDate()+i); const di=iso(d); const X=days.find(x=>x.d===di);
    week+=`<div class="col${di===T?" today":""}"><div class="hd"><span>${DNF[d.getDay()].slice(0,3)}</span><span>${d.getDate()}.${pad(d.getMonth()+1)}</span></div><div class="list">${list(X,di===T)}</div></div>`; }
  const stale=!D&&data;
  // dzień liturgiczny
  const L=D&&D.lit; if(L&&L.h) document.documentElement.style.setProperty("--litc",L.h);
  const MM=(data&&data.mem&&data.mem[T])||null, dio=(data&&data.snap&&data.snap.dioc)||"krk+bz";
  const memL=MM?[...(dio!=="bz"&&dio!=="none"?MM.krk||[]:[]),...(dio!=="krk"&&dio!=="none"?MM.bz||[]:[])]:[];
  const memH=memL.length?`<span class="mem" title="Wspominamy zmarłych kapłanów (rocznice śmierci)">🕯 Memento: ${memL.slice(0,6).map(esc).join(" · ")}${memL.length>6?" · …":""}</span>`:"";
  const litH=L?`<div class="lit"><span class="dot"></span><b>${esc(L.t)}</b>${L.r?" · "+esc(L.r):""}${L.s?" · "+esc(L.s):""}${L.c?" · kolor "+esc(L.c):""}${L.g?`<span class="sig" title="Czytania dnia">📖 ${esc(L.g)}</span>`:""}${memH}</div>`:"";
  // najbliższe terminy
  const dd=x=>Math.round((new Date(x+"T12:00")-new Date(T+"T12:00"))/864e5);
  const dl=n=>n<=0?"dziś":n===1?"jutro":"za "+n+" dni";
  const DNS=["nd","pon","wt","śr","czw","pt","sob"];
  const evs=((data&&data.snap&&data.snap.ev)||[]).filter(e=>e.d>=T).slice(0,3);
  const evH=evs.length?`<div class="mc"><div class="l"><span>Terminy</span><span>z kalendarza</span></div>`+evs.map(e=>{ const n=dd(e.d), dt=new Date(e.d+"T12:00");
    return `<div class="ev"><span class="d${n<=3?" soon":""}">${dl(n)}</span><span>${esc(e.t)} <small>· ${esc(e.sj||e.ty)} · ${DNS[dt.getDay()]} ${dt.getDate()}.${pad(dt.getMonth()+1)}</small></span></div>`; }).join("")+`</div>`:"";
  // słówko / pojęcie – co godzinę inne
  const V=(data&&data.snap&&data.snap.voc)||[]; const vo=V.length?V[Math.floor(Date.now()/36e5)%V.length]:null;
  const vocH=vo?`<div class="mc voc"><div class="l"><span>${esc(vo.k)}</span><span>co godzinę nowe</span></div><div class="w">${esc(vo.w)} ${vo.g?`<span class="g">${esc(vo.g)}</span>`:""}</div><div class="t">${esc(vo.t)}</div></div>`:"";
  // silentium: po Komplecie do pierwszego punktu następnego dnia (tylko tapeta)
  const kom=bs.filter(b=>/komplet/i.test(b.t)).pop(); const first=bs.find(vis);
  const silent=WALL&&((kom&&m>=toMin(kom.e))||(first&&m<toMin(first.s)&&m<6*60));
  const nb=kom&&m>=toMin(kom.e)?(J&&J.b.find(vis)):first; const nd=kom&&m>=toMin(kom.e)?tm:now;
  const silH=`<div class="sil"><div class="sa">Silentium sacrum</div><div class="sb">Dobranoc. ${nd===tm?"Jutro":"Dziś"} ${DNF[nd.getDay()]}, ${nd.getDate()} ${MON[nd.getMonth()]}</div>${nb?`<div class="sc">${nb.s} ${esc(nb.t)}</div>`:""}</div>`;
  document.documentElement.classList.toggle("silent",!!silent);
  app.className=showDom?"":"hideDom";
  app.innerHTML=
   `<div class="litbar"></div>`+silH+`<div class="top"><div class="date">${DNF[now.getDay()][0].toUpperCase()+DNF[now.getDay()].slice(1)}, ${now.getDate()} ${MON[now.getMonth()]}</div><div class="clock">${pad(now.getHours())}:${pad(now.getMinutes())}</div></div>`+
   litH+(err&&!data?`<div class="warn">${esc(err)}</div>`:"")+
   (stale?`<div class="warn">Plan nie obejmuje dzisiejszego dnia. Otwórz AugustApkę (zalogowany) – plan odświeży się sam.</div>`:"")+
   `<div class="wrap"><div>${nowH}${evH}<h3>${WALL?"Dalej dziś":"Dziś"}</h3><div class="list">${WALL&&D?(D.b.filter(b=>vis(b)&&toMin(b.e)>m&&b!==cur).slice(0,6).map(b=>row(b,m,true)).join("")||`<div class="note">${bs.length?"Koniec planu na dziś":esc(D.note||"—")}</div>`):list(D,true)}</div><div class="tmr"><h3>Jutro</h3><div class="list">${list(J,false)}</div></div>${vocH?`<div style="margin-top:12px">${vocH}</div>`:""}</div><div class="week">${week}</div></div>`+
   `<div class="foot"><span>${data&&data.at?"Plan z "+new Date(data.at).toLocaleString("pl-PL",{day:"numeric",month:"numeric",hour:"2-digit",minute:"2-digit"}):""}${err&&data?" · offline":""}</span><span><button class="tg" id="tg">${showDom?"Ukryj stałe punkty":"Pokaż stałe punkty"}</button> <a href="/">AugustApka</a></span></div>`;
  document.getElementById("tg").onclick=()=>{ showDom=!showDom; try{ localStorage.setItem(LD,showDom?"1":"0"); }catch(e){} draw(); };
  if(WALL) fit();
  const c=app.querySelector(".b.cur"); if(c&&!draw._sc&&!WALL){ draw._sc=1; c.scrollIntoView({block:"center"}); }
}
draw(); load();
setInterval(draw,30000);
setInterval(load,10*60000);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ load(); } });
})();
</script>
</body>
</html>
